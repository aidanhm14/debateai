<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>Debatable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@400..700&family=Inter:wght@400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <script src="/js/native-bridge.js"></script>
  <style>
    :root{--red:#df292d;--red-dark:#b91f23;--ink:#171412;--muted:#6f6862;--line:#dedad4;--paper:#f7f6f2;--white:#fff;--soft:#fff8f6}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fbfaf7 0%,#f4f1ec 100%);color:var(--ink)}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,a{font:inherit}
    .app-home{width:min(100%,540px);min-height:100svh;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(96px + env(safe-area-inset-bottom,0px))}
    .app-head{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .wordmark{display:flex;align-items:center;gap:9px;font:800 28px/1 "Archivo",Georgia,serif;letter-spacing:0;color:var(--red)}
    .wordmark img{width:34px;height:34px;border-radius:8px}
    .wordmark em{font-style:normal}
    .head-actions{display:flex;gap:8px}
    .icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--white);display:grid;place-items:center;color:var(--ink)}
    .icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .intro{margin-bottom:18px}
    h1{margin:0 0 9px;max-width:12ch;font:800 42px/.92 "Archivo",Georgia,serif;letter-spacing:0}
    .intro p{margin:0;max-width:35ch;color:var(--muted);font-size:16px;line-height:1.45}
    .primary{position:relative;display:block;width:100%;min-height:136px;padding:19px 20px 17px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--red),#c82328);color:#fff;text-decoration:none;overflow:hidden;box-shadow:0 18px 34px rgba(185,31,35,.22)}
    .primary::after{content:"";position:absolute;inset:auto -40px -70px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.13)}
    .primary:active{transform:scale(.99)}
    .primary-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .primary-label{font:800 30px/1 "Archivo",Georgia,serif}
    .primary-arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:24px}
    .primary-meta{position:absolute;left:20px;right:20px;bottom:17px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;font-size:12px;font-weight:750;color:rgba(255,255,255,.84)}
    .wave{height:34px;display:flex;align-items:center;gap:4px}
    .wave i{display:block;width:3px;height:var(--h);border-radius:3px;background:#fff;opacity:.9;animation:wave 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
    @keyframes wave{to{height:8px;opacity:.45}}
    .resume{display:none;align-items:center;justify-content:space-between;gap:14px;margin:12px 0 0;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.76);color:var(--ink);text-decoration:none}
    .resume.is-visible{display:flex}
    .resume small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
    .resume strong{font-size:14px}
    /* The second of the two choices. Same shape as .primary so they read as
       a pair, but paper-white instead of red: watching is the calmer act. */
    .secondary{position:relative;display:block;width:100%;margin:12px 0 0;padding:19px 20px 17px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.86);color:var(--ink);text-decoration:none}
    .secondary:active{transform:scale(.99);border-color:rgba(223,41,45,.5)}
    .secondary-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .secondary-label{font:800 30px/1 "Archivo",Georgia,serif}
    .secondary-arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f6e9e8;color:var(--red);font-size:24px}
    .secondary-meta{display:block;margin-top:10px;font-size:12px;font-weight:750;color:var(--muted)}
    /* Two webcam stills, because that is what a debate stream looks like:
       two people arguing into a laptop, not an illustration of one. */
    .watch-strip{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 14px;border-radius:14px;overflow:hidden;background:#e7e3dd}
    .watch-tile{position:relative;display:block;aspect-ratio:16/10;overflow:hidden}
    .watch-tile img{width:100%;height:100%;object-fit:cover;display:block}
    /* The broadcast indicator. It states the real state and never invents
       one: JS flips it to LIVE only when /api/stream-status says so. */
    .watch-badge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:rgba(12,10,9,.72);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .watch-badge i{width:8px;height:8px;border-radius:50%;background:#9a938c;flex:none}
    .watch-badge.is-live{background:rgba(197,26,30,.94)}
    .watch-badge.is-live i{background:#fff;animation:rec 1.4s ease-in-out infinite}
    @keyframes rec{50%{opacity:.25}}
    /* Everything that is not one of the two choices lives here: one quiet
       row of text links. These are real features and still reachable, they
       just stop competing with the thing you opened the app to do. */
    .more{display:flex;flex-wrap:wrap;gap:7px 16px;justify-content:center;margin:26px 2px 0}
    .more a,.more button{min-height:34px;display:inline-flex;align-items:center;padding:0;border:0;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;text-decoration:none}
    .more a:active,.more button:active{color:var(--red)}
    .app-note{margin:18px 2px 0;color:var(--muted);font-size:11px;line-height:1.45;text-align:center}
    @media(max-width:360px){.app-home{padding-left:14px;padding-right:14px}h1{font-size:39px}.primary{min-height:142px}.secondary{padding-top:17px}}
    @media(prefers-reduced-motion:reduce){.wave i{animation:none}}
  </style>
  <link rel="stylesheet" href="/css/arcade-flow.css">
<script defer src="/js/track.js"></script>
</head>
<body>
  <main class="app-home">
    <header class="app-head">
      <!-- "Debat" + "able" must be ONE flex item, else the container's
           gap:9px lands inside the word and renders "Debat able". -->
      <div class="wordmark"><img src="/icons/icon-192.png" alt="" /><span class="wm">Debat<em>able</em></span></div>
      <div class="head-actions">
        <button class="icon-btn" id="signInBtn" type="button" aria-label="Sign in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg>
        </button>
      </div>
    </header>

    <section class="intro" aria-labelledby="homeTitle">
      <h1 id="homeTitle">Make your case.</h1>
      <p>Watch a round, or take one yourself.</p>
    </section>

    <a class="primary" href="/newvoice?source=ios_home" aria-label="Start a voice debate round">
      <span class="primary-top"><span class="primary-label">Start a round</span><span class="primary-arrow" aria-hidden="true">→</span></span>
      <span class="primary-meta">
        <span>Voice debate · timed · judged</span>
        <span class="wave" aria-hidden="true">
          <i style="--h:12px;--d:-.1s"></i><i style="--h:24px;--d:-.35s"></i><i style="--h:17px;--d:-.6s"></i><i style="--h:31px;--d:-.25s"></i><i style="--h:20px;--d:-.5s"></i><i style="--h:11px;--d:-.75s"></i>
        </span>
      </span>
    </a>

    <a class="secondary" href="/watch">
      <span class="watch-strip" aria-hidden="true">
        <span class="watch-tile"><img src="/img/round/faces/face03.jpg" alt="" loading="lazy" decoding="async" /></span>
        <span class="watch-tile"><img src="/img/round/faces/face01.jpg" alt="" loading="lazy" decoding="async" /></span>
        <span class="watch-badge" id="watchBadge"><i></i><b>Off air</b></span>
      </span>
      <span class="secondary-top"><span class="secondary-label">Watch a debate</span><span class="secondary-arrow" aria-hidden="true">→</span></span>
      <span class="secondary-meta" id="watchMeta">Live rounds and replays</span>
    </a>

    <a class="resume" id="resumeLink" href="/native">
      <span><small>Continue</small><strong id="resumeLabel">Return to your last screen</strong></span><span aria-hidden="true">→</span>
    </a>

    <nav class="more" aria-label="More">
      <a href="/coach">Coach</a>
      <a href="/brain">Debate brain</a>
      <a href="/app#case">Build a case</a>
      <button id="alertsBtn" type="button">Alerts</button>
      <button id="shareBtn" type="button">Share</button>
    </nav>
    <p class="app-note" id="statusNote">Microphone access is requested only when you start a voice round.</p>
  </main>

  <script src="/js/auth-modal.js"></script>
  <script defer src="/js/arcade-flow.js"></script>
  <script>
    (function(){
      var signIn = document.getElementById('signInBtn');
      var share = document.getElementById('shareBtn');
      var alerts = document.getElementById('alertsBtn');
      var note = document.getElementById('statusNote');
      var resume = document.getElementById('resumeLink');
      try {
        var last = localStorage.getItem('dit-native-last-path');
        if (last && last !== '/native') {
          resume.href = last;
          resume.classList.add('is-visible');
          var clean = last.split(/[?#]/)[0].replace(/^\//,'').replace(/-/g,' ');
          document.getElementById('resumeLabel').textContent = clean ? 'Return to ' + clean : 'Return to your last screen';
        }
      } catch(e){}
      signIn.addEventListener('click', function(){ if (window.openAuthModal) window.openAuthModal(); });

      /* Watch card state. The badge must never claim a broadcast that is
         not happening, so nothing here is decorative: LIVE appears only
         when /api/stream-status reports one, and when there is no stream
         and no replay the card says so rather than advertising an empty
         shelf. Fails silent on a network error and keeps the neutral
         default, which is the honest direction to be wrong in. */
      (function watchState(){
        var badge = document.getElementById('watchBadge');
        var meta = document.getElementById('watchMeta');
        if (!badge || !meta) return;
        fetch('/api/stream-status').then(function(r){ return r.ok ? r.json() : null; }).then(function(s){
          if (s && s.live) {
            badge.className = 'watch-badge is-live';
            badge.querySelector('b').textContent = 'Live';
            meta.textContent = s.title || 'Live from the arena';
            return null;
          }
          return fetch('/api/recordings').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
            var n = d && d.recordings ? d.recordings.length : 0;
            meta.textContent = n ? (n === 1 ? '1 replay to watch' : n + ' replays to watch') : 'Nothing live right now';
          });
        }).catch(function(){});
      })();

      /* Round setup as an option select: one question a screen, a blip on
         each press, Skip to take the defaults. The tile keeps its href, so
         this is an upgrade over a working link and never the only path. */
      var startTile = document.querySelector('a.primary');
      if (startTile) startTile.addEventListener('click', function (ev) {
        if (!window.ArcadeFlow) return;              // link handles it
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
        ev.preventDefault();
        window.ArcadeFlow.start({
          label: 'Set up your round',
          steps: [
            { key: 'who', q: 'Who are you arguing?', summaryLabel: 'Opponent',
              hint: 'A stranger takes a moment to match. The AI starts now.',
              options: [
                { value: 'ai', label: 'The AI', sub: 'Starts immediately. It argues back and takes interruptions.' },
                { value: 'human', label: 'A stranger', sub: 'Matched live. Falls back to the AI if the queue is quiet.' }
              ] },
            { key: 'format', q: 'How do you want to argue?', summaryLabel: 'Format',
              hint: 'General clash is the round. Formal formats are there when you want them.',
              options: [
                { value: 'quick', label: 'General clash', sub: 'The default. Make your case, take the pushback, get judged out of 30.' },
                { value: 'choose', label: 'A competitive format', sub: 'APDA, BP, LD, PF and more. Pick it on the round screen.' }
              ] },
            { key: 'side', q: 'Which side?', summaryLabel: 'Side',
              hint: 'Take the side you disagree with when you want the harder round.',
              options: [
                { value: '', label: 'Surprise me', sub: 'Assigned when the round opens.' },
                { value: 'prop', label: 'Proposition', sub: 'You argue for the motion.' },
                { value: 'opp', label: 'Opposition', sub: 'You argue against it.' }
              ] }
          ],
          launch: { title: 'That is the setup.', hint: 'Microphone access is requested when the round starts, not before.', cta: 'Start the round' },
          onDone: function (a) {
            var q = [];
            // 'choose' means pick a formal format on the destination's
            // own picker; sending no format param leaves that picker
            // in charge instead of pre-pinning one here.
            if (a.format && a.format !== 'choose') q.push('format=' + encodeURIComponent(a.format));
            if (a.side) q.push('side=' + encodeURIComponent(a.side));
            q.push('source=ios_home');
            var base = a.who === 'human' ? '/spar' : '/practice';
            location.href = base + '?' + q.join('&');
          },
          onClose: function () {}
        });
      });
      share.addEventListener('click', function(){ if (window.DBShareApp) window.DBShareApp(); });
      alerts.addEventListener('click', function(){
        if (!window.DBEnableAlerts) return;
        alerts.disabled = true;
        window.DBEnableAlerts().then(function(result){
          var granted = !result || result.receive === 'granted' || result.display === 'granted';
          alerts.textContent = granted ? 'Alerts on' : 'Alerts not enabled';
          note.textContent = granted ? 'We will ping you when a live opponent or spectator room is ready.' : 'You can enable alerts later in iPhone Settings.';
        }).catch(function(){ note.textContent = 'You can enable alerts later in iPhone Settings.'; }).finally(function(){ alerts.disabled = false; });
      });
    })();
  </script>
</body>
</html>
