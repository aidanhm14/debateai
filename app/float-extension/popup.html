<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { width: 268px; margin: 0; font: 14px/1.5 -apple-system, system-ui, sans-serif; background: #15101d; color: #e8e8ee; }
  .wrap { padding: 16px; }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: .01em; }
  .brand b { color: #ef4444; }
  p { margin: 8px 0 0; font-size: 12.5px; color: #b8bcc4; }
  button { margin-top: 14px; width: 100%; padding: 10px 12px; border: none; border-radius: 10px; cursor: pointer;
           font: inherit; font-weight: 700; color: #fff; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
  button:hover { filter: brightness(1.06); }
  .note { margin-top: 12px; font-size: 11px; color: #8a8a96; }
</style>
<style>
/* One outlined Helvetica Neue wordmark, independent of page/device fonts.
   Scale with the existing logo slot; navigation placement stays unchanged. */
.db-wordmark{
  display:inline-block!important;position:relative;
  width:4.97538em;height:.8em;vertical-align:-.02em;
  background:url('wordmark.svg') center/contain no-repeat;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif!important;
  font-size:inherit!important;font-weight:900!important;font-style:normal!important;
  line-height:1!important;letter-spacing:normal!important;text-transform:none;
  color:#ef4444!important;white-space:nowrap;text-decoration:none;
}
.db-wordmark > span{
  position:absolute!important;width:1px!important;height:1px!important;
  padding:0!important;margin:-1px!important;overflow:hidden!important;
  clip-path:inset(50%);white-space:nowrap;border:0;
}
@media print, (forced-colors:active){
  .db-wordmark{width:auto;height:auto;background:none}
  .db-wordmark > span{
    position:static!important;width:auto!important;height:auto!important;
    margin:0!important;overflow:visible!important;clip-path:none;
    font:inherit!important;color:inherit!important;-webkit-text-fill-color:currentColor;
    -webkit-text-stroke:0;
  }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="db-wordmark notranslate" translate="no" role="img" aria-label="Debatable"><span class="db-wordmark-base">Debat</span><span class="db-wordmark-accent">able</span></span> · Floating round</div>
    <p>Start a voice round, then hit <b>Float over apps</b> in the round to keep it on top while you work in other apps.</p>
    <button id="go" type="button">Start a floating round</button>
    <div class="note">Always-on-top floating needs Chrome or Edge (Document Picture-in-Picture).</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
