.meet-button:hover .meet-arrow{transform:translateX(4px)}

@keyframes meet-ring{0%{opacity:0;transform:scale(.97)}20%{opacity:1}100%{opacity:0;transform:scale(var(--ring-x,1.2),1.65)}}
