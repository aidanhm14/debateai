<script>
  /* Theme: resolve the visitor's saved `da-theme` before first paint so the
     sitewide dark toggle reaches this page. Light stays the default. */
  (function(){
    var t = 'light';
    try { t = localStorage.getItem('da-theme') || 'light'; } catch(e){}
    if (t !== 'light') t = 'crimson';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-lighting', t === 'light' ? 'light' : 'dark');
  })();
</script>
<link rel="stylesheet" href="/css/ui.css">
<script defer src="/js/track.js"></script>
<script defer src="/js/app-check.js"></script>
<style>
/* ── Neural constellation on this surface (2026-08-18 sitewide sweep;
   same recipe as /pricing and /schools, per Aidan: "it adds a nice
   depth"). The shared canvas is position:fixed; painted late at
   z-index 0 it would sit ON TOP of static content, so the page
   background moves to <html>, <body> goes transparent, and the canvas
   drops to z-index -1: behind every element, in front of the paper.
   Dark themes keep ui.css's own opacity; only the light arm is lifted,
   because red-on-cream at .45 is close to invisible. */
html[data-lightweb="web"]{background:var(--wash)}
html[data-lightweb="web"] body{background:transparent}
html[data-lightweb="web"] .ui-neural-canvas{z-index:-1}
html[data-lightweb="web"][data-theme="light"] .ui-neural-canvas{opacity:.75}

  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif:'Crimson Pro',Georgia,serif;
    /* --faint carries the small meta text (chips, hints, counters). Keep it
       at or above 4.5:1 on --wash or the field labels drop under AA. */
    --ink:#1c1b18; --body:#3d3a33; --dim:#5f5b52; --faint:#6d685f;
    --line:#e7e4dc; --wash:#faf9f6; --card:#ffffff;
    --accent:#a4201d; --accent-bright:#c02622; --accent-wash:#fbf1f0;
    --ok:#1d6b3f; --ok-wash:#eef7ee; --err-wash:#fdf2f1;
  }
  html[data-lighting="dark"]{
    --ink:#f3f1ed; --body:#d8d4cc; --dim:#a6a099; --faint:#8d8880;
    --line:#2a2825; --wash:#141312; --card:#191817;
    --accent:#ef4444; --accent-bright:#f87171; --accent-wash:#2a1615;
    --ok:#6ee7a5; --ok-wash:#14241a; --err-wash:#2a1615;
  }
  html{scroll-behavior:smooth;background:var(--wash)}
  body{background:var(--wash);color:var(--body);font-family:var(--serif);
    font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
    padding-top:92px} /* clearance for the fixed .ui-topbar (+ beta strip) */
  @media(max-width:760px){body{padding-top:56px}}
  a{color:var(--accent);text-decoration:none}
  em,i{font-style:normal}
  ::selection{background:var(--accent);color:#fff}
  .theme-dots{display:none !important}

  .wrap{max-width:820px;margin:0 auto;padding:0 22px}

  /* ── Hero ────────────────────────────────────────────────────── */
  .hero{padding:64px 0 34px;text-align:center}
  .eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .hero h1{font-size:clamp(2.1rem,6vw,3.3rem);line-height:1.08;color:var(--ink);
    font-weight:600;letter-spacing:-.02em;margin:14px 0 16px}
  .hero p{font-size:1.1rem;color:var(--dim);max-width:44ch;margin:0 auto}

  /* ── Compose ─────────────────────────────────────────────────── */
  .compose{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px;margin:8px 0 40px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .field{margin-bottom:16px}
  .field:last-of-type{margin-bottom:0}
  .field label{display:block;font-size:.72rem;letter-spacing:.11em;
    text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:7px}
  .field input[type=text],.field textarea,.field select{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;
    background:var(--wash);color:var(--ink);font-family:var(--serif);
    font-size:1.02rem;line-height:1.5;resize:vertical}
  .field textarea{min-height:74px}
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .field .hint{display:flex;justify-content:space-between;gap:12px;
    font-size:.82rem;color:var(--faint);margin-top:6px}
  .counter.over{color:var(--accent-bright);font-weight:700}
  .row2{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .submit{background:var(--accent);color:#fff;border:0;border-radius:9px;
    padding:13px 26px;font-family:var(--serif);font-size:1.02rem;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:background .15s}
  .submit:hover:not(:disabled){background:var(--accent-bright)}
  .submit:disabled{opacity:.5;cursor:not-allowed}
  .banner{border-radius:9px;padding:12px 14px;font-size:.95rem;margin-top:16px}
  .banner.ok{background:var(--ok-wash);color:var(--ok);border:1px solid var(--ok)}
  .banner.err{background:var(--err-wash);color:var(--accent-bright);
    border:1px solid var(--accent)}
  .banner[hidden]{display:none}

  /* ── Board ───────────────────────────────────────────────────── */
  .board-head{display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);
    padding-bottom:12px;margin-bottom:6px}
  .board-head h2{font-size:1.32rem;color:var(--ink);font-weight:600;letter-spacing:-.01em}
  .sorts{display:flex;gap:4px}
  .sort{background:none;border:1px solid transparent;border-radius:99px;
    padding:5px 13px;font-family:var(--serif);font-size:.9rem;color:var(--faint);
    cursor:pointer}
  .sort.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}

  .card{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
  .card:last-child{border-bottom:0}
  /* align-self stops the button stretching to the full card height when the
     topic wraps to two or three lines on narrow screens. */
  .vote{flex:0 0 auto;align-self:flex-start;display:flex;flex-direction:column;align-items:center;
    gap:2px;min-width:56px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 6px;font-family:var(--serif);cursor:pointer;
    color:var(--dim);transition:border-color .15s,color .15s,background .15s}
  .vote:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .vote .arrow{font-size:.9rem;line-height:1}
  .vote .n{font-size:1.24rem;font-weight:700;color:var(--ink);line-height:1.1}
  .vote .lbl{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint)}
  .vote.voted{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}
  .vote.voted .n{color:var(--accent)}
  .vote:disabled{cursor:default}
  .card-body{min-width:0;flex:1}
  .card-topic{font-size:1.14rem;line-height:1.42;color:var(--ink);
    font-weight:600;letter-spacing:-.005em}
  .card-why{font-size:.98rem;color:var(--dim);margin-top:6px}
  .card-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin-top:11px;font-size:.8rem;color:var(--faint)}
  .chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;
    font-size:.74rem;letter-spacing:.04em;color:var(--dim)}
  .chip.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
  .card-go{margin-left:auto;font-weight:600;white-space:nowrap}
  .card-go:hover{color:var(--accent-bright)}

  .state{text-align:center;padding:44px 20px;color:var(--faint);font-size:1rem}
  .state strong{display:block;color:var(--ink);font-size:1.1rem;
    font-weight:600;margin-bottom:6px}

  footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 0 60px;
    text-align:center;font-size:.9rem;color:var(--faint)}
  footer a{margin:0 9px}
</style>
</head>
<body>

<div id="daTopbar"></div>

<div class="wrap">

  <header class="hero">
    <div class="eyebrow">Audience board</div>
    <h1>What do you want debated?</h1>
    <p>Post a motion you want argued. Upvote the ones you would actually watch. What rises to the top is what we put in front of debaters.</p>
  </header>

  <!-- Compose. Anonymous posting is deliberate: the people worth hearing
       from here have often not signed up yet. -->
  <form class="compose" id="composeForm">
    <div class="field">
      <label for="topicInput">The motion or question</label>
      <input type="text" id="topicInput" maxlength="200" autocomplete="off"
        placeholder="This House would make voting compulsory.">
      <div class="hint">
        <span>A motion, or just the question you want argued.</span>
        <span class="counter" id="topicCount">0/200</span>
      </div>
    </div>
    <div class="field">
      <label for="whyInput">Why it is worth arguing <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
      <textarea id="whyInput" maxlength="240"
        placeholder="What makes it a real clash rather than a one-sided question."></textarea>
      <div class="hint">
        <span></span>
        <span class="counter" id="whyCount">0/240</span>
      </div>
    </div>
    <div class="field row2">
      <div>
        <label for="formatSel">Format</label>
        <select id="formatSel"></select>
      </div>
      <button type="submit" class="submit" id="submitBtn">Post it</button>
    </div>
    <div class="banner" id="composeBanner" hidden></div>
  </form>

  <section>
    <div class="board-head">
      <h2>The board</h2>
      <div class="sorts">
        <button type="button" class="sort on" data-sort="top">Most wanted</button>
        <button type="button" class="sort" data-sort="new">Newest</button>
      </div>
    </div>
    <div id="board">
      <div class="state">Loading the board.</div>
    </div>
  </section>

  <footer>
    <a href="/">Home</a>
    <a href="/community">Community</a>
    <a href="/practice">Start a round</a>
  </footer>

</div>

<script>
(function(){
  'use strict';

  var VOTED_KEY = 'da-topic-voted';
  var board = document.getElementById('board');
  var form = document.getElementById('composeForm');
  var topicInput = document.getElementById('topicInput');
  var whyInput = document.getElementById('whyInput');
  var formatSel = document.getElementById('formatSel');
  var submitBtn = document.getElementById('submitBtn');
  var banner = document.getElementById('composeBanner');

  var state = { sort: 'top', topics: [], formats: null, loading: false };

  // Locally-remembered votes. This is UI state only: the server keeps the
  // real one-vote-per-person marker, so clearing storage does not buy a
  // second vote.
  var voted = {};
  try { voted = JSON.parse(localStorage.getItem(VOTED_KEY) || '{}') || {}; } catch(e){ voted = {}; }
  function rememberVote(id){
    voted[id] = 1;
    try { localStorage.setItem(VOTED_KEY, JSON.stringify(voted)); } catch(e){}
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function track(ev, props){
    try { if (window.track) window.track(ev, props || {}); } catch(e){}
  }

  // Bearer token when a REAL user is signed in. An anonymous Firebase user
  // (notifications.js signs one in on every page) is not a signed-in user,
  // so gate on !isAnonymous or the board would attribute anon sessions.
  function authHeader(){
    try {
      var fb = window.firebase;
      if (!fb || !fb.auth) return Promise.resolve(null);
      var u = fb.auth().currentUser;
      if (!u || u.isAnonymous) return Promise.resolve(null);
      return u.getIdToken().then(function(t){ return t ? ('Bearer ' + t) : null; })
        .catch(function(){ return null; });
    } catch(e){ return Promise.resolve(null); }
  }

  function post(url, payload){
    return authHeader().then(function(auth){
      var headers = { 'Content-Type': 'application/json' };
      if (auth) headers.Authorization = auth;
      return fetch(url, { method:'POST', headers: headers, body: JSON.stringify(payload) });
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        // Endpoints return { error }. A non-JSON body means the request
        // never reached the function, so say that instead of "failed".
        if (!res.ok) throw new Error(data.error || 'Could not reach the board. Check your connection and try again.');
        return data;
      });
    });
  }

  // ── Compose ────────────────────────────────────────────────────
  function wireCounter(el, counterId, max){
    var out = document.getElementById(counterId);
    function paint(){
      var n = el.value.length;
      out.textContent = n + '/' + max;
      out.classList.toggle('over', n >= max);
    }
    el.addEventListener('input', paint);
    paint();
  }
  wireCounter(topicInput, 'topicCount', 200);
  wireCounter(whyInput, 'whyCount', 240);

  function showBanner(kind, html){
    banner.className = 'banner ' + kind;
    banner.innerHTML = html;
    banner.hidden = false;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var topic = topicInput.value.trim();
    if (topic.length < 10){
      showBanner('err', 'Give it at least a full sentence so people know what they would be arguing.');
      return;
    }
    banner.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Posting';

    post('/api/suggest-topic', {
      topic: topic,
      why: whyInput.value.trim(),
      format: formatSel.value || 'any'
    }).then(function(data){
      showBanner('ok', data.merged
        ? 'Someone already asked for this one. Your request was added to theirs, so it climbs the board.'
        : 'Posted. It is on the board now.');
      track('topic_request_submit', { merged: !!data.merged, format: formatSel.value });
      topicInput.value = '';
      whyInput.value = '';
      topicInput.dispatchEvent(new Event('input'));
      whyInput.dispatchEvent(new Event('input'));
      // Reload so the new card is in its real ranked position.
      state.sort = data.merged ? state.sort : 'new';
      paintSorts();
      return load();
    }).catch(function(err){
      showBanner('err', esc(err.message || 'Could not post that. Try again.'));
    }).then(function(){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Post it';
    });
  });

  // ── Board ──────────────────────────────────────────────────────
  function cardHtml(t){
    var isVoted = !!voted[t.id];
    var chips = '<span class="chip">' + esc(t.formatLabel || 'Any format') + '</span>';
    if (t.suggestedCount > 1){
      chips += '<span class="chip hot">' + t.suggestedCount + ' people asked</span>';
    }
    if (t.authorName){
      chips += '<span>from ' + esc(t.authorName) + '</span>';
    }
    return '' +
      '<article class="card">' +
        '<button type="button" class="vote' + (isVoted ? ' voted' : '') + '" ' +
          'data-id="' + esc(t.id) + '"' + (isVoted ? ' disabled' : '') + ' ' +
          'aria-label="Upvote this topic">' +
          '<span class="arrow">' + (isVoted ? '✓' : '▲') + '</span>' +
          '<span class="n">' + t.votes + '</span>' +
          '<span class="lbl">' + (isVoted ? 'voted' : 'want') + '</span>' +
        '</button>' +
        '<div class="card-body">' +
          '<div class="card-topic">' + esc(t.topic) + '</div>' +
          (t.why ? '<div class="card-why">' + esc(t.why) + '</div>' : '') +
          '<div class="card-meta">' + chips +
            '<a class="card-go" href="/practice?motion=' + encodeURIComponent(t.topic) + '">Debate it &rarr;</a>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function paintBoard(){
    if (!state.topics.length){
      board.innerHTML = '<div class="state"><strong>Nothing on the board yet.</strong>' +
        'Post the first one. It goes live the moment you hit post.</div>';
      return;
    }
    board.innerHTML = state.topics.map(cardHtml).join('');
  }

  function paintSorts(){
    Array.prototype.forEach.call(document.querySelectorAll('.sort'), function(b){
      b.classList.toggle('on', b.getAttribute('data-sort') === state.sort);
    });
  }

  // The placeholder fill runs before the first board fetch, so this has to
  // key on "did the server list land yet", not on option count.
  var formatsFilled = false;
  function fillFormats(formats, fromServer){
    if (!formats || formatsFilled) return;
    var picked = formatSel.value;
    formatSel.innerHTML = Object.keys(formats).map(function(k){
      return '<option value="' + esc(k) + '">' + esc(formats[k]) + '</option>';
    }).join('');
    if (picked) formatSel.value = picked;
    if (fromServer) formatsFilled = true;
  }

  function load(){
    if (state.loading) return Promise.resolve();
    state.loading = true;
    return fetch('/api/topic-board?sort=' + encodeURIComponent(state.sort))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (!data || !data.ok) throw new Error('bad payload');
        state.topics = data.topics || [];
        fillFormats(data.formats, true);
        paintBoard();
      })
      .catch(function(){
        board.innerHTML = '<div class="state"><strong>Could not load the board.</strong>' +
          'Refresh and it should come back.</div>';
      })
      .then(function(){ state.loading = false; });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sort'), function(b){
    b.addEventListener('click', function(){
      var next = b.getAttribute('data-sort');
      if (next === state.sort) return;
      state.sort = next;
      paintSorts();
      load();
    });
  });

  board.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.vote') : null;
    if (!btn || btn.disabled) return;
    var id = btn.getAttribute('data-id');
    if (!id) return;

    // Optimistic: the count moves now, the server settles it on reply.
    var nEl = btn.querySelector('.n');
    var before = parseInt(nEl.textContent, 10) || 0;
    btn.disabled = true;
    btn.classList.add('voted');
    btn.querySelector('.arrow').textContent = '✓';
    btn.querySelector('.lbl').textContent = 'voted';
    nEl.textContent = before + 1;
    rememberVote(id);
    track('topic_request_vote', { topicId: id });

    post('/api/topic-vote', { topicId: id }).then(function(data){
      if (typeof data.votes === 'number') nEl.textContent = data.votes;
      var t = state.topics.filter(function(x){ return x.id === id; })[0];
      if (t && typeof data.votes === 'number') t.votes = data.votes;
    }).catch(function(){
      // Roll the optimistic paint back so the number is not a lie.
      nEl.textContent = before;
      btn.disabled = false;
      btn.classList.remove('voted');
      btn.querySelector('.arrow').textContent = '▲';
      btn.querySelector('.lbl').textContent = 'want';
      delete voted[id];
      try { localStorage.setItem(VOTED_KEY, JSON.stringify(voted)); } catch(e){}
    });
  });

  // Formats render from the server payload, but the select should not sit
  // empty while that is in flight.
  fillFormats({ any:'Any format' });
  load();
  track('topic_board_view');
})();
</script>

<script defer src="/js/topbar.js"></script>
<script src="/js/home-magnet.js" defer></script>
<!-- Shared neural-constellation background. Animates on this light
     surface because <html> carries data-lightweb="web". -->
<canvas id="uiNeuralCanvas" class="ui-neural-canvas"></canvas>
<script defer src="/js/ui-neural.js"></script>
</body>
