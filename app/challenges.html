   same recipe as /pricing and /schools, per the founder: "it adds a nice

   z-index 0 it would sit ON TOP of static content, so the page

  function fmtWhen(ms){
    if (!ms) return '';
    var d = Date.now() - ms;
    if (d < 0) {
      var ahead = -d;
      if (ahead < 3600000) return 'in ' + Math.max(1, Math.round(ahead/60000)) + 'm';
      if (ahead < 86400000) return 'in ' + Math.round(ahead/3600000) + 'h';
      return 'in ' + Math.round(ahead/86400000) + 'd';
    }
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.round(d/60000) + 'm ago';
    if (d < 86400000) return Math.round(d/3600000) + 'h ago';
    return Math.round(d/86400000) + 'd ago';
  }

  function avatar(p){
    if (p && p.avatarIdentity && window.DBAvatar && DBAvatar.publicSvg){
      return '<span class="ava">'+DBAvatar.publicSvg(p.avatarIdentity,'100%',{uid:p.uid||'',name:p.name||'Debater'})+'</span>';
    }
    if (p && p.photo) return '<span class="ava"><img src="'+esc(p.photo)+'" alt="" referrerpolicy="no-referrer"></span>';
    var init = ((p && p.name) || '?').trim().charAt(0).toUpperCase() || '?';
    return '<span class="ava">'+esc(init)+'</span>';
  }

  // The shared chooser carries password and emailed-link sign-in; a bare
  // Google popup offers neither, and Google refuses OAuth outright inside
  // an in-app browser. This page was left on the popup because the modal
  // used to navigate away on success, which would abandon the action the
  // person was in the middle of; it now hands the user back instead.
  // onDone fires exactly once, with a user or null on dismissal, so the
  // await below cannot hang.
  async function ensureAuth(){
    if (signedIn()) return state.user;
    if (!fbAuth) throw new Error('Sign-in is unavailable in this browser.');
    if (typeof window.openAuthModal === 'function'){
      var picked = await new Promise(function(resolve){
        window.openAuthModal('signin', { onDone: function(u){ resolve(u || null); } });
      });
      if (!picked || picked.isAnonymous) throw new Error('Sign in first.');
      state.user = picked;
      return state.user;
    }
    var res = await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    state.user = res.user;
    return state.user;
  }
  async function api(path, opts, needAuth){
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (needAuth){
      if (!signedIn()) throw new Error('Sign in first.');
      opts.headers.Authorization = 'Bearer ' + (await state.user.getIdToken());
    }
    var r = await fetch(path, opts);
    var j = null;
    try { j = await r.json(); } catch(e){}
    if (!r.ok) throw new Error((j && j.error) || ('Request failed (' + r.status + ')'));
    return j;
  }
  function post(body){
    return api('/api/challenge', {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body)
    }, true);
  }

  /* ── router ── */
  function nav(opts, push){
    if (opts.tab) { state.tab = opts.tab; state.slug = null; }
    if (opts.slug !== undefined) state.slug = opts.slug;
    // One challenge gets the short shareable permalink; the board keeps
    // its tab in a query param. Both are served by /challenges.html (see
    // the /c/* redirect in netlify.toml).
    state.compose = false; state.notice = '';
    var url = state.slug ? '/challenge/' + encodeURIComponent(state.slug)
      : ('/challenges' + (state.tab !== 'open-public' ? '?t=' + state.tab : ''));
    if (push !== false) { try{ history.pushState({}, '', url); }catch(e){} }
    load();
    window.scrollTo(0, 0);
  }
  window.addEventListener('popstate', function(){ routeFromUrl(false); });
  function routeFromUrl(push){
    var q = new URLSearchParams(location.search);
    // Rebuild composer state from the URL on every history change. This
    // prevents a political or directed draft from leaking into a normal
    // board route after Back, Forward, or a client-side navigation.
    state.compose = false;
    state.toUid = ''; state.toName = '';
    state.prefill = blankPrefill(); state.source = '';
    // /c/<slug> is the permalink; ?c=<slug> stays readable so an older
    // link or a hand-typed URL still resolves.
    var fromPath = /^\/(?:c|challenge)\/([^/]+)\/?$/.exec(location.pathname);
    var isNew = /^\/challenge\/new\/?$/.test(location.pathname);
    if (isNew) state.compose = true;
    var c = isNew ? null : fromPath ? decodeURIComponent(fromPath[1]) : q.get('c');
    var t = q.get('t');
    // ?to=<uid>&name=<label> arrives from a "Challenge them" button on the
    // leaderboard. It opens the composer aimed at that person rather than
    // dropping the visitor on a board and hoping they find the button.
    if (q.get('to')){
      state.toUid = String(q.get('to')).slice(0, 128);
      state.toName = String(q.get('name') || '').slice(0, 60);
      state.prefill = blankPrefill();
      state.source = '';
      state.compose = true;
    }
    if (q.get('claim')){
      var source = queryText(q.get('source'), 40);
      state.prefill = {
        claim: queryText(q.get('claim'), 300),
        context: queryText(q.get('context'), 2000),
        sideA: queryText(q.get('sideA'), 40, 'For'),
        sideB: queryText(q.get('sideB'), 40, 'Against'),
        side: q.get('side') === 'b' ? 'b' : 'a',
        topic: queryText(q.get('topic'), 40),
        category: queryText(q.get('category'), 40, source === 'political-debate' ? 'Politics' : ''),
        // Cached political links from before lanes existed are ordinary
        // For/Against questions, so they belong to the general treatment.
        lane: queryText(q.get('lane'), 20, source === 'political-debate' ? 'general' : '')
      };
      state.source = source;
      state.compose = true;
    }
    state.slug = c || null;
    state.tab = (t && TABS.some(function(x){ return x.key === t; })) ? t : 'open-public';
    if (push === false) load(); else nav({}, false);
  }

  /* ── data ── */
  async function load(quiet){
    var version = ++state.request, previous = JSON.stringify(state.one);
    if (state.compose) { state.loading = false; render(); return; }
    if (!quiet) { state.loading = true; state.err = ''; state.one = null; render(); }
    try {
      if (state.slug){
        var one = await api('/api/challenge?slug=' + encodeURIComponent(state.slug), {cache:'no-store'}, signedIn());
        if (version !== state.request) return;
        state.one = one.challenge;
        if (!state.viewed[state.one.id]) {
          state.viewed[state.one.id] = true;
          track('challenge_viewed', { challenge_id:state.one.id, status:state.one.status });
        }
        document.title = state.one.claim + ' · Debatable';
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.href = shareUrl(state.one);
      } else {
        // This surface owns challenge records only. Scheduled rounds live
        // on the adjacent Schedule tab, and recorded rounds live on /rounds.
        // Mixing all three made the page look busy and obscured what an
        // action would actually open.
        var f = await api('/api/challenge?feed=' + encodeURIComponent(state.tab) + '&limit=40');
        if (version !== state.request) return;
        state.feed = f.challenges || [];
        // The endpoint answers 200 with degraded:true rather than 502 when
        // the board query fails, so say the true thing instead of showing
        // an empty board as if it were quiet.
        if (f.degraded) state.err = 'The board is having trouble loading. Try again in a moment.';
      }
    } catch(e){
      if (version !== state.request) return;
      if (!quiet) state.err = e.message || 'Could not load the board.';
    }
    if (version !== state.request) return;
    state.loading = false;
    if (!state.busy && (!quiet || previous !== JSON.stringify(state.one) || (state.one && state.one.scheduledAt && state.one.scheduledAt <= Date.now() && document.querySelector('[data-join][disabled]')))) render();
  }

  /* ── actions ── */
  async function pickSide(c, side){
    // Optimistic: the tap should feel instant, and the counter is a lean
    // indicator, not a ledger.
    var prev = state.mySide[c.id];
    if (prev === side) return;
    state.mySide[c.id] = side;
    try { localStorage.setItem('da-challenge-side', JSON.stringify(state.mySide)); } catch(e){}
    if (c.crowd){
      if (side === 'a') c.crowd.supportA++; else c.crowd.supportB++;
      if (prev === 'a') c.crowd.supportA--; else if (prev === 'b') c.crowd.supportB--;
      var t = c.crowd.supportA + c.crowd.supportB;
      c.crowd.pctA = t ? Math.round((c.crowd.supportA/t)*100) : 50;
    }
    sfx('click'); track('challenge_side', { side:side });
    render();
    if (!signedIn()){ state.pendingSide[c.id] = side; return; }
    try { await post({ action:'side', id:c.id, side:side }); }
    catch(e){ console.warn('side failed', e.message); }
  }
  async function flushPendingSides(){
    var ids = Object.keys(state.pendingSide);
    for (var i=0;i<ids.length;i++){
      try { await post({ action:'side', id:ids[i], side:state.pendingSide[ids[i]] }); } catch(e){}
      delete state.pendingSide[ids[i]];
    }
  }

  async function accept(c){
    if (state.busy) return;
    state.busy = true; state.err = ''; render();
    try {
      await ensureAuth();
      if (c.mode === 'live') await DBChatChallenge.ensureAge();
      var r = await post({ action:'accept', id:c.id });
      track('challenge_accepted', { challenge_id:c.id, mode:c.mode });
      sfx('confirm');
      if (c.mode === 'live' && (!c.scheduledAt || c.scheduledAt <= Date.now())) {
        var room = await post({action:'join', id:c.id});
        location.href = room.url;
        return;
      }
      state.busy = false;
      if (c.mode !== 'live') { location.href = '/rounds'; return; }
      nav({ slug:c.slug });
      state.notice = c.mode === 'live' ? 'You’re in. Your side is reserved for the scheduled time.' : 'Your side is reserved.';
    } catch(e){
      state.busy = false;
      if (state.slug) await load(true);
      state.err = e.message; render();
    }
  }

  async function join(c){
    if (state.busy) return;
    state.busy = true; state.err = ''; render();
    try {
      await ensureAuth();
      var room = await DBChatChallenge.enter(c, state.user, false);
      location.href = room.url;
    } catch(e){ state.busy = false; state.err = e.message; render(); }
  }

  async function follow(c){
    if (state.busy) return;
    state.busy = true;
    try {
      await ensureAuth();
      var r = await post({ action:'follow', id:c.id, following:!c.following });
      c.crowd.followers = r.followers;
      c.following = r.following;
      state.notice = r.following ? 'You’re on the watch list. Keep this link for the round.' : 'Removed from your watch list.';
    } catch(e){ state.err = e.message; }
    state.busy = false; render();
  }

  function roomUrl(c){
    return '/live-round?' + new URLSearchParams({room:c.eventId, spectate:'1', source:'challenge'}).toString();
  }
  function watch(c){
    track('challenge_watch_clicked', {challenge_id:c.id, status:c.status});
    if (c.replayUrl) { location.href = c.replayUrl; return; }
    if (c.eventId && !c.roomPrivate && c.status === 'live') { location.href = roomUrl(c); return; }
    if (c.status === 'completed') return;
    follow(c);
  }
  function shareUrl(c){ return 'https://itsdebatable.com/challenge/' + encodeURIComponent(c.slug); }
  async function share(c, channel){
    var url = shareUrl(c), text = c.claim + ' Take the other side on Debatable.';
    try {
      if (channel === 'copy') {
        await navigator.clipboard.writeText(url);
        state.notice = 'Link copied.';
      } else if (channel === 'native') {
        if (navigator.share) await navigator.share({title:c.claim, text:text, url:url});
        else { await navigator.clipboard.writeText(url); state.notice = 'Link copied.'; }
      } else if (channel === 'card') {
        downloadCard(c);
      }
      track('challenge_shared', {challenge_id:c.id, channel:channel});
      render();
    } catch(e){ if (e.name !== 'AbortError') { state.err = 'Could not share. Copy this link: ' + url; render(); } }
  }
  async function notify(){
    if (!signedIn()) { await ensureAuth(); render(); return; }
    try {
      if (!window.daEnableMessageAlerts) throw new Error('Notification controls are still loading. Try again.');
      var ok = await window.daEnableMessageAlerts();
      state.notice = ok ? 'Notifications are on for this device. We’ll tell you when someone accepts.' : '';
      state.err = ok ? '' : (window.daMessageAlertsHelp ? window.daMessageAlertsHelp() : 'Enable notifications in your browser settings.');
    } catch(e){ state.err = e.message; }
    render();
  }
  function downloadCard(c){
    var canvas = document.createElement('canvas'); canvas.width = 1200; canvas.height = 630;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#faf8f3'; ctx.fillRect(0,0,1200,630);
    ctx.fillStyle = '#bc2025'; ctx.fillRect(0,0,16,630);
    ctx.font = 'bold 32px Arial'; ctx.fillText('DEBATABLE',56,66);
    ctx.fillStyle = '#17171b'; ctx.font = 'bold 28px Arial';
    ctx.fillText(c.status === 'completed' ? 'THE RESULT IS IN.' : 'TAKE THE OTHER SIDE.',56,125);
    var words = c.claim.split(/\s+/), lines = [], line = '';
    ctx.font = 'bold 52px Arial';
    words.forEach(function(w){ if (ctx.measureText(line + ' ' + w).width > 1070 && line) { lines.push(line); line = w; } else line += (line ? ' ' : '') + w; });
    if (line) lines.push(line);
    if (lines.length > 5) { ctx.font = 'bold 40px Arial'; lines = []; line = ''; words.forEach(function(w){ if (ctx.measureText(line + ' ' + w).width > 1070 && line) { lines.push(line); line = w; } else line += (line ? ' ' : '') + w; }); if (line) lines.push(line); }
    lines.slice(0,6).forEach(function(l,i){ ctx.fillText(l,56,205+i*57); });
    ctx.font = 'bold 24px Arial';
    var creator = c.creator || {}, seat = (c.accepted || []).filter(function(p){return p.uid === creator.uid;})[0] || {};
    var result = c.result;
    ctx.fillText(result ? (result.winner ? result.winnerName + ' wins' : 'No winner') : (creator.name || 'Someone') + ' · ' + (c.sides[seat.side] || 'For') + (creator.rating != null ? ' · ' + creator.rating : ''),56,560);
    ctx.fillStyle = '#bc2025'; ctx.font = '22px Arial'; ctx.fillText('itsdebatable.com/challenge/' + c.slug,56,602);
    var a = document.createElement('a'); a.download = 'debatable-' + c.slug + '.png'; a.href = canvas.toDataURL('image/png'); a.click();
  }

  async function cancel(c){
    if (!confirm('Cancel this challenge? It comes off the board.')) return;
    try {
      await post({ action:'cancel', id:c.id });
      nav({ tab:'open-public', slug:null });
    } catch(e){ state.err = e.message; render(); }
  }

  async function create(){
    if (state.busy) return;
    var claim = ($('cClaim').value || '').trim();
    if (!claim) { state.err = 'Write the motion you are willing to defend.'; return render(); }
    // Capture the editable draft before repainting the modal into its busy
    // state. Reading the controls after render would silently restore the
    // original URL prefill and discard the person's edits.
    var description = ($('cDesc').value || '').trim();
    var chosenSide = $('cSide').value === 'b' ? 'b' : 'a';
    var sideA = state.prefill.sideA || 'For';
    var sideB = state.prefill.sideB || 'Against';
    var topic = state.prefill.topic || '';
    var category = state.prefill.category || '';
    state.prefill.claim = claim;
    state.prefill.context = description;
    state.prefill.side = chosenSide;
    state.prefill.timing = $('cTiming').value;
    state.prefill.scheduled = $('cWhen').value;
    state.prefill.opponent = $('cOpponent') ? $('cOpponent').value.trim() : '';
    if (state.prefill.timing === 'scheduled' && !state.prefill.scheduled) { state.err = 'Choose a date and time.'; render(); return; }
    state.busy = true; state.err = ''; render();
    try {
      await ensureAuth();
      await DBChatChallenge.ensureAge();
      var r = await post({
        action:'create',
        claim: claim,
        challengedUid: state.toUid || '',
        description: description,
        sideA: sideA,
        sideB: sideB,
        topic: topic,
        category: category,
        format: 'quick',
        mode: 'live',
        timing: state.prefill.timing,
        scheduledAt: state.prefill.timing === 'scheduled' ? new Date(state.prefill.scheduled).getTime() : 0,
        opponentUsername: state.prefill.opponent || '',
        side: chosenSide
      });
      sfx('confirm');
      track('challenge_created', {
        challenge_id:r.challenge.id,
        format:r.challenge.format, mode:r.challenge.mode,
        directed: r.challenge.challengedUid ? 1 : 0,
        source: state.source || 'challenge-board'
      });
      state.busy = false; state.compose = false;
      state.toUid = ''; state.toName = '';
      state.prefill = blankPrefill(); state.source = '';
      nav({ slug: r.challenge.slug });
    } catch(e){
      state.busy = false; state.err = e.message; render();
    }
  }

  /* ── render helpers ── */
  function statusPill(c){
    if (c.status === 'live') return '<span class="pill pill-live">Live now</span>';
    if (c.status === 'open' || c.status === 'applications_open') return '<span class="pill pill-open">Open</span>';
    if (c.status === 'scheduled') return '<span class="pill pill-next">Scheduled</span>';
    if (c.status === 'accepted') return '<span class="pill pill-next">Accepted</span>';
    if (c.status === 'judging') return '<span class="pill">Judging</span>';
    if (c.status === 'completed') return '<span class="pill">Completed</span>';
    return '<span class="pill">'+esc(c.status)+'</span>';
  }

  // The line the founder asked for: who challenged whom, stated plainly.
  function person(p, side){
    var rating = p.rating == null ? 'Unrated' : p.rating + ' rating' + (p.provisional ? ' · provisional' : '');
    return '<div class="who">' + avatar(p) + '<span><a class="profile-link" href="/users?uid='+encodeURIComponent(p.uid || '')+'"><b>'+esc(p.name || 'Someone')+'</b></a><small>'+esc(side)+' · '+esc(rating)+'</small></span></div>';
  }
  function whoLine(c){
    var creator = c.creator || {}, seats = c.accepted || [];
    var own = seats.filter(function(p){return p.uid === creator.uid;})[0] || {};
    var peer = seats.filter(function(p){return p.uid !== creator.uid;})[0];
    var out = '<div class="faceoff">'+person(Object.assign({},creator,own),c.sides[own.side] || c.sides.a);
    out += '<span class="versus">VS</span>' + (peer ? person(peer,c.sides[peer.side]) : '<div class="open-seat"><span class="empty-ava">?</span><span>'+esc(c.challengedName || 'Your name here')+'<small>'+esc(own.side === 'b' ? c.sides.a : c.sides.b)+'</small></span></div>');
    return out + '</div>';
  }
  function timing(c){
    return c.scheduledAt ? new Date(c.scheduledAt).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}) : c.status === 'open' ? 'Ready now' : '';
  }

  function leanBlock(c, interactive){
    var pctA = (c.crowd && typeof c.crowd.pctA === 'number') ? c.crowd.pctA : 50;
    var votes = (c.crowd ? (c.crowd.supportA + c.crowd.supportB) : 0);
    var mine = state.mySide[c.id];
    var out = '<div class="lean">' +
      '<div class="lean-bar"><span class="lean-a" style="width:'+pctA+'%"></span>' +
      '<span class="lean-b" style="width:'+(100-pctA)+'%"></span></div>' +
      '<div class="lean-row"><span>'+esc(c.sides.a)+' '+pctA+'%</span>' +
      '<span>'+(votes ? votes + (votes===1?' vote':' votes') : 'No votes yet')+'</span>' +
      '<span>'+esc(c.sides.b)+' '+(100-pctA)+'%</span></div>';
    if (interactive){
      out += '<div class="side-btns">' +
        '<button class="side-btn'+(mine==='a'?' on':'')+'" data-side="a" data-cid="'+esc(c.id)+'">'+esc(c.sides.a)+'</button>' +
        '<button class="side-btn'+(mine==='b'?' on':'')+'" data-side="b" data-cid="'+esc(c.id)+'">'+esc(c.sides.b)+'</button>' +
        '</div>';
    }
    return out + '</div>';
  }

  // A directed challenge is only takeable by the person it names. Rendering
  // "Take the other side" to everyone else would offer an action the server
  // refuses, which reads as a broken button rather than as a rule.
  function aimState(c){
    if (!c.challengedUid || !signedIn()) return 'open';
    if (state.user && c.challengedUid === state.user.uid) return 'mine';
    return 'theirs';
  }

  function cardFor(c){
    var seats = (c.accepted || []).length;
    var aim = aimState(c);
    var canAccept = (c.status === 'open') && seats < 2 && aim !== 'theirs' &&
      !(c.accepted || []).some(function(p){ return state.user && p.uid === state.user.uid; });
    var canApply = c.status === 'applications_open';
    var cta = '';
    if (canAccept) {
      cta = '<button class="btn btn-red btn-sm" data-accept="'+esc(c.id)+'">' +
        (aim === 'mine' ? 'Answer it' : 'Take the other side') + '</button>';
    } else if (aim === 'theirs' && c.status === 'open') {
      cta = '<span class="meta">Waiting on ' + esc(c.challengedName || 'them') + '</span>';
    } else if (canApply) {
      cta = '<button class="btn btn-ghost btn-sm" data-open="'+esc(c.slug)+'">Apply ('+c.applicantCount+')</button>';
    } else {
      cta = '<button class="btn btn-ghost btn-sm" data-open="'+esc(c.slug)+'">Open</button>';
    }

    return '<article class="card' + (c.challengedUid ? ' card-directed' : '') + '">' +
      '<div class="card-top">' + statusPill(c) +
        (c.category === 'Politics' ? '<span class="pill pill-politics">Politics</span>' : '') +
        // The name lives in the who-line below, so the pill stays one word
        // wide and the card top does not wrap onto a second row.
        (c.challengedUid ? '<span class="pill pill-aim">' +
          (aim === 'mine' ? 'For you' : 'Called out') + '</span>' : '') +
        '<span class="meta card-time">' + esc(c.scheduledAt ? timing(c) : c.mode === 'live' && c.status === 'open' ? 'Ready now' : fmtWhen(c.status === 'completed' ? c.updatedAt : c.createdAt)) + '</span>' +
      '</div>' +
      '<h3 class="claim"><a href="/challenge/'+encodeURIComponent(c.slug)+'" data-open="'+esc(c.slug)+'">' + esc(c.claim) + '</a></h3>' +
      whoLine(c) +
      '<div class="card-foot">' + cta + '<span class="meta">'+(c.crowd.followers || 0)+' watching this challenge</span></div>' +
    '</article>';
  }

  function composeHtml(){
    var aimed = !!state.toUid;
    var who = state.toName || 'this debater';
    var draft = state.prefill || blankPrefill();
    var political = state.source === 'political-debate';
    var politicalLane = draft.lane === 'partisan' ? 'Democrats vs Republicans'
      : (draft.lane === 'independent' ? 'Independent politics' : 'Political challenge');
    var chosenLabel = draft.side === 'b' ? draft.sideB : draft.sideA;
    return '<a class="back" href="/challenges">← All challenges</a><form class="detail compose-page" id="challengeForm">' +
      (political ? '<div class="modal-k">'+esc(politicalLane)+'</div>' : '') +
      '<h1>' + (aimed ? 'Challenge ' + esc(who) : (political ? 'Post this political challenge' : 'I’ll defend this.')) + '</h1>' +
      '<p class="sub">' + (aimed
        // Shortened names already end in a period ("Priya R."), so the name
        // is trimmed before a sentence-ending one rather than doubling it.
        ? 'Write a motion you are willing to defend against ' + esc(who.replace(/\.$/, '')) + '. Only they can take it.'
        : (political
          ? (draft.lane === 'general'
            ? 'Review the question, choose your side, then put it on the board for someone willing to defend the other side.'
            : 'You chose the ' + esc(chosenLabel) + '. Review the framing, then put it on the board for someone willing to defend the other side.')
          : 'Put one clear motion on the board. Someone else takes the open side.')) + '</p>' +
      (state.err ? '<div class="err" role="alert">'+esc(state.err)+'</div>' : '') +
      '<div class="field"><label for="cClaim">Motion</label>' +
        '<textarea id="cClaim" maxlength="300" placeholder="Employers should publish everyone’s salary." required minlength="8">'+esc(draft.claim)+'</textarea></div>' +
      '<div class="field"><label for="cSide">Your side</label><select id="cSide">' +
        '<option value="a"'+(draft.side==='a'?' selected':'')+'>'+esc(draft.sideA)+'</option>' +
        '<option value="b"'+(draft.side==='b'?' selected':'')+'>'+esc(draft.sideB)+'</option></select></div>' +
      '<div class="field"><label for="cDesc">Why I’m taking this side (optional)</label>' +
        '<textarea id="cDesc" maxlength="280" placeholder="Make someone want to answer you.">'+esc(draft.context)+'</textarea></div>' +
      '<div class="field"><label for="cTiming">When</label><select id="cTiming"><option value="now"'+(draft.timing!=='scheduled'?' selected':'')+'>I’m live now</option><option value="scheduled"'+(draft.timing==='scheduled'?' selected':'')+'>Schedule a time</option></select></div>' +
      '<div class="field" id="whenField"'+(draft.timing==='scheduled'?'':' hidden')+'><label for="cWhen">Date and time</label><input id="cWhen" type="datetime-local" value="'+esc(draft.scheduled || '')+'"><small>Shown in your local time. Everyone sees their own time zone.</small></div>' +
      (!aimed ? '<div class="field"><label for="cOpponent">Opponent username (optional)</label><input id="cOpponent" maxlength="40" placeholder="@username, or leave open to everyone" value="'+esc(draft.opponent || '')+'" autocomplete="off"></div>' : '') +
      '<p class="hint">A public 1v1 video debate. Both people choose whether to record in the room.</p>' +
      '<div class="modal-foot">' +
        '<button type="submit" class="btn btn-red" id="cGo"'+(state.busy?' disabled':'')+'>'+
          (state.busy ? 'Posting...' : 'Post challenge')+'</button>' +
        '<button type="button" class="btn btn-ghost" id="cCancel">Cancel</button>' +
      '</div>' +
    '</form>';
  }

  function bandHtml(){
    return '<section class="band"><h2>How a challenge works</h2><div class="steps">' +
      '<div class="step"><span class="n">1</span><p><b>Post a motion</b> and choose For or Against.</p></div>' +
      '<div class="step"><span class="n">2</span><p><b>Someone accepts the open side.</b> A directed challenge waits only for that person.</p></div>' +
      '<div class="step"><span class="n">3</span><p><b>Both sides go on the record.</b> The decision stays on your challenge. Share it again.</p></div>' +
    '</div></section>';
  }

  function emptyHtml(){
    if (state.tab !== 'open-public'){
      var t = TABS.filter(function(x){ return x.key === state.tab; })[0];
      return '<div class="empty"><h3>Nothing here yet.</h3>' +
        '<p>' + esc(t ? t.note : '') + '</p>' +
        '<button class="btn btn-red" id="emptyPost">Start a challenge</button></div>';
    }
    return '<div class="empty"><h3>The board is empty.</h3>' +
      '<p>Nothing is waiting for an opponent right now. Start a challenge and choose the side you want to defend.</p>' +
      '<button class="btn btn-red" id="emptyPost">Start a challenge</button>' +
      '<div class="seed">' + SEED_CLAIMS.map(function(s){
        return '<button data-seed="'+esc(s)+'">'+esc(s)+'</button>'; }).join('') + '</div>' +
      '<p class="note">Tap one to start from it. You can edit before you post.</p></div>';
  }

  function renderBoard(){
    var tabs = TABS.map(function(t){
      return '<button class="tab'+(state.tab===t.key?' on':'')+'" data-tab="'+t.key+'">'+esc(t.label)+'</button>';
    }).join('');
    var note = (TABS.filter(function(x){ return x.key === state.tab; })[0] || {}).note || '';

    var body;
    if (state.loading) body = '<div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    else {
      var cards = (state.feed || []).map(cardFor);
      body = cards.length ? '<div class="grid">' + cards.join('') + '</div>' : emptyHtml();
    }

    $('app').innerHTML =
      // The founder called Challenges as the first page on 2026-09-03.
      // Schedule remains the adjacent dated view and owns the calendar.
      '<nav class="pair-nav" aria-label="Schedule and challenges">' +
        '<a class="pair-link on" href="/challenges" aria-current="page">Challenges</a>' +
        '<a class="pair-link" href="/live">Schedule</a>' +
      '</nav>' +
      '<div class="hero">' +
        '<div class="hero-copy"><div class="hero-eyebrow">Open challenges</div><h1>One claim.<br>Who’s taking the other side?</h1>' +
        '<p>Pick your side. Put it out there. Settle it face to face.</p></div>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-red" id="postBtn">Start a challenge</button>' +
      '</div>' +
      '<div class="board-head"><div><div class="tabs">' + tabs + '</div>' +
      '<p class="tab-note">' + esc(note) + '</p></div></div>' +
      (state.err ? '<div class="err" role="alert">'+esc(state.err)+'</div>' : '') +
      body +
      bandHtml() +
      (state.compose ? composeHtml() : '');
    wire();
  }

  function shareHtml(c){
    var url = encodeURIComponent(shareUrl(c)), text = encodeURIComponent(c.claim + ' Take the other side on Debatable.');
    return '<div class="share-row" aria-label="Share challenge">' +
      '<button class="btn btn-ghost btn-sm" data-share="copy">Copy link</button>' +
      '<a class="link-quiet" data-share="x" target="_blank" rel="noopener noreferrer" href="https://twitter.com/intent/tweet?text='+text+'&url='+url+'">X</a>' +
      '<a class="link-quiet" data-share="whatsapp" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text='+text+'%20'+url+'">WhatsApp</a>' +
      '<a class="link-quiet" data-share="imessage" href="sms:&body='+text+'%20'+url+'">Messages</a>' +
      '<button class="link-quiet" data-share="native">Share…</button>' +
      '<button class="link-quiet" data-share="card">Save share card</button></div>';
  }
  function renderOne(){
    var c = state.one;
    if (state.loading){ $('app').innerHTML = '<div class="skel" style="max-width:800px"></div>'; return; }
    if (!c){
      $('app').innerHTML = '<button class="back" data-back="1">Back to the board</button><div class="empty"><h1>Challenge unavailable</h1><p>'+esc(state.err || 'That challenge was not found.')+'</p><button class="btn btn-ghost" id="retryLoad">Try again</button></div>';
      return wire();
    }
    var mine = state.user && (c.accepted || []).some(function(p){ return p.uid === state.user.uid; });
    var creator = state.user && c.creator && c.creator.uid === state.user.uid;
    var aim = aimState(c), acts = '', result = '', future = c.scheduledAt > Date.now();
    if (c.status === 'open' && !mine && aim !== 'theirs') acts += '<button class="btn btn-red" data-accept="'+esc(c.id)+'"'+(state.busy?' disabled':'')+'>'+(state.busy?'Opening…':'Take the other side')+'</button>';
    if (c.status === 'applications_open' && !mine) acts += '<button class="btn btn-red" data-apply="'+esc(c.id)+'">Apply to take it</button>';
    if (c.status === 'open' && aim === 'theirs') acts += '<p>Waiting for '+esc(c.challengedName || 'the invited person')+'. Only they can accept.</p>';
    if (mine && c.mode === 'live' && ['accepted','live'].indexOf(c.status)>=0) acts += '<button class="btn btn-red" data-join="'+esc(c.id)+'"'+(future || state.busy?' disabled':'')+'>'+(future?'Side reserved':'Join debate')+'</button>';
    if (c.status !== 'cancelled' && !c.roomPrivate && (c.status !== 'completed' || c.replayUrl)) acts += '<button class="btn btn-ghost" data-watch="'+esc(c.id)+'"'+(state.busy?' disabled':'')+'>'+(c.status === 'completed'?'Watch replay':c.following && c.status !== 'live'?'On your watch list':'Watch')+'</button>';
    if (creator && c.status === 'open') acts += '<button class="link-quiet" data-cancel="'+esc(c.id)+'">Cancel challenge</button>';
    if (c.status === 'completed') {
      var b = c.result;
      result = '<section class="result"><div class="hero-eyebrow">The result</div><h2>'+(b ? b.winner ? esc(b.winnerName || (b.winner === 'pro'?'For':'Against'))+' wins.' : 'No winner.' : 'Round completed.')+'</h2>'+
        (b ? '<details open><summary>Read the ballot</summary><p class="ballot-text">'+esc(b.rfd || 'The round has ended.')+'</p></details>' : '<p>The ballot is not public.</p>')+
        (!c.replayUrl?'<p class="meta">No published replay. Recording and publication require the room’s consent.</p>':'')+'</section>';
    }
    $('app').innerHTML = '<button class="back" data-back="1">← All challenges</button>'+
      (state.err?'<div class="err" role="alert">'+esc(state.err)+'</div>':'')+
      '<article class="detail fight-detail"><div class="card-top">'+statusPill(c)+'<span class="meta">'+esc(timing(c))+'</span></div>'+
      '<h1 class="claim">'+esc(c.claim)+'</h1>'+whoLine(c)+
      (c.description?'<p class="desc">'+esc(c.description)+'</p>':'')+
      (c.evidence && c.evidence.length ? '<ul class="ev">'+c.evidence.map(function(e){return '<li><a href="'+esc(e.url)+'" target="_blank" rel="noopener nofollow">'+esc(e.title || e.url)+'</a></li>';}).join('')+'</ul>' : '')+
      '<div class="detail-acts">'+acts+'</div><p class="watch-count">'+(c.crowd.followers || 0)+' '+(c.crowd.followers===1?'person wants':'people want')+' to watch</p>'+
      (creator && c.status === 'open'?'<div class="notify-box"><b>Give them a reason to show up.</b><p>Share your challenge. Get a notification when someone takes the other side.</p><button class="btn btn-ghost btn-sm" id="notifyChallenge">Notify me when someone accepts</button></div>':'')+
      (mine && future && ['accepted','live'].indexOf(c.status)>=0?'<p>Your side is reserved. Come back at '+esc(timing(c))+'.</p>':'')+
      result+shareHtml(c)+'<p role="status" class="notice">'+esc(state.notice)+'</p></article>';
    wire();
  }
  function render(){
    if (state.compose) { $('app').innerHTML = composeHtml(); wire(); }
    else if (state.slug) renderOne(); else renderBoard();
  }

  /* ── wiring ── */
  function on(sel, fn){
    Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
  }
  function byId(id){
    var all = (state.slug ? [state.one] : (state.feed || []));
    return all.filter(Boolean).filter(function(c){ return c.id === id; })[0];
  }
  function wire(){
    on('[data-tab]', function(b){ b.onclick = function(){ sfx('click'); nav({ tab:b.getAttribute('data-tab') }); }; });
    on('[data-open]', function(b){ b.onclick = function(ev){ ev.preventDefault(); sfx('click'); nav({ slug:b.getAttribute('data-open') }); }; });
    on('[data-back]', function(b){ b.onclick = function(){ sfx('click'); nav({ tab:state.tab, slug:null }); }; });
    on('[data-side]', function(b){ b.onclick = function(){
      var c = byId(b.getAttribute('data-cid')); if (c) pickSide(c, b.getAttribute('data-side')); }; });
    on('[data-accept]', function(b){ b.onclick = function(){
      var c = byId(b.getAttribute('data-accept')); if (c) accept(c); }; });
    on('[data-join]', function(b){ b.onclick = function(){
      var c = byId(b.getAttribute('data-join')); if (c) join(c); }; });
    on('[data-follow]', function(b){ b.onclick = function(){
      var c = byId(b.getAttribute('data-follow')); if (c) follow(c); }; });
    on('[data-cancel]', function(b){ b.onclick = function(){
      var c = byId(b.getAttribute('data-cancel')); if (c) cancel(c); }; });
    on('[data-apply]', function(b){ b.onclick = async function(){
      var c = byId(b.getAttribute('data-apply')); if (!c) return;
      var note = prompt('One line on why you want this side (optional):') || '';
      try { await ensureAuth(); await post({ action:'apply', id:c.id, note:note });
        alert('Applied. The creator picks from the list.'); load(); }
      catch(e){ state.err = e.message; render(); } }; });

    // The board's own compose button always opens an OPEN challenge, even if
    // the visitor arrived on a ?to= link, so the aimed-at state cannot leak
    // into a claim they meant for everyone.
    function openCompose(){
      history.pushState({}, '', '/challenge/new');
      state.slug = null; state.request++;  sfx('click'); state.err=''; state.toUid=''; state.toName=''; state.prefill=blankPrefill(); state.source=''; state.compose = true; render(); }
    var pb = $('postBtn'); if (pb) pb.onclick = openCompose;
    var eb = $('emptyPost'); if (eb) eb.onclick = openCompose;
    on('[data-seed]', function(b){ b.onclick = function(){
      openCompose();
      var f = $('cClaim'); if (f){ f.value = b.getAttribute('data-seed'); f.focus(); } }; });

    var form = $('challengeForm');
    if (form) {
      form.onsubmit = function(e){ e.preventDefault(); create(); };
      form.oninput = function(){
        state.prefill.claim = $('cClaim').value; state.prefill.context = $('cDesc').value;
        state.prefill.side = $('cSide').value; state.prefill.timing = $('cTiming').value;
        state.prefill.scheduled = $('cWhen').value; state.prefill.opponent = $('cOpponent') ? $('cOpponent').value : '';
        $('whenField').hidden = $('cTiming').value !== 'scheduled';
        $('cWhen').required = ! $('whenField').hidden;
      };
      form.querySelectorAll('input,textarea,select,button').forEach(function(control){control.disabled=state.busy;});
    }
    on('[data-watch]', function(b){b.onclick=function(){var c=byId(b.getAttribute('data-watch'));if(c)watch(c);};});
    on('[data-share]', function(b){b.onclick=function(){if(state.one)share(state.one,b.getAttribute('data-share'));};});
    var notifyButton = $('notifyChallenge'); if(notifyButton)notifyButton.onclick=notify;
    var retry = $('retryLoad'); if(retry)retry.onclick=function(){load();};
    function closeCompose(){
      state.compose=false; state.err=''; state.toUid=''; state.toName='';
      state.prefill=blankPrefill(); state.source='';
      // A URL-prefilled draft should not reopen after the person cancels
      // and refreshes. Cancel returns to the canonical public board.
      try { history.replaceState({}, '', '/challenges'); } catch(e){}
      render();
    }
    var cc = $('cCancel'); if (cc) cc.onclick = closeCompose;
    var bg = $('composeBg'); if (bg) bg.onclick = function(ev){
      if (ev.target === bg) closeCompose(); };
  }

  window.addEventListener('debatable-avatar-change', function(){ if (!state.busy && !state.compose) render(); });
  routeFromUrl(false);
  setInterval(function(){ if (!document.hidden && state.slug && !state.busy && !state.compose) load(true); }, 10000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && state.slug && !state.busy) load(true); });
})();
</script>
<!-- Shared neural-constellation background. Animates on this light
     surface because <html> carries data-lightweb="web". -->
<canvas id="uiNeuralCanvas" class="ui-neural-canvas"></canvas>
<script defer src="/js/ui-neural.js"></script>
</body>
</html>
