<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casual debate room · itsdebatable.com</title>
<meta name="description" content="One-off video room for casual debate. Prompt at the top, video below. No timer, no judge, no ballot." />
<!-- Transient pairing room. Robots noindex so the random Daily URLs
     never accidentally surface in search. -->
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-0V4R5MY3BT"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-0V4R5MY3BT');</script>

<!-- Daily.co JS SDK for participant-joined / participant-left events.
     Lets us show "opponent left" or "opponent didn't show" banners
     instead of leaving the user staring at an empty Daily room.
     Falls back to raw <iframe> in mountDaily if this script fails. -->
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<!-- Camera converter (Camera / Avatar / Off) + on-device NSFW watchdog.
     The parent page owns the outgoing pixels via a canvas track, so the
     watchdog sees exactly what the room sees; Avatar mode never
     transmits camera pixels at all. Both optional: video works fine if
     either script fails to load. -->
<script defer src="/js/cam-avatar.js"></script>
<script defer src="/js/nsfw-guard.js"></script>



<script>
(function(){
  try{
    var t=localStorage.getItem('da-theme');
    if(!t || t==='day') t='crimson';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){
    document.documentElement.setAttribute('data-theme','crimson');
  }
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="grey"]{
  --bg:#0a0a0c;--bg-elev:#101014;--bg-card:#15151a;
  --border:rgba(255,255,255,.18);--border-strong:rgba(255,255,255,.32);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.4);
  --green:#22c55e;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.68);
}
[data-theme="crimson"]{
  --bg:#000;--bg-elev:#0c0306;--bg-card:#13070a;
  --border:rgba(239,68,68,.22);--border-strong:rgba(239,68,68,.45);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.55);
  --green:#22c55e;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.68);
}
[data-theme="light"]{
  --bg:#0a0a0c;--bg-elev:#101014;--bg-card:#15151a;
  --border:rgba(255,255,255,.18);--border-strong:rgba(255,255,255,.32);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.4);
  --green:#22c55e;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.68);
  /* The room stays dark even on the light site theme — Daily.co's UI
     is dark and a bright surround clashes with it. */
}
html,body{height:100%}
body{
  font-family:'Crimson Pro','Fraunces',Georgia,"Times New Roman",serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ─── Top room bar ─── */
.room-bar{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:18px;
  padding:12px 20px;
  background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 100%);
  border-bottom:1px solid var(--border);
  z-index:5;
}
.leave-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  border:1px solid var(--border);color:var(--text-dim);
  font-size:.78rem;font-weight:700;
  transition:color .15s,border-color .15s;
}
.leave-btn:hover{color:var(--text);border-color:var(--border-strong)}

.motion-block{min-width:0;text-align:center}
.motion-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.58rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);
}
.motion-eyebrow .pip{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.motion-text{
  font-size:clamp(.92rem,1.6vw,1.12rem);font-weight:700;
  letter-spacing:-.008em;line-height:1.3;color:var(--text);
  margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.motion-text.expanded{white-space:normal}

.room-actions{display:flex;align-items:center;gap:10px}
.elapsed{
  font-size:.78rem;font-weight:600;color:var(--text-ghost);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
  padding:6px 10px;border-radius:8px;
  background:rgba(255,255,255,.04);
  /* Room for h:mm:ss so the 9:59 -> 10:00 rollover doesn't nudge the row. */
  min-width:62px;text-align:center;
}
/* The label counts down every second and then swaps to "Next opponent",
   and the bar's right column is content-sized, so an unpinned width made
   the centred motion jitter each tick and jump ~45px at the swap. Width
   is reserved for the widest label; digits are tabular so the countdown
   itself never shifts. */
.next-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-width:148px;font-variant-numeric:tabular-nums;
  padding:8px 16px;border-radius:999px;
  background:var(--accent-solid,#b91c1c);color:#fff;
  font-size:.8rem;font-weight:800;letter-spacing:.005em;
  box-shadow:0 8px 22px var(--accent-glow);
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px var(--accent-glow);filter:brightness(1.05)}
.next-btn:active{transform:translateY(0)}
.next-btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ─── Stage (Daily iframe) ─── */
.stage{
  flex:1;position:relative;background:#000;min-height:0;
}
.stage iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:0;display:block;
}

/* ─── Stage status (pre-connect / errors) ─── */
.stage-status{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;color:var(--text-dim);
  padding:40px 22px;text-align:center;gap:12px;
  z-index:2;
}
.stage-status .spinner{
  width:36px;height:36px;border-radius:50%;
  border:2px solid rgba(239,68,68,.18);
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
  margin-bottom:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-status h2{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.01em}
.stage-status p{font-size:.88rem;color:var(--text-dim);max-width:380px;line-height:1.5}
.stage-status .error-detail{
  margin-top:6px;padding:9px 14px;border-radius:8px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);
  color:var(--accent);font-size:.78rem;font-weight:600;
  max-width:520px;
}
.stage-status .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.stage-status .row a, .stage-status .row button{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:999px;
  font-size:.78rem;font-weight:700;
  background:var(--accent-solid,#b91c1c);color:#fff;text-decoration:none;
  border:0;cursor:pointer;
}
.stage-status .row a.ghost, .stage-status .row button.ghost{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
}
.stage-status .row a.ghost:hover, .stage-status .row button.ghost:hover{
  color:var(--text);border-color:var(--border-strong);
}

/* ─── Opponent banner (left / no-show) ─── */
/* Overlays the Daily iframe when the OTHER user leaves, or when they
   never join within OPPONENT_TIMEOUT_MS. Two-button card: Find a new
   opponent (→ /spar?autoqueue=1) or Leave (→ /spar). */
.opponent-banner{
  position:absolute;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:opp-fade-in .25s ease-out;
  padding:28px;
}
@keyframes opp-fade-in{from{opacity:0}to{opacity:1}}
.opponent-card{
  background:var(--bg-card);
  border:1px solid var(--border-strong);
  border-radius:18px;
  padding:26px 30px;text-align:center;max-width:440px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.opponent-headline{
  font-size:1.28rem;font-weight:800;color:var(--text);
  letter-spacing:-.012em;margin-bottom:8px;line-height:1.25;
}
.opponent-sub{
  font-size:.92rem;color:var(--text-dim);margin-bottom:20px;line-height:1.5;
}
.opponent-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opponent-actions button{
  padding:11px 20px;border-radius:999px;
  font-size:.86rem;font-weight:800;letter-spacing:.005em;
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.opponent-actions button:hover{transform:translateY(-1px)}
.opponent-actions .opponent-find{
  background:var(--accent-solid,#b91c1c);color:#fff;
  box-shadow:0 8px 22px var(--accent-glow);
}
.opponent-actions .opponent-leave{
  border:1px solid var(--border-strong);color:var(--text-dim);
  background:transparent;
}
.opponent-actions .opponent-leave:hover{color:var(--text)}

/* ─── Bottom foot ─── */
.room-foot{
  padding:8px 20px;
  font-size:.66rem;color:var(--text-ghost);text-align:center;
  letter-spacing:.04em;text-transform:uppercase;
  background:rgba(0,0,0,.55);border-top:1px solid var(--border);
}
.room-foot strong{color:var(--text-dim);font-weight:600;text-transform:none;letter-spacing:0}

/* ─── Camera converter + safety (Camera / Avatar / Design / Off / Report) ─── */
.cam-modes{
  position:absolute;left:14px;bottom:14px;z-index:6;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(0,0,0,.62);border:1px solid var(--border);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.cam-modes button{
  padding:6px 10px;border-radius:999px;font-size:.72rem;font-weight:700;
  color:var(--text-ghost);transition:color .15s,background .15s;
}
.cam-modes button.on{background:var(--accent-solid,#b91c1c);color:#fff}
.cam-modes button:hover{color:var(--text)}
.cam-modes button.report{color:rgba(239,68,68,.9)}
.report-sheet{
  position:absolute;left:14px;bottom:60px;z-index:7;
  display:flex;flex-direction:column;gap:7px;min-width:230px;
  background:var(--bg-card);border:1px solid var(--border-strong);
  border-radius:12px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.report-sheet .rs-head{
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-ghost);
}
.report-sheet button{
  text-align:left;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:.85rem;color:var(--text);
}
.report-sheet button:hover{border-color:var(--border-strong)}

/* ─── Mobile ─── */
@media (max-width:680px){
  .room-bar{grid-template-columns:auto 1fr;gap:10px;padding:10px 14px}
  .motion-block{grid-column:1 / -1;order:3;text-align:left}
  .room-actions{justify-content:flex-end}
  .elapsed{display:none}
  .next-btn{padding:7px 12px;font-size:.74rem}
  .leave-btn{padding:7px 12px;font-size:.72rem}
  .motion-text{font-size:.92rem;white-space:normal}
}
</style>

<body>

<header class="room-bar">
  <button class="leave-btn" id="leaveBtn" type="button">← Leave</button>
  <div class="motion-block">
    <div class="motion-eyebrow"><span class="pip"></span> Casual · Now debating</div>
    <p class="motion-text" id="motionText" title="Click to expand">(loading)</p>
  </div>
  <div class="room-actions">
    <span class="elapsed" id="elapsed" aria-label="Elapsed time">0:00</span>
    <button class="next-btn" id="nextBtn" type="button" title="Leave this room and queue up for a new debater">Next opponent →</button>
  </div>
</header>

<div class="stage" id="stage">
  <div class="stage-status" id="stageStatus">
    <div class="spinner"></div>
    <h2>Setting up the room…</h2>
    <p>Spinning up your video room. Other side will land here too. Camera + mic prompt comes from Daily.co.</p>
  </div>
</div>

<footer class="room-foot">
  Casual chat. No timer, no judge, no ballot. <strong>Be kind.</strong>
</footer>

<script>
(function(){

  // ── URL params ────────────────────────────────────────
  var qs = new URLSearchParams(location.search);
  var roomName = (qs.get('room') || '').trim();
  var motion = (qs.get('motion') || '').trim();
  var pro = (qs.get('pro') || '').trim();
  var con = (qs.get('con') || '').trim();
  var source = (qs.get('source') || 'casual').trim();

  var $ = function(id){ return document.getElementById(id); };
  var motionEl = $('motionText');
  var leaveBtn = $('leaveBtn');
  var nextBtn = $('nextBtn');
  var stage = $('stage');
  var statusBox = $('stageStatus');
  var elapsedEl = $('elapsed');

  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  // Motion display: fall back to a placeholder if missing so the room
  // never shows a blank banner.
  motionEl.textContent = motion || 'Open chat. Pick anything to debate.';
  motionEl.addEventListener('click', function(){ motionEl.classList.toggle('expanded'); });

  // ── Status helpers ────────────────────────────────────
  function setStatus(htmlBody){
    if (!statusBox){
      statusBox = document.createElement('div');
      statusBox.className = 'stage-status';
      statusBox.id = 'stageStatus';
      stage.appendChild(statusBox);
    }
    statusBox.innerHTML = htmlBody;
  }
  function clearStatus(){
    if (statusBox && statusBox.parentNode) statusBox.parentNode.removeChild(statusBox);
    statusBox = null;
  }

  // ── Elapsed timer (no consequence, just orientation) ──
  var startTs = Date.now();
  function tickElapsed(){
    var s = Math.floor((Date.now() - startTs) / 1000);
    var m = Math.floor(s / 60);
    var ss = s % 60;
    elapsedEl.textContent = m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  setInterval(tickElapsed, 1000);
  tickElapsed();

  // ── Daily.co mount ────────────────────────────────────
  // Two-tier: try the daily-js SDK first so we get participant-join /
  // participant-left events (powers the "opponent left" banner). If
  // the SDK didn't load (CDN blocked, ad-blocker), fall back to a raw
  // <iframe> with the bare Daily URL. The user can still video chat
  // in fallback mode; they just don't get a banner if the opponent
  // bails.

  var callFrame = null;        // daily-js handle (null if fallback)
  var sawOpponent = false;     // true once any remote participant joins
  var bannerShown = false;     // ensures we only show one banner ever
  var opponentTimer = null;    // "didn't show" countdown
  var OPPONENT_TIMEOUT_MS = 60 * 1000;

  function showOpponentBanner(headline, sub){
    if (bannerShown) return;
    bannerShown = true;
    var b = document.createElement('div');
    b.className = 'opponent-banner';
    b.innerHTML =
      '<div class="opponent-card">' +
        '<div class="opponent-headline">' + escHtml(headline) + '</div>' +
        (sub ? '<div class="opponent-sub">' + escHtml(sub) + '</div>' : '') +
        '<div class="opponent-actions">' +
          '<button class="opponent-find" id="oppFindBtn" type="button">Find a new opponent →</button>' +
          '<button class="opponent-leave" id="oppLeaveBtn" type="button">Leave</button>' +
        '</div>' +
      '</div>';
    stage.appendChild(b);
    document.getElementById('oppFindBtn').addEventListener('click', function(){
      destroyRoom();
      try { gtag('event', 'casual_room_banner_find', { source: source, elapsed_s: Math.floor((Date.now() - startTs)/1000) }); } catch(e){}
      location.href = '/spar?autoqueue=1';
    });
    document.getElementById('oppLeaveBtn').addEventListener('click', function(){
      destroyRoom();
      try { gtag('event', 'casual_room_banner_leave', { source: source, elapsed_s: Math.floor((Date.now() - startTs)/1000) }); } catch(e){}
      location.href = '/spar';
    });
  }

  // ── Safety layer ──────────────────────────────────────
  // Parent-owned camera pipeline (cam-avatar.js) + on-device NSFW
  // watchdog (nsfw-guard.js) + peer reports (/api/video-moderate).
  // The published video track is a canvas the parent draws, so the
  // watchdog sees exactly what the room sees, and Avatar mode can
  // never leak camera pixels. If getUserMedia fails here, Daily's
  // internal camera keeps working as before — just unguarded.
  var remotePeer = null;       // { sessionId, userName } of the other side
  var cam = null;              // DebateCam instance (canvas pipeline)
  var camGuard = null;         // DebateGuard instance
  var camMode = 'camera';
  var modBar = null;
  // Same structural block as live-round.html: this room runs on Daily
  // PREBUILT, whose call machine sits in a cross-origin iframe, and a
  // MediaStreamTrack cannot cross that boundary. daily-js posts the
  // sentinel 'daily-custom-track' and the iframe, unable to resolve it
  // against the parent's shared-track map, falls back to the DEVICE
  // camera. Measured 2026-08-15: setInputDevicesAsync RESOLVES and the
  // raw feed goes out, so the "never leaks camera pixels" comment above
  // was false and Avatar mode published the debater's face. Not offered
  // until the room moves to createCallObject; see live-round.html.
  var CUSTOM_TRACK_OK = false;

  function localSessionId(){
    try {
      var p = callFrame && callFrame.participants();
      return (p && p.local && p.local.session_id) || '';
    } catch(e){ return ''; }
  }

  function initSafety(){
    if (!callFrame || !window.DebateCam || cam) { buildModBar(!window.DebateCam); return; }
    navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 640, height: 480, facingMode: 'user' } })
      .then(function(ms){
        if (!ms.getVideoTracks().length) throw new Error('no video track');
        return window.DebateCam.start(ms, { mode: 'camera', label: '' });
      })
      .then(function(c){
        cam = c;
        // The parent capture still runs so the NSFW watchdog has a feed
        // to read; only the publish is skipped, because it is a no-op
        // that makes the iframe re-acquire the device camera.
        if (!CUSTOM_TRACK_OK){ buildModBar(false); startGuard(); return; }
        return callFrame.setInputDevicesAsync({ videoSource: c.videoTrack }).then(function(){
          callFrame.setLocalVideo(true);
          buildModBar(false);
          startGuard();
          try { gtag('event', 'casual_room_cam_unified'); } catch(e){}
        });
      })
      .catch(function(e){
        console.warn('[casual-room] safety pipeline unavailable', e);
        buildModBar(true);   // report button still renders
      });
  }

  function buildModBar(noConverter){
    if (modBar) return;
    modBar = document.createElement('div');
    modBar.className = 'cam-modes';
    modBar.innerHTML = noConverter
      ? (CUSTOM_TRACK_OK && window.DebateCam && window.DebateCam.openDesigner ? '<button type="button" data-m="design" title="Design your avatar">Design</button>' : '') +
        '<button type="button" class="report" data-m="report">⚑ Report</button>'
      : '<button type="button" data-m="camera" class="on">Camera</button>' +
        (CUSTOM_TRACK_OK
          ? '<button type="button" data-m="avatar">Avatar</button>' +
            '<button type="button" data-m="design" title="Design your avatar">Design</button>'
          : '') +
        '<button type="button" data-m="off">Off</button>' +
        '<button type="button" class="report" data-m="report">⚑ Report</button>';
    modBar.addEventListener('click', function(ev){
      var b = ev.target.closest('button');
      if (!b) return;
      var m = b.getAttribute('data-m');
      if (m === 'report'){ openReportSheet(); return; }
      if (m === 'design'){ openAvatarDesigner(); return; }
      setCamMode(m);
    });
    stage.appendChild(modBar);
  }

  function openAvatarDesigner(){
    if (!window.DebateCam || !window.DebateCam.openDesigner) return;
    window.DebateCam.openDesigner({ cam: cam, label: 'YOU' });
  }

  function setCamMode(m){
    if (!cam || !callFrame || m === camMode) return;
    // Fail closed: the mask cannot be published here, and someone asking
    // to be anonymous gets camera off rather than camera on.
    if (m === 'avatar' && !CUSTOM_TRACK_OK) m = 'off';
    camMode = m;
    if (m === 'off'){
      cam.setMode('off');
      callFrame.setLocalVideo(false);
    } else {
      cam.setMode(m);
      // Re-push the canvas track on every mode entry: Daily's own camera
      // button can have swapped the device camera back in since the first
      // publish, and Avatar must never ride on top of a raw feed. In
      // Avatar mode a failed push fails CLOSED (camera off), never the
      // raw camera under an Avatar label.
      if (CUSTOM_TRACK_OK){
        callFrame.setInputDevicesAsync({ videoSource: cam.videoTrack }).then(function(){
          if (camMode === m) maskAsserted = true;
        }).catch(function(e){
          console.warn('[cam-mode publish]', e);
          if (m === 'avatar' && camMode === 'avatar'){
            try { callFrame.setLocalVideo(false); } catch(e2){}
            setCamMode('off');
          }
        });
      }
      callFrame.setLocalVideo(true);
    }
    if (modBar) Array.prototype.forEach.call(modBar.querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-m') === m);
    });
    try { gtag('event', 'casual_room_cam_mode', { mode: m }); } catch(e){}
  }

  // Daily's prebuilt camera button / device picker / high-CPU recovery
  // can silently re-acquire the DEVICE camera over our canvas track.
  // While Avatar is on, watch the local participant and re-push the mask
  // the moment anything else goes live. Cooldown keeps it loop-proof.
  var maskAsserted = false, reassertAt = 0;
  function reassertMask(ev){
    var p = ev && ev.participant;
    if (!p || !p.local) return;
    if (camMode !== 'avatar' || !cam || !callFrame) return;
    var v = p.tracks && p.tracks.video;
    if (!v || v.state !== 'playable'){ maskAsserted = false; return; }
    var live = v.persistentTrack || v.track || null;
    if (live && cam.videoTrack && live.id === cam.videoTrack.id){ maskAsserted = true; return; }
    // Track objects can be withheld across the iframe boundary; when we
    // cannot compare ids, re-assert only on the off -> playable edge.
    if (!live && maskAsserted) return;
    var now = Date.now();
    if (reassertAt && now - reassertAt < 1500) return;
    reassertAt = now; maskAsserted = true;
    callFrame.setInputDevicesAsync({ videoSource: cam.videoTrack })
      .catch(function(e){ console.warn('[avatar reassert]', e); });
  }
  // Full stop on leave: kill the guard + canvas pipeline and release the
  // camera + mic so the recording light goes off with the room.
  function teardownSafety(){
    if (camGuard){ try { camGuard.stop(); } catch(e){} camGuard = null; }
    if (cam){ try { cam.stop(); } catch(e){} cam = null; }
    camMode = 'camera'; maskAsserted = false;
    if (modBar) Array.prototype.forEach.call(modBar.querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-m') === 'camera');
    });
  }

  function startGuard(){
    if (camGuard || !window.DebateGuard || !cam) return;
    camGuard = window.DebateGuard.attach({
      videoEl: function(){ return cam.videoEl; },
      isActive: function(){ return camMode === 'camera'; },
      room: roomName,
      roundId: roomName,
      sessionId: localSessionId,
      onTrip: function(){
        try { cam.setMode('off'); } catch(e){}
        try { callFrame && callFrame.setLocalVideo(false); } catch(e){}
        camMode = 'off';
        showOpponentBanner(
          'Removed by the safety system.',
          'The on-device detector flagged explicit content on your camera. The feed was cut before it reached the room, and this counts as a strike. Repeat strikes suspend video access.'
        );
        setTimeout(function(){ try { callFrame && callFrame.leave(); } catch(e){} }, 400);
        try { gtag('event', 'casual_room_guard_trip'); } catch(e){}
      },
    });
  }

  function openReportSheet(){
    var old = stage.querySelector('.report-sheet');
    if (old){ old.remove(); return; }
    var sheet = document.createElement('div');
    sheet.className = 'report-sheet';
    var target = remotePeer;
    sheet.innerHTML = '<div class="rs-head">Report ' + escHtml(target ? target.userName : 'your opponent') + '</div>';
    [['nsfw','Explicit content'],['not_serious','Not serious, trolling'],['harassment','Harassment'],['other','Something else']].forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = c[1];
      b.addEventListener('click', function(){
        sheet.remove();
        if (!window.DebateGuard) return;
        window.DebateGuard.report({
          room: roomName, roundId: roomName, category: c[0],
          sessionId: localSessionId(),
          offender: target ? { sessionId: target.sessionId, userName: target.userName } : {},
        }).then(function(res){
          if (res && res.ejected){
            showOpponentBanner('Opponent removed.', 'They were removed from the room after your report. Find a new debater?');
          } else {
            var t = document.createElement('div');
            t.className = 'report-sheet';
            t.innerHTML = '<div class="rs-head">Report filed. Two independent reports remove a debater.</div>';
            stage.appendChild(t);
            setTimeout(function(){ try { t.remove(); } catch(e){} }, 3500);
          }
        });
        try { gtag('event', 'casual_room_report', { category: c[0] }); } catch(e){}
      });
      sheet.appendChild(b);
    });
    stage.appendChild(sheet);
  }

  function mountDaily(){
    if (!roomName){
      setStatus(
        '<h2>No room in the URL.</h2>' +
        '<p>This page is opened automatically after a match on <a href="/spar" style="color:var(--accent);text-decoration:underline">/spar</a>. Land here yourself? Go back and find a debater.</p>' +
        '<div class="row"><a href="/spar">← Back to debate chat</a></div>'
      );
      return;
    }
    fetch('/api/create-daily-room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: roomName }),
    }).then(function(r){
      return r.json().then(function(j){ return { ok: r.ok, status: r.status, body: j }; });
    }).then(function(res){
      if (res.status === 403 && res.body && res.body.banned){
        var untilStr = res.body.until ? new Date(res.body.until).toLocaleString() : 'later';
        setStatus(
          '<h2>Video access suspended.</h2>' +
          '<p>A safety violation was recorded on this account or network. Video rooms reopen after ' + escHtml(untilStr) + '.</p>' +
          '<div class="row"><a class="ghost" href="/spar">← Back to debate chat</a></div>'
        );
        try { gtag('event', 'casual_room_ban_gate'); } catch(e){}
        return;
      }
      if (!res.ok || !res.body || !res.body.url){
        var hint = (res.body && res.body.hint) || '';
        var detail = (res.body && (res.body.error || ('http_' + res.status))) || 'unknown error';
        setStatus(
          '<h2>Video room unavailable.</h2>' +
          '<p>The Daily.co integration is offline or unconfigured.</p>' +
          '<div class="error-detail">' + escHtml(detail) + (hint ? ' (' + escHtml(hint) + ')' : '') + '</div>' +
          '<div class="row">' +
            '<button onclick="location.reload()">Retry</button>' +
            '<a class="ghost" href="/spar">← Back to debate chat</a>' +
          '</div>'
        );
        console.warn('[casual-room] daily room failed', res);
        return;
      }
      var url = res.body.url;
      // Identity-attributed join (see create-daily-room.mjs): the
      // meeting token carries uid or IP hash as user_id, which is what
      // turns peer reports into strikes and makes eject's ban stick.
      if (res.body.token){
        url += (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(res.body.token);
      }

      // Preferred path: daily-js with participant events.
      if (window.DailyIframe && typeof window.DailyIframe.createFrame === 'function'){
        try {
          var displayName = pro || con || 'Guest';
          callFrame = window.DailyIframe.createFrame(stage, {
            iframeStyle: {
              position: 'absolute', top: '0', left: '0',
              width: '100%', height: '100%', border: '0',
            },
            showLeaveButton: false,
            showFullscreenButton: true,
          });
          callFrame.on('participant-joined', function(ev){
            sawOpponent = true;
            if (opponentTimer){ clearTimeout(opponentTimer); opponentTimer = null; }
            // Track the remote side so the Report button has a target.
            if (ev && ev.participant && !ev.participant.local){
              remotePeer = { sessionId: ev.participant.session_id, userName: ev.participant.user_name || 'Opponent' };
            }
          });
          callFrame.on('participant-updated', reassertMask);
          callFrame.on('left-meeting', teardownSafety);
          callFrame.on('participant-left', function(ev){
            // Don't fire the banner if WE already left (the "Leave" /
            // "Next" buttons set bannerShown via destroyRoom flag-free
            // navigation, but a double-event from Daily could still
            // race; bannerShown gate handles it).
            if (bannerShown) return;
            // Only signal if the leaver was the OPPONENT (remote).
            // Daily's docs say participant-left only fires for remote
            // participants, so any event here is the other side.
            showOpponentBanner(
              'Your opponent left the room.',
              'Find a new partner, or call it a round.'
            );
            try { gtag('event', 'casual_room_opponent_left', { source: source, elapsed_s: Math.floor((Date.now() - startTs)/1000) }); } catch(e){}
          });
          callFrame.join({ url: url, userName: displayName }).then(function(){
            clearStatus();
            initSafety();
            // Start the "opponent never showed" timer. Resets whenever
            // participant-joined fires.
            opponentTimer = setTimeout(function(){
              if (!sawOpponent && !bannerShown){
                showOpponentBanner(
                  'Your opponent did not arrive.',
                  'They may have dropped on their side. Find another debater?'
                );
                try { gtag('event', 'casual_room_opponent_no_show', { source: source }); } catch(e){}
              }
            }, OPPONENT_TIMEOUT_MS);
            try { gtag('event', 'casual_room_daily_mount', { source: source, mode: 'sdk' }); } catch(e){}
          }).catch(function(e){
            console.warn('[casual-room] daily-js join failed', e);
            setStatus(
              '<h2>Could not join the video room.</h2>' +
              '<p>The room exists but the connection failed.</p>' +
              '<div class="error-detail">' + escHtml(e && e.message || 'join failed') + '</div>' +
              '<div class="row"><button onclick="location.reload()">Retry</button><a class="ghost" href="/spar">← Back to debate chat</a></div>'
            );
          });
          return;
        } catch(e){
          console.warn('[casual-room] daily-js createFrame failed; falling back to raw iframe', e);
          callFrame = null;
          // Fall through to raw iframe path.
        }
      }

      // Fallback path: raw <iframe>. No participant events; user
      // won't see the "opponent left" banner. Still functional.
      var iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.allow = 'camera; microphone; fullscreen; display-capture; autoplay; clipboard-write';
      iframe.title = 'Casual debate video room';
      clearStatus();
      stage.appendChild(iframe);
      try { gtag('event', 'casual_room_daily_mount', { source: source, mode: 'iframe_fallback' }); } catch(e){}
    }).catch(function(e){
      setStatus(
        '<h2>Network error reaching the room service.</h2>' +
        '<p>Check your connection and try again.</p>' +
        '<div class="error-detail">' + escHtml(e && e.message || 'fetch failed') + '</div>' +
        '<div class="row">' +
          '<button onclick="location.reload()">Retry</button>' +
          '<a class="ghost" href="/spar">← Back to debate chat</a>' +
        '</div>'
      );
      console.warn('[casual-room] daily fetch failed', e);
    });
  }
  mountDaily();

  // ── Leave + Next opponent ─────────────────────────────
  function destroyRoom(){
    // Safety pipeline first so the camera + detector release cleanly.
    if (camGuard){ try { camGuard.stop(); } catch(e){} camGuard = null; }
    if (cam){
      try { cam.srcStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      try { cam.stop(); } catch(e){}
      cam = null;
    }
    if (modBar){ try { modBar.remove(); } catch(e){} modBar = null; }
    // Daily-js path: clean leave + destroy so the mic/cam release.
    if (callFrame){
      try { callFrame.leave(); } catch(e){}
      try { callFrame.destroy(); } catch(e){}
      callFrame = null;
    }
    // Raw-iframe fallback path: just rip the iframe out.
    var f = stage.querySelector('iframe');
    if (f) f.remove();
    // Remove any opponent banner that's currently overlaid.
    var b = stage.querySelector('.opponent-banner');
    if (b) b.remove();
    if (opponentTimer){ clearTimeout(opponentTimer); opponentTimer = null; }
  }
  leaveBtn.addEventListener('click', function(){
    destroyRoom();
    try { gtag('event', 'casual_room_leave', { source: source, elapsed_s: Math.floor((Date.now() - startTs)/1000) }); } catch(e){}
    location.href = '/spar';
  });

  // Brief grace period before Next is allowed. Without this, an
  // accidental click 2 seconds in re-queues users who haven't said
  // hello yet. 20s feels long enough to be intentional, short enough
  // to not feel jailed.
  var NEXT_MIN_MS = 20 * 1000;
  function updateNextEnabled(){
    var elapsedMs = Date.now() - startTs;
    if (elapsedMs < NEXT_MIN_MS){
      nextBtn.disabled = true;
      var left = Math.ceil((NEXT_MIN_MS - elapsedMs) / 1000);
      nextBtn.textContent = 'Next in ' + left + 's';
      setTimeout(updateNextEnabled, 1000);
    } else {
      nextBtn.disabled = false;
      nextBtn.textContent = 'Next opponent →';
    }
  }
  updateNextEnabled();

  nextBtn.addEventListener('click', function(){
    if (nextBtn.disabled) return;
    destroyRoom();
    try { gtag('event', 'casual_room_next', { source: source, elapsed_s: Math.floor((Date.now() - startTs)/1000) }); } catch(e){}
    // ?autoqueue=1 tells /spar to skip the prompt picker, pull
    // a random prompt, and auto-fire Find. The other side stays in
    // the room until they also click Next (or Leave / close the tab).
    location.href = '/spar?autoqueue=1';
  });

  // Belt-and-suspenders: also tear down the iframe on page hide so the
  // Daily session releases mic/cam if the user navigates away another
  // way (back button, tab close).
  window.addEventListener('pagehide', destroyRoom);

})();
</script>
<script defer src="/js/home-magnet.js"></script>
</body>
