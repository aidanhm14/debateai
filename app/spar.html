.setup-card{
  max-width:560px;margin:18px auto 0;padding:16px 18px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
  text-align:left;
}
.setup-head{
  display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:10px;
  font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);
}
.setup-head span{
  font-weight:500;letter-spacing:0;text-transform:none;color:var(--text-ghost);
}
/* Interruption capture is the capability debaters most often assume an AI
   judge lacks, so it gets a pill on the header row instead of sitting in
   the ghost-grey run-on line where it read as boilerplate. */
.setup-head .setup-flag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;
  font-size:.63rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  /* red-300 on the dark panel; the light theme swaps to a deeper red below.
     Straight #ef4444 measured under the 4.5 floor on the dark card. */
  white-space:nowrap;color:#fca5a5;
  background:var(--ui-accent-soft,rgba(239,68,68,.12));border:1px solid rgba(239,68,68,.55);
}
.setup-head .setup-flag::before{
  content:'';width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:setupFlagPulse 2s ease-in-out infinite;
}
[data-theme="light"] .setup-head .setup-flag{color:#b91c1c;border-color:rgba(185,28,28,.45)}
@keyframes setupFlagPulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.setup-head .setup-flag::before{animation:none}}
.setup-judge-top{
  margin:0 0 10px;padding:12px 13px;border:1px solid rgba(239,68,68,.24);
  border-radius:12px;background:rgba(239,68,68,.045);
}
.setup-judge-top .paradigm-row label{color:var(--text);font-size:.78rem}
.setup-judge-top .jb-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.setup-judge-top .jb-strip-btn{min-width:0;width:100%}
@media(max-width:520px){
  .setup-judge-top .jb-strip{grid-template-columns:1fr}
}
/* Numbered accordion steps (2026-08-18 simplification). Three <details>
   rows, collapsed by default; the summary line carries the current pick
   so a closed card still tells the truth about what is set. */
.setup-step{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02)}
.setup-step + .setup-step{margin-top:8px}
.setup-step summary{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  cursor:pointer;list-style:none;user-select:none;
}
.setup-step summary::-webkit-details-marker{display:none}
.setup-step summary:hover .setup-step-t{color:var(--accent)}
.setup-step-n{
  flex:none;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--border-strong);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:800;color:var(--text-dim);
}
.setup-step[open] .setup-step-n{background:var(--accent);border-color:var(--accent);color:#fff}
.setup-step-t{font-size:.82rem;font-weight:700;color:var(--text);transition:color .15s}
.setup-step-v{
  margin-left:auto;min-width:0;font-size:.72rem;font-weight:600;color:var(--text-ghost);
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.setup-step-chev{flex:none;font-size:.7rem;color:var(--text-ghost);transition:transform .15s}
.setup-step[open] .setup-step-chev{transform:rotate(180deg)}
.setup-step-body{padding:4px 13px 14px;border-top:1px solid var(--border)}
.setup-step-body .paradigm-row + .paradigm-row{margin-top:14px}
.setup-options-note{font-size:.74rem;color:var(--text-ghost);margin:8px 0 9px;line-height:1.5}
.style-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.style-chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--text-dim);font-size:.76rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:border-color .15s,color .15s,background .15s;
}
.style-chip:hover{border-color:var(--border-strong);color:var(--text)}
.style-chip.on{
  background:rgba(239,68,68,.12);border-color:var(--accent);color:var(--accent);
}
.judge-presets{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.judge-preset-chip{font-size:.72rem;padding:5px 10px}
.paradigm-row label{
  display:block;font-size:.74rem;font-weight:700;color:var(--text-dim);margin-bottom:6px;
}
.paradigm-row label .opt{font-weight:500;color:var(--text-ghost)}
.paradigm-row textarea{
  width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:inherit;font-size:.8rem;line-height:1.5;
  padding:9px 11px;resize:vertical;min-height:46px;
}
.paradigm-row textarea:focus{outline:none;border-color:var(--accent)}
.spar-lang-select{
  width:100%;padding:9px 10px;border-radius:10px;font-family:inherit;
  font-size:.86rem;font-weight:600;color:var(--text);cursor:pointer;
  border:1px solid var(--border);background:rgba(255,255,255,.03);
  transition:border-color .15s,background .15s;
}
.spar-lang-select:hover{border-color:var(--border-strong)}
.spar-lang-select:focus{outline:none;border-color:var(--accent)}
.spar-lang-select.xl{color:#fca5a5;border-color:rgba(239,68,68,.32);background:rgba(239,68,68,.06)}
.spar-lang-select option{background:#16131a;color:#f4f4f2}
.paradigm-meta{
  display:flex;justify-content:space-between;gap:8px;margin-top:5px;
  font-size:.66rem;color:var(--text-ghost);
}
#paradigmSaved{color:var(--green)}

/* Consent card — a proposed round with judge instructions, awaiting
   the opponent's accept/pass. */
.consent-wrap{max-width:580px;margin:0 auto}
.consent-note{
  max-width:480px;margin:14px auto 0;padding:13px 16px;text-align:left;
  background:rgba(239,68,68,.07);border:1px solid var(--accent-glow);border-radius:12px;
  font-size:.86rem;line-height:1.55;color:var(--text);
}
.consent-note.mine{
  background:var(--bg-card);border-color:var(--border);color:var(--text-dim);
}
.consent-note-label{
  font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-ghost);margin-bottom:5px;
}
/* Cross-format proposal block — "your proposal X, their proposal Y, play Z?" */
.consent-format{
  max-width:480px;margin:14px auto 0;padding:13px 16px;text-align:left;
  background:rgba(239,68,68,.07);border:1px solid var(--accent-glow);border-radius:12px;
}
.consent-format-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:.82rem;line-height:1.5;color:var(--text-dim);
}
.consent-format-row + .consent-format-row{margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.consent-format-row strong{color:var(--text);font-weight:700}
.consent-format-row.play strong{color:var(--accent)}
.consent-format-who{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-ghost)}

/* ── Match-found card ─────────────────────────────────────────────
   The highest-adrenaline moment on the site: a real person is on the
   other end and the window is seconds wide. The old card said so in
   grey text and a static number, which read like a cookie banner. So:
   one expanding ring on arrival, a you-against-them face-off so the
   opponent is a face rather than a name in a sentence, and the decide
   window drawn as a bar draining across the accept button, where the
   eye already is. Everything is red or ink; amber stays reserved for
   state semantics. */
.consent-wrap.mf{position:relative}
.mf-burst{
  position:absolute;left:50%;top:96px;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;border:2px solid var(--accent);pointer-events:none;z-index:0;
  animation:mf-burst 1s cubic-bezier(.16,.84,.44,1) forwards;
}
@keyframes mf-burst{from{transform:scale(1);opacity:.85}to{transform:scale(44);opacity:0}}
.mf > *{position:relative;z-index:1}
/* The eyebrow is the announcement, so it stops whispering: filled red
   chip, white type. Everywhere else on the page it stays a quiet label. */
.mf > .eyebrow{
  animation:mf-rise .45s cubic-bezier(.2,.9,.3,1) both;
  padding:6px 14px;border-radius:999px;
  background:var(--accent-solid,#b91c1c);color:#fff;
  font-size:.62rem;box-shadow:0 6px 22px var(--accent-glow);
}
[data-lighting="dark"] .mf > .eyebrow{color:#fff}
.mf > .eyebrow .pip{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.9)}
.mf > .mf-faceoff{animation:mf-rise .5s cubic-bezier(.2,.9,.3,1) .05s both}
.mf > h1{animation:mf-rise .5s cubic-bezier(.2,.9,.3,1) .12s both}
.mf > .lede{animation:mf-rise .5s cubic-bezier(.2,.9,.3,1) .18s both}
.mf > .btn-row{animation:mf-rise .5s cubic-bezier(.2,.9,.3,1) .24s both}
.mf > .countdown{animation:mf-rise .5s cubic-bezier(.2,.9,.3,1) .3s both}
@keyframes mf-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.mf-faceoff{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:0 auto 16px;
}
.mf-side{display:flex;flex-direction:column;align-items:center;gap:9px;width:120px}
.mf-face{
  position:relative;width:86px;height:86px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-card);border:1px solid var(--border);
  font-size:1.45rem;font-weight:800;color:var(--text-dim);letter-spacing:.02em;
}
.mf-face svg,.mf-face img{width:100%;height:100%;display:block;object-fit:cover}
.mf-side.them .mf-face{
  border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 0 5px var(--accent-glow),0 10px 30px var(--accent-glow);
}
/* One halo per second on the opponent only. They are the new thing on
   screen; haloing both sides would just be noise. */
.mf-side.them::before{
  content:'';position:absolute;width:86px;height:86px;border-radius:50%;
  border:1.5px solid var(--accent);pointer-events:none;
  animation:mf-halo 1.8s ease-out infinite;
}
@keyframes mf-halo{0%{transform:scale(1);opacity:.6}75%{transform:scale(1.42);opacity:0}100%{opacity:0}}
.mf-side{position:relative}
.mf-tag{
  font-size:.66rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-ghost);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;
}
.mf-side.them .mf-tag{color:var(--accent)}
.mf-vs{
  font-size:.82rem;font-weight:800;letter-spacing:.18em;color:var(--text-dim);
  margin-bottom:26px;
}

/* Accept button: bigger than a normal .btn, with the decide window
   draining along its bottom edge. The bar is the countdown; the pill
   below is the number for anyone who wants it exact. */
.btn.mf-go{
  position:relative;overflow:hidden;
  padding:14px 30px;font-size:.92rem;
}
.mf-drain{
  position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:rgba(255,255,255,.9);transform-origin:left center;
  animation:mf-drain var(--mf-dur,15s) linear forwards;
}
@keyframes mf-drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* Slow sheen across the accept button so it reads as the live thing on
   a still page. */
.btn.mf-go::after{
  content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  animation:mf-sheen 2.8s ease-in-out infinite;pointer-events:none;
}
@keyframes mf-sheen{0%{left:-60%}55%,100%{left:120%}}
.btn.mf-go:disabled::after,.btn.mf-go:disabled .mf-drain{display:none}

/* Last five seconds. The button breathes and the number goes red; no
   new colour is introduced, it just gets louder. */
.mf.is-urgent .btn.mf-go{animation:mf-pulse .85s ease-in-out infinite}
@keyframes mf-pulse{
  0%,100%{transform:none;box-shadow:0 6px 24px var(--accent-glow)}
  50%{transform:scale(1.035);box-shadow:0 8px 34px var(--accent)}
}
.mf.is-urgent .countdown{border-color:var(--accent);color:var(--accent)}
.mf.is-urgent .countdown strong{color:var(--accent)}
.mf .countdown{margin-top:16px;margin-bottom:0}

@media (max-width:520px){
  .mf-faceoff{gap:8px}
  .mf-side{width:96px}
  .mf-face{width:68px;height:68px;font-size:1.2rem}
  .mf-side.them::before{width:68px;height:68px}
  .mf-tag{max-width:96px}
  .mf-vs{margin-bottom:24px}
}
@media (prefers-reduced-motion:reduce){
  .mf-burst,.btn.mf-go::after,.mf-side.them::before{display:none}
  .mf > *{animation:none !important}
  .mf.is-urgent .btn.mf-go{animation:none}
  .mf-drain{animation-name:mf-drain}
}

/* ── Waiting on the opponent ──────────────────────────────────────
   The other half of the match-found moment, and until now the poor
   one: a face, a headline, and a Withdraw button on a page with no
   motion, no clock, and no statement of what happens if the other
   person never answers. So the reflex it invited was Withdraw, which
   dissolves a real pair.

   Same faceoff as the match card, with the roles inverted: I am
   settled, they are the live thing. Their side carries the decide
   window as a ring that empties, a caption that steps through what
   is actually happening, and a promise underneath that leaving is
   not the only way out of the wait. No number counts down at me —
   the wait is on them, and a digit ticking toward zero on my screen
   reads as my deadline. */
.mf-wait .mf-side.them .mf-face{
  box-shadow:0 0 0 5px var(--accent-glow),0 10px 30px var(--accent-glow);
  animation:mf-wait-breathe 2.4s ease-in-out infinite;
}
@keyframes mf-wait-breathe{
  0%,100%{transform:none}
  50%{transform:scale(1.04)}
}
/* My own side goes quiet: I am the settled one in this frame. */
.mf-wait .mf-side.me .mf-face{opacity:.62}
.mf-wait .mf-side.me .mf-tag{color:var(--text-ghost)}

/* Their decide window, drawn as a ring emptying around their face.
   Stroke-dashoffset over the real CONSENT_DECIDE_SEC, set inline. */
.mf-window{
  position:absolute;top:-7px;left:50%;width:100px;height:100px;margin-left:-50px;
  pointer-events:none;transform:rotate(-90deg);
}
.mf-window circle{
  fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;opacity:.85;
  stroke-dasharray:302;
  animation:mf-window var(--mf-dur,15s) linear forwards;
}
@keyframes mf-window{from{stroke-dashoffset:0}to{stroke-dashoffset:302}}

/* Step captions under their name. One line, swapped in place by
   startWaitPhases() — never stacked, so the card never grows. */
.mf-phase{
  display:block;margin:-6px auto 14px;font-size:.72rem;font-weight:600;
  letter-spacing:.02em;color:var(--text-dim);min-height:1.15em;
  animation:mf-phase-in .3s ease both;
}
@keyframes mf-phase-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ── MOTION DRAFT ──────────────────────────────────────────────────
   The pre-round veto. Five motions, two strikes each, blind, then a
   coin-flip split: one debater calls the motion, the other calls the
   side. Reads as a draft board, not as a form.

   The whole surface is built to survive a 320px phone without a
   horizontal scrollbar, because the strike beat is the one screen where
   a mis-tap costs a motion the person wanted. Cards are full-width rows
   on mobile and stay that way; nothing here is a grid that reflows
   under a thumb. */
.draft-wrap{max-width:660px;margin:0 auto;width:100%}

/* #daExpAsk is the sitewide "do you already debate?" chooser (topbar.js ->
   audience-mode.js): position:fixed, z-index 99990, and on a 375px screen it
   sits straight over motions 4 and 5. It asks a question with no deadline;
   the draft runs a 14 second clock on tap targets that cost a motion if you
   miss. It waits. Restored the moment the board comes down. */
body.draft-live #daExpAsk{display:none !important}

/* Phase clock. One bar, not a ring: the strike beat has five cards
   under it and a ring next to a face competes with them for the eye. */
.draft-clock{
  position:relative;height:3px;border-radius:2px;overflow:hidden;
  background:var(--border);margin:0 0 18px;
}
.draft-clock i{
  position:absolute;inset:0;display:block;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),#f97316);
  transform-origin:left center;
  animation:draft-clock var(--draft-dur,14s) linear forwards;
}
@keyframes draft-clock{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* Last three seconds. The bar is thin, so urgency has to come from
   colour and pulse rather than from size. */
.draft-clock.hot i{background:linear-gradient(90deg,#ef4444,#f97316);animation-name:draft-clock,draft-hot}
@keyframes draft-hot{0%,100%{opacity:1}50%{opacity:.45}}

.draft-head{text-align:center;margin:0 0 16px}
.draft-step{
  display:inline-flex;align-items:center;gap:7px;font-size:.63rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-ghost);
}
.draft-step b{color:var(--accent);font-weight:800}
.draft-title{
  font-size:clamp(1.15rem,4.2vw,1.6rem);font-weight:800;line-height:1.18;
  margin:8px 0 4px;letter-spacing:-.01em;
}
.draft-title em{font-style:normal;color:var(--accent)}
.draft-sub{font-size:.8rem;color:var(--text-dim);margin:0;line-height:1.45}
.draft-count{
  /* min-width stops the sentence reflowing as digits drop 14 -> 9 -> 0;
     text-align:right keeps a single digit against the "s" instead of
     leaving a gap in the middle of the phrase. */
  display:inline-block;min-width:1.4em;text-align:right;
  font-variant-numeric:tabular-nums;font-weight:800;color:var(--text);
}
/* Keeps "12s left" off two lines. The count is inline-block with a min-width
   so the layout does not jitter as digits change, and that is exactly what
   let the line break between the number and the unit. */
.draft-nb{white-space:nowrap}

/* ── the slate ─────────────────────────────────────────────────── */
.draft-slate{display:flex;flex-direction:column;gap:8px;margin:16px 0 0;list-style:none;padding:0}
.draft-card{
  position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;
  padding:13px 14px;border-radius:12px;text-align:left;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font:inherit;font-size:.87rem;line-height:1.4;
  cursor:pointer;transition:border-color .16s,background .16s,transform .12s,opacity .3s;
  animation:draft-deal .34s cubic-bezier(.2,.9,.3,1) both;
  animation-delay:calc(var(--i,0) * 55ms);
}
@keyframes draft-deal{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.draft-card:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.draft-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.draft-card:disabled{cursor:default}
.draft-num{
  flex:0 0 auto;width:22px;height:22px;border-radius:6px;margin-top:1px;
  display:grid;place-items:center;font-size:.68rem;font-weight:800;
  background:var(--border);color:var(--text-ghost);
  font-variant-numeric:tabular-nums;transition:background .16s,color .16s;
}
.draft-card:hover:not(:disabled) .draft-num{background:var(--accent);color:#fff}
/* basis 0, not auto. With `flex:1 1 auto` the text claims its full content
   width, and under the mobile flex-wrap it took a line of its own and left
   the number stranded above it. */
.draft-text{flex:1 1 0;min-width:0}

/* Struck by me. The slash is drawn, not a text-decoration, so it can
   animate across the card at the moment of the strike. */
.draft-card.struck{opacity:.42;border-color:var(--border);background:transparent}
.draft-card.struck .draft-num{background:transparent;color:var(--text-ghost)}
.draft-card.struck .draft-text{color:var(--text-ghost)}
.draft-card.struck::after{
  content:'';position:absolute;left:12px;right:12px;top:50%;height:2px;
  background:var(--accent);border-radius:2px;transform-origin:left center;
  animation:draft-slash .22s ease-out both;
}
@keyframes draft-slash{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Struck by the opponent: same slash, their colour, and it lands during
   the reveal rather than on a click. */
.draft-card.struck-them::after{background:#f97316}
.draft-card.struck-both::after{background:linear-gradient(90deg,var(--accent),#f97316)}

/* A flex child, deliberately NOT absolutely positioned. Absolute put it on
   top of the motion text, and the longest motion on the board is exactly the
   one most likely to survive and carry a badge, so the overlap landed on the
   single line the reveal exists to show. */
.draft-by{
  flex:0 0 auto;align-self:center;
  font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-ghost);padding:2px 0 2px 10px;border-radius:5px;
  animation:draft-by-in .3s ease .12s both;white-space:nowrap;
}
@keyframes draft-by-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* Survivor. The one thing on screen that should feel earned. */
.draft-card.alive{
  border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);
  animation:draft-alive .4s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes draft-alive{
  0%{transform:none}
  45%{transform:scale(1.025)}
  100%{transform:none}
}
.draft-card.alive .draft-num{background:var(--accent);color:#fff}
.draft-card.locked{
  border-color:var(--accent);border-width:2px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);
}

/* ── faces + roles ─────────────────────────────────────────────── */
.draft-vs{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:0 0 14px;
}
.draft-vs-side{display:flex;align-items:center;gap:8px;min-width:0}
.draft-vs-side .draft-vs-name{
  font-size:.76rem;font-weight:700;min-width:0;max-width:124px;
  /* The NAME clamps to one line; the state line under it must not inherit
     that clamp or "you called the motion" renders as "you called the m...".
     Overridden on .draft-vs-state below. */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.draft-vs-face{
  width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:var(--border);display:grid;place-items:center;
  font-size:.72rem;font-weight:800;color:var(--text-dim);
  border:2px solid transparent;transition:border-color .2s;
}
.draft-vs-face svg,.draft-vs-face img{width:100%;height:100%;display:block}
.draft-vs-side.ready .draft-vs-face{border-color:#22c55e}
.draft-vs-side.acting .draft-vs-face{border-color:var(--accent);animation:draft-acting 1.5s ease-in-out infinite}
@keyframes draft-acting{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.draft-vs-mid{
  font-size:.6rem;font-weight:800;letter-spacing:.14em;color:var(--text-ghost);
  flex:0 0 auto;
}
.draft-vs-state{
  display:block;font-size:.58rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-ghost);margin-top:1px;
  white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25;
}
.draft-vs-side.ready .draft-vs-state{color:#22c55e}

/* The coin. Two faces on one card, flipped in 3D, landing on the role
   this debater actually holds. */
.draft-coin-wrap{display:grid;place-items:center;margin:6px 0 16px;perspective:700px}
.draft-coin{
  width:64px;height:64px;border-radius:50%;position:relative;
  transform-style:preserve-3d;animation:draft-flip 1.15s cubic-bezier(.3,.7,.4,1) both;
}
.draft-coin span{
  position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  backface-visibility:hidden;font-size:.56rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;text-align:center;line-height:1.15;padding:6px;
}
.draft-coin .cf{background:var(--accent);color:#fff}
.draft-coin .cb{background:#f97316;color:#fff;transform:rotateY(180deg)}
@keyframes draft-flip{
  0%{transform:rotateY(0) scale(.7);opacity:0}
  15%{opacity:1}
  100%{transform:rotateY(1080deg) scale(1);opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .draft-coin{animation-duration:.01ms}
  .draft-card{animation:none}
  .draft-clock i{animation-duration:var(--draft-dur,14s)}
}

/* ── side pick ─────────────────────────────────────────────────── */
.draft-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.draft-side-btn{
  padding:18px 12px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:border-color .16s,transform .12s,background .16s;
  animation:draft-deal .3s cubic-bezier(.2,.9,.3,1) both;
}
.draft-side-btn:nth-child(2){animation-delay:70ms}
.draft-side-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.draft-side-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.draft-side-name{font-size:1.02rem;font-weight:800;letter-spacing:-.01em}
.draft-side-sub{font-size:.68rem;color:var(--text-dim);text-align:center;line-height:1.3}

/* ── final lock ────────────────────────────────────────────────── */
.draft-final{
  border:2px solid var(--accent);border-radius:14px;padding:18px 16px;
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  animation:draft-lock .45s cubic-bezier(.2,1.3,.4,1) both;text-align:center;
}
@keyframes draft-lock{
  0%{opacity:0;transform:scale(.9)}
  60%{transform:scale(1.02)}
  100%{opacity:1;transform:scale(1)}
}
.draft-final-motion{font-size:1rem;font-weight:700;line-height:1.35;margin:0 0 12px}
.draft-final-sides{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.draft-badge{
  font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;background:var(--accent);color:#fff;
}
.draft-badge.con{background:#f97316}
.draft-note{
  font-size:.7rem;color:var(--text-ghost);margin:12px 0 0;line-height:1.4;
}
.draft-actions{display:flex;gap:9px;justify-content:center;margin:18px 0 0;flex-wrap:wrap}

@media (max-width:420px){
  .draft-card{padding:11px 12px;font-size:.83rem;gap:10px}
  /* Under 420px the badge drops to its own line under the motion rather
     than squeezing the text into a column two words wide. */
  .draft-card{flex-wrap:wrap}
  .draft-by{align-self:flex-start;padding:4px 0 0 34px;width:100%}
  .draft-sides{gap:8px}
  .draft-side-btn{padding:15px 8px}
}

/* The promise. This is the line that stops the Withdraw reflex: the
   wait has a floor, and hitting it costs the user nothing. */
.mf-hold{
  max-width:400px;margin:2px auto 0;padding:10px 14px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  font-size:.76rem;line-height:1.5;color:var(--text-dim);
}
.mf-hold strong{color:var(--text);font-weight:700}

/* ── "They already said yes" ──────────────────────────────────────
   The strongest honest reason to accept a match, and the card was
   throwing it away: consents[peer] is already in the doc, so we know
   when the other person has committed and is standing in an empty
   room waiting on this click. Same card either way until now.

   Green, not red: this is a state fact about them, not a deadline
   aimed at me. Amber stays reserved per the 2026-05-19 rule; green
   is already the alerts colour on this page. */
/* --mf-ok rides the page's own --green so the light theme gets its
   darker #16a34a instead of a neon that washes out on cream. --mf-ok-*
   are the tints, defined per theme rather than as one alpha, because
   the same alpha over #0a0a0c and over #fafaf7 are not the same wash. */
:root,[data-theme="grey"],[data-theme="crimson"]{
  --mf-ok:#22c55e;
  --mf-ok-fill:rgba(34,197,94,.10);
  --mf-ok-line:rgba(34,197,94,.34);
  --mf-ok-halo:rgba(34,197,94,.16);
  --mf-ok-cast:rgba(34,197,94,.20);
}
[data-theme="light"]{
  /* Text sits a step darker than --green: the badge line is 11.5px and
     #16a34a on cream measures ~3.4:1, under AA. The rings and tints keep
     --green, where contrast is not carrying meaning. */
  --mf-ok:#15803d;
  --mf-ok-fill:rgba(22,163,74,.09);
  --mf-ok-line:rgba(22,163,74,.38);
  --mf-ok-halo:rgba(22,163,74,.14);
  --mf-ok-cast:rgba(22,163,74,.16);
}
.mf-locked{
  display:inline-flex;align-items:center;gap:7px;
  margin:0 auto 12px;padding:6px 13px;border-radius:999px;
  background:var(--mf-ok-fill);border:1px solid var(--mf-ok-line);
  color:var(--mf-ok);font-size:.72rem;font-weight:700;letter-spacing:.01em;
}
.mf-locked svg{flex-shrink:0}
.mf-side.them.has-locked .mf-face{
  border-color:var(--green);
  box-shadow:0 0 0 5px var(--mf-ok-halo),0 10px 30px var(--mf-ok-cast);
}
.mf-side.them.has-locked::before{border-color:var(--green)}
.mf-side.them.has-locked .mf-tag{color:var(--mf-ok)}

@media (max-width:520px){
  .mf-window{width:82px;height:82px;margin-left:-41px;top:-7px}
  .mf-window circle{stroke-dasharray:245}
  @keyframes mf-window{from{stroke-dashoffset:0}to{stroke-dashoffset:245}}
}
@media (prefers-reduced-motion:reduce){
  .mf-wait .mf-side.them .mf-face{animation:none}
  .mf-phase{animation:none}
  .mf-window circle{animation-name:mf-window}
}

/* Live waitlist tile — shows other available debaters, with avatars,
   short names, proposed formats, and how long they've been waiting.
   Replaces the older single-line "X in your queue" text. */
.waitlist{
  max-width:420px;margin:0 auto;
  padding:14px 16px 12px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:14px;
  text-align:left;
}
.waitlist-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-ghost);
  margin-bottom:10px;
}
.waitlist-head strong{color:var(--text);font-size:.78rem;letter-spacing:.04em;text-transform:none;font-weight:800}
.waitlist-head .wl-fmt{color:var(--text-dim);font-size:.62rem}
.wl-list{
  list-style:none;padding:0;margin:0;
  display:flex;flex-direction:column;gap:2px;
}
/* The two auto tracks take max-content BEFORE the name's 1fr gets
   anything, and the name's overflow:hidden drops its own minimum to 0,
   so on a phone the opponent's name collapsed to a sliver while the
   timestamp and Message button kept full width. The name now holds a
   real floor and the meta column is the one that gives. */
.wl-row{
  display:grid;grid-template-columns:24px minmax(88px,1fr) minmax(0,auto) auto;align-items:center;gap:10px;
  padding:6px 4px;border-radius:6px;
}
/* Under ~340px of list width all four items cannot share a line without
   crushing something, so the meta drops to its own row rather than the
   name and the timestamp fighting over ~30px. Keyed on the list's width,
   not the viewport, because this list also renders in a 320px drawer. */
.waitlist{container-type:inline-size}
@container (max-width:340px){
  .wl-row{grid-template-columns:24px minmax(0,1fr) auto;row-gap:2px}
  .wl-row .wl-avi{grid-column:1;grid-row:1}
  .wl-row .wl-name{grid-column:2;grid-row:1}
  .wl-row .wl-msg-btn{grid-column:3;grid-row:1 / span 2}
  .wl-row .wl-time{grid-column:2;grid-row:2}
}
.wl-row + .wl-row{border-top:1px solid var(--border)}
/* Per-peer DM action in the live queue list. Lets you reach out to
   someone who's searching right now and organise a round directly,
   instead of only waiting on the random pair. Reuses openDMThread +
   the existing dm_threads marketplace. */
.wl-msg-btn{
  font-family:inherit;font-size:.68rem;font-weight:700;letter-spacing:.02em;
  color:var(--accent);background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.32);border-radius:999px;
  padding:4px 11px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;
}
.wl-msg-btn:hover{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.55)}
.wl-avi{
  width:24px;height:24px;border-radius:50%;
  background:rgba(239,68,68,.12);
  display:inline-flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  font-size:.66rem;font-weight:800;color:#fca5a5;
}
.wl-avi img,.wl-avi svg{width:100%;height:100%;object-fit:cover;display:block}
.wl-name{
  font-size:.82rem;color:var(--text);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wl-time{
  font-size:.7rem;color:var(--text-ghost);font-weight:600;
  font-variant-numeric:tabular-nums;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wl-more{
  margin-top:8px;
  font-size:.7rem;color:var(--text-dim);text-align:center;
}
.waitlist-empty{
  max-width:420px;margin:0 auto;
  padding:12px 16px;
  background:var(--bg-card);
  border:1px dashed var(--border);
  border-radius:12px;
  font-size:.78rem;color:var(--text-dim);text-align:center;line-height:1.5;
}
.waitlist-empty strong{color:var(--text);font-weight:700}

/* The sign-in gate. Live video pairing is a Google-account feature.
   The surrounding frames use the consented 18+ webcam-still bank
   (face46-49, face51-54) plus seven founder-supplied fictional debate
   screenshots confirmed as fake on 2026-08-27. */
.gate-scene{
  position:relative;width:min(1480px,calc(100vw - 32px));min-height:720px;
  margin-left:50%;transform:translateX(-50%);
  display:grid;place-items:center;
}
.gate{
  position:relative;z-index:2;
  background:var(--bg-card);border:1px solid var(--border);border-radius:18px;
  padding:32px 28px;max-width:440px;width:100%;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.48);
}
.gate h2{font-size:1.4rem;font-weight:900;letter-spacing:-.015em;margin-bottom:10px;color:var(--text)}
.gate p{font-size:.92rem;color:var(--text-dim);line-height:1.55;margin-bottom:18px}
.gate-cams{position:absolute;inset:0;z-index:1;pointer-events:none}
.gate-cam{
  position:absolute;width:178px;aspect-ratio:16/9;overflow:hidden;
  border-radius:14px;border:1px solid rgba(255,255,255,.22);
  background:#08080a;box-shadow:0 18px 42px rgba(0,0,0,.42);
}
.gate-cam img{display:block;width:100%;height:100%;object-fit:cover}
.gate-cam--fictional{width:166px;aspect-ratio:1.44}
.gate-cam::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.34));
}
/* Keep the frame cloud close enough to read as one scene while preserving
   a clear moat around the single sign-up action. */
.gate-cam:nth-child(1){left:0;top:3%;transform:rotate(-3deg)}
.gate-cam:nth-child(2){right:0;top:3%;transform:rotate(3deg)}
.gate-cam:nth-child(3){left:0;top:30%;transform:rotate(2deg)}
.gate-cam:nth-child(4){right:0;top:30%;transform:rotate(-2deg)}
.gate-cam:nth-child(5){left:0;top:58%;transform:rotate(-2deg)}
.gate-cam:nth-child(6){right:0;top:58%;transform:rotate(2deg)}
.gate-cam:nth-child(7){left:21%;top:0;transform:rotate(1.5deg)}
.gate-cam:nth-child(8){right:21%;top:0;transform:rotate(-1.5deg)}
.gate-cam:nth-child(9){left:5%;top:auto;bottom:0;transform:rotate(-2.5deg)}
.gate-cam:nth-child(10){right:5%;top:auto;bottom:0;transform:rotate(2.5deg)}
.gate-cam:nth-child(11){left:15%;top:44%;transform:rotate(2deg)}
.gate-cam:nth-child(12){right:15%;top:44%;transform:rotate(-2deg)}
.gate-cam:nth-child(13){left:24%;top:auto;bottom:-4px;transform:rotate(1deg)}
.gate-cam:nth-child(14){right:24%;top:auto;bottom:-4px;transform:rotate(-1deg)}
.gate-cam:nth-child(15){left:50%;top:-28px;transform:translateX(-50%) rotate(1.5deg)}
@media(min-width:861px) and (max-width:1280px){
  .gate-scene{width:min(1120px,calc(100vw - 32px));min-height:650px}
  .gate-cam:nth-child(n+11){display:none}
  .gate-cam:nth-child(1){left:0;right:auto;top:1%;bottom:auto;transform:rotate(-3deg)}
  .gate-cam:nth-child(2){right:0;left:auto;top:1%;bottom:auto;transform:rotate(3deg)}
  .gate-cam:nth-child(3){left:0;right:auto;top:40%;bottom:auto;transform:rotate(2deg)}
  .gate-cam:nth-child(4){right:0;left:auto;top:40%;bottom:auto;transform:rotate(-2deg)}
  .gate-cam:nth-child(5){left:0;right:auto;top:auto;bottom:0;transform:rotate(-2deg)}
  .gate-cam:nth-child(6){right:0;left:auto;top:auto;bottom:0;transform:rotate(2deg)}
  .gate-cam:nth-child(7){left:24%;right:auto;top:0;bottom:auto;transform:rotate(-1.5deg)}
  .gate-cam:nth-child(8){right:24%;left:auto;top:0;bottom:auto;transform:rotate(1.5deg)}
  .gate-cam:nth-child(9){left:24%;right:auto;top:auto;bottom:-4px;transform:rotate(2.5deg)}
  .gate-cam:nth-child(10){right:24%;left:auto;top:auto;bottom:-4px;transform:rotate(-2.5deg)}
}
@media(max-width:860px){
  .gate-scene{width:min(560px,calc(100vw - 24px));min-height:0;display:flex;flex-direction:column}
  .gate-cams{
    position:relative;inset:auto;width:calc(100% + 12px);margin:0 -6px 12px;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
  }
  .gate-cam{position:relative;inset:auto!important;width:auto;transform:none!important;border-radius:9px}
  .gate-cam:nth-child(n+5){display:none}
}
/* The email sign-in button. Deliberately NOT var(--accent) (#ef4444):
   measured 2026-08-18, white on that red is 3.76:1 at this size, and the
   3:1 allowance only covers text >=18.66px bold while this renders at
   15.3px. #dc2626 (already this button's hover colour) is 4.83:1 and
   clears AA. The gate is the only way into the queue now, so its
   primary action has to be readable rather than merely on-brand. */
.gate-guest{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:13px 22px;background:#dc2626;color:white;border-radius:12px;
  font-weight:800;font-size:.9rem;cursor:pointer;border:none;font-family:inherit;
  transition:transform .15s, background .15s, box-shadow .15s;margin-bottom:10px;
}
.gate-guest:hover{transform:translateY(-1px);background:#b91c1c;box-shadow:0 10px 24px rgba(239,68,68,.22)}
.gate-google{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:13px 22px;background:#fff;color:#1a1a1a;border-radius:12px;
  font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;
  border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 10px rgba(0,0,0,.06);
  transition:transform .15s;margin-bottom:10px;
}
.gate-google:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.gate-google svg{width:18px;height:18px;flex-shrink:0}
/* Inline email sign-in on the gate card. The card already carries the
   same two paths the shared chooser does, so opening that chooser over
   it stacked one offer on an identical offer and hid the half only the
   card has (who is waiting, that the camera is optional, the under-18
   line). The email path needs a form the card did not have, so the card
   grew one. auth-modal.js still owns the send (debatableSendSignInLink)
   — this is a form, not a second auth implementation. */
.gate-email{display:block;text-align:left;margin:0 0 10px}
/* Both of these set a display, which beats the UA's [hidden] rule, so
   the form showed before it was asked for and the button it replaces
   stayed on screen under it. */
.gate-email[hidden],.gate-guest[hidden],.gate-google[hidden]{display:none}
.gate-email-label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);margin:0 0 5px}
.gate-email-input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid rgba(0,0,0,.16);background:var(--surface,#fff);color:var(--text);font:inherit;font-size:.92rem;margin:0 0 10px}
.gate-email-input:focus{outline:none;border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.14)}
.gate-email-note{font-size:.74rem;color:var(--text-ghost);margin-top:8px;line-height:1.5;text-align:center}
.gate-email-sent{font-size:.84rem;font-weight:750;color:#15803d;margin-top:10px;line-height:1.45;text-align:center}
.gate-email-spam{display:block;margin-top:7px;font-weight:650;color:var(--text-dim,#6b6b76)}
.gate-disclaimer{font-size:.74rem;color:var(--text-ghost);margin-top:12px;line-height:1.55}
/* "Want to debate anonymously?" reassurance: the REAL Avatar mask
   (DBAvatar.maskSvg, already loaded on this page) beside the copy, so a
   signed-out visitor sees what the room sees of them before the sign-in
   ask. The mask carries its own dark circular fill, so it reads on every
   theme; the inner ring separates it from the card on the dark ones. */
.gate-anon{display:flex;align-items:center;gap:13px;margin-top:14px;padding:11px 13px;border-radius:14px;border:1px solid rgba(128,128,128,.26);background:var(--bg-elev)}
.gate-anon-face{flex:0 0 auto;width:58px;height:58px;border-radius:50%;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.08)}
.gate-anon-face svg{width:100%;height:100%;display:block}
.gate-anon-copy{font-size:.78rem;line-height:1.5;color:var(--text-ghost)}
.gate-anon-copy strong{color:var(--text);font-weight:750}
@media(max-width:420px){.gate-anon-face{width:50px;height:50px}}
/* Signed-out conversion signal. Twelve is the founder-called baseline;
   the fresh public queue count is added once /api/spar-queue returns. */
.gate-live{display:flex;align-items:center;justify-content:center;gap:8px;margin:-6px 0 16px;font-size:.86rem;font-weight:650;color:var(--text)}
.gate-live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.7);animation:gateLivePulse 1.6s ease-in-out infinite;flex-shrink:0}
.gate-live[data-quiet] .gate-live-dot{background:#6b7280;box-shadow:none;animation:none;opacity:.55}
@keyframes gateLivePulse{0%,100%{opacity:1}50%{opacity:.45}}
/* Tournament nudge on the gate and the searching rail. Compact by
   design: the gate's fold position is load-bearing (2026-08-18 note),
   so this is one quiet line, never a card. */
.gate-open-line,.wait-rail__open-line{display:block;margin-top:10px;font-size:.8rem;font-weight:700;
  color:var(--accent,#dc2626);text-decoration:none;line-height:1.5}
.gate-open-line:hover,.wait-rail__open-line:hover{text-decoration:underline;text-underline-offset:3px}
.gate .ai-alt{
  display:block;margin-top:10px;padding:6px 8px;
  font-size:.72rem;color:var(--text-ghost);font-weight:500;
  border:none;border-radius:0;
  text-decoration:underline;text-underline-offset:3px;
  opacity:.6;transition:opacity .15s,color .15s;
}
.gate .ai-alt:hover{color:var(--text-dim);opacity:.85;background:transparent}
/* Landscape phones (wide, ~360-430px tall). The sign-in gate is authored
   for a tall portrait viewport, so centred it clips its own headline above
   the top and drops both sign-in buttons below the fold. Top-align it and
   tighten the headline stack so the two buttons sit on the first screen.
   Scoped to short landscape only, so portrait, tablet, and desktop are
   untouched. */
@media (orientation:landscape) and (max-height:600px){
  .wrap:not(.spar-search-layout){align-items:flex-start;padding:14px 22px 40px}
  .gate-scene{min-height:0}
  .gate-cams{display:none}
  .gate .eyebrow{margin-bottom:8px}
  .gate h2{font-size:1.15rem;margin-bottom:6px}
  .gate p{font-size:.86rem;line-height:1.42;margin-bottom:12px}
  .gate-live{margin:-2px 0 10px}
  .gate-google,.gate-guest{padding-top:11px;padding-bottom:11px}
  .gate-anon{margin-top:10px;padding:8px 11px;gap:11px}
  .gate-anon-face{width:44px;height:44px}
  .gate-disclaimer{margin-top:9px}
}
.discord-schedule-link{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  margin-top:12px;padding:9px 13px;
  border:1px solid rgba(88,101,242,.38);border-radius:999px;
  background:rgba(88,101,242,.08);
  color:#a7b3ff;text-decoration:none;
  font-size:.76rem;font-weight:800;line-height:1.25;
  transition:border-color .15s, background .15s, transform .15s;
}
.discord-schedule-link:hover{
  border-color:rgba(88,101,242,.62);
  background:rgba(88,101,242,.13);
  transform:translateY(-1px);
}
.discord-schedule-link .dot{
  width:6px;height:6px;border-radius:50%;background:#5865F2;
  box-shadow:0 0 0 3px rgba(88,101,242,.18);flex-shrink:0;
}
[data-theme="light"] .discord-schedule-link{
  color:#4f46e5;background:rgba(88,101,242,.07);
  border-color:rgba(88,101,242,.28);
}
/* 2026-08-22: the gate's two-tile round preview is gone (Aidan: remove
   the images, no need). The card is copy + buttons only now; the
   .gate-preview / .gate-seat rules and the portrait rotation went with
   the markup. */
.guest-strip{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:-2px auto 14px;max-width:440px;padding:8px 14px;
  border:1px solid var(--border);border-radius:999px;
  font-size:.78rem;font-weight:600;color:var(--text-dim);text-align:center;
}
.guest-strip button{
  border:0;background:transparent;padding:0;font-family:inherit;
  font-size:.78rem;font-weight:800;color:var(--accent);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
}
.guest-strip button:hover{opacity:.8}

.error{
  padding:12px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);
  border-radius:10px;color:#fca5a5;font-size:.84rem;margin-top:14px;
}

/* Helpful link strip at bottom */
.foot{
  font-size:.74rem;color:var(--text-ghost);margin-top:24px;line-height:1.6;
}
.foot a{color:var(--text-dim);text-decoration:underline;text-decoration-color:rgba(255,255,255,.25)}
.foot a:hover{color:var(--text)}

/* ── Waitlist sidebar (left rail) ─────────────────────────
   Posts persist in Firestore (waitlist_posts collection) so users
   can find each other for organized debates while the matchmaker
   keeps running in the center. DMs go through dm_threads. Both
   collections need rules + an index — see the comment block in the
   JS section below. */
/* `[hidden]` defaults to display:none in the UA stylesheet, but our
   inbox button + badge have explicit display:flex / inline-flex below
   that beats specificity. Force-respect [hidden] for these elements
   so the JS toggle (inboxBtn.hidden = true/false) actually hides
   them on signed-out + zero-unread states. */
.waitlist-rail__inbox[hidden], .waitlist-rail__inbox .badge[hidden],
.waitlist-fab[hidden], .waitlist-fab .fab-badge[hidden]{display:none !important}
.waitlist-rail{
  position:fixed; top:90px; left:24px; bottom:24px;
  width:320px; max-width:calc(100vw - 48px);
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;
  display:flex; flex-direction:column;
  overflow:hidden;
  z-index:30;
  box-shadow:var(--shadow-lg);
  /* Cozy pass 2026-08-05: the rail is a drawer on EVERY width now, not
     just mobile. A permanent column of invite cards + Discord copy was
     half the reason the searching screen felt like a control room; the
     "Open invites" pill (badge included) keeps it one tap away. */
  transform:translateX(-110%); transition:transform .25s ease;
}
.waitlist-rail.open{ transform:translateX(0) }
.waitlist-rail__head{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  gap:8px;
}
/* Matches the right rail's "WHILE YOU WAIT" head so the two panels read
   as a set. The page's label language is uppercase-tracked throughout
   (eyebrow, meta-strip, warm-up label); title-case "Open invites" was the
   lone outlier. */
.waitlist-rail__title{
  font-size:.78rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  color:var(--text);
  display:flex; align-items:center; gap:8px;
}
.waitlist-rail__title .live-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 8px var(--accent);
  animation:pulse 1.6s ease-in-out infinite;
}
.waitlist-rail__sub{
  font-size:.72rem; color:var(--text-ghost); font-weight:500;
  padding:10px 16px 0; line-height:1.5;
}
/* Scheduled rounds block (2026-07-14): native scheduling from
   /api/schedule-round rendered above the Discord card. Hidden until
   at least one upcoming round exists — no empty chrome. */
.waitlist-rail__sched{margin:10px 16px 0}
.wl-sched-head{
  font-size:.62rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-ghost);margin:0 0 6px;display:flex;align-items:center;justify-content:space-between;
}
.wl-sched-head a{color:var(--text-dim);font-weight:700;text-decoration:none;text-transform:none;letter-spacing:0;font-size:.66rem}
.wl-sched-head a:hover{color:var(--text)}
.wl-sched-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border:1px solid var(--border);border-radius:11px;
  background:rgba(255,255,255,.025);margin-bottom:6px;
}
.wl-sched-row.soon{border-color:rgba(34,197,94,.45)}
.wl-sched-when{flex:none;font-size:.66rem;font-weight:800;color:var(--text);min-width:74px;line-height:1.25}
.wl-sched-row.soon .wl-sched-when{color:#22c55e}
.wl-sched-what{flex:1;min-width:0;font-size:.68rem;color:var(--text-dim);line-height:1.35;overflow:hidden;text-overflow:ellipsis}
.wl-sched-what b{color:var(--text);font-weight:700}
.wl-sched-btn{
  flex:none;padding:5px 10px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--text-dim);font-size:.64rem;font-weight:800;
  cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s;text-decoration:none;
}
.wl-sched-btn:hover{color:var(--text);border-color:var(--border-strong)}
.wl-sched-btn.on{border-color:rgba(34,197,94,.55);color:#22c55e}
.wl-sched-btn.go{border-color:rgba(239,68,68,.55);color:var(--accent)}
.waitlist-rail__discord{
  display:block;margin:10px 16px 0;padding:10px 12px;
  border-radius:12px;border:1px solid rgba(88,101,242,.34);
  background:rgba(88,101,242,.08);
  color:var(--text);text-decoration:none;
  font-size:.74rem;line-height:1.45;
  transition:border-color .15s, background .15s;
}
.waitlist-rail__discord:hover{border-color:rgba(88,101,242,.58);background:rgba(88,101,242,.12)}
.waitlist-rail__discord strong{display:block;font-weight:800;margin-bottom:2px;color:var(--text)}
.waitlist-rail__discord span{display:block;color:var(--text-dim)}

/* On-site community doors (the feed + The Commons group chat), added
   2026-08-22 per the founder: the rail linked out to Discord but never to
   our own community surfaces. Same card shape as the Discord link,
   neutral chrome so Discord blurple and tournament red keep their
   meanings. */
.waitlist-rail__site{
  display:block;margin:10px 16px 0;padding:10px 12px;
  border-radius:12px;border:1px solid var(--border);
  background:rgba(127,127,127,.05);
  color:var(--text);text-decoration:none;
  font-size:.74rem;line-height:1.45;
  transition:border-color .15s, background .15s;
}
.waitlist-rail__site:hover{border-color:var(--border-strong);background:rgba(127,127,127,.09)}
.waitlist-rail__site strong{display:block;font-weight:800;margin-bottom:2px;color:var(--text)}
.waitlist-rail__site span{display:block;color:var(--text-dim)}
.waitlist-rail__inbox{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:999px;
  background:transparent; border:1px solid var(--border);
  color:var(--text-dim); font-size:.7rem; font-weight:700; cursor:pointer;
  transition:color .15s, border-color .15s;
  font-family:inherit;
}
.waitlist-rail__inbox:hover{color:var(--text); border-color:var(--border-strong)}
.waitlist-rail__inbox .badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 5px; border-radius:999px;
  background:var(--accent-solid,#b91c1c); color:#fff; font-size:.62rem; font-weight:800;
}
.match-avatar{
  width:68px;height:68px;margin:4px auto 16px;border-radius:50%;overflow:hidden;
  border:1px solid rgba(239,68,68,.36);box-shadow:0 0 30px rgba(239,68,68,.14);
  background:#0b0b0e;
}
.match-avatar svg,.match-avatar img{width:100%;height:100%;display:block;object-fit:cover}

/* Tournaments promo — replaced the "join the waitlist" post/browse
   board 2026-08-11. Styled like .waitlist-rail__discord (same card
   shape) but in the accent red instead of Discord blurple, since this
   is the money surface, not a community link. */
.waitlist-rail__tournaments{
  display:block;margin:10px 16px 0;padding:12px;
  border-radius:12px;border:1px solid rgba(220,38,38,.36);
  background:rgba(220,38,38,.07);
  color:var(--text);text-decoration:none;
  font-size:.76rem;line-height:1.45;
  transition:border-color .15s, background .15s, transform .15s;
}
.waitlist-rail__tournaments:hover{border-color:rgba(220,38,38,.6);background:rgba(220,38,38,.11);transform:translateY(-1px)}
.waitlist-rail__tournaments strong{display:block;font-weight:800;color:var(--text);margin-bottom:2px;font-size:.86rem}
.waitlist-rail__tournaments span{display:block;color:var(--text-dim)}

.waitlist-rail__close{
  display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%;
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  cursor:pointer; font-size:1.1rem; line-height:1;
  font-family:inherit;
}
.waitlist-fab{
  /* Read-aloud is retired, so Community owns the bottom-left corner. */
  position:fixed;
  left:calc(16px + env(safe-area-inset-left));
  bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:25;
  padding:10px 16px; border-radius:999px;
  background:var(--accent-solid,#b91c1c); color:#fff;
  font-size:.78rem; font-weight:700; cursor:pointer; border:none;
  box-shadow:0 8px 24px var(--accent-glow);
  display:inline-flex; align-items:center; gap:8px;
  font-family:inherit;
}
.waitlist-fab .fab-badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 5px; border-radius:999px;
  background:#fff; color:#b91c1c; font-size:.62rem; font-weight:800;
}

/* ── While-you-wait workspace (searching state only) ─────────
   This is a true second column, not a fixed overlay. The globe stays
   the focal point while the waiting tools get enough width to explain
   what each choice does. Desktop-only; the core queue screen keeps its
   existing compact composition below 1280px. */
.wait-rail{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:20px;
  display:none; flex-direction:column;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.wait-rail__head{
  padding:24px 24px 21px;
  border-bottom:1px solid var(--border);
}
.wait-rail__status{
  display:flex; align-items:center; gap:8px;
  color:var(--text-ghost); font-size:.66rem; font-weight:800;
  letter-spacing:.11em; text-transform:uppercase;
  margin-bottom:9px;
}
.wait-rail__status .live-dot{
  width:7px; height:7px; border-radius:50%;
  background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,.7);
}
.wait-rail__head h2{
  font-size:1.55rem; line-height:1.08; letter-spacing:-.025em;
  color:var(--text); margin-bottom:8px;
}
.wait-rail__head p{
  color:var(--text-dim); font-size:.87rem; line-height:1.5;
  max-width:34ch;
}
.wait-rail__body{
  padding:20px 24px 24px;
  display:flex; flex:1; min-height:0; flex-direction:column; gap:14px;
  overflow-y:auto; scrollbar-width:thin;
}
.wait-rail__card{
  border:1px solid var(--border);
  border-radius:15px; padding:17px;
  background:color-mix(in srgb, var(--bg-elev) 68%, transparent);
}
.wait-rail__label{
  font-size:.66rem; font-weight:800; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-ghost);
  margin-bottom:10px;
  display:flex; align-items:center; justify-content:space-between;
}
.wait-rail__shuffle{
  border:1px solid var(--border); border-radius:999px; cursor:pointer;
  color:var(--accent); font:inherit; font-size:.61rem;
  font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  padding:5px 8px; transition:border-color .15s ease, background .15s ease;
}
.wait-rail__shuffle:hover{ border-color:var(--accent); background:rgba(239,68,68,.06) }
.wait-rail__motion{
  font-size:1rem; font-weight:700; line-height:1.38;
  color:var(--text); margin-bottom:13px;
}
.wait-rail__pad{
  width:100%; min-height:126px; resize:vertical;
  background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:11px 12px;
  font:inherit; font-size:.85rem; line-height:1.5; color:var(--text);
}
.wait-rail__pad:focus{ outline:none; border-color:var(--accent) }
.wait-rail__saved{
  display:block; margin-top:7px; color:var(--text-ghost);
  font-size:.65rem; line-height:1.4;
}
.wait-rail__links{
  display:flex; flex-direction:column; gap:8px;
  margin-top:auto;
}
.wait-rail__link{
  display:grid; grid-template-columns:28px minmax(0,1fr) auto;
  align-items:center; gap:11px;
  padding:12px 13px;
  border:1px solid var(--border); border-radius:12px;
  color:var(--text); text-decoration:none;
  transition:border-color .15s ease, background .15s ease, transform .15s ease;
}
.wait-rail__link:hover{
  border-color:var(--accent); background:rgba(239,68,68,.05);
  transform:translateX(2px);
}
.wait-rail__link-index{
  width:28px; height:28px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-elev); border:1px solid var(--border);
  color:var(--text-ghost); font-size:.59rem; font-weight:800;
  letter-spacing:.05em;
}
.wait-rail__link-copy{ min-width:0 }
.wait-rail__link-copy strong{
  display:block; color:var(--text); font-size:.82rem;
  font-weight:800; line-height:1.25; margin-bottom:2px;
}
.wait-rail__link-copy span{
  display:block; color:var(--text-ghost); font-size:.69rem;
  font-weight:500; line-height:1.35;
}
.wait-rail__arrow{
  color:var(--text-ghost); font-size:1rem; transition:color .15s ease;
}
.wait-rail__link:hover .wait-rail__arrow{ color:var(--accent) }
.wait-rail__link--discord{
  border-color:rgba(88,101,242,.34);
  background:rgba(88,101,242,.08);
}
.wait-rail__link--discord:hover{
  border-color:rgba(88,101,242,.58);
  background:rgba(88,101,242,.12);
}

/* ── The Commons, inline on the searching screen ──────────────
   2026-08-23, Aidan pointing at the empty left column: put the chat
   here "for ppl tryna organize", instead of behind the Community FAB
   where a waiting person never opens it.

   It is the SAME room as /chat and /community's Live tab (one
   /api/chat-feed collection, no sign-in, rate-limited server-side),
   mounted through the shared js/community-chat.js rather than
   reimplemented, because two implementations of one room drift.

   It is a SIBLING of .shell, never a child: renderSearching() rewrites
   shell.innerHTML on every re-entry (a passed consent proposal, a
   guest-round recheck) and that would wipe the scrollback and re-init
   the poller each time. */
.spar-room{
  width:100%; max-width:720px; margin:20px auto 4px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:20px;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:var(--shadow-lg);
  position:relative; text-align:left;
}
.spar-room[hidden]{display:none}
.spar-room__head{
  display:flex; align-items:center; gap:9px;
  padding:13px 18px; border-bottom:1px solid var(--border);
}
.spar-room__head .live-dot{
  width:7px; height:7px; border-radius:50%; flex:none;
  background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,.7);
}
.spar-room__title{
  font-size:.68rem; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:var(--text-ghost);
}
.spar-room__sub{
  font-size:.78rem; color:var(--text-dim); margin-left:auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.spar-room__scroll{
  height:clamp(150px,23vh,250px);
  overflow-y:auto; scrollbar-width:thin;
  padding:10px 18px; display:flex; flex-direction:column;
}
.spar-room__composer{
  border-top:1px solid var(--border); background:var(--bg-elev);
  padding:11px 14px;
}
.spar-room__row{display:flex; align-items:flex-end; gap:9px}
.spar-room__input{
  flex:1; min-width:0; resize:none;
  font-family:inherit; font-size:.94rem; line-height:1.45;
  padding:10px 13px; border-radius:11px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  max-height:110px;
}
.spar-room__input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.spar-room__input::placeholder{color:var(--text-ghost)}
.spar-room__send{
  flex:none; padding:10px 18px; border-radius:11px;
  border:1px solid var(--accent-solid,#b91c1c); background:var(--accent-solid,#b91c1c); color:#fff;
  font-family:inherit; font-size:.9rem; font-weight:800; cursor:pointer;
}
.spar-room__send:disabled{opacity:.5; cursor:default}
.spar-room__send.chat-send-fail{background:#b45309; border-color:#b45309}
.spar-room__foot{
  display:flex; align-items:center; gap:8px;
  margin-top:7px; font-size:.74rem; color:var(--text-ghost);
}
.spar-room__foot b{color:var(--text-dim); font-weight:700}
.spar-room__reroll{
  border:none; background:transparent; color:var(--accent);
  font-family:inherit; font-size:.74rem; font-weight:700; cursor:pointer;
  padding:0; text-decoration:underline; text-underline-offset:2px;
}
.spar-room__count{margin-left:auto}
.spar-room__count.over{color:#b45309}
.spar-room__pill{
  position:absolute; left:50%; bottom:82px;
  transform:translateX(-50%) translateY(8px);
  padding:6px 14px; border-radius:999px;
  background:var(--accent-solid,#b91c1c); color:#fff;
  font-family:inherit; font-size:.78rem; font-weight:800;
  border:none; cursor:pointer; opacity:0; pointer-events:none;
  transition:opacity .18s, transform .18s;
  box-shadow:var(--shadow-lg); z-index:4;
}
.spar-room__pill.on{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0)}
/* Row styles for what community-chat.js renders. Kept in sync with the
   same block in community.html; denser than a DM thread because the
   feed carries join events too, so it reads as a log. */
.spar-room .chat-row{padding:5px 0}
.spar-room .chat-join{font-size:.82rem; color:var(--text-ghost)}
.spar-room .chat-join-name{color:#16a34a; font-weight:700}
.spar-room .chat-msg-head{display:flex; align-items:baseline; gap:8px}
.spar-room .chat-msg-handle{font-weight:800; font-size:.86rem; color:var(--accent)}
/* The name is a button when that person can be reached (community-chat.js
   only marks it up when the server returned their uid). Styled as the name
   it already was, plus a Message tail that surfaces on hover and focus, so
   the room does not grow a row of buttons competing with the messages. */
.spar-room .chat-msg-who{
  display:flex; align-items:baseline; gap:8px;
  background:none; border:none; padding:0; margin:0;
  font:inherit; color:inherit; cursor:pointer; text-align:left;
  border-radius:6px;
}
.spar-room .chat-msg-who .chat-msg-handle{text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px; transition:text-decoration-color .15s}
.spar-room .chat-msg-who:hover .chat-msg-handle,
.spar-room .chat-msg-who:focus-visible .chat-msg-handle{text-decoration-color:currentColor}
.spar-room .chat-msg-dm{
  font-size:.62rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  color:var(--accent); background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.28); border-radius:999px; padding:1px 7px;
  opacity:0; transition:opacity .15s;
}
.spar-room .chat-msg-who:hover .chat-msg-dm,
.spar-room .chat-msg-who:focus-visible .chat-msg-dm{opacity:1}
/* Touch has no hover, so the tail would never appear on a phone. */
@media (hover:none){ .spar-room .chat-msg-dm{opacity:1} }
.spar-room .chat-msg-mine .chat-msg-handle{color:#16a34a}
.spar-room .chat-msg-time{font-size:.7rem; color:var(--text-ghost)}
.spar-room .chat-msg-text{font-size:.94rem; line-height:1.5; margin-top:1px; color:var(--text); overflow-wrap:anywhere}
.spar-room .chat-av{width:20px; height:20px; border-radius:50%; overflow:hidden; flex:none}
.spar-room .chat-av svg{width:100%; height:100%; display:block}
.spar-room .chat-join .chat-av{display:inline-block; vertical-align:middle; margin-right:5px; width:16px; height:16px}
.spar-room .chat-empty{
  margin:auto; padding:18px 10px; text-align:center;
  font-size:.88rem; line-height:1.55; color:var(--text-dim); max-width:36ch;
}
/* Below 1281px the rail is display:none and the room rides the column
   instead. .wrap is a centring flex ROW, so without this the room is a
   second flex item beside .shell and collapses to ~40px wide. The class
   is applied by the mount, not :has(), so it cannot depend on selector
   support on the one page that matters most. */
.wrap.has-room{flex-wrap:wrap}
.wrap > .spar-room{flex:0 0 100%; max-width:560px; margin:20px auto 0}

/* In the rail it is one of the rail's cards, not a floating panel. */
#sparRoomSlot{display:contents}
.wait-rail__body .friend-challenge{
  max-width:none; margin:0; padding:14px; box-shadow:none;
  border-radius:15px; flex:none;
}
.wait-rail__body .friend-challenge p{font-size:.73rem; line-height:1.42}
.wait-rail__body .friend-challenge__actions{margin-top:10px}
.wait-rail__body .friend-challenge__actions .btn{min-height:36px; padding:7px 11px}
.wait-rail__body .friend-challenge__link{display:none}
.wait-rail__body .spar-room{
  max-width:none; margin:0; box-shadow:none; border-radius:15px;
  flex:1 0 280px; min-height:280px;
  background:color-mix(in srgb, var(--bg-elev) 68%, transparent);
}
.wait-rail__body .spar-room__scroll{height:auto; min-height:160px; flex:1; padding:10px 14px}
.wait-rail__body .spar-room__head{padding:11px 14px}
.wait-rail__body .spar-room__composer{padding:9px 11px; background:transparent}
.wait-rail__body .spar-room__sub{display:none}
.wait-rail__body .spar-room__pill{bottom:74px}

@media (min-width: 1281px){
  .wrap.spar-search-layout{
    display:grid;
    grid-template-columns:minmax(620px,760px) minmax(360px,420px);
    justify-content:center; align-items:start;
    gap:clamp(34px,3vw,56px);
    padding-inline:clamp(24px,3vw,48px);
    padding-top:76px !important;
  }
  .wrap.spar-search-layout .shell{
    max-width:720px; justify-self:center;
    padding-inline:clamp(18px,2vw,30px);
  }
  .wrap.spar-search-layout h1{
    font-size:clamp(2.35rem,3.2vw,3.05rem);
  }
  .wrap.spar-search-layout .lede{
    max-width:590px; font-size:1.04rem; margin-bottom:8px;
  }
  .wrap.spar-search-layout .globe-wrap{
    width:min(440px,50vh); margin:0 auto 10px;
  }
  .wrap.spar-search-layout .meta-strip{ margin:8px auto 14px }
  .wait-rail{

  }
}
