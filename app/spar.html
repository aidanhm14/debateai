      console.warn('[spar] queue query failed', err);
      // A read-only failure (the query 429s but the join write went
      // through) would otherwise leave the user on an endless "searching"
      // with no signal. If the backend is at capacity (quota exhausted),
      // surface it once — not every 2s poll — and point at the AI round.
      var raw = (err && (err.message || err.code)) || '';
      if (/resource-exhausted|resource_exhausted|quota|429/i.test(raw) && !state.capacityNoticeShown){
        state.capacityNoticeShown = true;
        var host = document.getElementById('queueStats') || shell;
        if (host){
          host.innerHTML = '<div class="error">Live matching is temporarily at capacity, so we can\'t reach the queue right now. Take an AI round instead, or check back in a bit. <a href="/practice" style="color:inherit;text-decoration:underline">Skip to AI</a>.</div>';
        }
      }
    });
  }

  // 2026-05-18: moved off a client-side Firestore transaction (which
  // silently failed because Firestore rules don't allow user A to
  // write user B's queue doc — the transaction could update self but
  // not the peer, leaving both stuck on "1 other debater in your
  // queue") onto a Netlify function with admin-SDK credentials that
  // updates both docs atomically. The client side just kicks the
  // function and lets subscribeMyDoc's onSnapshot drive navigation.
  //
  // Soft-fail reason codes from spar-pair (keep polling silently):
  //   lost_race        — another transaction beat us to one of the docs
  //   queue_doc_missing— peer doc got deleted between query and txn
  //   stale_peer       — peer's joinedAt is >3min old (ghost session);
  //                      spar-pair just marked it cancelled, polling
  //                      will sort to a fresher peer next tick
  // Anything else (auth/5xx/network) is a hard fail; we surface it so
  // the user knows pairing is having trouble rather than burning the
  // full fallback clock in silence.
  var PAIR_REQUEST_TIMEOUT_MS = 15000;
  function attemptMatch(peerUid /* peerData unused now */){
    if (state.cancelled || !state.user || !firebaseAuth) return;
    // Guard against re-firing while a pair attempt is in flight —
    // tryMatch polls every 2s and the snapshot listener also pokes
    // it; without this we'd fan out duplicate POSTs.
    if (state.pairInFlight) return;
    state.pairInFlight = true;
    // Self-heal: if the fetch never resolves (network limbo on mobile
    // tethering, function cold-start that hangs), the pairInFlight
    // flag would stick forever and the user would burn the full AI
    // fallback timer with no further pair attempts. Reset after 8s no
    // matter what so polling can try again.
    var timeoutId = setTimeout(function(){
      if (state.pairInFlight){
        state.pairInFlight = false;
        console.warn('[spar] spar-pair request timed out, retrying');
        updateDiag({ last: 'timeout' });
        surfacePairError('timeout');
      }
    }, PAIR_REQUEST_TIMEOUT_MS);
    firebaseAuth.currentUser.getIdToken().then(function(idToken){
      return fetch('/.netlify/functions/spar-pair', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + idToken,
        },
        body: JSON.stringify({
          peerUid: peerUid,
          format: formatParam,
        }),
      });
    }).then(function(res){
      return res.json().then(function(j){ return { ok: res.ok, status: res.status, body: j }; });
    }).then(function(r){
      clearTimeout(timeoutId);
      state.pairInFlight = false;
      // The guest allowance is gone. Not a pairing failure and not something
      // retrying fixes, so stop polling and hand the screen to the gate.
      if (r.status === 403 && r.body && (r.body.code === 'SIGN_IN_REQUIRED' || r.body.code === 'GOOGLE_SIGN_IN_REQUIRED')) {
        if (r.body.code === 'SIGN_IN_REQUIRED') markGuestSpent();
        leaveQueueQuietly();
        renderGate();
        return;
      }
      // The account has no SERVER-recorded age band (attested before the
      // 2026-08-22 hardening, or the record POST failed at the door).
      // Self-heal with the stored answer; only a genuinely unanswered
      // account sees the modal again. Throttled so a failing POST can't
      // fire on every 2s poll tick.
      if (r.status === 403 && r.body && r.body.code === 'AGE_BAND_REQUIRED') {
        var storedBand = (window.daAgeBand && window.daAgeBand()) || '';
        if (storedBand && window.daRecordAgeBand) {
          if (Date.now() - (state.ageHealAt || 0) > 10000) {
            state.ageHealAt = Date.now();
            window.daRecordAgeBand(storedBand, function(){ /* polling retries */ });
          }
          updateDiag({ last: 'age_record_heal' });
          return;
        }
        leaveQueueQuietly();
        if (window.daAskAgeBand) {
          window.daAskAgeBand(function(){ if (!state.cancelled) joinQueue(); });
        }
        return;
      }
      if (!r.ok || !r.body || !r.body.ok) {
        var reason = r.body && r.body.reason ? r.body.reason : 'http_' + r.status;
        var soft = (reason === 'lost_race'
                 || reason === 'queue_doc_missing' || reason === 'stale_peer'
                 // peer_ineligible: a spent guest, or a peer with no
                 // server-recorded age band, still holding a queue doc.
                 // Their problem, not ours — poll on to the next peer.
                 || reason === 'peer_ineligible'
                 // age_mismatch: the queue holds someone the age rule
                 // won't let us meet. Poll on to the next peer.
                 // age_check_failed: transient band read error, retry.
                 || reason === 'age_mismatch' || reason === 'age_check_failed'
                 || reason === 'skipped_peer' || reason === 'blocked_peer');
        if (soft && state.friendInvitePeerUid === peerUid){
          state.friendInvitePeerUid = '';
          paintFriendInviteStatus('That seat is not available', 'The invite may have been claimed already. We kept you in the live queue.');
        }
        // Soft fails are recoverable — keep polling. Surface them in
        // the diag line so the user can see retries happening instead
        // of staring at a silent countdown. Hard fails still get the
        // banner via surfacePairError.
        updateDiag({ last: reason });
        if (!soft) {
          console.warn('[spar] spar-pair function failed:', reason, r.body);
          surfacePairError(reason);
        } else {
          console.info('[spar] soft retry:', reason);
        }
        return;
      }
      clearPairError();
      if (r.body.pending === 'consent'){
        // Not a match yet — a judge-note proposal both sides now have
        // to sign off on. My own doc snapshot renders the consent
        // card; spar_consent_accept/pass instrument the outcome. Stamp
        // consentPending so the AI-fallback clock can't fire in the
        // gap between this response and the snapshot landing.
        state.consentPending = Date.now();
        updateDiag({ last: 'consent' });
        try { gtag('event', 'spar_consent_proposed', { format: formatParam }); } catch(e){}
        return;
      }
      updateDiag({ last: 'matched' });
      try { gtag('event', 'spar_match_made', { format: formatParam, wait_sec: state.joinedAtMs ? Math.floor((Date.now() - state.joinedAtMs) / 1000) : 0 }); } catch(e){}
      // The snapshot listener on my own doc should fire and navigate.
      // Fallback: if that stream stalls, use the function response so a
      // successful pair never sits on the search screen forever.
      setTimeout(function(){
        if (!state.roundNavPending && !state.cancelled && !state.inConsent){
          navigateToRound(r.body, 0);
        }
      }, 1300);
    }).catch(function(err){
      clearTimeout(timeoutId);
      state.pairInFlight = false;
      console.warn('[spar] spar-pair fetch failed', err);
      updateDiag({ last: 'network' });
      surfacePairError('network');
    });
  }

  // Diag line state — mutates the small uppercase status under the
  // queue card so the user can see what the matchmaker is doing even
  // when the bigger UI elements get replaced.
  // Holds: peer count from the last query, last spar-pair outcome,
  // and the tail of my own uid (debug-only — helps confirm two test
  // windows are on different accounts).
  var diagState = { peers: null, last: null };
  function updateDiag(patch){
    if (patch && typeof patch === 'object'){
      if ('peers' in patch) diagState.peers = patch.peers;
      if ('last' in patch) diagState.last = patch.last;
    }
    var el = document.getElementById('diagLine');
    if (!el) return;
    var uidTail = (state.user && state.user.uid) ? state.user.uid.slice(-6) : '----';
    var parts = [];
    parts.push('Queue: ' + (diagState.peers == null ? '…' : diagState.peers) + ' available');
    parts.push('proposal ' + formatParam.toUpperCase());
    parts.push('me ' + uidTail);
    if (diagState.last) parts.push('last ' + diagState.last);
    el.textContent = parts.join(' · ');
  }
  // Set the initial line so the user sees the diagnostic immediately,
  // not blank until the first query resolves.
  setTimeout(updateDiag, 50);

  // Render a small banner near the queue stats when pairing
  // hard-fails. Auto-clears on next successful attempt. Without this,
  // a misconfigured auth or function 5xx leaves the user staring at
  // "Scanning the queue" with no feedback until the AI fallback fires.
  function surfacePairError(reason){
    var stats = document.getElementById('queueStats');
    if (!stats) return;
    var msg;
    if (reason === 'timeout')      msg = 'Slow response from the matchmaker. Retrying…';
    else if (reason === 'network') msg = 'Network blip reaching the matchmaker. Retrying…';
    else if (/^http_5/.test(reason)) msg = 'Matchmaker hiccup (' + reason + '). Retrying…';
    else if (/^http_4/.test(reason)) msg = 'Auth issue reaching the matchmaker (' + reason + '). Try signing out + in.';
    else                            msg = 'Pairing error (' + reason + '). Retrying…';
    stats.innerHTML = '<div style="padding:10px 14px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.32);border-radius:10px;color:#fbbf24;font-size:.78rem;font-weight:600">' + escHtml(msg) + '</div>';
  }
  function clearPairError(){
    // Touched by a successful pair attempt; the matched-state UI takes
    // over the queue stats area within ~900ms via subscribeMyDoc's
    // setTimeout navigation, so we don't bother re-rendering the
    // "N other debaters" text in between.
  }

  function triggerAIFallback(){
    if (state.cancelled) return;
    // Never bulldoze a live consent handshake into matched_ai — the
    // countdown tick already guards this, but teardownQueue below
    // resets inConsent, so a stray second caller would slip through.
    if (state.inConsent) return;
    teardownQueue();
    if (state.queueDocRef){
      state.queueDocRef.update({
        status: 'matched_ai',
        matchedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(function(){});
    }
    // Draft against the AI too, so the drop-off is a different opponent
    // rather than a worse ritual. renderFallback stays as the plain path and
    // beginAIDraft falls back to it on any failure.
    if (DRAFT_ENABLED_CLIENT) beginAIDraft();
    else renderFallback();
  }

  // ── Zombie-tab guard ─────────────────────────────────────────────
  // The queue heartbeat used to run forever, so a /spar tab someone
  // walked away from stayed 'waiting' for DAYS: every new human got a
  // dead 20-second proposal from it before mutual skipUids kicked in.
  // Measured 2026-08-18: one abandoned anonymous tab sat in 4 created
  // rounds over a week without ever arriving, and threw two dead
  // proposals at a live tester in one afternoon. "Wander off if you
  // like" stays honest — 4 hours is far past any wander — but past
  // that with zero interaction the doc is parked (heartbeat stops, the
  // reaper sweeps it) and the FIRST real touch or tab return rejoins
  // with a fresh doc, so a returning human is requeued within a second
  // of actually being back.
  var ATTN_STALE_MS = 4 * 60 * 60 * 1000;
  var lastAttentionAt = Date.now();
  function humanIsAround(){ return Date.now() - lastAttentionAt < ATTN_STALE_MS; }
  (function(){
    var moveT = 0;
    function mark(){
      lastAttentionAt = Date.now();
      // Parked while away? The human is back: rejoin on a clean doc.
      if (state.zombieParked && !state.cancelled){
        state.zombieParked = false;
        updateDiag({ last: 'back from away, re-queueing' });
        joinQueue();
      }
    }
    ['pointerdown','keydown','touchstart'].forEach(function(ev){
      document.addEventListener(ev, mark, { passive: true });
    });
    // Mouse movement counts as presence on desktops, throttled so this
    // never becomes a hot listener.
    document.addEventListener('pointermove', function(){
      var n = Date.now();
      if (n - moveT > 60000){ moveT = n; mark(); }
    }, { passive: true });
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) mark();
    });
  })();

  // Re-stamp joinedAt every 90s while searching, mirroring the
  // background matcher in js/notifications.js. spar-pair skips (and
  // cancels) peers older than 3 min (STALE_PEER_MS) — without this
  // heartbeat the 4-minute fallback window would guarantee a
  // stale-skip cancel at 3:00 for every waiter. Trade: each re-stamp
  // moves you to the back of the joinedAt ordering, which is
  // irrelevant at current queue depth. The visible countdown reads
  // state.joinedAtMs (local), so re-stamping never resets the clock.
  function startQueueHeartbeat(){
    if (state.heartbeatInterval) clearInterval(state.heartbeatInterval);
    state.heartbeatInterval = setInterval(function(){
      if (state.cancelled || !state.queueDocRef) return;
      if (!humanIsAround()){
        // Stop refreshing joinedAt; the reaper sweeps the doc and the
        // attention tracker above rejoins the moment the human is back.
        state.zombieParked = true;
        return;
      }
      state.queueDocRef.update({
        joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(function(){});
    }, QUEUE_HEARTBEAT_MS);
  }

  function cancelQueue(){
    state.cancelled = true;
    // Cancel means OFF everywhere: clear the sitewide availability
    // flag joinQueue set, so the background matcher doesn't resurrect
    // the queue doc on the next page.
    try { localStorage.removeItem('da-spar-bg'); } catch(e){}
    // Only count as a "miss" if the user spent real time in the queue
    // (>=15s). A quick click-through isn't a missed match, it's a user
    // who never really tried.
    var elapsed = state.joinedAtMs ? Math.floor((Date.now() - state.joinedAtMs) / 1000) : 0;
    if (elapsed >= 15) logMissedMatch('cancel');
    teardownQueue();
    if (state.queueDocRef){
      state.queueDocRef.update({
        status: 'cancelled',
        cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(function(){});
    }
    try { gtag('event', 'spar_cancel', { format: formatParam, elapsed_sec: elapsed }); } catch(e){}
    // Ask WHY before leaving. The card resolves on answer, skip, or 30s
    // of nothing, so the navigation can never be lost; without the
    // widget the original navigation runs unchanged.
    if (window.RoundExit && typeof RoundExit.ask === 'function'){
      RoundExit.ask({
        surface: 'spar',
        stage: 'queue',
        elapsed: elapsed,
        reasons: ['matching_too_long', 'not_now', 'tech_problem', 'confused', 'other'],
        question: 'Leaving the queue: what happened?',
      }).then(function(){ location.href = '/'; }, function(){ location.href = '/'; });
    } else {
      location.href = '/';
    }
  }

  // Pull out of the queue without cancelQueue's side effects: no missed-match
  // log (nobody missed anybody; the allowance ended), no navigation (the gate
  // is rendering in place). Used when the server's guest count lands after we
  // optimistically queued, and when a pair attempt comes back SIGN_IN_REQUIRED.
  function leaveQueueQuietly(){
    state.cancelled = true;
    try { localStorage.removeItem('da-spar-bg'); } catch(e){}
    teardownQueue();
    if (state.queueDocRef){
      state.queueDocRef.delete().catch(function(){});
      state.queueDocRef = null;
    }
  }

  function leaveQueueForAi(){
    if (state.aiLeaving) return;
    state.aiLeaving = true;
    state.cancelled = true;
    try { localStorage.removeItem('da-spar-bg'); } catch(e){}
    try { localStorage.setItem('debateos-spar-format', formatParam); } catch(e){}
    var elapsed = state.joinedAtMs ? Math.floor((Date.now() - state.joinedAtMs) / 1000) : 0;
    if (elapsed >= 15) logMissedMatch('ai-choice');
    try { gtag('event', 'spar_ai_choice', { format: formatParam, elapsed_sec: elapsed }); } catch(e){}
    teardownQueue();
    var voiceMode = 'quickclash';
    var target = '/voice-debate?mode=' + encodeURIComponent(voiceMode) + '&handoff=spar-ai-choice';
    var navigated = false;
    function go(){
      if (navigated) return;
      navigated = true;
      location.href = target;
    }
    if (state.queueDocRef){
      state.queueDocRef.update({
        status: 'cancelled',
        cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).then(go).catch(go);
      setTimeout(go, 450);
    } else {
      go();
    }
  }

  function teardownQueue(){
    document.body.classList.remove('draft-live');
    if (state.consentTimer){ clearInterval(state.consentTimer); state.consentTimer = null; }
    // Inlined rather than routed through clearConsentTimer, so the draft's
    // own clocks have to be dropped here too. A surviving draft clock fires
    // its onZero into a page that has already navigated into the round.
    if (state.draftTimer){ clearInterval(state.draftTimer); state.draftTimer = null; }
    if (state.draftRevealTimer){ clearTimeout(state.draftRevealTimer); state.draftRevealTimer = null; }
    state.inConsent = false;
    state.consentKey = '';
    state.draftKey = '';
    state.draftPicks = [];
    state.draftSubmitting = false;
    state.draftRevealed = false;
    state.consentPending = 0;
    state.lastConsentDoc = null;
    document.title = BASE_TITLE;
    if (state.heartbeatInterval){ clearInterval(state.heartbeatInterval); state.heartbeatInterval = null; }
    if (state.watchPollInterval){ clearInterval(state.watchPollInterval); state.watchPollInterval = null; }
    if (state.countdownInterval){ clearInterval(state.countdownInterval); state.countdownInterval = null; }
    if (state.matchPollInterval){ clearInterval(state.matchPollInterval); state.matchPollInterval = null; }
    if (state.queueUnsub){ try { state.queueUnsub(); } catch(e){} state.queueUnsub = null; }
    if (state.queueWatchUnsub){ try { state.queueWatchUnsub(); } catch(e){} state.queueWatchUnsub = null; }
    // Drop the live ops strip's Firestore listener too — leaving it
    // attached after the search view tears down would leak.
    if (metaLiveUnsub.queue){ try { metaLiveUnsub.queue(); } catch(e){} metaLiveUnsub.queue = null; }
    state.matchTriggerPending = false;
    state.pairInFlight = false;
  }

  // Tab close / nav away. 2026-06-12: we deliberately do NOT delete
  // the queue doc anymore. Searching flips 'da-spar-bg' (see
  // joinQueue), so on any in-app navigation js/notifications.js
  // adopts the doc — heartbeats it, re-creates it if reaped, and
  // pops the match card wherever the user lands. On a true tab
  // close, the heartbeat stops and spar-pair's stale-skip/reaper
  // retires the doc server-side within minutes; if the user comes
  // back, the bg matcher self-heals. Deleting here would kill the
  // "stay available while you browse the rest of the app" promise.

  var WL_MSG_MAX = 1000;

  var wl = {
    threads: [],
    threadsUnsub: null,
    unreadThreads: 0,
    // The open thread's DBDM handle (js/dm-core.js). It owns both
    // listeners, the pending sends and the retry timers; closing the
    // modal closes it.
    dm: null,
    peerRead: false,

    // render without re-reading the doc: { id, participants:[uids],
    // participantInfo:{uid:{name,photo}}, isGroup, groupName }.
    activeThread: null,

  var WL_GROUP_NAME_MAX = 60;

  function relTime(ms){
    var diff = Date.now() - ms;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
    return Math.floor(diff/86400000) + 'd ago';
  }

  // Escape + linkify DM text. URLs become clickable anchors (the
  // schedule-proposal flow sends a Google Calendar URL in the body —
  // rendered as plain escaped text it was a dead string). Non-URL
  // spans go through escHtml exactly as before. Long URLs display as
  // a shortened host+path label so bubbles stay readable.
  function linkifyMsg(s){
    s = String(s || '');
    var rx = /(https?:\/\/[^\s<>"']+)/g;
    var out = '', last = 0, m;
    while ((m = rx.exec(s))){
      out += escHtml(s.slice(last, m.index));
      var url = m[1];
      // Trailing punctuation is sentence-structure, not URL.
      var clean = url.replace(/[).,;:!?]+$/, '');
      var rest = url.slice(clean.length);
      var label = clean.replace(/^https?:\/\//, '');
      if (label.length > 46) label = label.slice(0, 43) + '…';
      out += '<a class="wl-msg__link" href="' + escHtml(clean) + '" target="_blank" rel="noopener noreferrer">' + escHtml(label) + '</a>' + escHtml(rest);
      last = m.index + url.length;
    }
    out += escHtml(s.slice(last));
    return out;
  }

  function dmThreadId(uidA, uidB){
    return [uidA, uidB].sort().join('_');
  }

  // Open a 1:1 DM. Sets up wl.activeThread (participants known up-front
  // even before the doc exists, so the first send can create it) and
  // hands off to the shared renderer.
  function openDMThread(peerUid, peerName, peerPhoto){
    if (!state.user || !firebaseDb || !peerUid) return;
    if (peerUid === state.user.uid) return;
    var me = state.user.uid;
    var pInfo = {};
    pInfo[me] = { name: shortNameOf(state.user), photo: state.user.photoURL || '' };
    pInfo[peerUid] = { name: peerName || 'Debater', photo: peerPhoto || '' };
    wl.activeThread = {
      id: dmThreadId(me, peerUid),
      participants: [me, peerUid],
      participantInfo: pInfo,
      isGroup: false,
      groupName: '',
    };
    // Hydrate lastMessage from the existing doc so the thread header and
    // optimistic send state start from the same server snapshot.
    firebaseDb.collection('dm_threads').doc(wl.activeThread.id).get().then(function(doc){
      if (doc.exists && wl.activeThread && wl.activeThread.id === doc.id){
        wl.activeThread.lastMessage = (doc.data() || {}).lastMessage || '';
      }
    }).catch(function(){});
    renderThreadModal();
  }

  // Open a group (or any) thread by its doc id. Fetches the thread doc
  // for participants + name, then renders. Used by the inbox list and
  // the ?thread= deep link from a notification.
  function openGroupThread(threadId){
    if (!state.user || !firebaseDb || !threadId) return;
    firebaseDb.collection('dm_threads').doc(threadId).get().then(function(doc){
      if (!doc.exists){ return; }
      var d = doc.data() || {};
      if (!(d.participants || []).some(function(u){ return u === state.user.uid; })) return; // not a member
      wl.activeThread = {
        id: threadId,
        participants: d.participants || [],
        participantInfo: d.participantInfo || {},
        isGroup: !!d.isGroup || (d.participants || []).length > 2,
        groupName: d.groupName || '',
        lastMessage: d.lastMessage || '',
      };
      renderThreadModal();
    }).catch(function(e){ console.warn('[dm] open group thread failed', e && e.message); });
  }

    // Hand the thread to the shared engine (js/dm-core.js). It owns the

    // message used to need a page reload to appear.
    if (wl.dm){ try { wl.dm.close(); } catch(e){} wl.dm = null; }
    wl.peerRead = false;
    wl.dm = DBDM.open({
      db: firebaseDb,
      uid: state.user.uid,
      threadId: at.id,
      thread: at,
      maxLength: WL_MSG_MAX,
      senderName: function(){ return shortNameOf(state.user); },
      senderPhoto: function(){ return (state.user && state.user.photoURL) || ''; },
      onMessages: paintDMThread,
      onThread: function(d){
        if (!d) return;
        at.lastMessage = d.lastMessage || at.lastMessage || '';
        var un = d.unread || {};
        if (un[state.user.uid] > 0 && wl.dm) wl.dm.markRead();
        if (at.isGroup) return;
        var peerUid = (at.participants || []).filter(function(u){ return u !== state.user.uid; })[0];
        wl.peerRead = d.lastMessageFrom === state.user.uid && !(un[peerUid] > 0);
        updateReadReceipt();
      },
    });
    setTimeout(function(){
      var input = document.getElementById('wlSendInput');
      if (input){
        // One-shot challenge opener from the leaderboard. Seeded as a
        // DRAFT, never auto-sent: the point of a callout is that the
        // sender chose the words. Cleared after use so re-opening the
        // thread later does not keep re-seeding over what they typed,
        // and skipped if the field already has content.
        if (wl.pendingChallenge && !input.value){
          wl.pendingChallenge = false;
          var them = '';
          try {
            var at2 = wl.activeThread, other = at2 && at2.participants
              ? at2.participants.filter(function(u){ return u !== state.user.uid; })[0] : null;
            them = (other && at2.participantInfo && at2.participantInfo[other]
              && at2.participantInfo[other].name) || '';
          } catch(e){}
          input.value = (them ? them + ', I' : 'I')
            + " want to challenge you to a casual 1v1. Pick a time that suits you.";
        }
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch(e){}
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendThreadMessage(); }
        });
      }
    }, 50);
  }

  // Paints a DBDM view: { messages, status }. Messages carry their own
  // pending / failed state, so a send that has not landed yet is a real
  // bubble on screen rather than a cleared input and a line of red text.
  function paintDMThread(v){
    var t = document.getElementById('wlThread');
    if (!t) return;
    var msgs = (v && v.messages) || [];
    var at = wl.activeThread || {};
    if (!msgs.length){
      var note;
      if (v && v.status === 'loading') note = 'Loading messages…';
      else if (v && v.status === 'quota') note = 'Messages are rate-limited right now (daily data budget).<br>Sending still works; reading returns after midnight Pacific.';
      else if (v && v.status === 'error') note = 'Could not load messages right now.<br>Reconnecting…';
      else note = at.isGroup
        ? 'No messages yet.<br>Kick off the group. Propose a time or a practice motion.'
        : 'No messages yet.<br>Say hi and set up a round.';
      t.innerHTML = '<div class="wl-msg__empty">' + note + '</div>';
      return;
    }
    // Only follow the feed down if the reader is already at the bottom,
    // or if the newest message is theirs. Slamming scrollTop on every
    // repaint yanked the thread out from under anyone reading back.
    var stick = DBDM.nearBottom(t) || msgs[msgs.length - 1].mine;
    var isGroup = !!at.isGroup;
    var pInfo = at.participantInfo || {};
    var lastSender = null;
    t.innerHTML = '';
    msgs.forEach(function(m){
      var div = document.createElement('div');
      div.className = 'wl-msg ' + (m.mine ? 'mine' : 'theirs')
        + (m.pending ? ' pending' : '') + (m.failed ? ' failed' : '');
      var senderLabel = '';
      if (isGroup && !m.mine && m.fromUid !== lastSender){
        var nm = m.fromName || (pInfo[m.fromUid] && pInfo[m.fromUid].name) || 'Debater';
        senderLabel = '<div class="wl-msg__sender">' + escHtml(nm) + '</div>';
      }
      lastSender = m.fromUid;
      var foot;
      if (m.failed){
        div.setAttribute('data-retry', m.id);
        div.title = 'Tap to send again';
        foot = '<div class="wl-msg__time">Not sent. Tap to retry.</div>';
      } else if (m.pending){
        foot = '<div class="wl-msg__time">Sending…</div>';
      } else {
        var whenAbs = new Date(m.at).toLocaleString(undefined, {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
        foot = '<div class="wl-msg__time" title="' + escHtml(whenAbs) + '">' + escHtml(relTime(m.at)) + '</div>';
      }
      div.innerHTML = senderLabel + linkifyMsg(m.text || '') + foot;
      t.appendChild(div);
    });
    updateReadReceipt();
    if (stick) t.scrollTop = t.scrollHeight;
  }

  // A failed bubble is the retry button. Delegated because the feed is
  // rebuilt on every paint.
  document.addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('#wlThread [data-retry]') : null;
    if (!el || !wl.dm) return;
    if (e.target.closest('.wl-msg__link')) return;
    wl.dm.retry(el.getAttribute('data-retry')).catch(function(){});
  });

  // "Read" marker under my latest message in a 1:1 thread. Driven by
  // the thread-doc snapshot in renderThreadModal: when the peer's
  // unread hits 0 and the last message is mine, they've seen it. The
  // data was always there (unread map); this just surfaces it.
  function updateReadReceipt(){
    var t = document.getElementById('wlThread');
    if (!t) return;
    var old = document.getElementById('wlReadReceipt');
    if (old) old.remove();
    if (!wl.peerRead) return;
    var msgs = t.querySelectorAll('.wl-msg');
    if (!msgs.length) return;
    var lastEl = msgs[msgs.length - 1];
    if (!lastEl.classList.contains('mine')) return;
    var d = document.createElement('div');
    d.id = 'wlReadReceipt';
    d.className = 'wl-msg__read';
    d.textContent = 'Read';
    t.appendChild(d);
  }

  // Generalized send: works for 1:1 and group threads. Reads
  // wl.activeThread for participants, bumps unread for everyone except
  // the sender, and stamps fromName so group messages can be labeled.
  function toggleSchedulePanel(e, forceOpen){
    var panel = document.getElementById('wlSchedulePanel');
    var btn = document.getElementById('wlCalToggle');
    if (!panel) return;
    var open = typeof forceOpen === 'boolean' ? forceOpen : !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    if (btn) btn.classList.toggle('active', open);
    if (open){
      var f = document.getElementById('wlSchedDate');
      if (f) f.focus();
    } else {
      var inp = document.getElementById('wlSendInput');
      if (inp) inp.focus();
    }
  }

  function sendScheduleProposal(){
    var at = wl.activeThread;
    if (!at || !state.user) return;
    var dateVal = (document.getElementById('wlSchedDate') || {}).value || '';
    var timeVal = (document.getElementById('wlSchedTime') || {}).value || '';
    var durVal  = parseInt((document.getElementById('wlSchedDur') || {}).value || '60', 10);
    var motion  = ((document.getElementById('wlSchedMotion') || {}).value || '').trim();
    if (!dateVal || !timeVal){ alert('Pick a date and time first.'); return; }

    // Build a readable label
    var startDt = new Date(dateVal + 'T' + timeVal);
    if (isNaN(startDt.getTime())){ alert('Invalid date or time.'); return; }
    var endDt = new Date(startDt.getTime() + durVal * 60000);

    var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var label = dayNames[startDt.getDay()] + ' ' + monthNames[startDt.getMonth()] + ' ' + startDt.getDate();
    var h = startDt.getHours(), m = startDt.getMinutes();
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12 || 12;
    var timeLabel = h12 + (m ? ':' + (m < 10 ? '0' + m : m) : '') + ampm;
    var durLabel = durVal < 60 ? durVal + ' min' : (durVal / 60) + ' hr';

    // Google Calendar URL (local time, no Z suffix so it uses the user's timezone)
    function fmtGcal(d){
      return d.getFullYear() +
        String(d.getMonth()+1).padStart(2,'0') +
        String(d.getDate()).padStart(2,'0') + 'T' +
        String(d.getHours()).padStart(2,'0') +
        String(d.getMinutes()).padStart(2,'0') + '00';
    }
    var joinUrl = 'https://itsdebatable.com/spar';
    var details = 'Debate practice round via Debatable.' + (motion ? '\n\nMotion: ' + motion : '') + '\n\nJoin at: ' + joinUrl;
    var calUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent('Debate Round · Debatable') +
      '&dates=' + fmtGcal(startDt) + '/' + fmtGcal(endDt) +
      '&details=' + encodeURIComponent(details) +
      '&location=' + encodeURIComponent(joinUrl);

    // Compose the DM message
    var msg = '📅 Round proposed: ' + label + ' at ' + timeLabel + ' · ' + durLabel;
    if (motion) msg += '\nMotion: ' + motion;
    msg += '\n\nAdd to Google Calendar:\n' + calUrl;

    // Same send path as a typed message: one engine, so a proposal
    // gets the same optimistic bubble and the same retry. The inbox
    // preview is passed explicitly so the thread list shows the date
    // rather than the first line of a calendar link.
    var at2 = wl.activeThread;
    var btn = document.getElementById('wlSchedSend');
    if (!wl.dm) return;
    if (btn) btn.disabled = true;
    wl.dm.send(msg, { preview: '📅 ' + label + ' at ' + timeLabel }).then(function(){
      if (btn) btn.disabled = false;
      toggleSchedulePanel(null, false);
      try { gtag('event', 'dm_schedule_propose', {}); } catch(e){}
      firePushDM(at2.participants, at2.id); // Web Push the recipient(s)
      window.open(calUrl, '_blank', 'noopener');
    }).catch(function(err){
      if (btn) btn.disabled = false;
      console.warn('[sched] send failed', err && err.message);
      alert(DBDM.sendReason(err));
    });
  }

  // Web Push: ping every other participant's devices about a new DM so it
  // lands even with the tab or installed PWA closed. Mirrors the in-page
  // bell toast + the email nudge. The server verifies both sides share the
  // thread and builds the notification text, so there's no spoofing vector.
  // No-ops until VAPID is configured server-side.
  function firePushDM(participants, threadId){
    try {
      if (!state.user || !threadId || !Array.isArray(participants)) return;
      var me = state.user.uid;
      var others = participants.filter(function(uid){ return uid && uid !== me; });
      if (!others.length) return;
      state.user.getIdToken().then(function(tok){
        others.forEach(function(uid){
          fetch('/.netlify/functions/push-send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
            body: JSON.stringify({ recipientUid: uid, threadId: threadId }),
          }).catch(function(){});
        });
      }).catch(function(){});
    } catch (e) {}
  }

  function sendThreadMessage(){
    var at = wl.activeThread;
    var input = document.getElementById('wlSendInput');
    var sendBtn = document.getElementById('wlSendBtn');
    if (!at || !input || !wl.dm || !state.user) return;
    var text = (input.value || '').trim();
    if (!text) return;
    // The composer clears immediately because the words are already on
    // screen as an optimistic bubble. A send that fails keeps them
    // there, retryable, instead of dropping what was typed.
    input.value = '';
    var prevErr = document.getElementById('wlSendErr');
    if (prevErr) prevErr.textContent = '';
    if (sendBtn) sendBtn.disabled = true;
    wl.dm.send(text).then(function(res){
      if (sendBtn) sendBtn.disabled = false;
      input.focus();
      try { gtag('event', at.isGroup ? 'group_send' : 'dm_send', {}); } catch(e){}
      firePushDM(at.participants, at.id); // Web Push the recipient(s)
      if (res) at.lastMessage = res.preview;
    }).catch(function(e){
      if (sendBtn) sendBtn.disabled = false;
      console.warn('[dm] send failed', e);
      try {
        var errEl = document.getElementById('wlSendErr');
        if (!errEl && input && input.parentElement){
          errEl = document.createElement('div');
          errEl.id = 'wlSendErr';
          errEl.style.cssText = 'flex-basis:100%;padding:5px 4px 0;font-size:.75rem;color:#f59e0b';
          input.parentElement.appendChild(errEl);
        }
        if (errEl) errEl.textContent = DBDM.sendReason(e);
      } catch(_e){}
    });
  }

  function startInboxFeed(){
    if (!firebaseDb || !state.user) return;
    if (wl.threadsUnsub){ try { wl.threadsUnsub(); } catch(e){} }
    wl.threadsUnsub = firebaseDb.collection('dm_threads')
      .where('participants', 'array-contains', state.user.uid)
      .orderBy('lastMessageAt', 'desc')
      .limit(30)
      .onSnapshot(function(snap){
        var rows = [];
        var unreadCount = 0;
        var myUid = state.user.uid;
        snap.forEach(function(d){
          var data = d.data() || {};
          var unread = (data.unread && data.unread[myUid]) || 0;
          if (unread > 0) unreadCount++;
          rows.push({ id: d.id, data: data, unread: unread });
        });
        wl.threads = rows;
        wl.unreadThreads = unreadCount;
        var badge = document.getElementById('wlInboxBadge');
        var fabBadge = document.getElementById('wlFabBadge');
        [badge, fabBadge].forEach(function(b){
          if (!b) return;
          if (unreadCount > 0){ b.hidden = false; b.textContent = String(unreadCount); }
          else b.hidden = true;
        });
        if (document.getElementById('wlInboxList')) paintInboxList();
      }, function(err){
        // Most likely cause: missing composite index on
        // (participants array-contains, lastMessageAt desc). Firestore
        // logs a clickable "create index" link in the console error.
        console.warn('[dm] inbox snapshot error (likely missing index — see comment block above):', err);
      });
  }

  function openInboxModal(){
    if (!state.user){ doGoogleSignIn(); return; }
    openModal('Your messages',
      '<div class="wl-inbox-list" id="wlInboxList"><div class="wl-msg__empty">Loading…</div></div>',
      [
        { label: 'New group', kind: 'ghost', id: 'wlNewGroupBtn', onClick: openGroupComposer },
        { label: 'Close', kind: 'ghost', onClick: closeModal },
      ]
    );
    paintInboxList();
  }

  function paintInboxList(){
    var list = document.getElementById('wlInboxList');
    if (!list) return;
    if (!wl.threads.length){
      list.innerHTML = '<div class="wl-msg__empty">No messages yet. DM someone from the waitlist, or start a group.</div>';
      return;

    var myUid = state.user.uid;
    list.innerHTML = wl.threads.map(function(t){
      var d = t.data || {};
      var isGroup = !!d.isGroup || (d.participants || []).length > 2;
      var preview = escHtml(d.lastMessage || '');
      var when = d.lastMessageAt && d.lastMessageAt.toMillis ? relTime(d.lastMessageAt.toMillis()) : '';
      var name, avatar, attrs;
      if (isGroup){
        var count = (d.participants || []).length;
        name = escHtml(d.groupName || 'Group') + ' <span class="wl-inbox-row__count">' + count + '</span>';
        avatar = '<div class="wl-modal__avatar wl-modal__avatar--group" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>' +
          '</div>';
        attrs = 'data-thread-id="' + escHtml(t.id) + '" data-is-group="1"';
      } else {
        var peerUid = (d.participants || []).filter(function(p){ return p !== myUid; })[0] || '';
        var info = (d.participantInfo && d.participantInfo[peerUid]) || {};
        name = escHtml(info.name || 'Debater');
        avatar = info.photo
          ? '<img class="wl-modal__avatar" src="' + escHtml(info.photo) + '" alt="">'
          : '<div class="wl-modal__avatar"></div>';
        attrs = 'data-peer-uid="' + escHtml(peerUid) + '" data-peer-name="' + escHtml(info.name || '') + '" data-peer-photo="' + escHtml(info.photo || '') + '"';
      }
      return '<div class="wl-inbox-row' + (t.unread > 0 ? ' unread' : '') + '" ' + attrs + '>' +
        avatar +
        '<div class="wl-inbox-row__main">' +
          '<div class="wl-inbox-row__name">' + name + '</div>' +
          '<div class="wl-inbox-row__preview">' + preview + '</div>' +
        '</div>' +
        '<div class="wl-inbox-row__time">' + escHtml(when) + '</div>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.wl-inbox-row'), function(row){
      row.addEventListener('click', function(){
        if (row.dataset.isGroup){ openGroupThread(row.dataset.threadId); }
        else { openDMThread(row.dataset.peerUid, row.dataset.peerName, row.dataset.peerPhoto); }
      });
    });
  }

  // ── Group creation ───────────────────────────────────────────────
  // Candidates = people you already have a DM thread with. Deduped,
  // you excluded. (Used to also pull from waitlist posters; that
  // source is gone along with the join-the-waitlist board.)
  function groupCandidates(){
    var me = state.user && state.user.uid;
    var seen = {}; var out = [];
    function add(uid, name, photo){
      if (!uid || uid === me || seen[uid]) return;
      seen[uid] = true;
      out.push({ uid: uid, name: name || 'Debater', photo: photo || '' });
    }
    (wl.threads || []).forEach(function(t){
      var d = t.data || {};
      (d.participants || []).forEach(function(uid){
        var info = (d.participantInfo && d.participantInfo[uid]) || {};
        add(uid, info.name, info.photo);
      });
    });
    return out;
  }

  function openGroupComposer(){
    if (!state.user){ doGoogleSignIn(); return; }
    var cands = groupCandidates();
    var listHtml = cands.length
      ? cands.map(function(c){
          var av = c.photo
            ? '<img class="wl-modal__avatar" src="' + escHtml(c.photo) + '" alt="">'
            : '<div class="wl-modal__avatar"></div>';
          return '<label class="wl-pick">' +
            '<input type="checkbox" class="wl-pick__cb" value="' + escHtml(c.uid) + '" ' +
              'data-name="' + escHtml(c.name) + '" data-photo="' + escHtml(c.photo) + '">' +
            av +
            '<span class="wl-pick__name">' + escHtml(c.name) + '</span>' +
          '</label>';
        }).join('')
      : '<div class="wl-msg__empty">No one to add yet. When debaters post open invites or you DM someone, they show up here.</div>';
    openModal('New group',
      '<div class="wl-field">' +
        '<label for="wlGroupName">Group name</label>' +
        '<input class="wl-input" id="wlGroupName" placeholder="e.g. Friday BP practice" maxlength="' + WL_GROUP_NAME_MAX + '">' +
      '</div>' +
      '<div class="wl-field"><label>Add members</label>' +
        '<div class="wl-pick-list">' + listHtml + '</div>' +
      '</div>' +
      '<div class="wl-modal__error" id="wlGroupError"></div>',
      [
        { label: 'Cancel', kind: 'ghost', onClick: closeModal },
        { label: 'Create group', kind: 'primary', id: 'wlGroupCreate', onClick: submitGroup },
      ]
    );
    setTimeout(function(){ var n = document.getElementById('wlGroupName'); if (n) n.focus(); }, 50);
  }

  function submitGroup(){
    if (!state.user || !firebaseDb) return;
    var nameEl = document.getElementById('wlGroupName');
    var errEl = document.getElementById('wlGroupError');
    var btn = document.getElementById('wlGroupCreate');
    var name = (nameEl && nameEl.value || '').trim();
    var picks = Array.prototype.slice.call(document.querySelectorAll('.wl-pick__cb:checked'));
    if (!name){ if (errEl) errEl.textContent = 'Give the group a name.'; return; }
    if (picks.length < 2){ if (errEl) errEl.textContent = 'Pick at least 2 people for a group (use a DM for one).'; return; }
    if (picks.length + 1 > WL_GROUP_MAX_MEMBERS){ if (errEl) errEl.textContent = 'Groups cap at ' + WL_GROUP_MAX_MEMBERS + ' members.'; return; }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    var me = state.user.uid;
    var participants = [me];
    var participantInfo = {};
    participantInfo[me] = { name: shortNameOf(state.user), photo: state.user.photoURL || '' };
    var unread = {}; unread[me] = 0;
    picks.forEach(function(cb){
      var uid = cb.value;
      if (participants.indexOf(uid) >= 0) return;
      participants.push(uid);
      participantInfo[uid] = { name: cb.getAttribute('data-name') || 'Debater', photo: cb.getAttribute('data-photo') || '' };
      // Seed unread:1 for added members so "you were added to a group"
      // surfaces as a notification (bell badge + toast) for anyone online.
      unread[uid] = 1;
    });
    var threadId = 'grp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    firebaseDb.collection('dm_threads').doc(threadId).set({
      isGroup: true,
      groupName: name.slice(0, WL_GROUP_NAME_MAX),
      participants: participants,
      participantInfo: participantInfo,
      createdBy: me,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessage: shortNameOf(state.user) + ' started the group',
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessageFrom: me,
      unread: unread,
    }).then(function(){
      try { gtag('event', 'group_create', { members: participants.length }); } catch(e){}
      openGroupThread(threadId);
    }).catch(function(e){
      if (btn) btn.disabled = false;
      if (errEl) errEl.textContent = 'Couldn\'t create group: ' + (e.message || e.code || 'unknown');
    });
  }

  // Open a DM thread given only the peer's uid (from a ?dm= deep link).
  // Fetches the thread doc to recover the peer's display name + photo
  // from participantInfo; falls back to a generic label if the thread
  // doesn't exist yet or the read fails.
  function openDmFromUid(peerUid){
    if (!firebaseDb || !state.user || !peerUid) return;
    var threadId = dmThreadId(state.user.uid, peerUid);
    firebaseDb.collection('dm_threads').doc(threadId).get().then(function(doc){
      var info = {};
      if (doc.exists){
        var d = doc.data() || {};
        info = (d.participantInfo && d.participantInfo[peerUid]) || {};
      }
      openDMThread(peerUid, info.name || 'Debater', info.photo || '');
    }).catch(function(){
      openDMThread(peerUid, 'Debater', '');
    });
  }

  // Calm center state for inbox deep-links: the user arrived to read a
  // DM, so we show their messages + an explicit opt-in to matchmaking
  // rather than auto-queueing them into a live round.
  function renderInboxLanding(){
    shell.innerHTML =
      '<div class="gate">' +
        '<div class="eyebrow"><span class="pip"></span>Sparring · Messages</div>' +
        '<h2>Your messages</h2>' +
        '<p>Pick up where you left off, or jump back into the matchmaking queue when you\'re ready to spar.</p>' +
        '<button class="gate-google" id="inboxOpenBtn" type="button" style="margin-top:6px">Open inbox</button>' +
        '<button class="ai-alt" id="inboxQueueBtn" type="button" style="background:none;border:none;cursor:pointer;font-family:inherit">Or find a sparring partner now →</button>' +
      '</div>';
    var openBtn = document.getElementById('inboxOpenBtn');
    if (openBtn) openBtn.addEventListener('click', openInboxModal);
    var queueBtn = document.getElementById('inboxQueueBtn');
    if (queueBtn) queueBtn.addEventListener('click', function(){
      // Strip ?dm so a refresh / re-auth doesn't bounce back to inbox.
      try { history.replaceState(null, '', '/spar' + (formatParam ? ('?format=' + encodeURIComponent(formatParam)) : '')); } catch(e){}
      joinQueue();
    });
  }

  // Generic modal helpers ────────────────────────────────
  function openModal(titleHtml, bodyHtml, footButtons){
    closeModal();
    var backdrop = document.createElement('div');
    backdrop.className = 'wl-modal-backdrop';
    backdrop.id = 'wlModalBackdrop';
    var footHtml = (footButtons || []).map(function(b, i){
      if (b.html) return b.html;
      var cls = b.kind === 'primary' ? 'wl-btn primary' : 'wl-btn ghost';
      var idAttr = b.id ? ' id="' + b.id + '"' : ' data-foot-idx="' + i + '"';
      return '<button class="' + cls + '"' + idAttr + ' type="button">' + escHtml(b.label) + '</button>';
    }).join('');
    backdrop.innerHTML =
      '<div class="wl-modal" role="dialog" aria-modal="true">' +
        '<div class="wl-modal__head">' +
          '<div class="wl-modal__title">' + titleHtml + '</div>' +
          '<button class="wl-modal__close" id="wlModalClose" aria-label="Close">×</button>' +
        '</div>' +
        '<div class="wl-modal__body">' + bodyHtml + '</div>' +
        (footButtons && footButtons.length ? '<div class="wl-modal__foot">' + footHtml + '</div>' : '') +
      '</div>';
    document.body.appendChild(backdrop);
    // Scroll lock. Without it the document behind kept scrolling under a
    // touch drag, so scrolling a thread rubber-banded the whole page and
    // the sheet appeared to jump around.
    wlPrevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    document.getElementById('wlModalClose').addEventListener('click', closeModal);
    // Tap-outside closes, but ONLY when the press STARTED outside too. A
    // touch drag that begins on a message bubble and ends past the edge of
    // the sheet fires its click on the backdrop, so the old target-only
    // check dismissed the modal every time someone scrolled the thread.
    var downOnBackdrop = false;
    backdrop.addEventListener('pointerdown', function(e){
      downOnBackdrop = (e.target === backdrop);
    });
    backdrop.addEventListener('click', function(e){
      if (e.target === backdrop && downOnBackdrop) closeModal();
      downOnBackdrop = false;
    });
    (footButtons || []).forEach(function(b, i){
      if (!b.onClick) return;
      var el = b.id ? document.getElementById(b.id) : backdrop.querySelector('[data-foot-idx="' + i + '"]');
      if (el) el.addEventListener('click', b.onClick);
    });
    document.addEventListener('keydown', wlEscClose);
  }
  function wlEscClose(e){ if (e.key === 'Escape') closeModal(); }
  var wlPrevOverflow = '';
  function closeModal(){
    var b = document.getElementById('wlModalBackdrop');
    if (b) b.remove();
    document.body.style.overflow = wlPrevOverflow;
    wlPrevOverflow = '';
    document.removeEventListener('keydown', wlEscClose);
    if (wl.dm){ try { wl.dm.close(); } catch(e){} wl.dm = null; }
  }

  // ── Scheduled rounds in the rail (2026-07-14) ────────
  // The dead-queue rescue: when matchmaking is quiet, the rail shows
  // upcoming community-scheduled rounds (/api/schedule-round) so a
  // failed match converts into an RSVP for a future one. Same device
  // id + anonymous posture as /community; hidden when nothing is
  // scheduled; refreshes every 2 min while the tab is visible.
  var SCHED_FMT_LABELS = { quick:'Casual 1v1' };
  function schedDeviceId(){
    var id = '';
    try { id = localStorage.getItem('da-device-id') || ''; } catch(e){}
    if (!id){
      id = 'd' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
      try { localStorage.setItem('da-device-id', id); } catch(e){}
    }
    return id;
  }
  function schedHandle(){
    var h = '';
    // The RSVP list is shared, so this is the alias, never the account
    // first name it used to publish.
    if (state.user) h = daPublicName(state.user).split(/\s+/)[0];
    if (!h){ try { h = localStorage.getItem('da-chat-handle') || ''; } catch(e){} }
    return (h || 'anon').slice(0, 32);
  }
  function schedEsc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }
  function loadSchedRounds(){
    var slot = document.getElementById('wlSched');
    if (!slot) return;
    fetch('/api/schedule-round?d=' + encodeURIComponent(schedDeviceId()), { cache: 'no-cache' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        var rounds = (j && Array.isArray(j.rounds)) ? j.rounds : [];
        if (!rounds.length){ slot.hidden = true; slot.innerHTML = ''; return; }
        var now = Date.now();
        var rows = rounds.slice(0, 3).map(function(r){
          var soon = r.startAt - now < 20 * 60 * 1000 && r.startAt + 2 * 60 * 60 * 1000 > now;
          var d = new Date(r.startAt);
          var when = soon ? 'starting<br>soon'
            : (d.toDateString() === new Date().toDateString() ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })) +
              '<br>' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
          var what = '<b>' + schedEsc(SCHED_FMT_LABELS[r.format] || 'Casual 1v1') + '</b>' +
            (r.motion ? ' · ' + schedEsc(String(r.motion).slice(0, 60)) : '') +
            ' · ' + r.rsvpCount + ' in';
          var action = soon
            ? '<a class="wl-sched-btn go" href="/spar?format=quick">Queue →</a>'
            : '<button type="button" class="wl-sched-btn' + (r.mine ? ' on' : '') + '" data-sched-id="' + schedEsc(r.id) + '">' + (r.mine ? 'In ✓' : "I'm in") + '</button>';
          return '<div class="wl-sched-row' + (soon ? ' soon' : '') + '">' +
            '<div class="wl-sched-when">' + when + '</div>' +
            '<div class="wl-sched-what">' + what + '</div>' + action + '</div>';
        }).join('');
        slot.innerHTML =
          '<div class="wl-sched-head">Scheduled rounds<a href="/community">propose one →</a></div>' + rows;
        slot.hidden = false;
        slot.querySelectorAll('[data-sched-id]').forEach(function(b){
          b.addEventListener('click', function(){
            b.disabled = true;
            fetch('/api/schedule-round', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'rsvp', id: b.getAttribute('data-sched-id'), handle: schedHandle(), deviceId: schedDeviceId() }),
            }).then(function(r){ return r.json().catch(function(){ return null; }); })
              .then(function(res){
                if (res && res.ok){
                  try { gtag('event', 'spar_sched_rsvp', { going: res.mine }); } catch(e){}
                  loadSchedRounds();
                } else { b.disabled = false; }
              })
              .catch(function(){ b.disabled = false; });
          });
        });
      })
      .catch(function(){ /* endpoint down — block stays hidden */ });
  }
  setInterval(function(){ if (!document.hidden) loadSchedRounds(); }, 120 * 1000);

  // ── Draft demo view ─────────────────────────────────────────────
  // ?draftdemo=1 renders the real draft board against a synthetic pair, with
  // every POST short-circuited. Same precedent as the landing's ?first=
  // debug arm: this surface is a sequence of timed beats, so the only honest
  // way to judge the feel of it (or to change it later) is to watch it run
  // without needing two signed-in humans and a live queue.
  //
  // It touches no Firestore and joins no queue. Add &overlap=0 to force the
  // clean split where the strikes decide the motion outright, and
  // &role=side to hold the side call instead of the motion call.
  var DEMO = (new URLSearchParams(location.search)).get('draftdemo');
  function runDraftDemo(){
    var qs = new URLSearchParams(location.search);
    var me = 'demo-me';
    var peer = 'demo-peer';
    state.user = state.user || { uid: me, displayName: 'You', isAnonymous: false, photoURL: '' };
    state.named = true;
    var slate = [
      { id: 'm1', text: 'This house would ban billionaires.' },
      { id: 'm2', text: 'This house would abolish the electoral college.' },
      { id: 'm3', text: 'This house believes the ends justify the means.' },
      { id: 'm4', text: 'This house would make voting compulsory.' },
      { id: 'm5', text: 'This house would abolish intellectual property for medicines.' },
    ];
    var overlap = qs.get('overlap') !== '0';
    var iCallMotion = qs.get('role') !== 'side';
    var doc = {
      matchedWith: peer,
      matchedWithName: 'Rin A.',
      matchedWithAvatar: null,
      pairedFormat: 'quick',
      consents: { 'demo-me': false, 'demo-peer': false },
      draft: {
        v: 1, seed: 'demo', slate: slate,
        motionUid: iCallMotion ? me : peer,
        sideUid: iCallMotion ? peer : me,
        strikes: {}, motionId: null, side: null, phase: 'strike',
      },
    };
    // Stand in for the server: apply the strikes, advance the beat, re-render.
    window.__draftDemoAdvance = function(myStrikes){
      var d = doc.draft;
      d.strikes[me] = myStrikes && myStrikes.length === 2 ? myStrikes : ['m1', 'm2'];
      d.strikes[peer] = overlap ? [d.strikes[me][0], 'm5'] : null;
      if (!d.strikes[peer]){
        var free = slate.map(function(m){ return m.id; }).filter(function(id){ return d.strikes[me].indexOf(id) < 0; });
        d.strikes[peer] = [free[0], free[1]];
      }
      doc.consents[me] = true; doc.consents[peer] = true;
      var struck = {};
      Object.keys(d.strikes).forEach(function(u){ d.strikes[u].forEach(function(id){ struck[id] = 1; }); });
      var alive = slate.filter(function(m){ return !struck[m.id]; });
      if (alive.length === 1){ d.motionId = alive[0].id; d.phase = 'side'; }
      else { d.phase = 'motion'; }
      state.draftKey = '';
      renderDraft(doc);
    };
    window.__draftDemoPick = function(pick, value){
      var d = doc.draft;
      if (pick === 'motion'){ d.motionId = value; d.phase = 'side'; }
      else { d.side = value; d.phase = 'done'; }
      state.draftKey = '';
      if (d.phase === 'done'){
        shell.innerHTML = '<div class="draft-wrap">' +
          draftHeadHtml('Locked', 'Round <em>set</em>.', 'Opening the room…') +
          '<div class="draft-final"><p class="draft-final-motion">' +
            escHtml(draftMotionText(d)) + '</p>' +
            '<div class="draft-final-sides"><span class="draft-badge">demo complete</span></div>' +
          '</div></div>';
        return;
      }
      state.draftRevealed = true;
      renderDraft(doc);
    };
    renderDraft(doc);
  }

  // ── Boot ─────────────────────────────────────────────
  // Sidebar mounts immediately; renderWaitlistContent shows/hides the
  // inbox button once auth resolves.
  buildWaitlistRail();
  renderWaitlistContent();
  loadSchedRounds();

  if (DEMO){
    // Deliberately before the auth branch: the demo must not join a queue,
    // write a doc, or care whether anyone is signed in.
    try { runDraftDemo(); } catch(e){ console.error('[spar] draft demo failed', e); }
    return;
  }

  if (firebaseAuth){
    firebaseAuth.onAuthStateChanged(function(user){
      // 2026-08-19: a guest is a queue-eligible user again, so state.user
      // holds whoever is here and state.named says whether they have a real
      // account. Everything named-only (DMs, the inbox, live alerts, the
      // leaderboard) reads state.named; only queueing reads canQueue().
      state.user = user || null;
      state.named = isNamedUser(user);
      renderWaitlistContent();
      // The room asks the server who we are on every poll. Nudge it now
      // so signing in reveals the Message buttons immediately rather
      // than up to a poll interval later.
      if (state.roomChat && state.roomChat.refresh) state.roomChat.refresh();
      if (state.user && !state.named){
        // Guest. Paint from the local mirror immediately, then let the
        // server's count correct it — a guest who cleared storage would
        // otherwise get a free extra round on screen before spar-pair
        // refuses them, which is a worse moment than the honest one.
        loadGuestRounds(state.user.uid);
        var queuedOptimistically = canQueue(state.user);
        if (queuedOptimistically) joinQueue(); else renderGate();
        fetchGuestRounds(state.user.uid).then(function(){
          if (!state.user || state.named || state.inConsent) return;
          if (state.profileFlowOpen) return;
          var mayQueue = canQueue(state.user);
          if (queuedOptimistically && !mayQueue){
            // Mirror was stale in the visitor's favour (another tab spent the
            // last round). Pull the doc back out and put the gate up.
            leaveQueueQuietly();
            renderGate();
          } else if (!queuedOptimistically && mayQueue){
            // Mirror was stale against them — a cleared storage reading as
            // spent, or a count that reset. They have rounds; queue them.
            // renderSearching alone would paint a search with no queue doc
            // behind it, which is the worst of both.
            state.cancelled = false;
            joinQueue();
          } else if (mayQueue){
            // Same verdict, possibly a different number. Repaint so "2 free
            // rounds" does not outlive the first one.
            if (!document.getElementById('sparGateCard')) renderSearching();
          }
        });
        return;
      }
      if (state.user){
        startInboxFeed();
        // Deep link from a DM notification (topbar bell / toast / OS
        // notification → /spar?dm=<peerUid>). Open that thread instead
        // of dumping the user straight into the matchmaking queue —
        // they came to read a message, not to start a live round.
        var dmPeer = qs.get('dm');
        var dmThread = qs.get('thread');
        if (dmThread){
          renderInboxLanding();
          openGroupThread(dmThread);
        } else if (dmPeer && dmPeer !== state.user.uid){
          renderInboxLanding();
          // Arriving from the leaderboard's Challenge action
          // (/spar?dm=<uid>&challenge=1). Same DM thread as any peer
          // message, but the composer opens pre-filled with a challenge
          // opener so the user is one edit + Send from calling the round.
          if (qs.get('challenge') === '1'){ wl.pendingChallenge = true; }
          openDmFromUid(dmPeer);
        } else if (qs.get('inbox')){
          // Reached from the account/profile "Messages" card
          // (/spar?inbox=1). Land on the inbox with the thread list open,
          // not the matchmaking queue.
          renderInboxLanding();
          openInboxModal();
        } else {
          joinQueue();
        }
      } else {
        if (wl.threadsUnsub){ try { wl.threadsUnsub(); } catch(e){} wl.threadsUnsub = null; }
        wl.threads = []; wl.unreadThreads = 0;
        var badge = document.getElementById('wlInboxBadge');
        if (badge) badge.hidden = true;
        var fabBadge = document.getElementById('wlFabBadge');
        if (fabBadge) fabBadge.hidden = true;
        // No session at all. The zero guest allowance makes
        // mintGuestSession() refuse immediately, so Google is the door.
        if (!mintGuestSession()) renderGate();
      }
    });
  } else {
    renderGate();
  }
})();
</script>

<script defer src="/js/signup-nudge.js"></script>
<script defer src="/js/notifications.js"></script>
