      '<p class="lede">The queue is thin right now. Handing you to the AI sparring partner so you don\'t lose your prep time. You stay available in the background; if a human shows up, a match card pops wherever you are.</p>' +
      '<div class="orb-wrap"><div class="orb-glow"></div><div class="orb-ring"></div><div class="orb-core"></div></div>' +
      '<div class="status">Loading AI round…</div>';
    try { gtag('event', 'spar_ai_fallback', { format: formatParam }); } catch(e){}
    // Fallback timeout = a real "missed match" — they tried, nobody showed.
    logMissedMatch('fallback');
    setTimeout(function(){ location.href = '/practice'; }, 1200);
  }

  // ── Count-up timer (no forced AI fallback) ───────────
  // The user can leave the page and come back — no 4-minute wall.
  // AI fallback is still reachable via the "Skip to AI" link.
  // Notification permission is requested at 8s so the OS can ping
  // the user when a match lands while they're in another tab.
  function startCountdown(){
    if (state.countdownInterval) clearInterval(state.countdownInterval);
    state.pingAsked = false;
    state.sipAsked = false;
    state.countdownInterval = setInterval(function(){
      var elapsed = Math.floor((Date.now() - state.joinedAtMs) / 1000);
      var num = document.getElementById('countdownNum');
      if (num){
        var mm = Math.floor(elapsed / 60);
        var ss = elapsed % 60;
        num.textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
      }
      if (elapsed >= 8 && !state.pingAsked){
        state.pingAsked = true;
        requestPingPermission();
      }
      if (elapsed >= 12 && !state.aiOfferDismissed){
        var offer = document.getElementById('aiOpponentOffer');
        if (offer) offer.hidden = false;
      }
      // Sign-in popup for guests. Asked once, on a flag like pingAsked
      // above, so it cannot re-fire on the 250ms tick; a requeue resets
      // the flag but sessionStorage still holds it to once per session.
      if (elapsed >= SIP_AFTER_SEC && !state.sipAsked){
        state.sipAsked = true;
        maybeSignInPop();
      }
    }, 250);
  }

  function requestPingPermission(){
    try {
      if (window.Notification && Notification.permission === 'default'){
        var r = Notification.requestPermission();
        if (r && r.catch) r.catch(function(){});
      }
    } catch(e){}
  }

  function pingMatchFound(name){
    // "Away" is not just a hidden tab. The common desktop case is this tab
    // still being the active one in its own window while the user works in
    // a different window or app — document.hidden is false there, so the
    // notification below never fired for them.
    var away = true;
    try { away = document.hidden || !document.hasFocus(); } catch(e){}
    // window.daAlert (notifications.js) loads /js/sfx.js on demand. This
    // page never shipped that script, so the SFX.success call this replaces
    // was a no-op for everyone who had not manually touched the topbar
    // speaker toggle — i.e. the match chime on the matchmaking page itself
    // was silent. Keep the old call as the fallback path.
    if (window.daAlert) window.daAlert(away ? 3 : 1);
    else { try { if (window.SFX){ if (SFX.success) SFX.success(); else if (SFX.notify) SFX.notify(); } } catch(e){} }
    try {
      if (away && window.Notification && Notification.permission === 'granted'){
        var n = new Notification('Opponent ready', {
          body: 'vs ' + (name || 'your opponent') + '. Jump back in to start.',
          icon: '/favicon.svg',
          tag: 'da-spar-match'
        });
        n.onclick = function(){ try { window.focus(); } catch(e){} try { n.close(); } catch(e){} };
      }
    } catch(e){}
  }

  // ── Queue logic ──────────────────────────────────────
  // matchmaking_queue/{uid}: {
  //   uid, format, status: 'waiting' | 'consent' | 'matched' | 'matched_ai' | 'cancelled',
  //   joinedAt, matchedWith, room,
  //   paradigm,                  // my judge-instructions note (≤240 chars)
  //   skipUids,                  // peers I declined / who declined me (mutual, per session)
  //   // status 'consent' adds (written by spar-pair, admin SDK):
  //   paradigms: {uid: note},    // both notes, per uid
  //   consents: {uid: bool},     // per-uid handshake; both true → matched
  //   proposedAt, lastPassBy, lastPassAt,
  //   // status 'matched' adds:
  //   pairedParadigm,            // name-attributed agreed notes → /live-round ballot
  // }
  // Pairing strategy: real-time onSnapshot listener on the queue +
  // 2s polling fallback + transaction. The listener triggers an
  // immediate match attempt the instant a peer joins the queue; the
  // poll covers any case where the snapshot stream stalls (network
  // blip, Firestore reconnect). Whichever client races the
  // transaction first wins; the loser sees its own doc updated by
  // the winner's transaction and follows the same room link.
  //
  // ──────────────── REQUIRED Firebase config ────────────────
  // 1. Firestore security rules on matchmaking_queue:
  //      match /matchmaking_queue/{uid} {
  //        allow read: if request.auth != null;
  //        allow create, update, delete: if request.auth != null
  //          && (request.auth.uid == uid
  //              || resource.data.matchedWith == request.auth.uid);
  //      }
  //    The matchedWith clause is what lets the WINNING client of a
  //    race transaction also update the LOSING peer's doc to mark it
  //    matched. Without it the transaction succeeds for self and
  //    fails for peer, leaving the loser stuck on "searching."
  //
  // 2. Composite index for the polling query (Firebase Console →
  //    Firestore → Indexes):
  //      collection: matchmaking_queue
  //      fields:     status ASC, joinedAt ASC
  //
  // Without (1) clients can't write/read the queue at all. Without
  // (2) the polling query can fail and
  // every spar request falls through to the AI fallback at 4 min.
  // ──────────────────────────────────────────────────────────
  function resolveIncomingFriendInvite(attempt){
    if (!state.incomingFriendInvite || state.friendInviteLookupDone || !firebaseDb){
      return Promise.resolve();
    }
    if (state.friendInviteLookupBusy) return Promise.resolve();
    state.friendInviteLookupBusy = true;
    return firebaseDb.collection('matchmaking_queue')
      .where('friendInviteToken', '==', state.incomingFriendInvite)
      .limit(3)
      .get()
      .then(function(snap){
        state.friendInviteLookupBusy = false;
        var host = null;
        snap.forEach(function(doc){
          if (host || doc.id === state.user.uid) return;
          var d = doc.data() || {};
          if (d.status !== 'waiting') return;
          if (window.daAgeBandsOk && !window.daAgeBandsOk(
                (window.daAgeBand && window.daAgeBand()) || '', d.ageBand)) return;
          host = doc;
        });
        if (host){
          state.friendInviteLookupDone = true;
          state.friendInvitePeerUid = host.id;
          paintFriendInviteStatus('Your friend is here', 'Opening the ready-check. Both of you still confirm before the room opens.');
          updateDiag({ last: 'friend invite' });
          try { gtag('event', 'spar_friend_invite_open', { format: formatParam, result: 'found' }); } catch(e){}
          attemptMatch(host.id, host.data());
          return;
        }
        // A link can beat the host's first Firestore write by a fraction of
        // a second. Retry briefly before calling it expired.
        if ((attempt || 0) < 3){
          return new Promise(function(resolve){ setTimeout(resolve, 650); })
            .then(function(){ return resolveIncomingFriendInvite((attempt || 0) + 1); });
        }
        state.friendInviteLookupDone = true;
        paintFriendInviteStatus('That invite is no longer open', 'Your friend may have matched already. We kept you in the live queue.');
        try { gtag('event', 'spar_friend_invite_open', { format: formatParam, result: 'expired' }); } catch(e){}
      })
      .catch(function(err){
        state.friendInviteLookupBusy = false;
        state.friendInviteLookupDone = true;
        console.warn('[spar] friend invite lookup failed', err);
        paintFriendInviteStatus('Could not reach that invite', 'Your normal live search is still active.');
        try { gtag('event', 'spar_friend_invite_open', { format: formatParam, result: 'error' }); } catch(e){}
      });
  }

  function joinQueue(){
    if (!firebaseDb) return;
    if (state.profileFlowOpen) return;
    // Guests queue too, until their free rounds are spent (see the guest
    // rounds block). Everyone else — no session at all, or a guest who is
    // out of rounds — gets the gate.
    if (!canQueue(state.user)){ renderGate(); return; }
    // First visit gets the player-build before the queue doc exists. A
    // returning visitor keeps the saved device profile and can change it
    // from the searching screen without losing their place.
    if (!state.profileReady || !matchProfile){
      startMatchProfileFlow({ onDone: joinQueue, onClose: renderProfileGate });
      return;
    }
    // Age band before the first queue join, asked once ever
    // (js/age-gate.js). The answer rides the queue doc below and
    // spar-pair enforces the minor-with-minor rule server-side.
    if (window.daAskAgeBand && !window.daAgeBand()){
      window.daAskAgeBand(function(){ joinQueue(); });
      return;
    }
    state.cancelled = false;
    state.joinedAtMs = Date.now();
    // A real search has started (the gate + age checks above passed and a
    // queue doc is about to be written), so this is the honest moment to
    // count "looked for a live round." Deduped per format per tab-session
    // inside logSparAttempt, so a requeue after a pass never double-counts.
    logSparAttempt();
    // Remember the chosen format for the background matcher —
    // js/notifications.js fmt() reads 'debateos-spar-format' and falls
    // back to 'apda' when it was never written.
    try { localStorage.setItem('debateos-spar-format', formatParam); } catch(e){}
    // 2026-06-12: searching doubles as sitewide availability. Flip the
    // same 'da-spar-bg' flag the topbar "Available" pill + background
    // matcher read, so leaving /spar mid-search keeps this user
    // matchable everywhere (notifications.js heartbeats the doc and
    // pops the match card on whatever page they're on). Cleared by
    // Cancel below; a match consumes the doc through the normal flow.
    try { localStorage.setItem('da-spar-bg', '1'); } catch(e){}
    var ref = firebaseDb.collection('matchmaking_queue').doc(state.user.uid);
    state.queueDocRef = ref;
    var shortName = shortNameOf(state.user);
    var publicUsername = window.DBIdentity
      ? window.DBIdentity.forUser(state.user).username
      : ('guest_' + String(state.user.uid || '').slice(-4).toLowerCase());
    var blockedUids = [];
    try {
      blockedUids = JSON.parse(localStorage.getItem('dit-blocked-users') || '[]');
      if (!Array.isArray(blockedUids)) blockedUids = [];
    } catch(e){ blockedUids = []; }
    ref.set({
      uid: state.user.uid,
      // Server matcher requires this marker on BOTH queue seats. Firestore
      // rules bind it to the caller's verified Google provider, so an old
      // anonymous or email queue record cannot be pulled into a new match.
      authProvider: 'google.com',
      displayName: shortName,
      username: publicUsername,
      photoURL: state.user.photoURL || '',
      avatarIdentity: currentPublicAvatarIdentity(),
      // Advisory only. spar-pair reads the server's own record of who is a
      // guest, never this field, precisely because this one is client-written.
      anonymous: !!state.user.isAnonymous,
      // Self-attested age band ('adult' | 'minor' | ''). spar-pair reads
      // this on both docs and refuses a minor/non-minor pair.
      ageBand: (window.daAgeBand && window.daAgeBand()) || '',
      format: formatParam,
      paradigm: state.paradigm || '',
      lang: state.lang || 'en',
      // Neutral matchmaking preference only. The political take answers
      // that informed the user's choice remain in localStorage and are
      // never written to Firestore.
      matchMode: matchProfile.mode || 'fast',
      blockedUids: blockedUids.slice(-100),
      // Opaque, per-page token used by /spar?invite=. It only resolves while
      // this doc is waiting; the first successful spar-pair transaction
      // consumes the seat by moving both docs out of waiting.
      friendInviteToken: state.friendInviteToken,
      // The friend-side half of the same handshake. A host whose queue
      // snapshot sees this exact claim ranks it ahead of public candidates.
      friendInviteClaim: state.incomingFriendInvite || '',
      status: 'waiting',
      // Motion draft opt-in. spar-pair only builds a draft when BOTH docs
      // carry this, which is what keeps the rollout per-surface: a client
      // that cannot render a draft board must never be handed one, or it
      // sits on a card it does not understand until the reaper sweeps it.
      // Follows the client switch, not a constant: with ?draft=0 the board is
      // off, and a server-built draft would then land on the plain consent
      // card, which can accept but has no way to call a motion or a side.
      // The pair would sit there until the reaper swept it.
      draftOptIn: DRAFT_ENABLED_CLIENT,
      joinedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(function(){
      try { gtag('event', 'spar_queue_join', { format: formatParam }); } catch(e){}
      // Going live: ping everyone who opted into live-round alerts (Web Push,
      // even from another app). Guests broadcast too; the server enforces the
      // cooldowns. The response carries how many people were pinged, which the
      // wait rail shows the waiter — knowing alerts just went out is the best
      // reason to keep waiting. Helper lives in js/notifications.js.
      state.broadcastPinged = 0;
      try { if (window.daBroadcastGoLive) window.daBroadcastGoLive(formatParam, 'spar', function(res){
        if (res && res.broadcast && res.recipients > 0){
          state.broadcastPinged = res.recipients;
          updatePingedLine();
          try { gtag('event', 'spar_golive_pinged', { recipients: res.recipients, format: formatParam }); } catch(e){}
        }
      }); } catch(e){}
      subscribeMyDoc();
      startQueueHeartbeat();
      // A friend link gets first shot at the seat. The ordinary queue starts
      // immediately after the lookup, and attemptMatch's in-flight guard
      // prevents it from racing the direct proposal in this tab.
      if (state.incomingFriendInvite){
        resolveIncomingFriendInvite(0).then(startMatchPolling, startMatchPolling);
      } else {
        startMatchPolling();
      }
    }).catch(function(err){
      console.warn('[spar] queue join failed:', err);
      // Pattern-match on the error so the user gets a real next step
      // instead of a raw Firebase error code or an internal diagnosis.
      var raw = (err && (err.message || err.code)) || 'unknown';
      var msg;
      if (/resource-exhausted|resource_exhausted|quota|429/i.test(raw)) {
        // Firestore is refusing ops — the live matching backend is at
        // capacity (e.g. a daily quota was hit). Don't leave the user on
        // an endless "searching"; tell them plainly and point at the AI
        // round, which doesn't touch the queue.
        msg = "Live matching is temporarily at capacity, so we can't reach the queue right now. Take an AI round instead, or check back in a bit.";
      } else if (/permission|denied|insufficient/i.test(raw)) {
        msg = "Couldn't join the live queue. Try again, or take an AI round instead.";
      } else if (/network|offline|unavailable|failed-precondition/i.test(raw)) {
        msg = "Network problem reaching the queue. Check your connection and try again.";
      } else {
        msg = "Couldn't join the queue: " + raw + ". Skip to AI or refresh.";
      }
      shell.innerHTML += '<div class="error">' + escHtml(msg) + ' <a href="/practice" style="color:inherit;text-decoration:underline">Skip to AI</a>.</div>';
    });
    renderSearching();
  }

  // Listen to my own queue doc — when ANOTHER user's transaction marks
  // me as matched, this fires and I navigate to the round.
  function subscribeMyDoc(){
    if (!state.queueDocRef) return;
    if (state.queueUnsub){ try { state.queueUnsub(); } catch(e){} }
    state.queueUnsub = state.queueDocRef.onSnapshot(function(doc){
      if (!doc.exists) return;
      var d = doc.data();
      // Mirror my mutual-skip list (declined consent proposals) so
      // tryMatch stops POSTing at peers the server will refuse anyway.
      // Stamps ride along so local checks expire in step with the
      // server's SKIP_TTL_MS; a bare legacy array reads as expired.
      state.skipUids = Array.isArray(d.skipUids) ? d.skipUids : [];
      state.skipAtLocal = {};
      if (d.skipAt){
        Object.keys(d.skipAt).forEach(function(u){
          var at = d.skipAt[u];
          var t = (at && typeof at.toMillis === 'function') ? at.toMillis()
                : (at && at.seconds != null) ? at.seconds * 1000 : 0;
          if (t) state.skipAtLocal[u] = t;
        });
      }
      // Ghost stamps ride the same local map but expire on their own,
      // shorter clock — see GHOST_SKIP_TTL_MS.
      state.ghostAtLocal = {};
      if (d.ghostAt){
        Object.keys(d.ghostAt).forEach(function(u){
          var gt = stampMs(d.ghostAt[u]);
          if (gt) state.ghostAtLocal[u] = gt;
        });
      }
      if (d.status === 'matched' && d.room && d.matchedWith){
        pingMatchFound(d.matchedWithName || '');
        teardownQueue();
        // The matched-state render is cosmetic; navigation into the
        // round is the load-bearing step. Never let a render error
        // (e.g. a future undefined ref) swallow the navigation and
        // strand a successfully-paired user on the search screen.
        try { renderMatched(d.room, d.matchedWithName || 'your opponent', d.matchedWithAvatar); }
        catch (e) { console.warn('[spar] renderMatched failed, navigating anyway', e); }
        navigateToRound(d, 900);
      } else if (d.status === 'consent' && d.matchedWith){
        pingMatchFound(d.matchedWithName || '');
        // Two-phase match: someone's judge-paradigm note needs eyes
        // before the round exists. spar-pair wrote the full proposal
        // onto both docs; render the accept/pass card off mine.
        try { renderConsentGate(d); }
        catch (e) {
          // Log only. Auto-passing here used to dissolve the pair with
          // a MUTUAL skip on a transient render bug, which silently
          // bricked rematching for the whole session. The peer's
          // timers (20s/30s) unwind a genuinely dead handshake anyway.
          console.warn('[spar] renderConsentGate failed', e);
        }
      } else if (d.status === 'waiting' && state.inConsent){
        // Proposal fell through (opponent passed, withdrew, or timed
        // out) — server already reverted my doc; back to the hunt.
        exitConsentToSearch(d);
      } else if (d.status === 'cancelled'){
        // Distinguish a system cancel from a user cancel. The pair
        // function's stale-peer skip and the reaper sweep both stamp a
        // cancelReason; if WE didn't hit Cancel and the cancel came
        // from one of those, re-join the queue instead of bouncing the
        // user off the page. Without this, a single false stale-skip
        // (e.g. an unresolved serverTimestamp on a fresh peer) ejected
        // a live, waiting debater straight to the homepage.
        var systemCancel = (d.cancelReason === 'stale_peer_skip'
                         || d.cancelReason === 'stale_reaper'
                         // My doc got ghost-cancelled by a consent
                         // proposer whose timers gave up on me — if
                         // I'm actually here (snapshot stream stall,
                         // OS sleep), rejoin with a clean doc.
                         || d.cancelReason === 'consent_ghost');
        if (systemCancel && !state.cancelled){
          // Zombie-tab guard: if nobody has touched this tab in hours,
          // the server calling us stale/ghost is CORRECT — park instead
          // of silently rejoining. The attention tracker rejoins on the
          // first real touch. Without this gate, an abandoned tab loops
          // ghost-cancel → auto-requeue forever and every new human in
          // the queue pays a dead 20s proposal to it.
          if (!humanIsAround()){
            state.zombieParked = true;
            updateDiag({ last: 'parked (away, ' + d.cancelReason + ')' });
            teardownQueue();
            return;
          }
          console.info('[spar] system cancel (' + d.cancelReason + '), re-queueing');
          updateDiag({ last: 're-queue' });
          teardownQueue();
          // Fresh doc on re-join → fresh serverTimestamp → no repeat skip.
          setTimeout(function(){ if (!state.cancelled) joinQueue(); }, 400);
          return;
        }
        teardownQueue();
        location.href = '/';
      }
    }, function(err){
      console.warn('[spar] subscribeMyDoc error', err);
    });
  }
  function shortNameOf(u){
    if (!u) return 'You';
    if (window.DBIdentity) return window.DBIdentity.forUser(u).name;
    if (u.isAnonymous) return guestName(u);
    var fullName = (u.displayName || '').trim();
    var parts = fullName.split(/\s+/).filter(Boolean);
    return parts.length >= 2
      ? parts[0] + ' ' + parts[parts.length - 1][0].toUpperCase() + '.'
      : (parts[0] || 'You');
  }

  function navigateToRound(d, delay){
    if (!d || !d.room || state.roundNavPending || state.cancelled) return;
    state.roundNavPending = true;
    // Build the live-round URL. We do not need to know which side this
    // browser got; the round-room infra reconciles from proUid/conUid.
    var params = new URLSearchParams({
      motion: d.pairedMotion || '',
      format: d.pairedFormat || formatParam,
      pro: d.proName || shortNameOf(state.user),
      con: d.conName || (d.matchedWithName || 'Opponent'),
      proUid: d.proUid || (state.user && state.user.uid) || '',
      conUid: d.conUid || d.matchedWith || '',
      room: d.room,
      paradigm: d.pairedParadigm || '',
      // My lens nomination. /live-round seeds it as this side's pick in
      // the judge draft; it binds only when the opponent picks the same.
      judge: state.judgeLens || 'chair',
      source: 'spar',
    });
    setTimeout(function(){ location.href = '/live-round.html?' + params.toString(); }, delay || 0);
  }

  // ── Consent gate ─────────────────────────────────────
  // A judge-paradigm note never reaches the round without both
  // debaters' eyes on it. When spar-pair lands a candidate pair where
  // either side filed one, both docs sit in status 'consent' and this
  // card renders. Accept POSTs phase 2; pass (or the auto-pass timer,
  // or a dead peer) unwinds both docs back to 'waiting' with a mutual
  // skip so the same pair isn't re-proposed.
  // 2026-08-26: 15 -> 45. Measured before the change: 208 queue sessions
  // over 12 days produced ZERO matches while proposals kept firing (17
  // consent ghosts, 27 stale-peer skips in the same window). A proposal
  // is a reflex ask, but only for someone already looking at this tab;
  // the queue deliberately follows people across the site, so the common
  // case is a chime in a background tab, a switch, a read, a click. That
  // does not fit in fifteen seconds. The cost is paid by the side that
  // already accepted, who now waits up to 75s before being freed, and
  // that side is told on screen that it loses nothing and is requeued
  // automatically. A match is far scarcer here than 45 seconds.
  var CONSENT_DECIDE_SEC = 45;   // reading + deciding window (auto-PASSES at 0)
  // Waiting-on-peer net. Tab close no longer deletes queue docs (the
  // queue follows users across the app), so proposing to a ghost is a
  // ROUTINE case: a live deciding peer always acts by ~20s (their own
  // auto-pass), so 30s of silence means dead tab — unwind and move on.
  // Server-side ghost detection (spar-pair GHOST_CONSENT_MS, 25s) sits
  // between the two windows.
  // Must stay ABOVE spar-pair's GHOST_CONSENT_MS (55s), which must stay
  // above CONSENT_DECIDE_SEC: a live deciding peer always answers by 45s,
  // so silence past 55s is a dead tab and this net is what reports it.
  var CONSENT_WAIT_SEC   = 75;
  var BASE_TITLE = document.title;

  // Stop the search machinery without dropping my own doc listener —
  // subscribeMyDoc is what drives every consent transition. The
  // AI-fallback countdown pauses too: a proposal on screen is not
  // "nobody showed up."
  function pauseSearchForConsent(){
    if (state.countdownInterval){ clearInterval(state.countdownInterval); state.countdownInterval = null; }
    if (state.matchPollInterval){ clearInterval(state.matchPollInterval); state.matchPollInterval = null; }
    if (state.queueWatchUnsub){ try { state.queueWatchUnsub(); } catch(e){} state.queueWatchUnsub = null; }
    state.pairInFlight = false;
  }

  function clearConsentTimer(){
    // The draft runs its own clock on the same screen. Every unwind path
    // (teardown, navigate, decline, ghost) already calls this one, so
    // hanging the draft timer off it is what stops a countdown firing into
    // a page that has already moved on.
    clearDraftTimer();
    if (state.consentTimer){ clearInterval(state.consentTimer); state.consentTimer = null; }
    clearWaitPhases();
  }

  // Captions for the waiting-on-them card, stepped against their real
  // decide window rather than invented. Everything here is something
  // we actually know: the proposal is on their screen, their window is
  // CONSENT_DECIDE_SEC wide, and past it we are into the ghost net.
  // The point is that the screen moves and stays honest while it does;
  // a still card for thirty seconds is the thing that reads as broken.
  var WAIT_PHASES = [
    { until: 5,  text: 'Card is on their screen' },
    { until: 18, text: 'Reading it' },
    { until: 32, text: 'Still their move' },
    { until: CONSENT_DECIDE_SEC, text: 'Their window is almost up' },
    { until: 1e9, text: 'No answer yet. Holding your place.' },
  ];

  function clearWaitPhases(){
    if (state.waitPhaseTimer){ clearInterval(state.waitPhaseTimer); state.waitPhaseTimer = null; }
  }

  function startWaitPhases(){
    clearWaitPhases();
    var t0 = Date.now();
    var last = '';
    function tick(){
      var el = document.getElementById('mfPhase');
      if (!el) return;
      var secs = (Date.now() - t0) / 1000;
      var text = '';
      for (var i = 0; i < WAIT_PHASES.length; i++){
        if (secs < WAIT_PHASES[i].until){ text = WAIT_PHASES[i].text; break; }
      }
      if (text === last) return;
      last = text;
      el.textContent = text;
      // Re-trigger the entrance so a swapped line reads as a change
      // rather than as text that was always there.
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    }
    tick();
    state.waitPhaseTimer = setInterval(tick, 500);
  }

  // secs → timeout. pass showNum=false for the silent safety net on the
  // waiting-on-peer view (a visible timer there reads as pressure on YOU
  // when the wait is on THEM). Timer-fired actions carry auto:true so the
  // server can tell idle-timeout from a human click.
  //
  // autoAccept: RETIRED 2026-08-10. Every call site now passes false.
  //
  // The 2026-06-15 tuning auto-JOINED at 0 on the deciding card when the
  // tab was visible, reasoning that a present user who doesn't click
  // shouldn't lose a rare match. Its own comment named the risk exactly
  // right ("accepting there would strand the opponent alone") and then
  // trusted visibilityState to rule it out. It doesn't: a foregrounded
  // tab nobody is sitting at is 'visible', so for 15 seconds an empty
  // chair could accept a match.
  //
  // That is the measured failure. Of 411 live rounds only ~85 ever had
  // both people present, and 390 never completed one speech. Trading a
  // few extra matches for rooms that open onto nobody is a bad trade:
  // the person who DID show up waits alone and leaves, and they are the
  // one we can least afford to lose. A timeout now always auto-PASSES,
  // which routes into the existing ghost path (server cancels the silent
  // side, requeues the live one with a clean doc).
  //
  // The parameter is kept rather than deleted so the deliberate choice
  // stays visible at every call site instead of vanishing into history.
  function startConsentCountdown(peerUid, secs, showNum, autoAccept){
    clearConsentTimer();
    var deadline = Date.now() + secs * 1000;
    state.consentTimer = setInterval(function(){
      var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      if (showNum){
        var el = document.getElementById('consentCountNum');
        if (el) el.textContent = String(left);
        // Last five seconds get louder rather than newer: same red, more
        // of it. Cheap enough to set every tick; the class is idempotent.
        var card = document.getElementById('consentCard');
        if (card && left <= 5) card.classList.add('is-urgent');
      }
      if (left <= 0){
        clearConsentTimer();
        // autoAccept is false at every call site (see above). A silent
        // timeout is not a person; it unwinds.
        sendConsent(peerUid, !!autoAccept, true);
      }
    }, 250);
  }

  // Short two-note "match found" ping. WebAudio so we ship no asset; the
  // context resumes off the click that put the user in the queue, so it's
  // allowed to sound. Wrapped in try/catch — audio is a nicety, never a
  // blocker for the consent card rendering.
  function sparChime(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!state.audioCtx) state.audioCtx = new AC();
      var ctx = state.audioCtx;
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} }
      var t0 = ctx.currentTime;
      [880, 1318.5].forEach(function(f, i){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        var t = t0 + i * 0.15;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.26);
      });
    } catch(e){}
  }

  // ── MOTION DRAFT ────────────────────────────────────────────────
  // The pre-round veto. Five motions land, both debaters strike two with
  // the other side's picks hidden, the strikes reveal together, and a coin
  // flip splits the two remaining powers: one debater calls the motion
  // (when more than one survived), the other calls their side.
  //
  // The server owns every decision (lib/motion-draft.mjs, applied inside
  // spar-pair's consent transaction). This file renders what the doc says
  // and posts intent. It never computes a phase, a survivor set that
  // matters, or a side, because a client that could decide its own side
  // would decide to win.
  //
  // Blind is enforced on the SERVER, not here: until both sides commit,
  // each queue doc carries only its own owner's strikes, so there is
  // nothing in this browser to peek at. Do not "helpfully" mirror them.
  // Client kill switch, independent of the server's SPAR_DRAFT_ENABLED. ?draft=0
  // turns the board off for one visit, which is how it gets debugged against
  // the plain consent card without a deploy.
  var DRAFT_ENABLED_CLIENT = (new URLSearchParams(location.search)).get('draft') !== '0';
  var DRAFT_STRIKE_SEC = 14;   // must match STRIKE_SEC in lib/motion-draft.mjs
  var DRAFT_PICK_SEC = 9;      // must match PICK_SEC
  var DRAFT_STRIKES = 2;       // must match STRIKES_PER_SIDE
  var DRAFT_REVEAL_MS = 2300;  // reveal beat before the pick UI takes over

  function draftStruckBy(dr){
    // id -> array of uids who struck it. Only meaningful once both sides
    // are in; before that a doc holds one owner's strikes and nothing else.
    var out = {};
    var st = (dr && dr.strikes) || {};
    Object.keys(st).forEach(function(u){
      (st[u] || []).forEach(function(id){ (out[id] = out[id] || []).push(u); });
    });
    return out;
  }
  function draftSurvivors(dr){
    var struck = draftStruckBy(dr);
    return ((dr && dr.slate) || []).filter(function(m){ return !struck[m.id]; });
  }
  function draftMyStrikes(dr, uid){
    var st = (dr && dr.strikes) || {};
    return st[uid] || [];
  }
  function draftMotionText(dr){
    var hit = ((dr && dr.slate) || []).filter(function(m){ return m.id === dr.motionId; })[0];
    return hit ? hit.text : '';
  }

  function clearDraftTimer(){
    if (state.draftTimer){ clearInterval(state.draftTimer); state.draftTimer = null; }
    if (state.draftRevealTimer){ clearTimeout(state.draftRevealTimer); state.draftRevealTimer = null; }
  }

  // One countdown driver for every beat. `onZero` is what the clock is FOR,
  // so it always fires: the strike beat auto-submits whatever is selected
  // (the server fills the rest), and a pick beat asks the server to expire.
  function startDraftClock(secs, onZero){
    clearDraftTimer();
    var left = secs;
    var bar = document.getElementById('draftClock');
    if (bar) bar.style.setProperty('--draft-dur', secs + 's');
    var num = document.getElementById('draftSecs');
    if (num) num.textContent = left;
    state.draftTimer = setInterval(function(){
      left--;
      if (num) num.textContent = Math.max(0, left);
      if (bar && left <= 3) bar.classList.add('hot');
      if (left <= 0){
        clearDraftTimer();
        try { onZero(); } catch(e){ console.warn('[spar] draft clock handler failed', e); }
      }
    }, 1000);
  }

  function draftFaceHtml(identity, uid, name){
    var inner = (identity && window.DBAvatar && DBAvatar.publicSvg)
      ? DBAvatar.publicSvg(identity, '100%', { uid: uid, name: name })
      : escHtml(initialsFor(name));
    return '<span class="draft-vs-face">' + inner + '</span>';
  }

  // The two faces across the top, carrying state rather than decoration:
  // who has locked their strikes, and whose clock is running right now.
  // `mine`/`theirs` are 'ready' | 'acting' | ''.
  function draftVsHtml(d, mineState, theirsState, mineLabel, theirsLabel){
    var me = state.user || {};
    var peerName = d.matchedWithName || 'Opponent';
    return '<div class="draft-vs">' +
        '<div class="draft-vs-side ' + mineState + '">' +
          draftFaceHtml(currentPublicAvatarIdentity(), me.uid || '', me.displayName || 'You') +
          '<span class="draft-vs-name">You' +
            '<span class="draft-vs-state">' + escHtml(mineLabel || '') + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="draft-vs-mid">VS</div>' +
        '<div class="draft-vs-side ' + theirsState + '">' +
          draftFaceHtml(d.matchedWithAvatar, d.matchedWith || '', peerName) +
          '<span class="draft-vs-name">' + escHtml(peerName) +
            '<span class="draft-vs-state">' + escHtml(theirsLabel || '') + '</span>' +
          '</span>' +
        '</div>' +
      '</div>';
  }

  function draftClockHtml(){
    return '<div class="draft-clock" id="draftClock"><i></i></div>';
  }

  function draftHeadHtml(step, title, sub){
    return '<div class="draft-head">' +
        '<div class="draft-step">' + step + '</div>' +
        '<h1 class="draft-title">' + title + '</h1>' +
        (sub ? '<p class="draft-sub">' + sub + '</p>' : '') +
      '</div>';
  }

  // ── entry point ─────────────────────────────────────────────────
  // Called from renderConsentGate when the proposal carries a draft.
  function renderDraft(d){
    var dr = d.draft;
    var me = state.user.uid;
    var peerUid = d.matchedWith;
    var consents = d.consents || {};
    var phase = String(dr.phase || 'strike');
    var iStruck = draftMyStrikes(dr, me).length >= DRAFT_STRIKES;
    var theyStruck = !!consents[peerUid];

    // Snapshot streams echo every write. Re-render only when the draft
    // actually moved, or the countdown restarts on every mirrored write and
    // the strike beat becomes unplayable.
    var key = [peerUid, phase, iStruck ? 1 : 0, theyStruck ? 1 : 0,
               dr.motionId || '', dr.side || ''].join('|');
    if (state.inConsent && state.draftKey === key) return;
    var firstRender = !state.inConsent;
    state.inConsent = true;
    state.draftKey = key;
    state.consentKey = '';
    state.lastConsentDoc = d;
    state.consentPending = 0;
    if (firstRender){
      state.draftPicks = [];
      state.draftRevealed = false;
      state.draftSubmitting = false;
      document.body.classList.add('draft-live');
      pauseSearchForConsent();
      closeSignInPop();
      removeWaitRail();
      sparChime();
      try { gtag('event', 'spar_draft_open', { format: d.pairedFormat || formatParam }); } catch(e){}
    }
    document.title = '● Draft · Spar';

    if (phase === 'strike'){
      if (iStruck) return renderDraftHold(d);
      return renderDraftStrike(d);
    }
    // Strikes are in, so the handshake's own auto-pass net has done its job
    // and must stop. It fires a DECLINE at CONSENT_DECIDE_SEC, and the hold
    // beat below arms it: a peer who strikes at 40s lands us in the reveal
    // with that timer still running, and it would unwind a pair that both
    // people just committed to. Cleared here, before any draft clock starts,
    // because clearConsentTimer also clears the draft clock.
    clearConsentTimer();

    // The doc now carries both sides. Play the reveal once, then hand over
    // to whichever pick beat is live.
    if (!state.draftRevealed){
      state.draftRevealed = true;
      return renderDraftReveal(d);
    }
    if (phase === 'motion') return renderDraftMotionPick(d);
    if (phase === 'side') return renderDraftSidePick(d);
    // 'done' arrives as a status flip to 'matched'; subscribeMyDoc navigates.
    return renderDraftHold(d);
  }

  // ── beat 1: strike ──────────────────────────────────────────────
  function renderDraftStrike(d){
    var dr = d.draft;
    var fmtLabel = escHtml(FORMAT_LABELS[d.pairedFormat] || String(d.pairedFormat || '').toUpperCase());
    var cards = (dr.slate || []).map(function(m, i){
      return '<button type="button" class="draft-card" data-draft-strike="' + escHtml(m.id) + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
        '</button>';
    }).join('');

    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftClockHtml() +
        draftVsHtml(d, 'acting', '', 'striking', 'striking') +
        draftHeadHtml(
          'Step 1 of 2 &middot; <b>' + fmtLabel + '</b>',
          'Strike <em>two</em> motions.',
          'They are striking two as well, and they cannot see yours. Whatever survives is what you argue. ' +
          '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_STRIKE_SEC + '</span>s left.</span>'
        ) +
        '<div class="draft-slate">' + cards + '</div>' +
        '<p class="draft-note" id="draftHint">Pick the two you least want to argue.</p>' +
      '</div>';

    var hint = document.getElementById('draftHint');
    shell.querySelectorAll('[data-draft-strike]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-draft-strike');
        var at = state.draftPicks.indexOf(id);
        if (at >= 0){
          // Un-strike. Nothing is committed until the POST, so taking one
          // back has to be free; a mis-tap that costs a motion is the worst
          // thing this screen can do.
          state.draftPicks.splice(at, 1);
          btn.classList.remove('struck');
        } else {
          if (state.draftPicks.length >= DRAFT_STRIKES) return;
          state.draftPicks.push(id);
          btn.classList.add('struck');
        }
        var left = DRAFT_STRIKES - state.draftPicks.length;
        if (hint){
          hint.textContent = left > 0
            ? (left === 1 ? 'One more strike.' : 'Pick the two you least want to argue.')
            : 'Locking them in.';
        }
        if (state.draftPicks.length >= DRAFT_STRIKES) submitDraftStrikes(d, false);
      });
    });

    // The clock's job. An empty or short set is filled server-side from the
    // shared seed, so a timeout costs the choice, never the round.
    startDraftClock(DRAFT_STRIKE_SEC, function(){ submitDraftStrikes(d, true); });
  }

  function submitDraftStrikes(d, auto){
    if (state.draftSubmitting) return;
    state.draftSubmitting = true;
    clearDraftTimer();
    if (DEMO){ state.draftSubmitting = false; window.__draftDemoAdvance(state.draftPicks.slice()); return; }
    shell.querySelectorAll('[data-draft-strike]').forEach(function(b){ b.disabled = true; });
    var hint = document.getElementById('draftHint');
    if (hint) hint.textContent = auto ? 'Time. Filling the rest.' : 'Locked in. Waiting on them.';
    try { gtag('event', 'spar_draft_strike', { auto: !!auto, count: state.draftPicks.length }); } catch(e){}
    sendConsent(d.matchedWith, true, false, state.draftPicks.slice());
  }

  // ── holding: my half is in, theirs is not ───────────────────────
  function renderDraftHold(d){
    var dr = d.draft;
    var me = state.user.uid;
    var mine = draftMyStrikes(dr, me);
    var struckMine = {};
    mine.forEach(function(id){ struckMine[id] = 1; });
    var cards = (dr.slate || []).map(function(m, i){
      return '<div class="draft-card' + (struckMine[m.id] ? ' struck' : '') + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
        '</div>';
    }).join('');
    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftVsHtml(d, 'ready', 'acting', 'locked in', 'striking') +
        draftHeadHtml(
          'Step 1 of 2',
          'Your strikes are <em>in</em>.',
          escHtml(d.matchedWithName || 'They') + ' still has two to spend. Both sets reveal together.'
        ) +
        '<div class="draft-slate">' + cards + '</div>' +
      '</div>';
    // No local clock here on purpose. A peer who never strikes is a peer who
    // never proved they are at the keyboard, and unwinding that pair is the
    // consent gate's existing ghost job (startConsentCountdown), not a
    // second timer racing it from this screen.
    if (!DEMO) startConsentCountdown(d.matchedWith, CONSENT_DECIDE_SEC, false, false);
  }

  // ── beat 2: the reveal ──────────────────────────────────────────
  function renderDraftReveal(d){
    var dr = d.draft;
    var me = state.user.uid;
    var peerUid = d.matchedWith;
    var peerName = d.matchedWithName || 'Them';
    var by = draftStruckBy(dr);
    var survivors = draftSurvivors(dr);

    var cards = (dr.slate || []).map(function(m, i){
      var who = by[m.id] || [];
      var mineHit = who.indexOf(me) >= 0;
      var theirsHit = who.indexOf(peerUid) >= 0;
      var cls = 'draft-card';
      var label = '';
      if (mineHit && theirsHit){ cls += ' struck struck-both'; label = 'both struck'; }
      else if (mineHit){ cls += ' struck'; label = 'you struck'; }
      else if (theirsHit){ cls += ' struck struck-them'; label = peerName + ' struck'; }
      else { cls += ' alive'; label = 'survives'; }
      return '<div class="' + cls + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
          '<span class="draft-by">' + escHtml(label) + '</span>' +
        '</div>';
    }).join('');

    // Overlap is the common case (roughly seven drafts in ten), so the
    // headline has to read right for one survivor AND for three.
    var line = survivors.length === 1
      ? 'One motion <em>left standing</em>.'
      : survivors.length + ' motions <em>survived</em>.';

    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftVsHtml(d, 'ready', 'ready', 'struck', 'struck') +
        draftHeadHtml('The reveal', line,
          survivors.length === 1
            ? 'Your strikes and theirs did not overlap, so the round is already decided.'
            : 'You struck the same motion, so more than one is still live.') +
        '<div class="draft-slate">' + cards + '</div>' +
      '</div>';

    // Hold the reveal long enough to read, then let the doc's phase drive
    // the next beat. Re-render through renderDraft rather than jumping
    // straight to a pick: the phase may have moved while this played.
    state.draftRevealTimer = setTimeout(function(){
      state.draftRevealTimer = null;
      if (!state.inConsent || !state.lastConsentDoc) return;
      state.draftKey = '';
      try { renderDraft(state.lastConsentDoc); } catch(e){ console.warn('[spar] draft reveal handoff failed', e); }
    }, DRAFT_REVEAL_MS);
  }

  // ── the coin, shown once before whichever pick this debater holds ──
  function draftCoinHtml(iCall, what){
    return '<div class="draft-coin-wrap">' +
        '<div class="draft-coin">' +
          '<span class="cf">' + (iCall ? 'you<br>call' : 'they<br>call') + '</span>' +
          '<span class="cb">' + escHtml(what) + '</span>' +
        '</div>' +
      '</div>';
  }

  // ── beat 3: the motion call ─────────────────────────────────────
  function renderDraftMotionPick(d){
    var dr = d.draft;
    var me = state.user.uid;
    var iCall = String(dr.motionUid) === String(me);
    var survivors = draftSurvivors(dr);
    var peerName = d.matchedWithName || 'They';

    if (!iCall){
      shell.innerHTML =
        '<div class="draft-wrap">' +
          draftClockHtml() +
          draftVsHtml(d, 'ready', 'acting', 'side: yours', 'picking motion') +
          draftHeadHtml('The coin', escHtml(peerName) + ' calls the <em>motion</em>.',
            'The flip gave them the last word on what you argue, so it gave you the last word on which side you take. ' +
            '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_PICK_SEC + '</span>s.</span>') +
          '<div class="draft-slate">' +
            survivors.map(function(m, i){
              return '<div class="draft-card alive" style="--i:' + i + '">' +
                  '<span class="draft-num">' + (i + 1) + '</span>' +
                  '<span class="draft-text">' + escHtml(m.text) + '</span>' +
                '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      // Either side may expire a pick beat: both people already proved they
      // are here by striking, so a slow click must not cost the round. The
      // server checks its own clock, so an early POST is simply refused.
      startDraftClock(DRAFT_PICK_SEC + 2, function(){ sendDraftExpire(d.matchedWith); });
      return;
    }

    var cards = survivors.map(function(m, i){
      return '<button type="button" class="draft-card" data-draft-motion="' + escHtml(m.id) + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
        '</button>';
    }).join('');

    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftClockHtml() +
        draftCoinHtml(true, 'the motion') +
        draftHeadHtml('Step 2 of 2', 'You call the <em>motion</em>.',
          'They get the last word on their side in return. ' +
          '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_PICK_SEC + '</span>s.</span>') +
        '<div class="draft-slate">' + cards + '</div>' +
      '</div>';

    shell.querySelectorAll('[data-draft-motion]').forEach(function(btn){
      btn.addEventListener('click', function(){
        shell.querySelectorAll('[data-draft-motion]').forEach(function(b){ b.disabled = true; });
        btn.classList.add('locked');
        clearDraftTimer();
        try { gtag('event', 'spar_draft_motion_pick', {}); } catch(e){}
        sendDraftPick(d.matchedWith, 'motion', btn.getAttribute('data-draft-motion'));
      });
    });
    startDraftClock(DRAFT_PICK_SEC, function(){ sendDraftExpire(d.matchedWith); });
  }

  // ── beat 4: the side call ───────────────────────────────────────
  function renderDraftSidePick(d){
    var dr = d.draft;
    var me = state.user.uid;
    var iCall = String(dr.sideUid) === String(me);
    var motion = draftMotionText(dr);
    var peerName = d.matchedWithName || 'They';
    var lockedByStrikes = !dr.autoMotion && draftSurvivors(dr).length === 1;

    var motionBlock =
      '<div class="draft-final">' +
        '<p class="draft-final-motion">' + escHtml(motion) + '</p>' +
        '<div class="draft-final-sides">' +
          '<span class="draft-badge">the motion</span>' +
        '</div>' +
      '</div>';

    if (!iCall){
      shell.innerHTML =
        '<div class="draft-wrap">' +
          draftClockHtml() +
          draftVsHtml(d, 'ready', 'acting', 'motion: yours', 'picking side') +
          draftHeadHtml('Locked', 'This is the <em>motion</em>.',
            escHtml(peerName) + ' is choosing which side to take. ' +
            '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_PICK_SEC + '</span>s.</span>') +
          motionBlock +
        '</div>';
      startDraftClock(DRAFT_PICK_SEC + 2, function(){ sendDraftExpire(d.matchedWith); });
      return;
    }

    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftClockHtml() +
        draftCoinHtml(true, 'your side') +
        draftHeadHtml(
          lockedByStrikes ? 'The strikes decided it' : 'Step 2 of 2',
          'Pick your <em>side</em>.',
          'This is the motion you are arguing. ' +
          '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_PICK_SEC + '</span>s.</span>'
        ) +
        motionBlock +
        '<div class="draft-sides">' +
          '<button type="button" class="draft-side-btn" data-draft-side="pro">' +
            '<span class="draft-side-name">Pro</span>' +
            '<span class="draft-side-sub">You argue for it. You speak first.</span>' +
          '</button>' +
          '<button type="button" class="draft-side-btn" data-draft-side="con">' +
            '<span class="draft-side-name">Con</span>' +
            '<span class="draft-side-sub">You argue against it. You answer them.</span>' +
          '</button>' +
        '</div>' +
      '</div>';

    shell.querySelectorAll('[data-draft-side]').forEach(function(btn){
      btn.addEventListener('click', function(){
        shell.querySelectorAll('[data-draft-side]').forEach(function(b){ b.disabled = true; });
        clearDraftTimer();
        try { gtag('event', 'spar_draft_side_pick', { side: btn.getAttribute('data-draft-side') }); } catch(e){}
        sendDraftPick(d.matchedWith, 'side', btn.getAttribute('data-draft-side'));
      });
    });
    startDraftClock(DRAFT_PICK_SEC, function(){ sendDraftExpire(d.matchedWith); });
  }

  // ── posts ───────────────────────────────────────────────────────
  function draftPost(payload, label){
    if (!firebaseAuth || !firebaseAuth.currentUser) return Promise.resolve({});
    return firebaseAuth.currentUser.getIdToken().then(function(idToken){
      return fetch('/.netlify/functions/spar-pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
        body: JSON.stringify(payload),
      });
    }).then(function(res){
      return res.json().catch(function(){ return {}; });
    }).catch(function(err){
      console.warn('[spar] draft ' + label + ' POST failed', err);
      return {};
    });
  }

  function sendDraftPick(peerUid, pick, value){
    if (DEMO){ window.__draftDemoPick(pick, value); return; }
    draftPost({ action: 'draft', peerUid: peerUid, pick: pick, value: value }, pick).then(function(j){
      if (j && j.ok) return;
      // The doc stream drives every transition, so a soft failure only needs
      // to give the buttons back. 'too_early' cannot happen on a real pick,
      // and 'wrong_phase' means the doc already moved past this beat.
      var reason = (j && (j.reason || j.error)) || 'unknown';
      if (reason === 'wrong_phase' || reason === 'consent_state_gone') return;
      console.warn('[spar] draft pick refused:', reason);
      recoverDraftCard();
    });
  }

  // Either side asks the server to resolve an expired pick beat. The server
  // verifies its OWN phase clock, so this can be fired optimistically and a
  // refusal costs one retry rather than a stalled round.
  function sendDraftExpire(peerUid){
    if (DEMO){ return; }
    draftPost({ action: 'draft', peerUid: peerUid, expire: true }, 'expire').then(function(j){
      if (j && j.ok) return;
      if (j && j.reason === 'too_early'){
        // Our clock ran ahead of the server's. Try once more just past the
        // grace window rather than leaving the beat hanging.
        state.draftRevealTimer = setTimeout(function(){ sendDraftExpire(peerUid); }, 1800);
      }
    });
  }

  function recoverDraftCard(){
    if (!state.inConsent || !state.lastConsentDoc || !state.lastConsentDoc.draft) return;
    state.draftKey = '';
    state.draftSubmitting = false;
    try { renderDraft(state.lastConsentDoc); } catch(e){}
  }

  function renderConsentGate(d){
    // A drafting pair gets the draft board instead of the accept card. The
    // draft subsumes the ready check: striking is an act, so it proves the
    // same presence a Ready button was standing in for.
    if (DRAFT_ENABLED_CLIENT && d && d.draft && d.draft.slate && d.draft.slate.length){
      return renderDraft(d);
    }
    closeSignInPop();
    removeWaitRail();
    var me = state.user.uid;
    var peerUid = d.matchedWith;
    var paradigms = d.paradigms || {};
    var consents = d.consents || {};
    var myConsent = !!consents[me];
    var peerConsent = !!consents[peerUid];
    // Snapshot streams echo every write; only re-render (and reset the
    // countdown) when the consent state actually moved.
    var key = peerUid + '|' + (myConsent ? 1 : 0) + '|' + (peerConsent ? 1 : 0);
    if (state.inConsent && state.consentKey === key) return;
    var firstRender = !state.inConsent;
    state.inConsent = true;
    state.consentKey = key;
    // Keep the latest doc around so a failed consent POST can restore
    // a usable card instead of leaving dead disabled buttons.
    state.lastConsentDoc = d;
    state.consentPending = 0;
    if (firstRender) pauseSearchForConsent();

    var peerName = escHtml(d.matchedWithName || 'Your opponent');
    var peerAvatar = avatarMarkup(d.matchedWithAvatar, 'match-avatar', d.matchedWith || '', d.matchedWithName || 'Your opponent', '');
    var fmtLabel = escHtml(FORMAT_LABELS[d.pairedFormat] || String(d.pairedFormat || 'this').toUpperCase());
    var theirNote = cleanParadigm(paradigms[peerUid]);
    var myNote = cleanParadigm(paradigms[me]);
    // Cross-format proposal: the two sides proposed different styles.
    // Build a "your proposal X · their proposal Y · play Z" block so
    // nobody is dropped into a format they didn't pick without saying
    // yes first.
    var crossFmt = !!d.crossFormat;
    var labelFor = function(f){ return escHtml(FORMAT_LABELS[f] || String(f || '').toUpperCase()); };
    var formatBlock = '';
    if (crossFmt){
      formatBlock =
        '<div class="consent-format">' +
          '<div class="consent-format-row"><span class="consent-format-who">Your proposal</span><strong>' + labelFor(d.myFormatPref) + '</strong></div>' +
          '<div class="consent-format-row"><span class="consent-format-who">' + peerName + ' proposes</span><strong>' + labelFor(d.peerFormat) + '</strong></div>' +
          '<div class="consent-format-row play"><span class="consent-format-who">Proposed round</span><strong>' + fmtLabel + '</strong></div>' +
        '</div>';
    }

    if (myConsent){
      // My half of the handshake is in. The wait is on them.
      //
      // This used to be the flattest screen on the site: a face, a
      // sentence, and Withdraw, held still for up to thirty seconds
      // with no clock and no statement of what happens at the end of
      // it. A still screen with one button is a screen that gets that
      // button pressed, and pressing it dissolves a real pair, which
      // is the scarcest thing this page produces.
      //
      // So it becomes the staredown instead: the same faceoff as the
      // match card with the roles inverted (they are the live side, I
      // am settled), their decide window drawn as a ring emptying
      // around their face, a caption stepping through what is actually
      // happening, and the guarantee spelled out underneath. Nothing
      // here is invented; every element is read off the doc or off
      // their real window.
      shell.innerHTML =
        '<div class="consent-wrap mf mf-wait" id="consentCard">' +
          '<div class="eyebrow"><span class="pip"></span>Awaiting opponent</div>' +
          faceoffMarkup(d.matchedWithAvatar, d.matchedWith, peerName, { window: true, phase: true }) +
          '<h1>Waiting on <em>' + peerName + '</em>' + nameDot(peerName) + '</h1>' +
          '<p class="lede">' + (crossFmt
            ? 'You\'re in. They\'re confirming the <strong>' + fmtLabel + '</strong> round, and it starts the second they do.'
            : (myNote
              ? 'You\'re in. They\'re reading your judge instructions, and the round starts the second they accept.'
              : 'You\'re in. The round starts the second they confirm they\'re at their desk.')) + '</p>' +
          (crossFmt ? formatBlock : '') +
          (myNote ? '<div class="consent-note mine"><div class="consent-note-label">Your instructions to the judge</div>' + escHtml(myNote) + '</div>' : '') +
          // The line that makes Withdraw a choice instead of a reflex.
          '<div class="mf-hold">If they have walked away, <strong>you lose nothing.</strong> ' +
            'We put you back at the front of the queue on our own and start looking again, so there is no wait you have to sit out.</div>' +
          // 2026-08-23, the founder: "find a way to pm a match." Until
          // now the only thing you could do to a person who had gone
          // quiet was dissolve the pair. A DM is the smaller move and
          // the one that keeps the match: they may be finding a quiet
          // room or reading the card, and "you there?" costs nothing.
          // It also survives the pairing — if this one unwinds, the
          // thread is still there to arrange a round later, which is
          // the whole point of a queue that is thin at this hour.
          //
          // Second action, never first: Withdraw is what the card is
          // for, and a chat button that outranked it would turn a
          // ready-check into a lobby.
          '<div class="btn-row">' +
            '<button class="btn ghost" id="consentDmBtn">Message ' + peerName + '</button>' +
            '<button class="btn ghost" id="consentPassBtn">Withdraw &amp; keep searching</button>' +
          '</div>' +
        '</div>';
      var wb = document.getElementById('consentPassBtn');
      if (wb) wb.addEventListener('click', function(){
        clearConsentTimer();
        sendConsent(peerUid, false);
      });
      var dmb = document.getElementById('consentDmBtn');
      if (dmb) dmb.addEventListener('click', function(){
        // The wait keeps running underneath: the thread modal is an
        // overlay, the consent listener and its safety net are
        // untouched, and an accept still redirects both of us into the
        // room mid-conversation.
        try { gtag('event', 'spar_consent_dm', { surface: 'waiting' }); } catch(e){}
        openDMThread(peerUid, d.matchedWithName || 'Your opponent', d.matchedWithPhoto || '');
      });
      // Silent safety net: if their tab died mid-read, unwind instead
      // of waiting forever. Stays auto-PASS (autoAccept=false) — I've
      // already accepted; this net only exists to free me from a ghost.
      startConsentCountdown(peerUid, CONSENT_WAIT_SEC, false, false);
      // AFTER the countdown, never before: startConsentCountdown opens
      // with clearConsentTimer(), which sweeps the phase interval too.
      // Starting the phases first would have them cleared a line later.
      startWaitPhases();
      return;
    }

    var noteBlocks = '';
    if (theirNote){
      noteBlocks += '<div class="consent-note"><div class="consent-note-label">' + peerName + '\'s instructions to the judge</div>' + escHtml(theirNote) + '</div>';
    }
    if (myNote){
      noteBlocks += '<div class="consent-note mine"><div class="consent-note-label">Yours · they\'re accepting this too</div>' + escHtml(myNote) + '</div>';
    }
    // Lede depends on what they're being asked to OK: a format switch, a
    // judge note, or both. Format gets named first since it changes the
    // whole round; the note rides on top of the standard ballot method.
    // Pure ready-check: nothing to review, so the only question is
    // whether a human is here. Different card on purpose. "Accept &
    // start" invites reading and weighing; this one wants a reflex, and
    // the count is framed as the match expiring rather than as a
    // deadline to decide by, because there is nothing to decide.
    //
    // peerConsent splits it in two. Both sides start at false, so for
    // the first seconds neither of us has answered and the honest line
    // is the empty-room warning. The moment they accept, the doc says
    // so and this card should stop being a symmetric ready-check: a
    // person is now standing in a room waiting on one click of mine.
    // That fact was already in the snapshot and the card threw it away,
    // showing the same screen either way. It is the most persuasive
    // true thing available here, so it leads.
    if (d.readyCheck && !theirNote && !myNote && !crossFmt){
      shell.innerHTML =
        '<div class="consent-wrap mf" id="consentCard">' +
          '<span class="mf-burst" aria-hidden="true"></span>' +
          '<div class="eyebrow"><span class="pip"></span>Match found</div>' +
          faceoffMarkup(d.matchedWithAvatar, d.matchedWith, peerName, { locked: peerConsent }) +
          (peerConsent ? lockedBadge(peerName) : '') +
          '<h1>' + (peerConsent
            ? '<em>' + peerName + '</em> is waiting on you.'
            : '<em>' + peerName + '</em> is ready.') + '</h1>' +
          '<p class="lede">' + (peerConsent
            ? 'They said yes and the room is open. One click puts you in the <strong>' + fmtLabel + '</strong> round. Leave it and they sit in an empty room, then go back to the queue.'
            : 'Confirm you\'re here and the <strong>' + fmtLabel + '</strong> round starts. If you don\'t, they go back in the queue instead of waiting in an empty room.') + '</p>' +
          '<div class="btn-row">' +
            '<button class="btn primary mf-go" id="consentAcceptBtn" style="--mf-dur:' + CONSENT_DECIDE_SEC + 's">' +
              (peerConsent ? 'Join them, start the round' : 'I\'m here, start the round') +
              '<span class="mf-drain" aria-hidden="true"></span>' +
            '</button>' +
            '<button class="btn ghost" id="consentDeclineBtn">Not now</button>' +
          '</div>' +
          '<div class="countdown">Match expires in <strong id="consentCountNum">' + CONSENT_DECIDE_SEC + '</strong>s</div>' +
        '</div>';
      document.getElementById('consentAcceptBtn').addEventListener('click', function(){
        this.disabled = true;
        this.textContent = 'Starting…';
        var dec = document.getElementById('consentDeclineBtn');
        if (dec) dec.disabled = true;
        clearConsentTimer();
        sendConsent(peerUid, true);
      });
      document.getElementById('consentDeclineBtn').addEventListener('click', function(){
        clearConsentTimer();
        sendConsent(peerUid, false);
      });
      startConsentCountdown(peerUid, CONSENT_DECIDE_SEC, true, false);
      if (firstRender) sparChime();
      document.title = '● Match found · Spar';
      return;
    }

    var lede;
    if (crossFmt && (theirNote || myNote)){
      lede = 'You proposed different formats. Run the <strong>' + fmtLabel + '</strong> round, with the judge instructions below applied on top. Accept to start, pass to keep searching.';
    } else if (crossFmt){
      lede = 'You proposed different formats. Accept to debate this round in <strong>' + fmtLabel + '</strong>, or pass to keep searching.';
    } else {
      lede = 'The judge applies the instructions below on top of the standard ballot method. Accept to start, pass to keep searching.';
    }
    // Same peerConsent read as the ready-check above: if they have
    // already accepted the terms they proposed, say so. On this card it
    // also answers the question the notes raise ("are they actually
    // going to run this?") before the user has to wonder about it.
    shell.innerHTML =
      '<div class="consent-wrap">' +
        '<div class="eyebrow"><span class="pip"></span>Match found · needs your OK</div>' +
        peerAvatar +
        (peerConsent ? lockedBadge(peerName) : '') +
        '<h1>' + peerName + ' proposes a <em>' + fmtLabel + '</em> round.</h1>' +
        '<p class="lede">' + lede + '</p>' +
        formatBlock +
        noteBlocks +
        '<div class="btn-row">' +
          '<button class="btn primary" id="consentAcceptBtn">Accept &amp; start</button>' +
          '<button class="btn ghost" id="consentDeclineBtn">Pass</button>' +
        '</div>' +
        // 2026-08-26: this said "Auto-join in Ns" while the timer at the
        // end of it auto-PASSES. The copy was true until 2026-08-10, when
        // the timeout flipped from auto-accept to auto-pass (411 rounds,
        // only ~85 with both people present) and this line did not follow.
        // So the one card shown to anyone paired with a debater who filed
        // a judge note told them, in as many words, not to click. The
        // ready-check card above already says "Match expires"; both cards
        // now say the same true thing.
        '<div class="countdown">Match expires in <strong id="consentCountNum">' + CONSENT_DECIDE_SEC + '</strong>s</div>' +
      '</div>';
    document.getElementById('consentAcceptBtn').addEventListener('click', function(){
      this.disabled = true;
      this.textContent = 'Locking in…';
      var dec = document.getElementById('consentDeclineBtn');
      if (dec) dec.disabled = true;
      clearConsentTimer();
      sendConsent(peerUid, true);
    });
    document.getElementById('consentDeclineBtn').addEventListener('click', function(){
      clearConsentTimer();
      sendConsent(peerUid, false);
    });
    startConsentCountdown(peerUid, CONSENT_DECIDE_SEC, true, false);
    // Ping the moment a real human match lands (B, 2026-06-15): the user
    // asked not to be dropped in silently. Only on first render so a
    // snapshot re-paint doesn't double-chime.
    if (firstRender) sparChime();
    // Tab-title nudge — the proposal has a short shelf life and the user
    // may be in another tab ("queue follows you" makes that common).
    document.title = '● Match found · Spar';
  }

  function sendConsent(peerUid, accept, auto, strikes){
    if (!firebaseAuth || !firebaseAuth.currentUser) return;
    // A human pass buys a breather. Without it the poll loop proposes the
    // next person in the same second, which reads as the queue arguing with
    // you. A timer-fired pass is nobody's decision, so it earns nothing.
    if (!accept && !auto) state.declineUntil = Date.now() + DECLINE_COOLDOWN_MS;
    try { gtag('event', accept ? 'spar_consent_accept' : 'spar_consent_pass', { format: formatParam, auto: !!auto }); } catch(e){}
    firebaseAuth.currentUser.getIdToken().then(function(idToken){
      return fetch('/.netlify/functions/spar-pair', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + idToken,
        },
        body: JSON.stringify({
          action: 'consent', accept: !!accept, auto: !!auto, peerUid: peerUid,
          // Only on a drafting pair. The server sanitises this hard (an
          // over-long set would hand one side the whole draft) and fills a
          // short one from the shared seed.
          strikes: Array.isArray(strikes) ? strikes : undefined,
        }),
      });
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(j){
        j = j || {};
        j.__status = res.status;
        return j;
      });
    }).then(function(j){
      if (j && j.ok) return;
      // The allowance ran out between queueing and accepting (another tab
      // spent the last round, or the optimistic local count was stale).
      // recoverConsentCard would hand back buttons that cannot work, so take
      // the screen instead.
      if (j.__status === 403 && (j.code === 'SIGN_IN_REQUIRED' || j.code === 'GOOGLE_SIGN_IN_REQUIRED')){
        if (j.code === 'SIGN_IN_REQUIRED') markGuestSpent();
        state.inConsent = false;
        leaveQueueQuietly();
        renderGate();
        return;
      }
      // Doc snapshots drive every UI transition. 'consent_state_gone'
      // needs nothing from us — my own snapshot already moved me (or
      // is about to). Anything else (throttle 429, 5xx, weird body)
      // left the proposal ALIVE but my click dead — restore a usable
      // card so the user can act again instead of staring at disabled
      // buttons until a timer unwinds everything.
      var reason = (j && (j.reason || j.error)) || 'unknown';
      if (reason === 'consent_state_gone'){
        console.info('[spar] consent state gone before my ' + (accept ? 'accept' : 'pass'));
        return;
      }
      console.warn('[spar] consent POST soft-failed:', reason);
      if (state.lastConsentDoc && state.lastConsentDoc.draft){ recoverDraftCard(); return; }
      recoverConsentCard();
    }).catch(function(err){
      // Network blip mid-click: same recovery. The auto-pass timers
      // (mine or the peer's) still backstop a never-delivered decline.
      console.warn('[spar] consent POST failed', err);
      if (state.lastConsentDoc && state.lastConsentDoc.draft){ recoverDraftCard(); return; }
      recoverConsentCard();
    });
  }

  // Re-render the consent card from the last doc snapshot after a
  // failed POST — fresh buttons, fresh countdown, user can retry.
  function recoverConsentCard(){
    if (!state.inConsent || !state.lastConsentDoc) return;
    state.consentKey = '';
    try { renderConsentGate(state.lastConsentDoc); } catch(e){}
  }

  function exitConsentToSearch(d){
    document.body.classList.remove('draft-live');
    state.inConsent = false;
    state.consentKey = '';
    state.draftKey = '';
    state.draftPicks = [];
    state.draftSubmitting = false;
    state.draftRevealed = false;
    clearDraftTimer();
    state.consentPending = 0;
    state.lastConsentDoc = null;
    clearConsentTimer();
    document.title = BASE_TITLE;
    // Server refreshed joinedAt on the revert — restart the local
    // clocks to match so the AI fallback gets a fresh window.
    state.joinedAtMs = Date.now();
    renderSearching();
    startMatchPolling();
    if (d && d.lastPassBy){
      var stats = document.getElementById('queueStats');
      if (stats){
        // Hold the notice on screen — tryMatch repaints the stats slot
        // every ~2s and would otherwise blink this away unread.
        state.noticeUntil = Date.now() + 7000;
        stats.innerHTML = '<div style="margin-top:14px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;color:var(--text-dim);font-size:.78rem;font-weight:600">' + escHtml(d.lastPassBy) + ' passed on the proposal. Still searching.</div>';
      }
    }
  }

  // Real-time queue watcher + polling fallback. The snapshot listener
  // fires the moment another peer's queue doc lands in Firestore,
  // making pairing sub-second instead of up-to-2s with polling alone.
  // Polling stays as a fallback for snapshot-stream hiccups (network
  // blip, Firestore reconnect, cold-start latency).
  //
  // Debounce: rapid-fire snapshot events (multiple peers joining at
  // once) coalesce to one tryMatch per ~150ms so we don't pile up
  // transaction attempts.
  function startMatchPolling(){
    if (state.matchPollInterval) clearInterval(state.matchPollInterval);
    // The onSnapshot listener below is the REAL matcher: it fires within
    // ~150ms of any waiting-doc change (a peer joins, heartbeats, matches),
    // so a live peer is picked up near-instantly regardless of this poll.
    // This interval is only a backstop for a dropped listener stream. It
    // used to run every 2s, and each tick does a 12-doc get() — ~14k reads
    // per hour for ONE person just sitting on the searching screen, which
    // is what blows the Firestore read quota. 15s keeps the safety net at
    // a fraction of the cost; matching speed is unchanged (the listener
    // owns the fast path).
    state.matchPollInterval = setInterval(tryMatch, 15000);
    setTimeout(tryMatch, 600); // first attempt fast

    if (state.queueWatchUnsub){ try { state.queueWatchUnsub(); } catch(e){} }
    state.queueWatchUnsub = firebaseDb.collection('matchmaking_queue')
      .where('status', '==', 'waiting')
      .limit(8)
      .onSnapshot(function(){
        if (state.matchTriggerPending) return;
        state.matchTriggerPending = true;
        // Coalesce a burst of changes (e.g. several people joining or
        // heartbeating at once) into one tryMatch get() instead of one
        // per change. 500ms still feels instant and cuts the read
        // amplification when the queue is active.
        setTimeout(function(){
          state.matchTriggerPending = false;
          tryMatch();
        }, 500);
      }, function(err){
        console.warn('[spar] queue snapshot stream error:', err);
      });
  }

  // Public ladder ratings already power /leaderboard. Load them only when
  // the person asks for a closest-rating matchup; no extra private profile
  // or political answer is needed. Missing ratings use the 1500 starting
  // point, which is the honest comparison for a new account.
  function loadRatingMap(){
    if (state.ratings) return Promise.resolve(state.ratings);
    if (state.ratingsLoading) return state.ratingsLoading;
    state.ratingsLoading = fetch('/api/leaderboard-ratings').then(function(res){
      return res.ok ? res.json() : { rows: [] };
    }).then(function(data){
      var map = {};
      (data && Array.isArray(data.rows) ? data.rows : []).forEach(function(row){
        if (row && row.uid && Number.isFinite(Number(row.rating))) map[row.uid] = Number(row.rating);
      });
      state.ratings = map;
      return map;
    }).catch(function(){
      state.ratings = {};
      return state.ratings;
    });
    return state.ratingsLoading;
  }

  function joinedOrder(doc){
    var d = doc && doc.data ? doc.data() : {};
    return (d.joinedAt && d.joinedAt.seconds) || 0;
  }

  function friendInviteOrder(doc){
    var d = doc && doc.data ? doc.data() : {};
    return d.friendInviteClaim && d.friendInviteClaim === state.friendInviteToken ? 0 : 1;
  }

  function orderMatchCandidates(others){
    var list = others.slice();
    var mode = (matchProfile && matchProfile.mode) || 'fast';
    // First available remains the universal tie-break, so a preference
    // never strands two eligible people in a thin queue.
    // A person who opened MY challenge link comes before the public queue.
    // If several friends open it, joinedAt keeps the promise that the first
    // arrival gets the seat.
    list.sort(function(a, b){ return friendInviteOrder(a) - friendInviteOrder(b) || joinedOrder(a) - joinedOrder(b); });
    if (mode === 'viewpoint'){
      list.sort(function(a, b){
        var av = a.data().matchMode === 'viewpoint' ? 0 : 1;
        var bv = b.data().matchMode === 'viewpoint' ? 0 : 1;
        return friendInviteOrder(a) - friendInviteOrder(b) || av - bv || joinedOrder(a) - joinedOrder(b);
      });
      return Promise.resolve(list);
    }
    if (mode !== 'rating') return Promise.resolve(list);
    return loadRatingMap().then(function(ratings){
      var mine = Number.isFinite(ratings[state.user.uid]) ? ratings[state.user.uid] : 1500;
      list.sort(function(a, b){
        var ar = Number.isFinite(ratings[a.id]) ? ratings[a.id] : 1500;
        var br = Number.isFinite(ratings[b.id]) ? ratings[b.id] : 1500;
        return friendInviteOrder(a) - friendInviteOrder(b) || Math.abs(ar - mine) - Math.abs(br - mine) || joinedOrder(a) - joinedOrder(b);
      });
      return list;
    });
  }

  function tryMatch(){
    if (state.cancelled || !state.user || !firebaseDb) return;
    var queue = firebaseDb.collection('matchmaking_queue');
    // Match against every waiting debater. Format and judge notes are
    // proposed terms; spar-pair routes disagreements through consent.
    var queries = [
      queue.where('status', '==', 'waiting').orderBy('joinedAt').limit(12).get(),
    ];
    Promise.all(queries).then(function(snaps){
      var seen = {};
      var others = [];
      snaps.forEach(function(snap){
        snap.docs.forEach(function(d){
          if (d.id === state.user.uid) return;
          if (seen[d.id]) return;
          // Mutual-skip filter (declined consent proposals): the server
          // would refuse the pair anyway; don't waste the POST or stall
          // the poll loop on it. Skips EXPIRE (SKIP_TTL_MS) so one passed
          // proposal can't permanently blind two live debaters.
          if (localSkipActive(d.id)) return;
          var dd = d.data();
          if (docSkips(dd, state.user.uid)) return;
          // Age separation: don't propose a pair the server would refuse
          // (spar-pair bandsCompatible). Filtering here also keeps the
          // "N waiting" count honest for someone in the 13-17 pool.
          if (window.daAgeBandsOk && !window.daAgeBandsOk(
                (window.daAgeBand && window.daAgeBand()) || '', dd.ageBand)) return;
          seen[d.id] = true;
          others.push(d);
        });
      });
      state.waitingPeers = others.length;
      setQuietQueue(others.length === 0);
      var stats = document.getElementById('queueStats');
      if (stats && Date.now() > (state.noticeUntil || 0)){
        stats.innerHTML = renderWaitlist(others);
      }
      updateDiag({ peers: others.length });
      if (others.length === 0) return;
      // Counts and the waiting list above are already updated; only the
      // automatic proposal is held, so the page still shows who is around.
      if (Date.now() < (state.declineUntil || 0)){
        updateDiag({ last: 'cooldown after pass' });
        return;
      }
      orderMatchCandidates(others).then(function(ordered){
        if (state.cancelled || !ordered.length) return;
        attemptMatch(ordered[0].id, ordered[0].data());
      });
    }).catch(function(err){
