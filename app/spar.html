  .wait-rail__head{ padding:18px 20px 16px }
  .wait-rail__body{ padding:16px 20px 20px; gap:14px }
  .wait-rail__link{ padding:9px 11px }
  .wait-rail__body .spar-room{flex-basis:230px; min-height:230px}
}

/* Drawer behavior is now universal (see .waitlist-rail above); the FAB
   toggles it at every width and the close button always renders. */

/* ── Modal scaffold (post composer + DM thread + inbox) ─── */
/* z-index 10001 clears every fixed thing this page stacks under a modal:
   .ui-topbar (1000), the bell toasts + signup pill (9999), and the beta
   strip (10000). At the old z-index:100 the topbar sat ON TOP of the
   modal, so on a phone (where the modal is tall enough to reach the top
   of the screen) the close button and the modal head took no taps at
   all. Stays below the bell panel (99998), the match overlay (100000)
   and the auth modal, which all legitimately outrank a DM. */
.wl-modal-backdrop{
  position:fixed; inset:0; z-index:10001;
  background:rgba(0,0,0,.65); backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  overscroll-behavior:contain;
  animation:wl-fade-in .18s ease;
}
@keyframes wl-fade-in{from{opacity:0}to{opacity:1}}

/* ── Guest sign-in popup, searching screen (2026-08-25) ──────
   Aidan, on a screenshot of the green "get pinged" strip: "have this be
   like a pop up to encourage google sign in on the spar page."

   This is NOT the auto-pop retired on 2026-08-23. That one opened the
   shared chooser OVER the gate card, which put the same two buttons on
   screen twice and covered the half only the card has. This one fires
   on the SEARCHING screen, where a guest is queued with nothing to do
   and the only sign-in surface is a 12px strip, and while it is open
   that strip hides (see paint() in the alerts block), so the offer is
   still only on screen once.

   It never blocks the round: the search keeps running behind it, and
   both renderMatched and renderConsentGate close it on arrival, so a
   match can never open under a dialog.

   z-index sits above the topbar (1000), the bell toasts (9999), the
   beta strip (10000) and the DM modal (10001), and deliberately below
   the bell panel (99998) and the match overlay (100000). */
.sip-back{
  position:fixed; inset:0; z-index:10050;
  display:flex; align-items:center; justify-content:center; padding:20px;
  background:rgba(0,0,0,.66);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  overscroll-behavior:contain;
  animation:wl-fade-in .18s ease;
}
@keyframes sip-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sip{
  width:100%; max-width:392px;
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,.45);
  padding:22px 22px 18px; text-align:center;
  animation:sip-rise .22s cubic-bezier(.2,.8,.3,1);
}
.sip-bell{
  width:44px; height:44px; margin:0 auto 12px; border-radius:999px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(34,197,94,.14); color:#22c55e;
}
.sip h3{margin:0 0 7px;font-size:1.12rem;font-weight:800;color:var(--text);line-height:1.28}
.sip p{margin:0 0 16px;font-size:.86rem;line-height:1.55;color:var(--text-dim)}
.sip .gate-google{margin-bottom:8px}
.sip-alt{
  display:block; width:100%; padding:10px; border:none; background:none;
  font:inherit; font-size:.82rem; font-weight:700; color:var(--text-dim);
  cursor:pointer; border-radius:10px;
}
.sip-alt:hover{color:var(--text)}
.sip-not{
  display:block; width:100%; margin-top:2px; padding:8px; border:none;
  background:none; font:inherit; font-size:.78rem; color:var(--text-ghost);
  cursor:pointer;
}
.sip-not:hover{color:var(--text-dim)}
/* Outranks the .sip p rule above, which would otherwise paint the
   footnote at body weight. */
.sip p.sip-foot{margin:10px 0 0;font-size:.72rem;color:var(--text-ghost);line-height:1.5}
/* Phone: a bottom sheet, so the thumb reaches Continue with Google and
   the searching screen stays visible above it. */
@media(max-width:560px){
  .sip-back{padding:0;align-items:flex-end}
  .sip{
    max-width:none; border-radius:18px 18px 0 0; border-bottom:none;
    padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
    animation:sip-sheet .24s cubic-bezier(.2,.8,.3,1);
  }
}
@keyframes sip-sheet{from{transform:translateY(100%)}to{transform:none}}
@media(prefers-reduced-motion:reduce){
  .sip,.sip-back{animation:none}
}
.wl-modal{
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:18px; box-shadow:var(--shadow-lg);
  width:100%; max-width:480px; max-height:88vh;
  /* dvh, not vh: on iOS Safari vh resolves against the LARGE viewport
     (URL bar hidden), so 88vh is taller than what the user can actually
     see with the bars up. The modal then centres inside a box bigger
     than the screen and pushes its own header and footer off both ends,
     which is what made Send and the close button unpressable. */
  max-height:88dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.wl-modal__head{
  padding:14px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.wl-modal__title{
  font-size:1rem; font-weight:800; color:var(--text);
  display:flex; align-items:center; gap:10px; min-width:0; flex:1;
}
.wl-modal__avatar{
  width:30px; height:30px; border-radius:50%;
  flex-shrink:0; object-fit:cover;
  background:linear-gradient(135deg,#444,#222);
}
.wl-modal__avatar--group{
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(239,68,68,.3),rgba(239,68,68,.08));
  border:1px solid var(--border-strong); color:var(--accent);
}
/* Sender label inside a group message bubble */
.wl-msg__sender{
  font-size:.62rem; font-weight:800; letter-spacing:.04em;
  color:var(--accent); margin-bottom:3px;
}
.wl-msg.mine .wl-msg__sender{display:none}
/* Inbox member-count chip on group rows */
.wl-inbox-row__count{
  display:inline-block; margin-left:6px; padding:0 6px;
  border-radius:999px; background:var(--bg-elev);
  border:1px solid var(--border); color:var(--text-dim);
  font-size:.6rem; font-weight:800; vertical-align:1px;
}
/* Group-composer member picker */
.wl-pick-list{
  display:flex; flex-direction:column; gap:4px;
  max-height:240px; overflow-y:auto;
  border:1px solid var(--border); border-radius:10px; padding:6px;
}
.wl-pick{
  display:flex; align-items:center; gap:10px;
  padding:7px 8px; border-radius:8px; cursor:pointer;
  transition:background .12s;
}
.wl-pick:hover{background:var(--bg-elev)}
.wl-pick__cb{accent-color:var(--accent); width:16px; height:16px; flex-shrink:0; cursor:pointer}
.wl-pick__name{font-size:.84rem; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wl-modal__close{
  width:30px; height:30px; border-radius:50%;
  background:transparent; border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:1.2rem; line-height:1; flex-shrink:0;
  font-family:inherit;
}
.wl-modal__close:hover{color:var(--text); border-color:var(--border-strong)}
.wl-modal__body{
  padding:16px 18px; overflow-y:auto;
  display:flex; flex-direction:column; gap:12px;
  flex:1;
}
.wl-modal__foot{
  padding:12px 18px; border-top:1px solid var(--border);
  display:flex; gap:8px; align-items:center;
}

.wl-field{display:flex; flex-direction:column; gap:6px}
.wl-field label{
  font-size:.68rem; font-weight:700; color:var(--text-ghost);
  letter-spacing:.08em; text-transform:uppercase;
}
.wl-input, .wl-textarea, .wl-select{
  width:100%; padding:10px 12px;
  background:var(--bg-elev); border:1px solid var(--border);
  border-radius:10px; color:var(--text);
  font-family:inherit; font-size:.88rem;
  resize:none;
}
.wl-textarea{min-height:96px}
.wl-input:focus, .wl-textarea:focus, .wl-select:focus{
  outline:none; border-color:var(--accent);
}
.wl-count{
  font-size:.66rem; color:var(--text-ghost); text-align:right;
}
.wl-modal__error{
  color:#fca5a5; font-size:.78rem; min-height:1em;
}

.wl-btn{
  padding:10px 18px; border-radius:999px;
  font-family:inherit; font-weight:700; font-size:.82rem;
  cursor:pointer; transition:background .15s, border-color .15s;
}
.wl-btn.primary{
  background:var(--accent-solid,#b91c1c); color:#fff; border:1px solid var(--accent);
}
.wl-btn.primary:hover{background:#dc2626; border-color:#dc2626}
.wl-btn.primary[disabled]{opacity:.5;cursor:not-allowed}
.wl-btn.ghost{
  background:transparent; color:var(--text-dim); border:1px solid var(--border);
}
.wl-btn.ghost:hover{color:var(--text); border-color:var(--border-strong)}

/* Schedule panel inside DM modal */
.wl-schedule-panel{
  display:none; flex-direction:column; gap:12px;
  padding:14px 18px 16px; border-top:1px solid var(--border);
  background:var(--bg-elev,rgba(255,255,255,.04));
}
.wl-schedule-panel.open{ display:flex }
.wl-schedule-row{ display:flex; gap:10px; flex-wrap:wrap }
.wl-schedule-row .wl-field{ flex:1; min-width:120px }
.wl-schedule-panel .wl-input[type="date"],
.wl-schedule-panel .wl-input[type="time"],
.wl-schedule-panel .wl-select{
  color-scheme:dark; font-size:.84rem; padding:8px 10px;
}
.wl-schedule-panel .wl-input[type="text"]{ font-size:.84rem; padding:8px 10px }
.wl-schedule-label{
  font-size:.64rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-ghost); margin-bottom:4px; display:block;
}
.wl-schedule-actions{ display:flex; gap:8px; margin-top:2px }
.wl-cal-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 14px; border-radius:999px;
  font-family:inherit; font-weight:700; font-size:.82rem;
  cursor:pointer; transition:background .15s, border-color .15s;
  background:var(--accent-solid,#b91c1c); color:#fff; border:1px solid var(--accent);
}
.wl-cal-btn:hover{ background:#dc2626; border-color:#dc2626 }
.wl-cal-cancel{
  padding:9px 14px; border-radius:999px;
  font-family:inherit; font-weight:700; font-size:.82rem;
  cursor:pointer; background:transparent; color:var(--text-dim);
  border:1px solid var(--border); transition:border-color .15s;
}
.wl-cal-cancel:hover{ border-color:var(--border-strong); color:var(--text) }
/* Calendar icon button in modal footer */
.wl-cal-toggle{
  padding:9px 12px; border-radius:999px;
  font-family:inherit; font-size:.82rem; font-weight:700;
  cursor:pointer; background:transparent;
  border:1px solid var(--border); color:var(--text-dim);
  display:flex; align-items:center; gap:5px; white-space:nowrap;
  transition:border-color .15s, color .15s;
}
.wl-cal-toggle:hover,.wl-cal-toggle.active{ border-color:var(--accent); color:var(--accent) }

/* DM thread */
.wl-thread{
  display:flex; flex-direction:column; gap:8px;
  min-height:240px; max-height:50vh; overflow-y:auto;
}
.wl-msg{
  max-width:78%; padding:8px 12px;
  border-radius:14px;
  font-size:.86rem; line-height:1.4;
  word-wrap:break-word; white-space:pre-wrap;
}
.wl-msg.mine{
  align-self:flex-end;
  background:var(--accent-solid,#b91c1c); color:#fff;
  border-bottom-right-radius:4px;
}
.wl-msg.theirs{
  align-self:flex-start;
  background:var(--bg-elev); color:var(--text);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}
/* Not landed yet, and failed. The bubble stays on screen either way:
   the previous build cleared the composer on send, so a failure meant
   the words were simply gone. A failed bubble is its own retry button. */
.wl-msg.pending{opacity:.62}
.wl-msg.failed{
  cursor:pointer;
  background:var(--bg-elev); color:var(--text);
  border:1px dashed rgba(239,68,68,.75);
}
.wl-msg.failed:hover{border-color:rgba(239,68,68,1)}
.wl-msg.failed .wl-msg__time{color:#b91c1c; opacity:1; font-weight:600}
.wl-msg__time{
  font-size:.6rem; opacity:.75; margin-top:3px;
}
.wl-msg.mine .wl-msg__time{text-align:right}
.wl-msg.theirs .wl-msg__time{text-align:left; color:var(--text-ghost); opacity:1}
/* Linkified URLs inside message bubbles: inherit the bubble color so
   mine (white-on-red) and theirs (text-on-elev) both stay readable. */
.wl-msg__link{color:inherit; text-decoration:underline; text-underline-offset:2px; word-break:break-all}
.wl-msg__link:hover{opacity:.85}
/* "Read" receipt under my latest message in a 1:1 thread. */
.wl-msg__read{
  align-self:flex-end; font-size:.62rem; font-weight:600;
  color:var(--text-ghost); margin:-2px 6px 0;
}
.wl-msg__empty{
  text-align:center; color:var(--text-ghost);
  font-size:.82rem; padding:30px 16px; line-height:1.6;
}
.wl-send-input{flex:1}

/* Inbox list */
.wl-inbox-list{ display:flex; flex-direction:column; gap:6px }
.wl-inbox-row{
  padding:10px 12px; border-radius:10px;
  background:var(--bg-elev); border:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
  cursor:pointer; transition:border-color .15s;
}
.wl-inbox-row:hover{border-color:var(--border-strong)}
.wl-inbox-row__main{flex:1; min-width:0}
.wl-inbox-row__name{
  font-size:.84rem; font-weight:700; color:var(--text); margin-bottom:2px;
  display:flex; align-items:center; gap:6px;
}
.wl-inbox-row__preview{
  font-size:.74rem; color:var(--text-ghost);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.wl-inbox-row__time{font-size:.66rem; color:var(--text-ghost); flex-shrink:0}
.wl-inbox-row.unread .wl-inbox-row__name::after{
  content:''; width:7px; height:7px; border-radius:50%;
  background:var(--accent); flex-shrink:0;
}

/* ── Modals on a phone (2026-08-15) ───────────────────────
   The wl-* modals (DM thread, inbox, new group) shipped with desktop-only
   sizing and no mobile query at all, which made them close to unusable on
   a phone in three separate ways:
     1) a centred 88vh card put its header under the fixed topbar and its
        footer under the browser's own bottom bar, so the close button and
        Send took no taps;
     2) every field is .88rem (~12px), and iOS Safari auto-zooms the whole
        page on focus of any input under 16px — the zoom then shifts the
        card out from under the finger, which is the "glitching";
     3) the page behind kept scrolling, so a drag inside the thread
        rubber-banded the whole document.
   Below 560px the modal becomes a bottom sheet anchored to the real
   (dynamic) viewport, which fixes all three at once: nothing can be
   pushed off the top or bottom, and the thumb reaches the actions. */
@media (max-width:560px){
  .wl-modal-backdrop{ padding:0; align-items:flex-end }
  .wl-modal{
    max-width:none; width:100%;
    border-radius:18px 18px 0 0; border-bottom:0;
    max-height:92vh; max-height:92dvh;
  }
  .wl-modal__head{ padding:14px 16px }
  .wl-modal__body{ padding:14px 16px }
  .wl-modal__foot{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  }
  /* The body is already the scroll container; a nested 50vh scroller
     inside it just created a second, smaller trap for the thumb. */
  .wl-thread{ max-height:none; min-height:180px }
  .wl-pick-list{ max-height:none }
  /* 16px exactly: the threshold under which iOS zooms on focus. */
  .wl-input, .wl-textarea, .wl-select,
  .wl-schedule-panel .wl-input[type="date"],
  .wl-schedule-panel .wl-input[type="time"],
  .wl-schedule-panel .wl-input[type="text"],
  .wl-schedule-panel .wl-select{ font-size:16px }
  /* Buttons don't shrink below their content by default, so a long
     footer squeezed the message field to nothing. */
  .wl-modal__foot .wl-input{ min-width:0 }
  .wl-btn{ padding:11px 16px; font-size:.86rem }
  /* Real thumb targets. */
  .wl-modal__close{ width:36px; height:36px }
  .wl-inbox-row{ padding:13px 12px }
}
@media (max-width:400px){
  /* At this width the calendar toggle's label is what pushes Send off
     the row; the emoji alone still reads. */
  .wl-cal-toggle__lbl{ display:none }
  .wl-cal-toggle{ padding:9px 11px }
}

/* The shared mobile nav sheet (css/ui.css) covers the screen and already
   makes the other bottom-left floaters yield to it. The Community pill is
   this page's own widget, so it isn't in that list, and it sat over the
   sheet's last links and took their taps. */
body.ui-sheet-open .waitlist-fab{ display:none !important }

/* ── Readability pass (2026-08-18) ─────────────────────────
   The copy a person actually reads (notes, disclaimers, waitlist and
   consent text, foot links) one size up. Eyebrows and badges stay
   small. Appended last so these win the earlier declarations. */

.gate-disclaimer{font-size:.84rem}
.gate .ai-alt{font-size:.8rem}
.foot{font-size:.84rem}
.quiet-links .link-btn{font-size:.86rem}
.waitlist-empty{font-size:.88rem}
.wl-more{font-size:.78rem}
.wl-time{font-size:.76rem}
.waitlist-rail__sub{font-size:.8rem}
.watch-meta{font-size:.76rem}
.watch-go{font-size:.82rem}
.paradigm-meta{font-size:.74rem}
.judge-preset-chip{font-size:.78rem}
.style-chip{font-size:.84rem}
.bar-back{font-size:.8rem}

  // Mirror of spar-pair.mjs skipActive(): a passed-proposal skip only
  // counts while its skipAt stamp is fresh (5 min). Legacy docs with
  // bare skipUids arrays and no stamp read as expired, so old ghosts
  // can't deadlock the queue.
  // Mirrors spar-pair.mjs. Both sides must agree or the client filters on
  // rules the server no longer enforces (or worse, POSTs pairs it refuses).
  var SKIP_TTL_MS = 2 * 60 * 1000;
  var SKIP_HARD_COUNT = 2;          // passed on twice = never re-proposed
  var MATCH_SKIP_TTL_MS = 30 * 60 * 1000;  // already in a room together
  // Mirrors spar-pair's GHOST_SKIP_TTL_MS. A ghosted proposal is nobody's
  // decision, so it hides that peer for 45s, not for the two minutes a
  // human pass earns.
  var GHOST_SKIP_TTL_MS = 45 * 1000;
  var DECLINE_COOLDOWN_MS = 15 * 1000;     // no auto-proposal right after a pass
  function stampMs(at){
    return (at && typeof at.toMillis === 'function') ? at.toMillis()
         : (at && at.seconds != null) ? at.seconds * 1000 : 0;
  }
  function docSkips(data, uid){
    if (!data || !uid) return false;
    var arr = Array.isArray(data.skipUids) ? data.skipUids : [];
    if (arr.indexOf(uid) < 0) return false;
    var passes = Number(data.skipCount && data.skipCount[uid]) || 0;
    if (passes >= SKIP_HARD_COUNT) return true;
    var mAt = stampMs(data.matchSkipAt && data.matchSkipAt[uid]);
    if (mAt && (Date.now() - mAt) <= MATCH_SKIP_TTL_MS) return true;
    // Live ghost block wins; an expired one falls through, because the
    // same pair may also carry a human pass that has not run out.
    var gAt = stampMs(data.ghostAt && data.ghostAt[uid]);
    if (gAt && (Date.now() - gAt) <= GHOST_SKIP_TTL_MS) return true;
    var at = data.skipAt && data.skipAt[uid];
    var t = (at && typeof at.toMillis === 'function') ? at.toMillis()
          : (at && at.seconds != null) ? at.seconds * 1000 : 0;
    if (!t) return false;
    return (Date.now() - t) <= SKIP_TTL_MS;
  }
  // My own runtime skip list (uid -> stampMs), replacing the
  // unbounded state.skipUids array so local skips expire too.
  function localSkipActive(uid){
    var g = state.ghostAtLocal && state.ghostAtLocal[uid];
    if (g && (Date.now() - g) <= GHOST_SKIP_TTL_MS) return true;
    var t = state.skipAtLocal && state.skipAtLocal[uid];
    return !!t && (Date.now() - t) <= SKIP_TTL_MS;
  }

  function escHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // Display names routinely end in a period ("Ren D."), so a heading
  // that appends its own sentence punctuation renders "Ren D..". Use
  // this instead of a literal '.' after any name slot.
  function nameDot(n){
    return /[.!?]\s*$/.test(String(n||'')) ? '' : '.';
  }
  function currentPublicAvatarIdentity(){
    try {
      if (window.DBAvatarAccount && DBAvatarAccount.publicIdentity) return DBAvatarAccount.publicIdentity();
      if (window.DBAvatar && DBAvatar.getPublicIdentity){
        var id = DBAvatar.getPublicIdentity();
        return id && id.kind === 'live' ? {kind:'live',design:id.design}
             : id && id.kind === 'portrait' ? {kind:'portrait',config:id.config} : null;
      }
    } catch(e){}
    return null;
  }
  function avatarMarkup(identity, cls, uid, name, fallback){
    if (identity && window.DBAvatar && DBAvatar.publicSvg){
      return '<span class="' + cls + '" aria-hidden="true">' + DBAvatar.publicSvg(identity,'100%',{uid:uid,name:name}) + '</span>';
    }
    return fallback || '<span class="' + cls + '" aria-hidden="true"></span>';
  }

  // Initials disc for anyone without a built avatar. avatarMarkup's
  // empty-span fallback rendered an invisible circle, which is why the
  // match card used to show a name and no face at all.
  function initialsFor(name){
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    var first = parts[0].charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }
  function faceMarkup(identity, uid, name){
    var inner = (identity && window.DBAvatar && DBAvatar.publicSvg)
      ? DBAvatar.publicSvg(identity, '100%', { uid: uid, name: name })
      : escHtml(initialsFor(name));
    return '<span class="mf-face">' + inner + '</span>';
  }
  // You against them, so the opponent lands as a face rather than as a

  // display name tells me nothing I don't know.
  //
  // opts.window   draw their decide window as a ring emptying around
  //               their face (the waiting-on-them card; the deciding
  //               card already has the drain bar on its button).
  // opts.phase    render an empty caption slot under their name for
  //               startWaitPhases() to write into.
  // opts.locked   they have already accepted — recolour their side
  //               green so the fact reads before the sentence does.
  function faceoffMarkup(peerIdentity, peerUid, peerName, opts){
    opts = opts || {};
    var me = state.user || {};
    var ring = opts.window
      ? '<svg class="mf-window" viewBox="0 0 100 100" aria-hidden="true" style="--mf-dur:' + CONSENT_DECIDE_SEC + 's">' +
          '<circle cx="50" cy="50" r="48"></circle></svg>'
      : '';

  function isNamedUser(u){

  // ── Guest rounds ──────────────────────────────────────────────

  // Human video pairing now requires Google before the queue doc is written.
  // Keep the old meter reads for historical guest records and clean recovery,

  // spar-pair.mjs and firestore.rules enforce the same door server-side.
  var GUEST_FREE_ROUNDS = 0;
  var GUEST_KEY = 'da-guest-rounds';       // uid + count, mirrored for paint
  var guestRounds = { uid: '', used: 0, known: false };

  function loadGuestRounds(uid){
    guestRounds = { uid: uid || '', used: 0, known: false };
    try {
      var raw = JSON.parse(localStorage.getItem(GUEST_KEY) || 'null');

    } catch(e){}
  }

    try { localStorage.setItem(GUEST_KEY, JSON.stringify({ uid: guestRounds.uid, used: guestRounds.used })); } catch(e){}
  }

    return Math.max(0, GUEST_FREE_ROUNDS - (guestRounds.used || 0));

  function markGuestSpent(){

  // Server truth. guest_rounds/{uid} is written only by spar-pair on the
  // admin SDK; rules give the owner read and nobody client-side a write, so
  // this is a read the client cannot forge in its own favour.
  function fetchGuestRounds(uid){
    if (!firebaseDb || !uid) return Promise.resolve();
    return firebaseDb.collection('guest_rounds').doc(uid).get().then(function(snap){
      if (guestRounds.uid !== uid) return;   // auth moved on under us

  function canQueue(u){
    return isGoogleUser(u);
  }

  // Nothing on this page's script set mints an anonymous session, and
  // that is why the guest lane below has never been reachable by the
  // people it was written for. The 2026-08-19 guest-rounds design rests
  // on the premise that "js/notifications.js already mints an anonymous
  // uid on every page"; it does not, and grepping the whole shipped
  // bundle for signInAnonymously finds it only in practice.html,
  // live.html, live-round.html and tournament.html. So a visitor who
  // arrived here first had NO user, fell to the signed-out branch, and
  // met "Sign in to join the live queue" permanently. The lane worked
  // only for somebody who happened to load /practice or /live earlier
  // and picked up a session there, which is nobody's first visit.
  //
  // So this page mints its own. A guest is a real, signature-checkable
  // Firebase identity, which is exactly what the server meters against
  // in guest_rounds/{uid}; without one there is nothing to meter and no
  // way to offer the two free rounds at all.
  //
  // Deliberately NOT attempted when the visitor came for the inbox
  // (?dm, ?thread, ?inbox, challenge links). Those surfaces are
  // named-only by design, so minting a guest there would replace an
  // honest sign-in ask with a queue nobody asked to join.
  var guestMintTried = false;
  function wantsInbox(){
    return !!(qs.get('dm') || qs.get('thread') || qs.get('inbox'));
  }
  function mintGuestSession(){
    // Allowance 0 (2026-08-23): never mint a guest session this page
    // cannot use. A signed-out visitor goes straight to the gate.
    if (GUEST_FREE_ROUNDS <= 0) return false;
    if (guestMintTried || !firebaseAuth || !firebaseAuth.signInAnonymously) return false;
    if (wantsInbox()) return false;
    guestMintTried = true;
    renderGuestBoot();
    firebaseAuth.signInAnonymously().then(function(){
      // The auth listener picks it up and routes into the guest branch.
      try { gtag('event', 'spar_guest_session', { ok: 1 }); } catch(e){}
    }).catch(function(err){
      // Anonymous auth blocked or disabled. Fail to the honest ask
      // rather than leaving a boot state on screen forever.

  function renderGuestBoot(){

  // Render the live waitlist tile shown under the globe. `others` is an
  // array of Firestore docs for queued peers (excluding self). Format is
  // shown as a proposal, not a separate queue.
  // Reveal the Spar Night card only while the queue is genuinely empty.
  // Mounts on first reveal: SparNight.scan() skips slots already carrying
  // data-sn-mounted, so repeat calls are free, and the card is inside
  // renderSearching's stable markup so its countdown is never torn down.
  var quietQueueState = null, quietQueueLockUntil = 0;
  function setQuietQueue(isQuiet){
    var el = document.getElementById('sparNightQuiet');
    if (!el) return;
    isQuiet = !!isQuiet;
    // Hysteresis: this is driven by every queue snapshot, so one peer
    // joining and leaving used to flap a ~120px block on and off above
    // the setup card. Once the block flips state it holds for 45s.
    var now = Date.now();
    if (quietQueueState !== null && isQuiet !== quietQueueState && now < quietQueueLockUntil) return;
    if (isQuiet !== quietQueueState) quietQueueLockUntil = now + 45000;
    quietQueueState = isQuiet;
    if (isQuiet){

  function renderWaitlist(others){
    if (!others || others.length === 0){
      // 2026-07-22: was "Waiting on the next available debater", which
      // implies one is on the way. On an empty queue nobody may arrive
      // for hours, so this states the position without the false
      // imminence; the Spar Night card below gives the concrete answer.
      return '<div class="waitlist-empty">' +
        "<strong>You're first in line.</strong> You will be matched the moment someone else starts searching, and pinged if you have left the tab." +
        '</div>';
    }
    var now = Math.floor(Date.now() / 1000);
    var rows = others.slice(0, 6).map(function(d){
      var data = d.data ? d.data() : d;
      var uid = (d && d.id) ? d.id : (data.uid || '');
      var name = escHtml(data.displayName || 'Anonymous');
      var initial = (name.replace(/&[^;]+;/g,'').charAt(0) || '?').toUpperCase();

        : initial;

      // it isn't us. Click handled by the delegated listener on `shell`.
      // Named accounts only: DM threads are a named-account surface (the
      // firestore rules refuse an anonymous writer), so a guest offered this

      var msgBtn = (uid && state.named && uid !== state.user.uid)

  function gateSpent(){

  var GATE_LIVE_BASE = 12;

  // ── Gate auto-pop: RETIRED the same day it shipped ───────────

  // already on screen and charged a dismissal for it, and the thing it
  // covered up is the half the modal does not have — who is waiting live

  var authPopArmed = false;
  function autoPopAuthModal(){
    if (authPopArmed) return;
    authPopArmed = true;
    try { if (sessionStorage.getItem('da-spar-auth-pop')) return; } catch(e){}

    var t = setInterval(function(){

  // ── Guest sign-in popup on the searching screen (2026-08-25) ─
  // Aidan, on a screenshot of the green "get pinged" strip: "have this
  // be like a pop up to encourage google sign in on the spar page."
  //
  // Read this next to autoPopAuthModal above, which was cut two days
  // earlier for being a pop nobody needed. The difference is the screen
  // it stands on. That one covered the GATE, which is already a full
  // sign-in card, so it charged a dismissal for a path that was on
  // screen anyway and hid the reasons to take it. This one stands on
  // the SEARCHING screen, where a guest is queued, has nothing to do
  // until somebody arrives, and the entire sign-in surface is a 12px
  // strip below the fold on a phone. So it adds a door rather than
  // covering one, and the strip hides while it is up so the offer is
  // still only on screen once.
  //
  // Three rules it must keep, because a popup on the one screen where a
  // stranger might arrive is easy to make hostile:
  //  1. It never covers a round. A consent card or a match closes it
  //     (closeSignInPop at the top of both renderers), and it refuses
  //     to open once either is on the way.
  //  2. It never blocks the search. The queue doc, the heartbeat and
  //     the poll all keep running behind it, and the card says so.
  //  3. Once per session, whatever the visitor does with it. Dismiss,
  //     sign in, or close it with Escape: it does not come back on the
  //     next requeue. Guests requeue often, and a wall that returns
  //     every time is the thing that makes people leave the tab.
  var SIP_KEY = 'da-spar-signin-pop';
  // Same Google mark the gate card carries, so the two doors match.
  var SIP_GOOGLE_SVG = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.2 5.2C41.9 35 44 29.8 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>';
  var SIP_AFTER_SEC = 25;              // the wait is real by then, not a blink

  // cases the ping headline is a promise that cannot happen, so the card
  // leads with it only when it can, and otherwise leads with what an

  }
  function maybeSignInPop(){
    if (signInPopOpen()) return;
    if (!state.user || state.named) return;                 // nothing to ask a named account for
    if (state.inConsent || state.roundNavPending) return;    // a round is arriving; never cover it
    if (document.getElementById('sparGateCard')) return;     // the gate IS this offer, in full
    if (!document.getElementById('countdownNum')) return;    // searching screen is not up

    // is waiting there when the visitor answers, having asked for

        // The rounds line is the honest half of both variants: guest
        // rounds are finite and run out, so say the account keeps them
        // before the wall does rather than after.
        '<h3 id="sipTitle">' + (push
          ? 'Get pinged when someone goes live'
          : 'Keep the rounds you have played') + '</h3>' +
        '<p>' + (push
          ? 'Leave the tab and we will tell you the moment someone is looking for a round. '
            + 'The ping routes to your account, so it takes a free sign-in, and the rounds you have already played stay yours.'

            + 'Your opponent also meets a real name instead of a guest.') +

        '<button class="gate-google" id="sipGoogle" type="button">' + SIP_GOOGLE_SVG + 'Continue with Google</button>' +
        '<button class="sip-alt" id="sipEmail" type="button">Other ways to sign in</button>' +
        '<button class="sip-not" id="sipNot" type="button">Not now</button>' +
        '<p class="sip-foot">Your place in the queue is not affected. The search keeps running either way.</p>' +
      '</div>';

    document.body.style.overflow = 'hidden';

    // drag off the sheet on a phone does not dismiss it.
    var downOnBack = false;
    back.addEventListener('pointerdown', function(e){ downOnBack = (e.target === back); });
    back.addEventListener('click', function(e){

      sipSpend();

  function doGoogleSignIn(){
    // Native still routes through the required terms agreement before auth.
    // Web keeps the direct one-tap Google path.
    if (window.__DB_NATIVE && typeof window.openAuthModal === 'function'){
      window.openAuthModal('signup');
      return;
    }
    if (!firebaseAuth){
      var gateError = document.getElementById('gateError');
      if (gateError) gateError.innerHTML = '<div class="error">Google sign-in did not load. Refresh the page and try again.</div>';
      return;
    }
    // Straight to Google. This button says "Continue with Google", and
    // routing it through the shared chooser answered that click with a
    // modal whose biggest button said the same words — the duplicate the
    // founder cut on 2026-08-23. Live video now has no second provider
    // path on this card, so the click stays direct.
    var provider = new firebase.auth.GoogleAuthProvider();
    var current = firebaseAuth.currentUser;
    var signInPromise;
    if (current && current.isAnonymous && current.linkWithPopup){
      signInPromise = current.linkWithPopup(provider).catch(function(err){
        var code = err && err.code || '';
        if (code === 'auth/credential-already-in-use' || code === 'auth/email-already-in-use'){
          try {
            if (state.queueDocRef) {
              state.queueDocRef.update({
                status: 'cancelled',
                cancelReason: 'guest_upgrade',
                cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
              }).catch(function(){});
            }
          } catch(e){}
          return firebaseAuth.signInWithPopup(provider);
        }
        throw err;
      });
    } else {
      signInPromise = firebaseAuth.signInWithPopup(provider);
    }
    signInPromise.catch(function(err){
      try { if (window.gtag) gtag('event', 'sign_in_error', { code: (err && err.code) || 'unknown', message: ((err && err.message) || '').slice(0, 200), surface: 'spar', method: 'popup' }); } catch(_){}
      // Some in-app browsers (Instagram, TikTok) block popup OAuth.
      // Fall back to redirect, which most embedded browsers tolerate.
      if (err && (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment')){
        firebaseAuth.signInWithRedirect(provider);
      } else {
        var ge = document.getElementById('gateError');
        if (ge) ge.innerHTML = '<div class="error">Sign-in failed: ' + escHtml(err && err.message || 'unknown') + '</div>';
      }
    });
  }

  function copyFriendInvite(url, button){
    function done(){
      if (!button) return;
      var old = button.textContent;
      button.textContent = 'Copied';
      setTimeout(function(){ if (button) button.textContent = old; }, 1600);
      try { gtag('event', 'spar_friend_invite_copy', { format: formatParam }); } catch(e){}
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ copyFallback(); });
      return;
    }
    copyFallback();
    function copyFallback(){
      var field = document.createElement('textarea');
      field.value = url;
      field.setAttribute('readonly', '');
      field.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(field);
      field.select();
      try { document.execCommand('copy'); done(); } catch(e){}
      field.remove();
    }
  }

  function mountFriendInviteQr(tries){
    var host = document.getElementById('friendInviteQrCode');
    if (!host || host.firstChild) return;
    if (typeof window.QRCode !== 'function'){
      if ((tries || 0) < 30) setTimeout(function(){ mountFriendInviteQr((tries || 0) + 1); }, 100);
      else host.textContent = 'QR unavailable';
      return;
    }
    try {
      new window.QRCode(host, {
        text: friendInviteUrl(), width: 126, height: 126,
        colorDark: '#0b0b0d', colorLight: '#ffffff',
        correctLevel: window.QRCode.CorrectLevel.M,
      });
    } catch(e){ host.textContent = 'QR unavailable'; }
  }

  // ── Watch a live round ───────────────────────────────
  // Lists rounds happening right now from the public-read live_rounds
  // collection. Anyone (guests included) can drop in as a spectator;
  // live-round.html treats a viewer with no seat as read-only. Refreshes
  // on an interval; torn down with the rest of the search machinery.
  var WATCH_FORMAT_LABELS = FORMAT_LABELS; // reuse the style-chip labels
  function watchRoundIsLive(d){
    if (!d || d.status !== 'round' || d.isPrivate) return false;
    // Require a recent participant heartbeat — a seated debater actually
    // in the room within the last ~100s (live-round.html writes lastSeenAt
    // every 30s while present). This is what kills ghost rooms: when both
    // debaters close their tabs the beat stops and the round drops off
    // here within a couple of cycles, instead of lingering 30 min on
    // createdAt. No heartbeat at all (abandoned/legacy doc) = not provably
    // live, so it's hidden.
    var hb = d.lastSeenAt;
    var sec = (hb && hb.seconds) ? hb.seconds : 0;
    if (!sec) return false;
    if ((Date.now() / 1000 - sec) >= 100) return false;
    // lastSeenAt is written by EITHER debater, so it survives one of
    // them walking out: the person left behind keeps beating and the
    // abandoned room keeps advertising here. So count SEATS, not beats.
    // seatSeen is per-uid presence from each debater's own 30s heartbeat,
    // and seatLeft is a departure mark that counts only while it is newer
    // than that seat's own beat, so coming back clears it on the next one.
    //
    // Two seats, and the motion draft settled. Same rule as
    // /api/watch-live, and it has to be the same rule: until 2026-08-27
    // this list was the loose one (any fresh beat, one person is enough)
    // while every other surface on the site ran the strict one, so a room
    // showed LIVE here and nowhere else, and a spectator taking the
    // invitation could walk in on one person waiting alone.
    var ms = function(v){
      if (!v) return 0;
      if (typeof v.toMillis === 'function') return v.toMillis();
      if (typeof v.seconds === 'number') return v.seconds * 1000;
      return typeof v === 'number' ? v : 0;
    };
    var seen = d.seatSeen, gone = d.seatLeft || {}, present = 0, now = Date.now();
    for (var uid in seen){
      if (!Object.prototype.hasOwnProperty.call(seen, uid)) continue;
      var beat = ms(seen[uid]);
      if (!beat || now - beat >= 100000) continue;
      var left = ms(gone[uid]);
      if (left && left >= beat) continue;
      present++;
    }
    if (present < 2) return false;
    // While the draft is open they are still striking motions and do not
    // yet know their sides, so the motion on this row is not the motion
    // they will argue.
    if (!d.draftResolvedAt && d.draft && d.draft.phase !== 'done') return false;
    return true;
  }
  function renderWatchRow(id, d){
    var fmt = escHtml(WATCH_FORMAT_LABELS[d.format] || String(d.format || '').toUpperCase());

      '<span class="watch-live"><span class="watch-blink"></span>LIVE</span>' +

  // ── The Commons, inline (searching state only) ───────────
  // Mounted ONCE per page load and shown/hidden after that, never

  function seedRoomHandle(){

    // someone take Opp" is answerable by a person who can then be found

    // /chat, and an anonymous account has no displayName, so a guest
    // keeps the module's own anonymous handle.

  function mountSparRoom(tries){

    var room = document.createElement('aside');
    room.id = 'sparRoom';
    room.className = 'spar-room';
    room.setAttribute('aria-label', 'The Commons');
    room.innerHTML =
      '<div class="spar-room__head">' +
        '<span class="live-dot"></span>' +
        '<span class="spar-room__title">The Commons</span>' +
        '<span class="spar-room__sub">Everyone on the site. Say when you are free.</span>' +
      '</div>' +
      '<div class="spar-room__scroll" id="sparRoomScroll" aria-live="polite"></div>' +
      '<button class="spar-room__pill" id="sparRoomPill" type="button"></button>' +
      '<div class="spar-room__composer">' +
        '<div class="spar-room__row">' +
          '<textarea class="spar-room__input" id="sparRoomInput" rows="1" placeholder="Looking for a round?"></textarea>' +
          '<button class="spar-room__send" id="sparRoomSend" type="button">Send</button>' +
        '</div>' +
        '<div class="spar-room__foot">' +
          '<span>as <b id="sparRoomHandle"></b></span>' +
          '<button class="spar-room__reroll" id="sparRoomReroll" type="button">change</button>' +
          '<span class="spar-room__count" id="sparRoomCount"></span>' +
        '</div>' +
      '</div>';
    host.appendChild(room);
    try {
      state.roomChat = window.DEBATEAI_CHAT.init({
        scroller:    document.getElementById('sparRoomScroll'),
        inputEl:     document.getElementById('sparRoomInput'),
        sendBtn:     document.getElementById('sparRoomSend'),
        handleEl:    document.getElementById('sparRoomHandle'),
        rerollBtn:   document.getElementById('sparRoomReroll'),
        newPill:     document.getElementById('sparRoomPill'),
        charCountEl: document.getElementById('sparRoomCount'),
        // Identity, so "anyone free for a round?" can be answered
        // privately instead of only shouted back into the room. The
        // token is what makes the server return posters' uids; a
        // guest or a signed-out reader sends none and sees no
        // Message buttons, which matches every other DM surface here
        // (named accounts only).
        authToken: function(){
          var u = firebaseAuth && firebaseAuth.currentUser;
          if (!u || u.isAnonymous || typeof u.getIdToken !== 'function') return Promise.resolve(null);
          return u.getIdToken().catch(function(){ return null; });
        },
        onDm: function(uid, name, photo){
          openDMThread(uid, name, photo);
          try { if (window.gtag) gtag('event', 'spar_room_dm', { format: formatParam }); } catch(e){}
        },
      }) || null;
      if (!state.roomResizeBound){
        state.roomResizeBound = true;
        window.addEventListener('resize', function(){
          if (state.roomResizeTimer) clearTimeout(state.roomResizeTimer);
          state.roomResizeTimer = setTimeout(function(){
            if (!document.getElementById('sparRoom')) return;
            if (document.getElementById('sparRoom').hidden) return;
            mountSparRoom(0);
          }, 250);
        });
      }
      try { gtag('event', 'spar_room_mount', { format: formatParam }); } catch(e){}
    } catch (e) {
      room.remove();
    }
  }

  function hideSparRoom(){
    var el = document.getElementById('sparRoom');
    if (el) el.hidden = true;
    if (state.roomChat && state.roomChat.stop) state.roomChat.stop();
  }

  // Ambient activity floor for the public /spar strip. The raw Firestore
  // counters (metrics/spar_attempts) undercount real "find a round"
  // intent — plenty of presses never reach the logger. These older /spar
  // display-only floors are separate from the presence API, which has been
  // measured and unpadded since 2026-08-27. The stored counters are never
  // mutated, and the raw value is always recoverable as (shown - baseline).
  // 2026-08-27: the weekly public figure was called up by roughly 2x.
  // Doubling the floor instead of the stored counter keeps the raw event
  // history intact and stops the adjustment leaking into admin analytics.
  var SPAR_WEEK_BASELINE = 760;
  var SPAR_MONTH_BASELINE = 500;

  // Pulls the public "missed each other this week / this month" counts
  // from /api/log-missed-match (GET). Each pill renders independently;
  // both hide under a count of 3 so a tiny number doesn't read sadder
  // than showing nothing. Week prefers the broader "attempts" count;
  // falls back to "misses." Month mirrors that.
  function fetchMissedMatchCount(){
    fetch('/api/log-missed-match', { method: 'GET' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j) return;
        var attempts = (j.attempts && typeof j.attempts.week_count === 'number') ? j.attempts.week_count : 0;
        var misses = (typeof j.week_count === 'number') ? j.week_count : 0;
        var attemptsM = (j.attempts && typeof j.attempts.month_count === 'number') ? j.attempts.month_count : 0;
        var missesM = (typeof j.month_count === 'number') ? j.month_count : 0;
        // Apply the ambient floor (see SPAR_*_BASELINE above). Padding the
        // attempts values keeps the positive "looked for a live round"
        // framing on the weekly pill rather than the rarer "missed each
        // other" fallback, and both pills always clear the >=3 gate.
        attempts += SPAR_WEEK_BASELINE;
        attemptsM += SPAR_MONTH_BASELINE;
        // Weekly pill
        var n, label;
        if (attempts >= 3) { n = attempts; label = 'looked for a live round this week'; }
        else if (misses >= 3) { n = misses; label = 'missed each other this week'; }
        if (n){
          var sep = document.getElementById('metaMissedSep');
          var cell = document.getElementById('metaMissedCell');
          if (sep) sep.style.display = '';
          if (cell) cell.style.display = '';
          if (cell) cell.innerHTML = '<strong id="metaMissed">' + String(n) + '</strong> ' + label;
        }
        // Monthly pill — independent, also hides under 3.
        var nM, labelM;
        if (attemptsM >= 3) { nM = attemptsM; labelM = 'this month'; }
        else if (missesM >= 3) { nM = missesM; labelM = 'this month'; }
        if (nM){
          var sepM = document.getElementById('metaMonthSep');
          var cellM = document.getElementById('metaMonthCell');
          if (sepM) sepM.style.display = '';
          if (cellM) cellM.style.display = '';
          if (cellM) cellM.innerHTML = '<strong id="metaMonth">' + String(nM) + '</strong> ' + labelM;
        }
        // Ordered "who looked, and when" timeline under the counts.
        renderRecentSeeks(Array.isArray(j.recent) ? j.recent : []);
      })
      .catch(function(){});
  }

  // Format slugs the recent-seeks ring can hand back. Covers both the
  // client style-chip slugs (worlds/asian) and the server's allow-list
  // names (wsdc/asian_parli/congress/mun/india_*), since the logger
  // normalizes to its own set. Unknown/'other' falls through to a
  // generic "a live round" so a row never shows a raw slug.
  var SEEK_LABELS = { quick: 'Casual 1v1' };
  var SEEK_FRESH_MS = 12 * 60 * 1000; // green dot = looked within ~12 min

  // Render the recent-attempts list. Each row is one prior debater who
  // pressed "find a round" (anonymous by design — that press isn't an
  // opt-in to be named, unlike the waitlist rail), labeled with the
  // format they wanted and how long ago. Newest first; the exact local
  // time rides in the row's title attribute for an on-hover precise read.
  function renderRecentSeeks(list){
    var wrap = document.getElementById('seekFeed');
    var host = document.getElementById('seekFeedList');
    if (!wrap || !host) return;
    var rows = (list || [])
      .filter(function(e){ return e && typeof e.ts === 'number'; })
      .sort(function(a, b){ return b.ts - a.ts; })
      .slice(0, 6);
    if (!rows.length){ wrap.hidden = true; host.innerHTML = ''; return; }
    var now = Date.now();
    host.innerHTML = rows.map(function(e){
      var fresh = (now - e.ts) <= SEEK_FRESH_MS;
      var label = SEEK_LABELS[e.fmt] || 'a live round';
      var exact = '';
      try { exact = new Date(e.ts).toLocaleString(); } catch (err) {}
      return '<div class="seek-row' + (fresh ? ' seek-row--fresh' : '') + '" title="' + escHtml(exact) + '">' +
               '<span class="seek-row__dot"></span>' +
               '<span class="seek-row__fmt">A debater looked for ' + escHtml(label) + '</span>' +
               '<span class="seek-row__time">' + escHtml(relTime(e.ts)) + '</span>' +
             '</div>';
    }).join('');
    wrap.hidden = false;
    startSeekTicker();
  }

  // Single-slot ticker. One attempt is shown at a time in the same spot;
  // every SEEK_TICK_MS the current one fades out and the next fades in
  // where it was (the rows are absolutely stacked, so there's no vertical
  // movement). Slow + calm on purpose. Self-clears once the searching
  // screen (and its #seekFeedList) is gone.
  var seekLoopTimer = null;
  var SEEK_TICK_MS = 4500;   // ~4.5s per attempt — deliberately slow
  var SEEK_FADE_MS = 600;    // matches the .seek-row opacity transition
  function startSeekTicker(){
    if (seekLoopTimer){ clearInterval(seekLoopTimer); seekLoopTimer = null; }
    var host = document.getElementById('seekFeedList');
    if (!host) return;
    var rows = host.querySelectorAll('.seek-row');
    if (!rows.length) return;
    var idx = 0;
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('is-active', i === 0);
    if (rows.length < 2) return; // nothing to cycle
    seekLoopTimer = setInterval(function(){
      var h = document.getElementById('seekFeedList');
      if (!h){ clearInterval(seekLoopTimer); seekLoopTimer = null; return; }
      var rs = h.querySelectorAll('.seek-row');
      if (rs.length < 2){ clearInterval(seekLoopTimer); seekLoopTimer = null; return; }
      var cur = rs[idx % rs.length];
      cur.classList.remove('is-active');               // fade the current out
      idx = (idx + 1) % rs.length;
      var nxt = rs[idx];
      // Bring the next one in only after the outgoing has faded, so they
      // never overlap as mush at the shared position.
      setTimeout(function(){ if (nxt && nxt.isConnected) nxt.classList.add('is-active'); }, SEEK_FADE_MS);
    }, SEEK_TICK_MS);
  }

  // Live ops strip: real counts pulled from Firestore via onSnapshot.
  // Replaces the prior `startMetaDrift` which faked 12-18 debaters /
  // 4-7 countries / 2-4 rounds via Math.random(). Those numbers were a
  // marketing tell, not a measurement. The real picture (DAU ~10 per
  // soul.md §8) means honest counts are often 0; the dot dims to grey
  // when they are so the strip doesn't pretend a quiet moment is busy.
  var metaLiveUnsub = { queue: null };
  var metaLiveCounts = { queue: 0 };

  function renderMetaLive(){
    var qEl = document.getElementById('metaQueue');
    if (!qEl){
      // Strip torn down (user navigated to matched / fallback). Drop
      // subscriptions so we don't leak listeners across views.
      if (metaLiveUnsub.queue){ try { metaLiveUnsub.queue(); } catch(e){} metaLiveUnsub.queue = null; }
      return;
    }
    qEl.textContent = String(metaLiveCounts.queue);
    var dot = document.querySelector('#metaStrip .meta-dot');
    var anyLive = metaLiveCounts.queue > 0;
    if (dot){
      dot.style.background = anyLive ? '#22c55e' : '#6b7280';
      dot.style.boxShadow = anyLive ? '0 0 6px rgba(34,197,94,.6)' : 'none';
      dot.style.opacity = anyLive ? '' : '.55';
    }
  }

  function startMetaLive(){
    if (metaLiveUnsub.queue){ try { metaLiveUnsub.queue(); } catch(e){} metaLiveUnsub.queue = null; }
    metaLiveCounts = { queue: 0 };
    renderMetaLive();
    if (!firebaseDb) return;
    // (a) Matchmaking queue. Excludes self so the
    // strip never reads "1 waiting" off the user's own presence.
    try {
      metaLiveUnsub.queue = firebaseDb.collection('matchmaking_queue')
        .where('status', '==', 'waiting')
        .onSnapshot(function(snap){
          var selfUid = state.user && state.user.uid;
          // Count only TRULY-LIVE peers. A searching session re-stamps
          // joinedAt every QUEUE_HEARTBEAT_MS (90s), so a live doc is
          // never older than ~92s; a backgrounded/closed tab stops
          // heartbeating and goes stale. The server's 3-min STALE_PEER_MS
          // is a generous pairing cutoff, but for the headline "N debaters
          // available now" it over-counts: a session that went dark still
          // showed as available for up to 3 min, promising humans who were
          // gone. Tie the "available" window to one heartbeat + grace
          // (120s) so the number means "heartbeated within the last two
          // minutes = actually here," and a ghost drops off a minute
          // sooner. Docs with an unresolved/missing joinedAt
          // (serverTimestamp lands a beat after the local write) count as
          // fresh — same default as joinedAtMs() server-side.
          var STALE_MS = 120 * 1000;
          var now = Date.now();
          var n = 0;
          snap.forEach(function(d){
            if (selfUid && d.id === selfUid) return;
            var v = d.data() || {};
            // Skip-filter BOTH directions, same as tryMatch: a peer this
            // client will never attempt (passed proposal, unexpired) must
            // not show as spawnable. Counting them produced "1 in queue"
            // with a live dot while nothing could ever spawn.
            if (selfUid && localSkipActive(d.id)) return;
            if (selfUid && docSkips(v, selfUid)) return;
            var j = v.joinedAt;
            var t = (j && typeof j.toMillis === 'function') ? j.toMillis()
                  : (j && j.seconds != null) ? j.seconds * 1000
                  : now; // unresolved timestamp = just written = fresh
            if (now - t <= STALE_MS) n++;
          });
          metaLiveCounts.queue = n;
          renderMetaLive();
        }, function(err){
          // Missing composite index or rules denial: degrade to 0,
          // don't crash. Same failure mode as queueWatchUnsub above.
          console.warn('[meta] queue snapshot error:', err && err.message);
        });
    } catch(e){}
    // (b) The old "open DM invites" cell (waitlist_posts, last 24h) is
    // gone — nothing writes new posts anymore since the join-the-
    // waitlist board was replaced by the /tournaments link.
  }

  // Drive the status-phase rotation. Reads elapsed time from
  // state.joinedAtMs (same source the countdown uses) so the phase
  // is always in sync with how long the user has been waiting.
  // When the phase actually changes (not every poll tick), fade the
  // text out → swap → fade in. The .26s opacity transition lives in
  // CSS via the .status.is-fading class.
  var statusCycleInterval = null;
  function startStatusCycle(){
    if (statusCycleInterval) clearInterval(statusCycleInterval);
    function tick(){
      var elapsed = Math.floor((Date.now() - state.joinedAtMs) / 1000);
      // Default to the LAST phase so elapsed >= the final `until`
      // (a tick racing the fallback) doesn't snap back to phase one.
      var phase = STATUS_PHASES[STATUS_PHASES.length - 1];
      for (var i = 0; i < STATUS_PHASES.length; i++){
        if (elapsed < STATUS_PHASES[i].until){ phase = STATUS_PHASES[i]; break; }
      }
      var main = document.getElementById('statusMain');
      var sub = document.getElementById('statusSub');
      var wrap = main ? main.parentElement : null;
      if (!main || !sub) return;
      var mainChanged = main.textContent !== phase.text;
      var subChanged = sub.textContent !== phase.sub;
      if (!mainChanged && !subChanged) return;
      // Crossfade: dim → swap → un-dim.
      if (wrap) wrap.classList.add('is-fading');
      setTimeout(function(){
        if (mainChanged) main.textContent = phase.text;
        if (subChanged) sub.textContent = phase.sub;
        if (wrap) wrap.classList.remove('is-fading');
      }, 260);
    }
    tick();
    statusCycleInterval = setInterval(function(){ if (!document.hidden) tick(); }, 1500);
  }

  // startPairingTicker() removed 2026-05-25 — see RECENT_PAIRINGS
  // comment for the why. The 'Recent pairing · @x ↔ @y · paired in Ns'
  // line was fabricated social-proof theater.

  // Mount the rooms-opening-worldwide globe once
  // /js/global-debate-map.js has loaded. Replaces the prior radar
  // mount (sweep arm + fabricated @handles). Honest ambient visual —
  // dots spawn, arcs draw, room-forming pills float in. Keeps a
  // handle so we can stop the rAF loop on re-render.
  var globalMapHandle = null;

  // ── Real presence pins (/api/presence-live) ─────────────────────
  // People seen on the site in the last 24 hours, city-level, fed
  // by the anonymous track.js beat. The server excludes suspicious cell
  // bursts and publishes one dot per retained location. When we have pins,
  // the globe shows ONLY them and the
  // arcs + "Room forming" pills are disabled so nothing fabricated
  // rides on real data. When the fetch fails or comes back empty, the
  // globe falls back to the ambient decorative city pool, unlabeled,
  // exactly as before. Server response is shared-cached 5 minutes, so the
  // 2-min repoll costs ~1 cache read.
  var presenceLive = null;
  var presencePollTimer = null;
  function fetchPresenceLive(){
    fetch('/api/presence-live').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      var had = !!(presenceLive && presenceLive.pins && presenceLive.pins.length);
      presenceLive = (d && Array.isArray(d.pins)) ? d : null;
      var has = !!(presenceLive && presenceLive.pins.length);
      renderLiveNote();
      // Remount only on a state change (ambient ↔ real pins) so the
      // globe doesn't visibly restart every poll.
      if (has !== had && document.getElementById('globalDebateMap')) mountGlobalMap('globalDebateMap');
    }).catch(function(){});
  }
  function renderLiveNote(){
    var note = document.getElementById('globeLiveNote');
    if (!note) return;
    var n = presenceLive && (presenceLive.online24 || presenceLive.online30);
    if (n > 0) {
      // "visits", not "people": the count is per-tab sessions, not humans.
      note.textContent = 'Each red dot: a visit to Debatable in the last 24 hours (' + n + ' visits).';
      note.hidden = false;
    } else {
      note.hidden = true; // honest empty state: no claim, ambient art only
    }
  }
  function mountGlobalMap(containerId){
    if (globalMapHandle && globalMapHandle.stop) { try { globalMapHandle.stop(); } catch(e){} }
    globalMapHandle = null;
    function tryMount(retries){
      if (!window.GlobalDebateMap) {
        if (retries > 0) return setTimeout(function(){ tryMount(retries - 1); }, 60);
        return;
      }
      var c = document.getElementById(containerId);
      if (!c) return;
      var opts = {
        maxActiveDots: 7,
        maxActiveArcs: 2,
        spawnEveryMs:  1700,
        roomEveryMs:   4200,
        rotateSec:     240,
        palette:       'auto',
      };
      var pins = presenceLive && presenceLive.pins;
      if (pins && pins.length) {
        opts.cities = pins.map(function(p){
          return { name: p.city || 'Somewhere on Earth', lat: p.lat, lng: p.lng };
        });
        opts.maxActiveArcs  = 0;    // no fabricated "Room forming" on real pins
        opts.persistentDots = true; // real people don't blink out
      }
      globalMapHandle = window.GlobalDebateMap.mount(c, opts);
      renderLiveNote();
    }
    tryMount(40);
  }
  fetchPresenceLive();
  if (!presencePollTimer) presencePollTimer = setInterval(function(){
    if (document.hidden) return;
    if (!document.getElementById('globalDebateMap')) return;
    fetchPresenceLive();
  }, 120000);

  // Flat 2D presence background (#presenceMapBg, fixed behind the UI).
  // The module fetches, polls, resizes, and pulses on its own; empty
  // state is just faint land dots, so there is nothing to fake.
  (function mountPresenceBg(retries){
    if (!window.PresenceMap) {
      if (retries > 0) return setTimeout(function(){ mountPresenceBg(retries - 1); }, 80);
      return;
    }
    var host = document.getElementById('presenceMapBg');
    if (host) window.PresenceMap.mount(host, { palette: 'auto' });
  })(50);

  // Legacy world-globe mount, kept for the SIGN-IN GATE only. That
  // surface is pre-auth social proof — showing the geographic spread
  // of debaters is the right read there. The active matchmaking
  // (renderSearching) uses mountRadar instead.
  var globeHandle = null;
  function mountGlobe(canvasId){
    if (globeHandle && globeHandle.stop) { try { globeHandle.stop(); } catch(e){} }
    globeHandle = null;
    function tryMount(retries){
      if (!window.DebateGlobe) {
        if (retries > 0) return setTimeout(function(){ tryMount(retries - 1); }, 60);
        return;
      }
      var c = document.getElementById(canvasId);
      if (!c) return;
      globeHandle = window.DebateGlobe.mount(c, {
        palette: 'accent',
        rotateDegPerSec: 5,
        showArcs: true,
        showScanSweep: true,
        transparent: true,
      });
    }
    tryMount(40);
  }

  // ── Render: matched! ─────────────────────────────────
  // radarHandle: the searching view now renders the globe
  // (global-debate-map.js), not the old radar, so this stays null and
  // renderMatched's `if (radarHandle && ...)` guards fall through to
  // the immediate swap. It MUST be declared: leaving it implicit made
  // line "if (radarHandle && radarHandle.lockOn)" throw
  // ReferenceError, which aborted renderMatched before subscribeMyDoc
  // could navigate, stranding BOTH matched users on the search screen
  // until the 60s AI fallback. That was the "live spawn never works
  // for two humans" bug — the server paired them fine; the client
  // crashed rendering the match.
  var radarHandle = null;
  function renderMatched(roomName, peerName, peerAvatar){
    closeSignInPop();
    removeWaitRail();
    try { gtag('event', 'spar_match_found', { format: formatParam, wait_sec: state.joinedAtMs ? Math.floor((Date.now() - state.joinedAtMs) / 1000) : 0 }); } catch(e){}

    // Cinematic two-step: trigger the radar convergence FIRST (nodes
    // pull toward center, sweep fades, expanding ring pulses outward,
    // center pulse brightens), wait ~700ms for the visual beat, THEN
    // swap the eyebrow + headline so "Match found / paired with X"
    // arrives synchronously with the converged radar instead of a
    // hard cut. Falls through to immediate swap if the radar isn't
    // mounted (shouldn't happen in normal flow but defensive).
    var beatMs = 750;
    if (radarHandle && radarHandle.lockOn){
      try { radarHandle.lockOn(); } catch(e){ beatMs = 0; }
    } else {
      beatMs = 0;
    }

    // Soft-fade existing copy so the swap doesn't snap into the
    // converged radar. We dim everything except the canvas, which
    // keeps animating through the convergence.
    var fadeNodes = shell.querySelectorAll('.eyebrow, h1, .lede, .meta-strip, .status, .countdown, .btn-row, .organized-pivot, .pairing-ticker, .queue-stats, .diag, .foot, .format-pill');
    Array.prototype.forEach.call(fadeNodes, function(el){
      el.style.transition = 'opacity .35s ease';
      el.style.opacity = '0';
    });

    setTimeout(function(){
      // Beat is done — stop the radar (we're about to navigate to the
      // round room anyway) and swap to the matched markup. Cascading
      // fade-in via transition-delay on each child.
      if (radarHandle && radarHandle.stop){ try { radarHandle.stop(); } catch(e){} radarHandle = null; }

      shell.innerHTML =
        '<div class="eyebrow" style="background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.4);color:#4ade80;opacity:0;transition:opacity .4s ease"><span class="pip" style="background:#22c55e;box-shadow:0 0 8px #22c55e"></span>Match found</div>' +
        avatarMarkup(peerAvatar, 'match-avatar', '', peerName || 'Debater', '') +
        '<h1 style="opacity:0;transition:opacity .4s ease .08s">You\'re paired with <em>' + escHtml(peerName || 'your opponent') + '</em>' + nameDot(peerName || 'your opponent') + '</h1>' +
        '<p class="lede" style="opacity:0;transition:opacity .4s ease .16s">Joining the round room now. Camera + mic prompt in a sec; accept and you\'re live.</p>' +
        '<div class="orb-wrap matched" id="orbWrap" style="opacity:0;transition:opacity .4s ease .24s"><div class="orb-glow"></div><div class="orb-ring"></div><div class="orb-core"></div></div>' +
        '<div class="status" style="opacity:0;transition:opacity .4s ease .32s">Loading round…</div>';

      // Double-rAF so the opacity:0 → opacity:1 transition actually
      // plays — setting both in the same paint tick is a no-op.
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          var nodes = shell.querySelectorAll('.eyebrow, h1, .lede, .orb-wrap, .status');
          Array.prototype.forEach.call(nodes, function(el){ el.style.opacity = '1'; });
        });
      });
    }, beatMs);
  }

  // ── Render: AI fallback fired ────────────────────────
  // Fire-and-forget POST to /api/log-missed-match. Increments the
  // public missed-match counter that's displayed on /spar's meta strip
  // and /live's callout. Dedupes via sessionStorage so a tab refresh
  // mid-queue doesn't double-count: same (format, joinedAtMs, reason)
  // tuple only fires once per browser session.
  function logMissedMatch(reason){
    try {
      var key = 'da-missed-' + formatParam + '-' + state.joinedAtMs + '-' + reason;
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, '1');
    } catch (e) { /* private mode — proceed without dedupe */ }
    try {
      fetch('/api/log-missed-match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ format: formatParam, reason: reason }),
        keepalive: true, // survive navigation in renderFallback
      }).catch(function(){});
    } catch (e) { /* never block the flow on a logging failure */ }
  }

  // Spar intent. Called from joinQueue the moment a search actually
  // begins — after the sign-in/age gates pass and a queue doc is written,
  // NOT on page load. That distinction is the whole accuracy of the
  // public "looked for a live round" count: a /spar visit that bounces,
  // a bot rendering the page, or a guest who hits the sign-in wall and
  // never queues is not someone who looked for a round, and firing on
  // load counted all three. A superset of misses (every miss had an
  // attempt, but plenty of attempts end in a fast AI fallback that never
  // reaches the >=15s "miss" bar). Deduped per format per tab session so
  // a requeue after a pass doesn't inflate it.
  function logSparAttempt(){
    try {
      var k = 'da-spar-attempt-' + formatParam;
      if (sessionStorage.getItem(k)) return;
      sessionStorage.setItem(k, '1');
    } catch (e) { /* private mode — proceed without dedupe */ }
    try {
      fetch('/api/log-missed-match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ format: formatParam, reason: 'attempt' }),
        keepalive: true,
      }).catch(function(){});
    } catch (e) { /* never block the flow on a logging failure */ }
  }

  // ── AI fallback draft ───────────────────────────────────────────
  // The queue timed out. That is already the disappointing half of the
  // moment, so the ritual stays the same rather than degrading into a
  // motion the machine picked: same five, same two strikes, same coin.
  // The AI's strikes come from the server and only after ours are
  // committed, so the blind phase is blind here too.
  //
  // Everything after the reveal resolves locally. There is no opponent left
  // to protect once both sets are on screen, so a round trip per beat would
  // buy nothing.
  var AI_DRAFT_UID = 'ai';

  function beginAIDraft(){
    removeWaitRail();
    shell.innerHTML =
      '<div class="draft-wrap">' +
        '<div class="draft-head">' +
          '<div class="draft-step">AI opponent</div>' +
          '<h1 class="draft-title">No human yet. <em>Dealing the motions</em>.</h1>' +
          '<p class="draft-sub">Same draft, same strikes. You stay in the queue while you play.</p>' +
        '</div>' +
        '<div class="orb-wrap"><div class="orb-glow"></div><div class="orb-ring"></div><div class="orb-core"></div></div>' +
      '</div>';
    document.body.classList.add('draft-live');
    try { gtag('event', 'spar_ai_fallback', { format: formatParam, draft: 1 }); } catch(e){}
    logMissedMatch('fallback');
    draftPost({ action: 'solo', format: formatParam }, 'solo').then(function(j){
      if (!j || !j.ok || !j.slate || !j.slate.length){
        // The draft is a flourish; the round is the product. A failed slate
        // must never cost someone their AI round.
        console.warn('[spar] solo slate unavailable, handing off plain');
        goToPractice('', '');
        return;
      }
      state.aiDraft = {
        seed: j.seed, slate: j.slate,
        motionUid: j.motionUid, sideUid: j.sideUid,
        strikes: {}, motionId: null, side: null, phase: 'strike',
      };
      state.draftPicks = [];
      state.draftSubmitting = false;
      renderAIStrike();
    });
  }

  function goToPractice(motion, side){
    document.body.classList.remove('draft-live');
    var params = new URLSearchParams({ format: formatParam, now: '1', handoff: 'spar-draft' });
    if (motion) params.set('motion', motion);
    if (side) params.set('side', side === 'pro' ? 'prop' : 'opp');
    location.href = '/practice?' + params.toString();
  }

  function aiFaceHtml(){
    return '<div class="draft-vs">' +
        '<div class="draft-vs-side acting">' +
          draftFaceHtml(currentPublicAvatarIdentity(), (state.user && state.user.uid) || '', 'You') +
          '<span class="draft-vs-name">You<span class="draft-vs-state">striking</span></span>' +
        '</div>' +
        '<div class="draft-vs-mid">VS</div>' +
        '<div class="draft-vs-side acting">' +
          '<span class="draft-vs-face">AI</span>' +
          '<span class="draft-vs-name">AI opponent<span class="draft-vs-state">striking</span></span>' +
        '</div>' +
      '</div>';
  }

  function renderAIStrike(){
    var dr = state.aiDraft;
    var cards = dr.slate.map(function(m, i){
      return '<button type="button" class="draft-card" data-ai-strike="' + escHtml(m.id) + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
        '</button>';
    }).join('');
    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftClockHtml() +
        aiFaceHtml() +
        draftHeadHtml('Step 1 of 2', 'Strike <em>two</em> motions.',
          'The AI is striking two as well. ' +
          '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_STRIKE_SEC + '</span>s left.</span>') +
        '<div class="draft-slate">' + cards + '</div>' +
      '</div>';
    shell.querySelectorAll('[data-ai-strike]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-ai-strike');
        var at = state.draftPicks.indexOf(id);
        if (at >= 0){ state.draftPicks.splice(at, 1); btn.classList.remove('struck'); return; }
        if (state.draftPicks.length >= DRAFT_STRIKES) return;
        state.draftPicks.push(id);
        btn.classList.add('struck');
        if (state.draftPicks.length >= DRAFT_STRIKES) submitAIStrikes();
      });
    });
    startDraftClock(DRAFT_STRIKE_SEC, submitAIStrikes);
  }

  function submitAIStrikes(){
    if (state.draftSubmitting) return;
    state.draftSubmitting = true;
    clearDraftTimer();
    shell.querySelectorAll('[data-ai-strike]').forEach(function(b){ b.disabled = true; });
    draftPost({
      action: 'solo', format: formatParam,
      seed: state.aiDraft.seed, strikes: state.draftPicks.slice(),
    }, 'solo-strike').then(function(j){
      if (!j || !j.ok || !j.draft){ goToPractice('', ''); return; }
      state.aiDraft = j.draft;
      // A beat of hesitation before the reveal. Instant would read as a
      // lookup table rather than an opponent.
      state.draftRevealTimer = setTimeout(renderAIReveal, 700);
    });
  }

  function renderAIReveal(){
    var dr = state.aiDraft;
    var me = state.user.uid;
    var by = draftStruckBy(dr);
    var survivors = draftSurvivors(dr);
    var cards = dr.slate.map(function(m, i){
      var who = by[m.id] || [];
      var mineHit = who.indexOf(me) >= 0;
      var theirsHit = who.indexOf(AI_DRAFT_UID) >= 0;
      var cls = 'draft-card', label = '';
      if (mineHit && theirsHit){ cls += ' struck struck-both'; label = 'both struck'; }
      else if (mineHit){ cls += ' struck'; label = 'you struck'; }
      else if (theirsHit){ cls += ' struck struck-them'; label = 'AI struck'; }
      else { cls += ' alive'; label = 'survives'; }
      return '<div class="' + cls + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
          '<span class="draft-by">' + escHtml(label) + '</span>' +
        '</div>';
    }).join('');
    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftHeadHtml('The reveal',
          survivors.length === 1 ? 'One motion <em>left standing</em>.' : survivors.length + ' motions <em>survived</em>.',
          '') +
        '<div class="draft-slate">' + cards + '</div>' +
      '</div>';
    state.draftRevealTimer = setTimeout(advanceAIDraft, DRAFT_REVEAL_MS);
  }

  // Local phase machine, valid only because both strike sets are already on
  // screen. The human-vs-human draft never does this: there the server owns
  // every transition, because there a client deciding its own side would
  // decide to win.
  function advanceAIDraft(){
    var dr = state.aiDraft;
    var survivors = draftSurvivors(dr);
    if (!dr.motionId){
      if (survivors.length === 1){ dr.motionId = survivors[0].id; }
      else if (String(dr.motionUid) === String(state.user.uid)){ return renderAIMotionPick(survivors); }
      else { dr.motionId = survivors[0].id; }  // the AI's call, taken deterministically
    }
    if (!dr.side){
      if (String(dr.sideUid) === String(state.user.uid)) return renderAISidePick();
      // The AI called the side, so ours is the remainder.
      dr.side = Math.random() < 0.5 ? 'pro' : 'con';
      return finishAIDraft(dr.side === 'pro' ? 'con' : 'pro');
    }
    finishAIDraft(dr.side);
  }

  function renderAIMotionPick(survivors){
    var cards = survivors.map(function(m, i){
      return '<button type="button" class="draft-card" data-ai-motion="' + escHtml(m.id) + '" style="--i:' + i + '">' +
          '<span class="draft-num">' + (i + 1) + '</span>' +
          '<span class="draft-text">' + escHtml(m.text) + '</span>' +
        '</button>';
    }).join('');
    shell.innerHTML =
      '<div class="draft-wrap">' + draftClockHtml() + draftCoinHtml(true, 'the motion') +
        draftHeadHtml('Step 2 of 2', 'You call the <em>motion</em>.',
          'The AI takes the side you leave it. ' +
          '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_PICK_SEC + '</span>s.</span>') +
        '<div class="draft-slate">' + cards + '</div>' +
      '</div>';
    shell.querySelectorAll('[data-ai-motion]').forEach(function(btn){
      btn.addEventListener('click', function(){
        clearDraftTimer();
        state.aiDraft.motionId = btn.getAttribute('data-ai-motion');
        advanceAIDraft();
      });
    });
    startDraftClock(DRAFT_PICK_SEC, function(){
      state.aiDraft.motionId = survivors[0].id;
      advanceAIDraft();
    });
  }

  function renderAISidePick(){
    var motion = draftMotionText(state.aiDraft);
    shell.innerHTML =
      '<div class="draft-wrap">' + draftClockHtml() + draftCoinHtml(true, 'your side') +
        draftHeadHtml('Step 2 of 2', 'Pick your <em>side</em>.',
          'This is the motion you are arguing. ' +
          '<span class="draft-nb"><span class="draft-count" id="draftSecs">' + DRAFT_PICK_SEC + '</span>s.</span>') +
        '<div class="draft-final"><p class="draft-final-motion">' + escHtml(motion) + '</p>' +
          '<div class="draft-final-sides"><span class="draft-badge">the motion</span></div></div>' +
        '<div class="draft-sides">' +
          '<button type="button" class="draft-side-btn" data-ai-side="pro">' +
            '<span class="draft-side-name">Pro</span>' +
            '<span class="draft-side-sub">You argue for it. You speak first.</span></button>' +
          '<button type="button" class="draft-side-btn" data-ai-side="con">' +
            '<span class="draft-side-name">Con</span>' +
            '<span class="draft-side-sub">You argue against it. You answer them.</span></button>' +
        '</div>' +
      '</div>';
    shell.querySelectorAll('[data-ai-side]').forEach(function(btn){
      btn.addEventListener('click', function(){
        clearDraftTimer();
        finishAIDraft(btn.getAttribute('data-ai-side'));
      });
    });
    startDraftClock(DRAFT_PICK_SEC, function(){
      finishAIDraft(Math.random() < 0.5 ? 'pro' : 'con');
    });
  }

  function finishAIDraft(mySide){
    clearDraftTimer();
    var motion = draftMotionText(state.aiDraft);
    shell.innerHTML =
      '<div class="draft-wrap">' +
        draftHeadHtml('Locked', 'Round <em>set</em>.', 'Loading your AI round…') +
        '<div class="draft-final">' +
          '<p class="draft-final-motion">' + escHtml(motion) + '</p>' +
          '<div class="draft-final-sides">' +
            '<span class="draft-badge' + (mySide === 'con' ? ' con' : '') + '">You: ' +
              (mySide === 'pro' ? 'Pro' : 'Con') + '</span>' +
            '<span class="draft-badge' + (mySide === 'pro' ? ' con' : '') + '">AI: ' +
              (mySide === 'pro' ? 'Con' : 'Pro') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    try { gtag('event', 'spar_ai_draft_done', { format: formatParam, side: mySide }); } catch(e){}
    setTimeout(function(){ goToPractice(motion, mySide); }, 1400);
  }

  function renderFallback(){
    removeWaitRail();
    shell.innerHTML =
      '<div class="eyebrow" style="background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.4);color:#fbbf24"><span class="pip" style="background:#f59e0b;box-shadow:0 0 8px #f59e0b"></span>AI Fallback</div>' +
      '<h1>No human yet. <em>Spinning up the AI</em>.</h1>' +
