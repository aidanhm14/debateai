<script>
(function(){
  try{
    var t=localStorage.getItem('da-theme');
    if(!t || t==='day') t='crimson';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){ document.documentElement.setAttribute('data-theme','crimson'); }
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="grey"]{
  --bg:#0a0a0c;--bg-elev:#101014;--bg-card:#15151a;
  --border:rgba(255,255,255,.18);--border-strong:rgba(255,255,255,.32);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.4);
  --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.65);
  --shadow-lg:0 18px 60px rgba(0,0,0,.55);--bar-bg:rgba(10,10,12,.92);
}
[data-theme="crimson"]{
  --bg:#000;--bg-elev:#0c0306;--bg-card:#13070a;
  --border:rgba(239,68,68,.22);--border-strong:rgba(239,68,68,.42);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.55);
  --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.65);
  --shadow-lg:0 18px 60px rgba(0,0,0,.6);--bar-bg:rgba(0,0,0,.95);
}
[data-theme="light"]{
  --bg:#fafaf7;--bg-elev:#fff;--bg-card:#fff;
  --border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.22);
  --accent:#dc2626;--accent-glow:rgba(220,38,38,.3);
  --green:#16a34a;--amber:#d97706;--blue:#2563eb;
  --text:#1a1a1f;--text-dim:rgba(0,0,0,.72);--text-ghost:rgba(0,0,0,.5);
  --shadow-lg:0 18px 60px rgba(0,0,0,.14);--bar-bg:rgba(250,250,247,.94);
}
html,body{min-height:100%}
body{
  font-family:'Crimson Pro','Fraunces',Georgia,"Times New Roman",serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:96px 18px 80px}
.page-h{margin:0 0 4px;font-size:2rem;font-weight:800;letter-spacing:-.02em}
.page-sub{margin:0 0 22px;font-size:.95rem;color:var(--text-ghost)}
/* The feed reuses the .ui-bell-* row styles that notifications.js injects.
   The card just gives them a bordered, full-width home instead of a
   320px dropdown. */
.notif-card{
  border:1px solid var(--border);border-radius:16px;overflow:hidden;
  background:var(--bg-card);box-shadow:var(--shadow-lg);
}
#daNotifPage:empty::before{
  content:"Loading notifications…";
  display:block;padding:28px 16px;text-align:center;
  color:var(--text-ghost);font-size:.9rem;
}
</style>
</head>
<body>

<div id="daTopbar"></div>

<main class="wrap">
  <h1 class="page-h">Notifications</h1>
  <p class="page-sub">Product updates, live challenges, replies to your threads, and your messages.</p>
  <div class="notif-card">
    <div id="daNotifPage"></div>
  </div>
</main>

<script defer src="/js/topbar.js"></script>
<script defer src="/js/notifications.js"></script>
<script defer src="/js/cohort-banner.js"></script>
</body>
</html>
