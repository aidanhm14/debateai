<style>
/* ── Neural constellation on this surface (2026-08-18 sitewide sweep;
   same recipe as /pricing and /schools, per Aidan: "it adds a nice
   depth"). The shared canvas is position:fixed; painted late at
   z-index 0 it would sit ON TOP of static content, so the page
   background moves to <html>, <body> goes transparent, and the canvas
   drops to z-index -1: behind every element, in front of the paper.
   Dark themes keep ui.css's own opacity; only the light arm is lifted,
   because red-on-cream at .45 is close to invisible. */
html[data-lightweb="web"]{background:var(--bg)}
html[data-lightweb="web"] body{background:transparent}
html[data-lightweb="web"] .ui-neural-canvas{z-index:-1}
html[data-lightweb="web"][data-theme="light"] .ui-neural-canvas{opacity:1}
html[data-lightweb="web"]:not([data-theme="light"]) .ui-neural-canvas{opacity:.8}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="grey"]{
  --bg:#0a0a0c;--bg-elev:#101014;--bg-card:#15151a;
  --border:rgba(255,255,255,.18);--border-strong:rgba(255,255,255,.32);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.4);
  --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.68);
  --shadow-lg:0 18px 60px rgba(0,0,0,.55);--bar-bg:rgba(10,10,12,.92);
}
[data-theme="crimson"]{
  --bg:#000;--bg-elev:#0c0306;--bg-card:#13070a;
  --border:rgba(239,68,68,.22);--border-strong:rgba(239,68,68,.42);
  --accent:#ef4444;--accent-glow:rgba(239,68,68,.55);
  --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;
  --text:#fff;--text-dim:rgba(255,255,255,.85);--text-ghost:rgba(255,255,255,.68);
  --shadow-lg:0 18px 60px rgba(0,0,0,.6);--bar-bg:rgba(0,0,0,.95);
}
[data-theme="light"]{
  --bg:#fafaf7;--bg-elev:#fff;--bg-card:#fff;
  --border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.22);
  --accent:#dc2626;--accent-glow:rgba(220,38,38,.3);
  --green:#16a34a;--amber:#d97706;--blue:#2563eb;
  --text:#1a1a1f;--text-dim:rgba(0,0,0,.72);--text-ghost:rgba(0,0,0,.64);
  --shadow-lg:0 18px 60px rgba(0,0,0,.14);--bar-bg:rgba(250,250,247,.94);
}
html,body{min-height:100%}
body{
  font-family:'Archivo','Fraunces',Georgia,"Times New Roman",serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:112px 24px 96px}
.page-h{margin:0 0 6px;font-size:clamp(2.45rem,4vw,3.35rem);font-weight:800;letter-spacing:-.035em;line-height:1}
.page-sub{margin:0;font-size:1.12rem;line-height:1.5;color:var(--text-ghost)}
.notif-filters{display:flex;align-items:center;gap:9px;margin:28px 0 18px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.notif-filters::-webkit-scrollbar{display:none}
.notif-filter{flex:none;min-height:42px;padding:0 17px;border:1px solid var(--border);border-radius:999px;background:transparent;
  color:var(--text-dim);font-family:Archivo,Georgia,serif;font-size:.88rem;font-weight:750;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s,transform .15s}
.notif-filter:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.notif-filter:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notif-filter[aria-pressed="true"]{color:#fff;border-color:var(--accent-solid,#b91c1c);background:var(--accent-solid,#b91c1c);box-shadow:0 8px 22px rgba(239,68,68,.18)}
/* The feed reuses the .ui-bell-* row styles that notifications.js injects.
   These id-scoped rules intentionally outrank the compact bell defaults. */
.notif-card{
  border:1px solid var(--border);border-radius:18px;overflow:hidden;
  background:var(--bg-card);box-shadow:var(--shadow-lg);
}
#daNotifPage .ui-bell-head{padding:18px 22px 13px;font-size:.78rem;letter-spacing:.15em}
#daNotifPage > .ui-bell-head:first-child{border-top:0}
#daNotifPage .ui-bell-list{max-height:none;overflow:visible}
#daNotifPage .ui-bell-row{gap:15px;padding:17px 22px;min-height:76px}
#daNotifPage .ui-bell-av{width:40px;height:40px;font-size:.9rem}
#daNotifPage .ui-bell-row__main{gap:4px}
#daNotifPage .ui-bell-row__name{font-size:1.04rem;line-height:1.25}
#daNotifPage .ui-bell-row__preview{font-size:.9rem;line-height:1.45}
#daNotifPage .ui-bell-row__time{font-size:.78rem;padding-left:8px}
#daNotifPage .ui-bell-empty{padding:30px 22px;font-size:.96rem;line-height:1.6}
#daNotifPage .ui-bell-foot{padding:14px 18px;font-size:.9rem}
#daNotifPage .ui-bell-la{padding:18px 22px!important;gap:14px!important}
#daNotifPage .ui-bell-la > span:first-child{width:40px!important;height:40px!important}
#daNotifPage:empty::before{
  content:"Loading notifications…";
  display:block;padding:36px 22px;text-align:center;
  color:var(--text-ghost);font-size:1rem;
}
@media(max-width:640px){
  .wrap{padding:82px 12px 72px}.page-h{font-size:2.45rem}.page-sub{font-size:1rem}
  .notif-filters{margin-top:22px;gap:7px}.notif-filter{min-height:40px;padding:0 15px;font-size:.82rem}
  .notif-card{border-radius:14px}
  #daNotifPage .ui-bell-head{padding:16px 16px 12px;font-size:.72rem}
  #daNotifPage .ui-bell-row{align-items:flex-start;gap:12px;padding:16px;min-height:72px}
  #daNotifPage .ui-bell-av{width:36px;height:36px}
  #daNotifPage .ui-bell-row__name{font-size:.98rem;white-space:normal}
  #daNotifPage .ui-bell-row__preview{font-size:.86rem}
  #daNotifPage .ui-bell-row__time{font-size:.72rem;padding-left:2px;padding-top:2px}
  #daNotifPage .ui-bell-la{padding:16px!important}
}
</style>
</head>
<body>

<div id="daTopbar"></div>

<main class="wrap">
  <h1 class="page-h">Notifications</h1>
  <p class="page-sub">Matches, replies, messages, and updates. Filter to what matters.</p>
  <div class="notif-filters" id="daNotifFilters" role="group" aria-label="Filter notifications">
    <button class="notif-filter" type="button" data-notif-filter="all" aria-pressed="true" aria-controls="daNotifPage">All</button>
    <button class="notif-filter" type="button" data-notif-filter="matches" aria-pressed="false" aria-controls="daNotifPage">Matches</button>
    <button class="notif-filter" type="button" data-notif-filter="replies" aria-pressed="false" aria-controls="daNotifPage">Replies</button>
    <button class="notif-filter" type="button" data-notif-filter="messages" aria-pressed="false" aria-controls="daNotifPage">Messages</button>
    <button class="notif-filter" type="button" data-notif-filter="updates" aria-pressed="false" aria-controls="daNotifPage">Updates</button>
  </div>
  <div class="notif-card">
    <div id="daNotifPage"></div>
  </div>
</main>

<script defer src="/js/topbar.js"></script>
<script defer src="/js/notifications.js"></script>
<script defer src="/js/cohort-banner.js"></script>
<!-- Shared neural-constellation background. Animates on this light
     surface because <html> carries data-lightweb="web". -->
<canvas id="uiNeuralCanvas" class="ui-neural-canvas"></canvas>
<script defer src="/js/ui-neural.js"></script>
</body>
</html>
