<script>

  var t = 'light';
  try { t = localStorage.getItem('da-theme') || 'light'; } catch(e){}
  if (t !== 'light') t = 'crimson';
  document.documentElement.setAttribute('data-theme', t);

<style>
/* ── Neural constellation on this surface (2026-08-18 sitewide sweep;
   same recipe as /pricing and /schools, per Aidan: "it adds a nice
   depth"). The shared canvas is position:fixed; painted late at
   z-index 0 it would sit ON TOP of static content, so the page
   background moves to <html>, <body> goes transparent, and the canvas
   drops to z-index -1: behind every element, in front of the paper.
   Dark themes keep ui.css's own opacity; only the light arm is lifted,
   because red-on-cream at .45 is close to invisible. */
html[data-lightweb="web"]{background:radial-gradient(900px 500px at 80% -10%, rgba(239,68,68,.10), transparent 60%),radial-gradient(700px 500px at 0% 10%, rgba(167,139,250,.06), transparent 55%),var(--bg)}
html[data-lightweb="web"] body{background:transparent}
html[data-lightweb="web"] .ui-neural-canvas{z-index:-1}
html[data-lightweb="web"][data-theme="light"] .ui-neural-canvas{opacity:.75}

  :root{
    --bg:#0a0a0b; --bg-card:#141416; --bg-card2:#1a1a1d;
    --text:#f4f4f5; --text-dim:#a1a1aa; --text-ghost:#a1a1aa;
    --accent:#ef4444; --border:rgba(255,255,255,.10);
    --green:#34d399; --amber:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  em,i{font-style:normal}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(239,68,68,.10), transparent 60%),
      radial-gradient(700px 500px at 0% 10%, rgba(167,139,250,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Archivo',Georgia,serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  /* 100px clears the fixed shared topbar (52px bar + the 32px beta strip). */
  .wrap{max-width:820px;margin:0 auto;padding:100px 20px 80px}
  .back{display:inline-block;font-size:.92rem;color:var(--text-dim);text-decoration:none;font-weight:600;margin-bottom:14px}
  .back:hover{color:var(--text)}

  /* identity badges — mirror community.html so the badge means the same
     thing on every surface */
  .ident-badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;vertical-align:middle;line-height:1.5;white-space:nowrap}
  .ident-badge::before{font-size:.72rem;line-height:1}
  .ident-human{color:var(--green);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4)}
  .ident-human::before{content:"✓"}
  .ident-ai{color:#a78bfa;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.45)}
  .ident-ai::before{content:"◆"}
  .ident-debater{color:var(--text-dim);background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .ident-private{color:var(--amber);background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35)}

  .profile-card{
    background:linear-gradient(180deg,var(--bg-card),rgba(20,20,22,.6));
    border:1px solid var(--border);border-radius:18px;padding:26px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
  .phead{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .avatar{
    width:84px;height:84px;border-radius:50%;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:1.9rem;font-weight:900;color:#fff;letter-spacing:-.02em;
    background:linear-gradient(135deg,#3f3f46,#27272a);
    border:2px solid var(--border);
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar.is-ai{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:rgba(167,139,250,.6)}
  .avatar.is-human{border-color:rgba(52,211,153,.6)}
  .pname{font-size:1.75rem;font-weight:900;letter-spacing:-.02em;margin:0 0 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .phandle{color:var(--text-ghost);font-size:1rem;font-weight:600}
  .pmeta{color:var(--text-dim);font-size:1rem;font-weight:600;margin-top:5px}
  .pbadges{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pbio{margin-top:16px;font-size:1.08rem;line-height:1.6;color:var(--text-dim)}
  .pactions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
    border-radius:10px;padding:10px 18px;border:1px solid var(--border);
    background:var(--bg-card2);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    transition:transform .12s,border-color .15s,background .15s;
  }
  .btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.22)}
  .btn.primary{background:#b91c1c;border-color:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.3)}
  .btn.primary:hover{background:#dc2626}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

  /* ── level + XP ────────────────────────────────────────────────── */
  .level-card{margin-top:22px;background:var(--bg-card2);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .level-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .level-name{font-size:1.15rem;font-weight:900;letter-spacing:-.01em}
  .level-name span{color:var(--accent)}
  .level-xp{font-size:.9rem;color:var(--text-ghost);font-weight:700;font-family:'JetBrains Mono',ui-monospace,monospace}
  .xp-track{margin-top:12px;height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
  .xp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#b91c1c,var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .level-next{margin-top:9px;font-size:.9rem;color:var(--text-dim);line-height:1.5}

  /* ── subject skill map ─────────────────────────────────────────── */
  .sec{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .sec-title{font-size:1.3rem;font-weight:900;letter-spacing:-.01em;margin:0}
  .sec-sub{font-size:.9rem;color:var(--text-ghost);font-weight:600}
  .dom-list{display:flex;flex-direction:column;gap:9px}
  .dom{
    background:var(--bg-card2);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
  }
  .dom.untested{opacity:.62}
  .dom-name{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
  .dom-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dom-verdict{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .v-strength{color:var(--green);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.38)}
  .v-steady{color:var(--text-dim);background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .v-needs-work{color:var(--amber);background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35)}
  .v-untested{color:var(--text-ghost);background:transparent;border:1px dashed var(--border)}
  .dom-bar{grid-column:1/-1;height:6px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
  .dom-bar i{display:block;height:100%;border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .dom-stats{grid-column:1/-1;font-size:.85rem;color:var(--text-ghost);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;font-family:'JetBrains Mono',ui-monospace,monospace}
  .dom-stats b{color:var(--text-dim);font-weight:700}

  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .stat{flex:1 1 110px;background:var(--bg-card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center}
  .stat .n{font-size:1.5rem;font-weight:900;color:var(--text)}
  .stat .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-ghost);font-weight:700;margin-top:3px}

  /* ── recent rounds ─────────────────────────────────────────────── */
  .round{background:var(--bg-card2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .round + .round{margin-top:8px}
  .round-motion{font-size:1rem;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .round-sub{font-size:.82rem;color:var(--text-ghost);font-weight:600;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .round-score{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;font-size:1.1rem;flex:0 0 auto}
  .wl{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
  .wl-w{color:var(--green);background:rgba(52,211,153,.12)}
  .wl-l{color:#f87171;background:rgba(239,68,68,.12)}

  /* ── links ─────────────────────────────────────────────────────── */
  .link-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .link-chip{font-size:.9rem;font-weight:700;text-decoration:none;border:1px solid var(--border);background:var(--bg-card2);border-radius:999px;padding:8px 16px;color:var(--text-dim);transition:border-color .15s,color .15s}
  .link-chip:hover{color:var(--text);border-color:rgba(255,255,255,.24)}

  /* ── owner editor ──────────────────────────────────────────────── */
  .editor{margin-top:26px;background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.22);border-radius:16px;padding:20px}
  .editor h2{margin:0 0 4px;font-size:1.2rem;font-weight:900}
  .editor .hint{font-size:.92rem;color:var(--text-dim);margin:0 0 16px;line-height:1.5}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-ghost);margin-bottom:5px}
  .fld input,.fld textarea{
    width:100%;font:inherit;font-size:1rem;padding:10px 13px;border-radius:10px;
    background:var(--bg);border:1px solid var(--border);color:var(--text);
  }
  .fld input:focus,.fld textarea:focus{outline:none;border-color:rgba(239,68,68,.55)}
  .fld textarea{resize:vertical;min-height:74px;line-height:1.5}
  .fld .sub{font-size:.82rem;color:var(--text-ghost);margin-top:4px}
  .fld-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .vis-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}
  .vis-opt{
    flex:1 1 190px;cursor:pointer;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    background:var(--bg);transition:border-color .15s,background .15s;
  }
  .vis-opt.on{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.07)}
  .vis-opt .t{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:7px}
  .vis-opt .d{font-size:.85rem;color:var(--text-ghost);margin-top:4px;line-height:1.45}
  .vis-opt input{accent-color:var(--accent)}
  .ed-status{font-size:.9rem;font-weight:600;color:var(--text-ghost);margin-left:10px}
  .ed-status.ok{color:var(--green)}
  .ed-status.err{color:#f87171}

  .empty{
    background:var(--bg-card2);border:1px dashed var(--border);border-radius:12px;
    padding:18px;font-size:.98rem;color:var(--text-dim);line-height:1.6;text-align:center;
  }
  .ai-explain{
    margin-top:20px;padding:16px 18px;border-radius:14px;
    background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.28);
    font-size:.98rem;line-height:1.6;color:var(--text-dim);
  }
  .ai-explain strong{color:#c4b5fd}
  .ai-explain ul{margin:10px 0 0;padding-left:18px}
  .ai-explain li{margin:3px 0}
  .note{margin-top:22px;font-size:.88rem;line-height:1.55;color:var(--text-ghost);text-align:center}
  .note a{color:var(--text-dim);text-decoration:underline}
  .skel{color:var(--text-ghost);text-align:center;padding:40px 0;font-size:1rem}
  /* ── keep exploring: routes onward so a profile is never a dead end ── */
  .explore-row{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .explore-row a{font-size:.92rem;font-weight:700;text-decoration:none;border:1px solid var(--border);background:var(--bg-card2);border-radius:999px;padding:9px 18px;color:var(--text-dim);transition:border-color .15s,color .15s}
  .explore-row a:hover{color:var(--text);border-color:rgba(255,255,255,.24)}
  @media(max-width:560px){
    .fld-2{grid-template-columns:1fr}
    .phead{gap:14px}
    .avatar{width:64px;height:64px;font-size:1.5rem}
    .wrap{padding:22px 14px 70px}
    .profile-card{padding:20px}
  }
</style>

  <!-- Shared topbar: same nav, theme toggle, and sign-in as the rest of
       the site, so a profile is a page IN the product, not a dead end. -->
  <div id="daTopbar"></div>

  <div class="wrap">
    <a class="back" href="/leaderboard">← Back to the leaderboard</a>
    <div id="profile" class="profile-card"><div class="skel">Loading profile…</div></div>

    <div class="note" id="footNote">
      Humans are marked <span class="ident-badge ident-human">Human Verified</span> once a judged round is on their record. AI personas are always marked <span class="ident-badge ident-ai">AI Persona</span>. We never present a bot as a person.

<script>
(function(){
  'use strict';

  var FIREBASE_CONFIG = {
    apiKey: ["AIzaSyDDx","TYlyWLOJnFP99","e7XsLPb3FwIEijNNM"].join(""),
    authDomain: "debateos-78ac5.firebaseapp.com",
    projectId: "debateos-78ac5",
    storageBucket: "debateos-78ac5.firebasestorage.app",
    messagingSenderId: "860359449192",
    appId: "1:860359449192:web:f5dc0060dbd50d6c4fb9dd",
    measurementId: "G-0V4R5MY3BT"
  };
  var db = null, auth = null;
  try {
    if (typeof firebase !== 'undefined'){
      if (!(firebase.apps && firebase.apps.length)) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      if (firebase.auth) auth = firebase.auth();
    }
  } catch(e){ console.warn('[users] firebase init failed', e); }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function $(id){ return document.getElementById(id); }

  // Resolve the handle from the path (/users/<handle>, served via a
  // Netlify 200-rewrite so the URL is preserved) or a ?handle= / ?h=
  // query param (works under a plain static server / preview too).
  function getHandle(){
    var qs = new URLSearchParams(location.search);
    var q = qs.get('handle') || qs.get('h');
    if (q) return q;
    var m = location.pathname.match(/\/users\/([^\/?#]+)/i);
    if (m && m[1] && m[1].toLowerCase() !== 'users.html') return decodeURIComponent(m[1]);
    return '';
  }
  var QS = new URLSearchParams(location.search);
  var handle = String(getHandle() || '').replace(/^@/, '').toLowerCase();
  var uidParam = QS.get('uid') || '';
  var isAI = QS.get('ai') === '1';

  function nameFromHandle(h){
    if (!h) return 'New member';
    return h.replace(/[-_]+/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
  }
  function initials(name){
    var parts = String(name||'').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function slugify(s){
    return String(s||'').toLowerCase().trim()
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
  }
  function fmtScore(n){ return (typeof n==='number' && isFinite(n)) ? n.toFixed(1) : '—'; }
  function millisOf(ts){
    if (!ts) return 0;
    try {
      if (typeof ts === 'number') return ts;
      if (typeof ts.toMillis === 'function') return ts.toMillis();
      if (typeof ts.toDate === 'function') return ts.toDate().getTime();
      var t = new Date(ts).getTime();
      return isFinite(t) ? t : 0;
    } catch(e){ return 0; }
  }
  function fmtAgo(ts){
    var t = millisOf(ts);
    if (!t) return '';
    var s = Math.max(0, Math.floor((Date.now()-t)/1000));
    if (s < 3600) return Math.max(1, Math.floor(s/60)) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    var d = Math.floor(s/86400);
    if (d < 7) return d + 'd ago';
    if (d < 60) return Math.floor(d/7) + 'w ago';
    return Math.floor(d/30) + 'mo ago';
  }

  var host = $('profile');
  var extras = $('extras');
  var me = null;          // signed-in firebase user
  var targetUid = '';     // whose profile this is
  var profileDoc = null;  // public_profiles doc data
  var entries = [];       // this debater's leaderboard_entries

  // ── AI persona: unchanged honesty shell ─────────────────────────
  if (isAI){
    var aiName = nameFromHandle(handle);
    document.title = aiName + ' · Debatable';
    host.innerHTML =
      '<div class="phead">' +
        '<div class="avatar is-ai">' + esc(initials(aiName)) + '</div>' +
        '<div style="min-width:0;flex:1">' +
          '<h1 class="pname">' + esc(aiName) + '</h1>' +
          '<div class="phandle">@' + esc(handle) + '</div>' +
          '<div class="pbadges"><span class="ident-badge ident-ai">AI Persona</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="ai-explain">' +
        '<strong>This is an AI persona, not a person.</strong> It exists to start and deepen debates when the room is quiet. It will never pose as a student, claim a school, or invent a personal story.' +
        '<ul>' +
          '<li>Asks sharp debate questions and responds to motions</li>' +
          '<li>Steelmans arguments and suggests counterarguments</li>' +
          '<li>Summarizes a thread’s clash and revives dead threads</li>' +
        '</ul>' +
      '</div>' +
      '<div class="pactions">' +
        '<a class="btn primary" href="/voice-debate">Debate the bot</a>' +
        '<a class="btn" href="/community">Back to threads</a>' +
      '</div>';
    return;
  }

  // ── resolve handle -> uid ────────────────────────────────────────
  function resolveUid(){
    if (uidParam) return Promise.resolve(uidParam);
    if (!handle || !db) return Promise.resolve('');
    return db.collection('profile_handles').doc(handle).get()
      .then(function(d){ return (d.exists && (d.data()||{}).uid) || ''; })
      .catch(function(e){
        console.warn('[users] handle lookup failed', e && e.code);
        return '';
      });
  }

  function loadProfile(uid){
    if (!uid || !db) return Promise.resolve(null);
    return db.collection('public_profiles').doc(uid).get()
      .then(function(d){ return d.exists ? (d.data()||{}) : null; })
      .catch(function(e){
        // A private profile is a permission-denied read for everyone but
        // its owner. That is the rule doing its job, not a failure, so
        // we surface the private state rather than an error.
        if (e && e.code === 'permission-denied') return { __private: true };
        console.warn('[users] profile load failed', e && e.code);
        return null;
      });
  }

  // Judged rounds are public (leaderboard_entries is a public board), so
  // the record renders even for someone who never filled in a profile.
  function loadEntries(uid){
    if (!uid || !db) return Promise.resolve([]);
    return db.collection('leaderboard_entries').where('uid','==',uid).limit(200).get()
      .then(function(snap){
        var out = [];
        snap.forEach(function(doc){ out.push(doc.data()||{}); });
        return out;
      })
      .catch(function(e){
        console.warn('[users] entries load failed', e && e.code);
        return [];
      });
  }

  // ── renderers ───────────────────────────────────────────────────
  function avatarHTML(name, photo, cls){
    if (photo){
      return '<div class="avatar ' + cls + '"><img src="' + esc(photo) + '" alt="" referrerpolicy="no-referrer"></div>';
    }
    return '<div class="avatar ' + cls + '">' + esc(initials(name)) + '</div>';
  }

  function levelCardHTML(stats){
    var L = stats.level;
    var pct = Math.round(L.progress * 100);
    var next = L.nextXp === null
      ? 'Top level reached.'
      : L.toNext + ' XP to ' + window.DBDomains.titleFor(L.level + 1) + '. Every judged round adds its speaker score, usually 24 to 28, so a couple of rounds gets there.';
    return '<div class="level-card">' +
      '<div class="level-top">' +
        '<div class="level-name">Level ' + L.level + ' <span>' + esc(L.title) + '</span></div>' +
        '<div class="level-xp">' + L.xp.toLocaleString() + ' XP</div>' +
      '</div>' +
      '<div class="xp-track"><div class="xp-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="level-next">' + esc(next) + '</div>' +
    '</div>';
  }

  function domainsHTML(stats){
    if (!stats.domains.length){
      return '<div class="sec"><div class="sec-head"><h2 class="sec-title">Subject map</h2></div>' +
        '<div class="empty">No judged rounds yet, so there is nothing to map. Subject strengths appear once rounds land on the record.</div></div>';
    }
    var rows = stats.domains.map(function(d){
      var verdict = window.DBDomains.label(d.verdict);
      var stat = [
        '<span><b>' + d.rounds + '</b> round' + (d.rounds===1?'':'s') + '</span>',
        '<span><b>' + d.wins + 'W</b> ' + d.losses + 'L</span>',
        d.mean !== null ? '<span>avg <b>' + fmtScore(d.mean) + '</b></span>' : '',
        '<span><b>' + d.xp.toLocaleString() + '</b> XP</span>',
      ].filter(Boolean).join('');
      return '<div class="dom' + (d.verdict==='untested'?' untested':'') + '">' +
        '<div class="dom-name"><span class="dom-dot" style="background:' + esc(d.accent) + '"></span>' + esc(d.name) + '</div>' +
        '<span class="dom-verdict v-' + esc(d.verdict) + '">' + esc(verdict) + '</span>' +
        '<div class="dom-bar"><i style="width:' + Math.round(d.fill*100) + '%;background:' + esc(d.accent) + '"></i></div>' +
        '<div class="dom-stats">' + stat + '</div>' +
      '</div>';
    }).join('');

    // One honest sentence up top, only when the data actually supports it.
    var line = '';
    var shortOf = function (d) { return (window.DBDomains.get(d.key).short || d.name).toLowerCase(); };
    if (stats.strongest && stats.weakest){
      line = 'Sharpest on ' + shortOf(stats.strongest) + ', weakest on ' + shortOf(stats.weakest) + '.';
    } else if (stats.strongest){
      line = 'Sharpest on ' + shortOf(stats.strongest) + '.';
    } else {
      line = 'Needs ' + stats.minRounds + ' rounds in a subject before it is called either way.';
    }

    return '<div class="sec">' +
      '<div class="sec-head"><h2 class="sec-title">Subject map</h2><div class="sec-sub">' + esc(line) + '</div></div>' +
      '<div class="dom-list">' + rows + '</div>' +
      '<div class="note" style="text-align:left;margin-top:10px">Strength and weakness are measured against their own average, not against other people. A subject stays Untested until ' + stats.minRounds + ' judged rounds land in it.</div>' +
    '</div>';
  }

  function roundsHTML(){
    var recent = entries.slice().sort(function(a,b){ return millisOf(b.completedAt)-millisOf(a.completedAt); }).slice(0,6);
    if (!recent.length) return '';
    var rows = recent.map(function(e){
      var dom = window.DBDomains.classify(e.motion||'');
      var d = window.DBDomains.get(dom.key);
      var wl = e.won === true ? '<span class="wl wl-w">Win</span>'
             : e.won === false ? '<span class="wl wl-l">Loss</span>' : '';
      return '<div class="round">' +
        '<div style="min-width:0">' +
          '<div class="round-motion">' + esc(e.motion || 'Motion not recorded') + '</div>' +
          '<div class="round-sub">' +
            '<span style="color:' + esc(d.accent) + '">' + esc(d.name) + '</span>' +
            (e.formatName||e.format ? '<span>' + esc(e.formatName||e.format) + '</span>' : '') +
            (e.completedAt ? '<span>' + esc(fmtAgo(e.completedAt)) + '</span>' : '') +
            wl +
          '</div>' +
        '</div>' +
        '<div class="round-score">' + fmtScore(e.score) + '</div>' +
      '</div>';
    }).join('');
    return '<div class="sec"><div class="sec-head"><h2 class="sec-title">Recent judged rounds</h2>' +
      '<div class="sec-sub">' + entries.length + ' on record</div></div>' + rows + '</div>';
  }

  var LINK_FIELDS = [
    { key:'website',   label:'Website',   pre:'' },
    { key:'x',         label:'X',         pre:'https://x.com/' },
    { key:'instagram', label:'Instagram', pre:'https://instagram.com/' },
    { key:'linkedin',  label:'LinkedIn',  pre:'' },
    { key:'youtube',   label:'YouTube',   pre:'' },
  ];

  function linksHTML(p){
    var links = (p && p.links) || {};
    var chips = [];
    if (links.email){
      chips.push('<a class="link-chip" href="mailto:' + esc(links.email) + '">Email</a>');
    }
    LINK_FIELDS.forEach(function(f){
      var v = links[f.key];
      if (!v) return;
      var href = /^https?:\/\//i.test(v) ? v : (f.pre ? f.pre + String(v).replace(/^@/,'') : 'https://' + v);
      chips.push('<a class="link-chip" href="' + esc(href) + '" target="_blank" rel="noopener nofollow">' + esc(f.label) + '</a>');
    });
    if (!chips.length) return '';
    return '<div class="link-row">' + chips.join('') + '</div>';
  }

  function actionsHTML(p){
    var isSelf = me && targetUid && me.uid === targetUid;
    var name = (p && p.name) || nameFromHandle(handle);
    if (isSelf){
      return '<div class="pactions">' +
        '<a class="btn" href="/messages">Your messages</a>' +
        '<a class="btn" href="/leaderboard">Leaderboard</a>' +
        '<a class="btn" href="/spar">Find a round</a>' +
      '</div>';
    }
    if (!targetUid){
      return '<div class="pactions"><a class="btn primary" href="/spar">Find a round</a></div>';
    }
    // dmOpen defaults to true: a profile exists to be reachable. Someone
    // who wants to be unreachable turns it off and the button says so
    // rather than opening a thread that will never be read.
    var dmOpen = !p || p.dmOpen !== false;
    var msg = dmOpen
      ? '<a class="btn" href="/messages?dm=' + encodeURIComponent(targetUid) + '&name=' + encodeURIComponent(name) + '">Message</a>'
      : '<button class="btn" type="button" disabled title="This person has DMs turned off">DMs closed</button>';
    return '<div class="pactions">' +
      '<a class="btn primary" href="/challenges?to=' + encodeURIComponent(targetUid) + '&name=' + encodeURIComponent(name) + '">Challenge to a debate</a>' +
      msg +
    '</div>';
  }

  function render(){
    var p = profileDoc;
    var isSelf = me && targetUid && me.uid === targetUid;

    // Private and not yours: say so plainly and stop. No record, no map.
    if (p && p.__private && !isSelf){
      document.title = 'Private profile · Debatable';
      host.innerHTML =
        '<div class="phead">' +
          '<div class="avatar">·</div>' +
          '<div style="min-width:0;flex:1">' +
            '<h1 class="pname">Private profile</h1>' +
            '<div class="phandle">@' + esc(handle) + '</div>' +
            '<div class="pbadges"><span class="ident-badge ident-private">Private</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="pbio">This person keeps their profile private. Their judged rounds still count on the leaderboard, but the profile itself is theirs to share.</div>' +
        '<div class="pactions"><a class="btn primary" href="/spar">Find a round</a><a class="btn" href="/leaderboard">Leaderboard</a></div>';
      extras.innerHTML = '';
      return;
    }
    if (p && p.__private) p = profileDoc = null; // owner viewing before first save

    var name = (p && p.name) || nameFromHandle(handle);
    var stats = window.DBDomains.forEntries(entries);
    document.title = name + ' · Debatable';

    // The leaderboard links by uid because a row knows the uid and not
    // the handle. Once the profile is loaded we do know it, so swap the
    // URL for the shareable one rather than leaving a query string in
    // the address bar for someone to copy.
    if (p && p.handle && !handle){
      handle = String(p.handle).toLowerCase();
      try { history.replaceState(null, '', '/users/' + handle); } catch(e){}
    }

    var meta = [p && p.school, p && p.circuit].filter(Boolean).join(' · ');
    // "Human Verified" is earned by a judged round, not claimed by
    // filling in a form. No rounds, no badge.
    var badge = entries.length
      ? '<span class="ident-badge ident-human">Human Verified</span>'
      : '<span class="ident-badge ident-debater">Member</span>';
    var privMark = (p && p.visibility === 'private')
      ? ' <span class="ident-badge ident-private">Private</span>' : '';

    host.innerHTML =
      '<div class="phead">' +
        avatarHTML(name, p && p.photo, entries.length ? 'is-human' : '') +
        '<div style="min-width:0;flex:1">' +
          '<h1 class="pname">' + esc(name) + '</h1>' +
          (handle ? '<div class="phandle">@' + esc(handle) + '</div>' : '') +
          (meta ? '<div class="pmeta">' + esc(meta) + '</div>' : '') +
          '<div class="pbadges">' + badge + privMark + '</div>' +
        '</div>' +
      '</div>' +
      (p && p.bio ? '<div class="pbio">' + esc(p.bio) + '</div>' : '') +
      linksHTML(p) +
      actionsHTML(p) +
      levelCardHTML(stats) +
      '<div class="stat-row">' +
        '<div class="stat"><div class="n">' + stats.rounds + '</div><div class="l">Judged rounds</div></div>' +
        '<div class="stat"><div class="n">' + stats.wins + ' / ' + stats.losses + '</div><div class="l">Win / loss</div></div>' +
        '<div class="stat"><div class="n">' + fmtScore(stats.mean) + '</div><div class="l">Avg score</div></div>' +
        '<div class="stat"><div class="n">' + (stats.strongest ? esc(window.DBDomains.get(stats.strongest.key).short || stats.strongest.name) : '—') + '</div><div class="l">Best subject</div></div>' +
      '</div>';

    extras.innerHTML = domainsHTML(stats) + roundsHTML();
    if (isSelf) mountEditor();
  }

  // ── owner editor ────────────────────────────────────────────────
  function mountEditor(){
    var p = profileDoc || {};
    var links = p.links || {};
    var vis = p.visibility === 'private' ? 'private' : 'public';
    var dmOpen = p.dmOpen !== false;
    var wrap = document.createElement('div');
    wrap.className = 'editor';
    wrap.innerHTML =
      '<h2>Your public profile</h2>' +
      '<p class="hint">This is what other people see at your profile link. Your judged rounds and subject map are drawn from the leaderboard automatically, so there is nothing to type there.</p>' +
      '<div class="fld"><label for="edName">Display name</label>' +
        '<input id="edName" maxlength="60" value="' + esc(p.name || (me && me.displayName) || '') + '" placeholder="How you want to be listed"></div>' +
      '<div class="fld"><label for="edHandle">Handle</label>' +
        '<input id="edHandle" maxlength="30" value="' + esc(p.handle || '') + '" placeholder="e.g. ananya-r">' +
        '<div class="sub" id="edHandleSub">Your profile lives at /users/&lt;handle&gt;. Letters, numbers and dashes.</div></div>' +
      '<div class="fld-2">' +
        '<div class="fld"><label for="edSchool">School or club</label><input id="edSchool" maxlength="80" value="' + esc(p.school || '') + '"></div>' +
        '<div class="fld"><label for="edCircuit">Circuit</label><input id="edCircuit" maxlength="60" value="' + esc(p.circuit || '') + '" placeholder="e.g. APDA, WSDC"></div>' +
      '</div>' +
      '<div class="fld"><label for="edBio">Bio</label>' +
        '<textarea id="edBio" maxlength="280" placeholder="What you debate, what you are working on.">' + esc(p.bio || '') + '</textarea>' +
        '<div class="sub"><span id="edBioCount">0</span>/280</div></div>' +
      '<div class="fld-2">' +
        '<div class="fld"><label for="edEmail">Contact email</label><input id="edEmail" maxlength="200" value="' + esc(links.email || '') + '" placeholder="Optional. Shown publicly."></div>' +
        '<div class="fld"><label for="edX">X</label><input id="edX" maxlength="200" value="' + esc(links.x || '') + '" placeholder="@handle"></div>' +
      '</div>' +
      '<div class="fld-2">' +
        '<div class="fld"><label for="edInstagram">Instagram</label><input id="edInstagram" maxlength="200" value="' + esc(links.instagram || '') + '" placeholder="@handle"></div>' +
        '<div class="fld"><label for="edLinkedin">LinkedIn</label><input id="edLinkedin" maxlength="200" value="' + esc(links.linkedin || '') + '" placeholder="Profile URL"></div>' +
      '</div>' +
      '<div class="fld-2">' +
        '<div class="fld"><label for="edYoutube">YouTube</label><input id="edYoutube" maxlength="200" value="' + esc(links.youtube || '') + '" placeholder="Channel URL"></div>' +
        '<div class="fld"><label for="edWebsite">Website</label><input id="edWebsite" maxlength="200" value="' + esc(links.website || '') + '"></div>' +
      '</div>' +
      '<div class="fld"><label>Who can see this profile</label>' +
        '<div class="vis-row">' +
          '<label class="vis-opt' + (vis==='public'?' on':'') + '" data-vis="public">' +
            '<div class="t"><input type="radio" name="edVis" value="public"' + (vis==='public'?' checked':'') + '> Public</div>' +
            '<div class="d">Anyone can open your profile, read your subject map, and challenge you.</div></label>' +
          '<label class="vis-opt' + (vis==='private'?' on':'') + '" data-vis="private">' +
            '<div class="t"><input type="radio" name="edVis" value="private"' + (vis==='private'?' checked':'') + '> Private</div>' +
            '<div class="d">Only you can open it. Your rounds still count on the leaderboard.</div></label>' +
        '</div></div>' +
      '<div class="fld"><label class="vis-opt' + (dmOpen?' on':'') + '" id="edDmWrap" style="display:block">' +
          '<div class="t"><input type="checkbox" id="edDm"' + (dmOpen?' checked':'') + '> Let people message me</div>' +
          '<div class="d">Turn this off and the Message button on your profile is replaced with a note that your DMs are closed.</div>' +
        '</label></div>' +
      '<div style="display:flex;align-items:center;flex-wrap:wrap">' +
        '<button class="btn primary" id="edSave" type="button">Save profile</button>' +
        '<span class="ed-status" id="edStatus"></span>' +
      '</div>';
    extras.appendChild(wrap);

    var bio = $('edBio'), count = $('edBioCount');
    function paintCount(){ count.textContent = String((bio.value||'').length); }
    bio.addEventListener('input', paintCount); paintCount();

    wrap.querySelectorAll('.vis-opt[data-vis]').forEach(function(opt){
      opt.addEventListener('click', function(){
        wrap.querySelectorAll('.vis-opt[data-vis]').forEach(function(o){ o.classList.remove('on'); });
        opt.classList.add('on');
      });
    });
    $('edDm').addEventListener('change', function(){
      $('edDmWrap').classList.toggle('on', $('edDm').checked);
    });

    $('edSave').addEventListener('click', save);
  }

  function save(){
    var status = $('edStatus');
    function say(msg, cls){ status.textContent = msg; status.className = 'ed-status' + (cls?' '+cls:''); }

    var name = ($('edName').value||'').trim().slice(0,60);
    if (!name){ say('Add a display name first.', 'err'); return; }
    var wantHandle = slugify($('edHandle').value || name);
    if (!wantHandle){ say('That handle has no usable characters.', 'err'); return; }

    var visEl = document.querySelector('input[name="edVis"]:checked');
    var visibility = visEl && visEl.value === 'private' ? 'private' : 'public';

    var doc = {
      uid: me.uid,
      name: name,
      handle: wantHandle,
      school: ($('edSchool').value||'').trim().slice(0,80),
      circuit: ($('edCircuit').value||'').trim().slice(0,60),
      bio: ($('edBio').value||'').trim().slice(0,280),
      photo: ((me && me.photoURL) || '').slice(0,400),
      visibility: visibility,
      dmOpen: !!$('edDm').checked,
      links: {
        email: ($('edEmail').value||'').trim().slice(0,200),
        x: ($('edX').value||'').trim().slice(0,200),
        instagram: ($('edInstagram').value||'').trim().slice(0,200),
        linkedin: ($('edLinkedin').value||'').trim().slice(0,200),
        youtube: ($('edYoutube').value||'').trim().slice(0,200),
        website: ($('edWebsite').value||'').trim().slice(0,200),
      },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    say('Saving…');
    // Claim the handle first. The doc id IS the handle, so `create`
    // failing on an existing id is exactly the uniqueness check we want,
    // and we must not write the profile under a handle we did not get.
    claimHandle(wantHandle)
      .then(function(){
        return db.collection('public_profiles').doc(me.uid).set(doc, { merge: true });
      })
      .then(function(){
        var oldHandle = profileDoc && profileDoc.handle;
        profileDoc = doc;
        handle = wantHandle;
        say('Saved. Your profile is at /users/' + wantHandle, 'ok');
        try { history.replaceState(null, '', '/users/' + wantHandle); } catch(e){}
        try { gtag('event', 'public_profile_save', { visibility: visibility }); } catch(e){}
        // Release the old handle so it is not parked forever.
        if (oldHandle && oldHandle !== wantHandle){
          db.collection('profile_handles').doc(oldHandle).delete().catch(function(){});
        }
        render();
      })
      .catch(function(e){
        if (e && e.__taken) say('That handle is taken. Try another.', 'err');
        else say('Could not save' + ((e && e.code) ? ' (' + e.code + ')' : '') + '.', 'err');
      });
  }

  function claimHandle(want){
    var ref = db.collection('profile_handles').doc(want);
    return ref.get().then(function(d){
      if (d.exists){
        if ((d.data()||{}).uid === me.uid) return true;  // already ours
        var err = new Error('handle taken'); err.__taken = true; throw err;
      }
      return ref.set({ uid: me.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
  }

  // ── boot ────────────────────────────────────────────────────────
  function boot(){
    if (!db){
      host.innerHTML = '<div class="empty">Profiles need a database connection and this browser could not open one. Try again, or turn off a strict content blocker for this site.</div>';
      return;
    }
    resolveUid().then(function(uid){
      targetUid = uid || '';
      if (!targetUid){
        host.innerHTML =
          '<div class="phead"><div class="avatar">?</div><div style="min-width:0;flex:1">' +
            '<h1 class="pname">No profile here yet</h1>' +
            (handle ? '<div class="phandle">@' + esc(handle) + '</div>' : '') +
          '</div></div>' +
          '<div class="pbio">Nobody has claimed this profile link. If it is meant to be yours, sign in and set your handle on your own profile.</div>' +
          '<div class="pactions"><a class="btn primary" href="/leaderboard">See the leaderboard</a><a class="btn" href="/spar">Find a round</a></div>';
        extras.innerHTML = '';
        return;
      }
      return Promise.all([loadProfile(targetUid), loadEntries(targetUid)]).then(function(res){
        profileDoc = res[0];
        entries = res[1] || [];
        render();
      });
    });
  }

  if (auth){
    var booted = false;
    auth.onAuthStateChanged(function(user){
      // Anonymous Firebase users are not signed in for our purposes:
      // notifications.js signs everyone in anonymously, so a truthy
      // currentUser proves nothing about ownership.
      me = (user && !user.isAnonymous) ? user : null;
      if (!booted){ booted = true; boot(); }
      else render();
    });
    // If auth never settles (blocked third-party storage), still show the
    // public view rather than a permanent spinner.
    setTimeout(function(){ if (!booted){ booted = true; boot(); } }, 2500);
  } else {
    boot();
  }
})();
</script>
