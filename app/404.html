<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Theme: resolve the visitor's saved `da-theme` before first paint. This
   page carries no topbar, so it has no toggle of its own; it follows the
   choice made anywhere else on the site. Light is the default. */
(function(){
  var t = 'light';
  try { t = localStorage.getItem('da-theme') || 'light'; } catch(e){}
  if (t !== 'light') t = 'crimson';
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.setAttribute('data-lighting', t === 'light' ? 'light' : 'dark');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Debatable</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png">

<style>
  /* Theme tokens. The palette was inlined here; these name what those
     literals meant so dark only has to restate what changes. */
  :root{
    --ink-rgb:20,20,30;
    --bg:#fbfaf7;--ink:#1b1b21;--dim:#5f5f6a;--card:#ffffff;
    --accent:#dc2626;--accent-deep:#b91c1c;
  }
  html[data-theme="crimson"],html[data-theme="grey"]{
    color-scheme:dark;
    --ink-rgb:232,232,240;
    --bg:#0b0b0e;--ink:#f2f2f6;--dim:#9a9aa8;--card:#16161b;
    --accent:#ef4444;--accent-deep:#ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family:'Archivo','Fraunces',Georgia,"Times New Roman",serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 520px;
  }

  .error-code {
    font-family: DM Sans,Archivo,Georgia,serif;
    font-size: 120px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: DM Sans,Archivo,Georgia,serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .message {
    font-size: 16px;
    color: var(--dim);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    padding: 12px 28px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 10px 24px -12px rgba(220,38,38,.7);
  }

  .btn-primary:hover {
    background: var(--accent-deep);
  }

  .btn-ghost {
    background: var(--card);
    color: var(--ink);
    border: 1px solid rgba(var(--ink-rgb),.18);
  }

  .btn-ghost:hover {
    border-color: rgba(var(--ink-rgb),.35);
  }

  .map-row {
    margin-top: 26px;
    display: flex;
    gap: 6px 22px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .map-row a {
    color: rgba(var(--ink-rgb),.64);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 600;
    border-bottom: 1px solid rgba(var(--ink-rgb),.18);
    padding-bottom: 1px;
    transition: color .15s, border-color .15s;
  }

  .map-row a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
</style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Sans:opsz,wght@9..40,400..900&family=Geist+Mono:wght@400..700&family=Inter:wght@400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script defer src="/js/track.js"></script>
<link rel="stylesheet" href="/css/ui.css">
<script defer src="/js/topbar.js"></script>
</head>
<body>

<!-- Shared topbar, so this page is not a dead end. -->
<div id="daTopbar" class="ui-topbar-mount"></div>

<div class="container">
  <div class="error-code">404</div>
  <div class="subtitle">Page not found</div>
  <p class="message">The argument you're looking for doesn't exist. Yet.</p>
  <div class="btn-row">
    <a href="/" class="btn btn-primary">Back to Debatable</a>
    <a href="/practice" class="btn btn-ghost">Start a round</a>
  </div>
  <!-- Map row: a 404 visitor followed a stale or mistyped link; give
       them the main rooms instead of only the front door. -->
  <div class="map-row">
    <a href="/newvoice">Voice AI</a>
    <a href="/spar">Live debates</a>
    <a href="/judge">AI judge</a>
    <a href="/learn">Learn</a>
  </div>
</div>

  <script src="/js/home-magnet.js" defer></script>
</body>
</html>
