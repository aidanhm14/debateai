<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Debatable</title>
<!--
  Offline screen for the iOS/Android shell.

  The app loads itsdebatable.com/native over the network. When that load
  fails, Capacitor redirects the WebView here via `server.errorPath` in
  capacitor.config.ts. Before 2026-08-19 no errorPath was set and this file
  was a 93-byte black page carrying the retired brand name, so a phone with
  no signal showed a blank screen.

  Keep this file fully self-contained. It is the one surface that has to
  render with no network, so it can load no font, image, script or stylesheet
  from anywhere.
-->
<style>
  :root {
    --bg: #f7f6f2;
    --ink: #14110f;
    --muted: #5f5a54;
    --card: #ffffff;
    --line: rgba(0, 0, 0, .1);
    --accent: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0e0d;
      --ink: #f5f3f0;
      --muted: #a5a09a;
      --card: #1a1817;
      --line: rgba(255, 255, 255, .12);
      --accent: #ef4444;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px)
             calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
    -webkit-user-select: none;
    user-select: none;
  }
  .card { width: 100%; max-width: 360px; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 22px;
    background: var(--accent); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 32px; font-weight: 800; letter-spacing: -.02em;
  }
  h1 { margin: 0 0 10px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  p { margin: 0 0 26px; color: var(--muted); font-size: 16px; }
  button {
    width: 100%; padding: 15px 20px; border: 0; border-radius: 13px;
    background: var(--accent); color: #fff;
    font: 600 17px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
  }
  button:active { opacity: .82; }
  .status {
    margin: 16px 0 0; font-size: 14px; color: var(--muted);
    min-height: 20px; opacity: 0; transition: opacity .2s;
  }
  .status.on { opacity: 1; }
</style>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">D</div>
    <h1>No connection</h1>
    <p>Debatable needs a network to load a round. Reconnect, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  (function () {
    var HOME = 'https://itsdebatable.com/native';
    var btn = document.getElementById('retry');
    var status = document.getElementById('status');
    var retrying = false;

    function say(text) {
      status.textContent = text || '';
      status.classList.toggle('on', !!text);
    }

    function retry() {
      if (retrying) return;
      retrying = true;
      btn.disabled = true;
      say('Reconnecting');
      // A failed load lands back here through errorPath, so this is safe to
      // fire blind. Release the lock in case the load neither fails nor
      // navigates away, which would otherwise dead-end the only button.
      location.replace(HOME);
      setTimeout(function () {
        retrying = false;
        btn.disabled = false;
        say('');
      }, 6000);
    }

    btn.addEventListener('click', retry);

    // navigator.onLine only reports the interface, not reachability, so treat
    // it as a hint worth acting on rather than proof the site is up.
    window.addEventListener('online', retry);
  })();
</script>
